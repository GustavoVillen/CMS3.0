<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Copilot Management System</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0D1B2A" />
    <meta name="application-name" content="CMS" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CMS" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Modern Typography: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- No-flash theme: aplica la clase .dark y el fondo correcto ANTES del primer
         paint, leyendo gpms_theme. Default light. Debe ir antes del CSS/JS. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("gpms_theme");
          var dark = t === "dark";
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = dark ? "#080D1D" : "#F4F5F7";
        } catch (e) {
          document.documentElement.style.backgroundColor = "#F4F5F7";
        }
      })();
    </script>
    <style>
      body { margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
