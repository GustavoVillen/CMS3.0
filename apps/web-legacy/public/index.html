<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PMS SaaS</title>
  <style>
    /* ── Design System Tokens ─────────────────────────── */
    :root {
      --bg:          #0F172A;
      --surface:     #1E293B;
      --border:      rgba(255,255,255,0.10);
      --accent:      #EAB308;
      --accent-dark: #CA8A04;
      --text:        #E2E8F0;
      --muted:       #94A3B8;
      --success:     #22C55E;
      --danger:      #EF4444;
      --warning:     #F97316;
    }
    /* ── Reset ────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
    }
    /* ── Layout ───────────────────────────────────────── */
    .layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 240px; background: var(--surface); border-right: 1px solid var(--border);
      padding: 16px 0; flex-shrink: 0; display: flex; flex-direction: column;
    }
    .sidebar-header { padding: 0 16px 16px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
    .sidebar-logo { color: var(--accent); font-size: 1.125rem; font-weight: 700; letter-spacing: -0.01em; }
    .sidebar-sub  { color: var(--muted);  font-size: 0.75rem; margin-top: 3px; }
    .sidebar-section { padding: 8px 16px 4px; color: var(--muted); font-size: 0.65rem;
                        font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
    .nav-item {
      display: block; padding: 9px 16px; color: var(--muted); text-decoration: none;
      font-size: 0.875rem; transition: background 0.12s, color 0.12s; cursor: pointer;
      border: none; background: none; width: 100%; text-align: left;
    }
    .nav-item:hover  { background: rgba(255,255,255,0.05); color: var(--text); }
    .nav-item.active { background: rgba(234,179,8,0.10); color: var(--accent); border-left: 3px solid var(--accent); }
    .main   { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
    .header {
      height: 52px; background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0;
    }
    .header-title { font-size: 1rem; font-weight: 600; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .header-user   { color: var(--muted); font-size: 0.8rem; }
    .header-badge  {
      font-size: 0.7rem; font-weight: 600; background: rgba(234,179,8,0.15);
      color: var(--accent); border-radius: 4px; padding: 2px 6px;
    }
    .content { flex: 1; padding: 24px; overflow-y: auto; }
    /* ── Cards & Grids ────────────────────────────────── */
    .card {
      background: rgba(255,255,255,0.03); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px; margin-bottom: 16px;
    }
    .card-header   { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .card-title    { font-size: 1rem; font-weight: 600; }
    .stats-grid    { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card     { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .stat-value    { font-size: 2rem; font-weight: 700; color: var(--accent); }
    .stat-label    { color: var(--muted); font-size: 0.875rem; margin-top: 4px; }
    /* ── Buttons ──────────────────────────────────────── */
    .btn {
      padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: #334155; color: var(--text); cursor: pointer; font-size: 0.875rem; font-family: inherit;
    }
    .btn:hover { background: #475569; }
    .btn-sm    { padding: 5px 10px; font-size: 0.8rem; }
    .btn-danger { border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.1); color: var(--danger); }
    .btn-danger:hover { background: rgba(239,68,68,0.2); }
    .btn-ghost { background: none; border: none; color: var(--muted); }
    .btn-ghost:hover { color: var(--text); background: rgba(255,255,255,0.07); }
    /* ── Forms ────────────────────────────────────────── */
    .form-group  { margin-bottom: 16px; }
    .form-label  { display: block; margin-bottom: 5px; color: var(--muted); font-size: 0.8rem; }
    .form-input  {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: rgba(15,23,42,0.8); color: var(--text); font-size: 0.875rem; font-family: inherit;
    }
    .form-input:focus { outline: none; border-color: var(--accent); }
    .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
    .filters { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .filter-group { display: flex; flex-direction: column; gap: 4px; }
    .filter-label { color: var(--muted); font-size: 0.75rem; }
    .filter-select {
      padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: rgba(15,23,42,0.8); color: var(--text); font-size: 0.85rem; font-family: inherit;
      min-width: 160px;
    }
    .filter-select:focus { outline: none; border-color: var(--accent); }
    /* ── Tables ───────────────────────────────────────── */
    .table-wrap { overflow-x: auto; }
    table       { width: 100%; border-collapse: collapse; }
    th, td      { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--border); }
    th          { color: var(--muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; }
    td          { font-size: 0.875rem; }
    tr:hover    { background: rgba(255,255,255,0.02); }
    /* ── Status Badges ────────────────────────────────── */
    .badge          { display: inline-block; padding: 3px 7px; border-radius: 4px; font-size: 0.72rem; font-weight: 600; }
    .badge-green    { background: rgba(34,197,94,0.18);  color: var(--success); }
    .badge-yellow   { background: rgba(234,179,8,0.18);  color: var(--accent); }
    .badge-red      { background: rgba(239,68,68,0.18);  color: var(--danger); }
    .badge-orange   { background: rgba(249,115,22,0.18); color: var(--warning); }
    .badge-neutral  { background: rgba(148,163,184,0.18); color: var(--muted); }
    /* ── Misc ─────────────────────────────────────────── */
    .page-header    { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .page-title     { font-size: 1.5rem; font-weight: 700; }
    .empty-state    { text-align: center; padding: 48px 24px; color: var(--muted); }
    .loading-state  { text-align: center; padding: 48px 24px; color: var(--muted); }
    .error-state    { text-align: center; padding: 32px 24px; color: var(--danger); }
    .insight-card   {
      background: rgba(255,255,255,0.03); border: 1px solid var(--border);
      border-radius: 8px; padding: 14px; margin-bottom: 10px;
    }
    .insight-title  { font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }
    .insight-desc   { color: var(--muted); font-size: 0.85rem; line-height: 1.5; }
    .insight-meta   { margin-top: 6px; font-size: 0.72rem; color: #64748B; }
    /* ── Login ────────────────────────────────────────── */
    .login-wrap  { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); }
    .login-card  {
      width: 380px; background: rgba(255,255,255,0.03); border: 1px solid var(--border);
      border-radius: 16px; padding: 36px 32px;
    }
    .login-logo  { color: var(--accent); font-size: 1.4rem; font-weight: 700; text-align: center; margin-bottom: 4px; }
    .login-sub   { text-align: center; color: var(--muted); font-size: 0.8rem; margin-bottom: 24px; }
    .login-error { color: var(--danger); font-size: 0.8rem; margin-bottom: 12px; min-height: 1rem; }
    .btn-primary {
      width: 100%; padding: 11px; border-radius: 8px; border: none;
      background: var(--accent); color: #0F172A; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; font-family: inherit; margin-top: 4px;
    }
    .btn-primary:hover { background: var(--accent-dark); }
    .platform-notice {
      margin-top: 20px; text-align: center; font-size: 0.75rem; color: var(--muted);
    }
    .platform-notice a { color: var(--accent); cursor: pointer; text-decoration: none; }
    /* ── Modals ───────────────────────────────────────── */
    .modal {
      position: fixed; inset: 0; background: rgba(15,23,42,0.6);
      display: none; align-items: center; justify-content: center; z-index: 50;
      padding: 24px;
    }
    .modal-content {
      width: 100%; max-width: 480px; background: #111827; border: 1px solid var(--border);
      border-radius: 12px; padding: 20px;
    }
    .modal-title { font-size: 1rem; font-weight: 600; margin-bottom: 16px; }
    /* ── Platform sidebar variant ─────────────────────── */
    .sidebar-platform .sidebar-logo { color: #93c5fd; }
    .sidebar-platform .nav-item.active {
      background: rgba(147,197,253,0.10); color: #93c5fd; border-left-color: #93c5fd;
    }
  </style>
</head>
<body>
  <div id="app"><div class="loading-state">Iniciando…</div></div>
  <script src="/bundle.js"></script>
</body>
</html>
