<style>
  :root {
    --bg-main: #050a11;
    --bg-panel: #0a111e;
    --bg-card: #101c30;
    --bg-card-hover: #152540;
    --border-color: #1a2a47;
    --border-light: rgba(6, 182, 212, 0.2);

    --text-main: #f8fafc;
    --text-muted: #94a3b8;

    --accent-cyan: #06b6d4;
    --accent-blue: #3b82f6;
    --accent-green: #10b981;
    --accent-yellow: #f59e0b;
    --accent-red: #ef4444;
    --accent-purple: #8b5cf6;
    --accent-orange: #f97316;

    --font-main: 'Inter', sans-serif;
    --radius-md: 0.5rem;
    --radius-lg: 0.75rem;
    --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body,
  html {
    height: 100%;
    font-family: var(--font-main);
    background-color: var(--bg-main);
    color: var(--text-main);
    overflow: hidden;
  }

  /* UTILS */
  .d-flex {
    display: flex;
  }

  .align-center {
    align-items: center;
  }

  .justify-between {
    justify-content: space-between;
  }

  .gap-4 {
    gap: 1rem;
  }

  .fs-sm {
    font-size: 0.875rem;
  }

  .fs-md {
    font-size: 1.125rem;
  }

  .icon-brand {
    color: var(--accent-cyan);
    font-size: 2rem;
  }

  .icon-cyan {
    color: var(--accent-cyan);
  }

  .mobile-only {
    display: none !important;
  }

  @media (max-width: 768px) {
    .mobile-only {
      display: flex !important;
    }
  }

  .cyan-text {
    color: var(--accent-cyan);
    font-weight: 600;
  }

  .red-text {
    color: var(--accent-red);
    font-weight: 600;
  }

  .yellow-text {
    color: var(--accent-yellow);
    font-weight: 600;
  }

  .dot-yellow,
  .dot-red,
  .dot-green {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 0.25rem;
  }

  .dot-yellow {
    background-color: var(--accent-yellow);
    box-shadow: 0 0 5px var(--accent-yellow);
  }

  .dot-red {
    background-color: var(--accent-red);
    box-shadow: 0 0 5px var(--accent-red);
  }

  .dot-green {
    background-color: var(--accent-green);
    box-shadow: 0 0 5px var(--accent-green);
  }

  .btn-icon-subtle {
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    transition: var(--transition);
    padding: 0.5rem;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .btn-icon-subtle:hover {
    color: var(--text-main);
    background: rgba(255, 255, 255, 0.05);
  }

  /* OVERALL LAYOUT */
  .app-layout {
    display: flex;
    height: 100vh;
  }

  /* LEFT SIDEBAR MINI */
  .sidebar-mini {
    width: 60px;
    background-color: var(--bg-panel);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1.5rem 0;
    z-index: 10;
  }

  .brand-logo {
    margin-bottom: 2rem;
  }

  .nav-mini {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    flex: 1;
  }

  .nav-mini .nav-item {
    color: var(--text-muted);
    text-decoration: none;
    padding: 0.5rem;
    border-radius: var(--radius-md);
    transition: var(--transition);
  }

  .nav-mini .nav-item:hover,
  .nav-mini .nav-item.active {
    color: var(--accent-cyan);
    background-color: rgba(6, 182, 212, 0.1);
  }

  .sidebar-footer {
    margin-top: auto;
  }

  .avatar-mini {
    width: 32px;
    height: 32px;
    background-color: var(--accent-blue);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: white;
  }

  /* MAIN DASHBOARD */
  .dashboard-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    background: radial-gradient(circle at 50% -20%, #0a1b33 0%, var(--bg-main) 50%);
  }

  .dashboard-header {
    height: 70px;
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-title-box {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .title-icon {
    color: var(--accent-blue);
    font-size: 2.2rem;
  }

  .header-title-box h1 {
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    color: var(--text-main);
  }

  .btn-sync {
    background: transparent;
    border: 1px solid var(--accent-cyan);
    color: var(--accent-cyan);
    padding: 0.4rem 1rem;
    border-radius: 20px;
    font-size: 0.7rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    transition: var(--transition);
    letter-spacing: 0.05em;
  }

  .btn-sync:hover {
    background: var(--accent-cyan);
    color: var(--bg-main);
    box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
  }

  .btn-outline {
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    padding: 0.6rem 1.25rem;
    border-radius: var(--radius-md);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
  }

  .btn-outline:hover {
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
    background: rgba(6, 182, 212, 0.05);
  }
  .content-wrapper {
    flex: 1;
    padding: 1rem 2rem 2rem 2rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    overflow-y: auto;
  }

  .content-wrapper::-webkit-scrollbar {
    width: 6px;
  }

  .content-wrapper::-webkit-scrollbar-thumb {
    background: var(--border-color);
    border-radius: 4px;
  }

  /* CHARTS ROW */
  .charts-row {
    display: flex;
    gap: 1.5rem;
    height: auto;
    flex-wrap: wrap;
    align-items: stretch;
  }

  .chart-card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  .pie-card {
    flex: 1 1 260px;
    min-width: 260px;
  }

  .bar-card {
    flex: 1.2;
    min-width: 0;
  }

  .dashboard-grid-3 {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.5rem;
    align-items: stretch;
  }

  .dashboard-grid-3 > .chart-card,
  .dashboard-grid-3 > .snapshot-card {
    min-width: 0;
    height: 100%;
    margin-bottom: 0;
  }

  .dashboard-section-divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, rgba(6,182,212,0), rgba(6,182,212,0.35), rgba(6,182,212,0));
    margin: 0.35rem 0 0.15rem;
  }

  .chart-title {
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--text-main);
    letter-spacing: 0.1em;
    margin-bottom: 1.5rem;
  }

  /* Pie Mock */
  .pie-container {
    display: flex;
    align-items: center;
    justify-content: space-around;
    flex: 1;
  }

  .pie-chart-mock {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: conic-gradient(var(--accent-yellow) 0% 17%, var(--accent-green) 17% 100%);
    box-shadow: 0 0 20px rgba(16, 185, 129, 0.1);
  }

  .pie-legend {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .badge {
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
    color: #fff;
    display: inline-block;
    min-width: 40px;
    text-align: center;
  }

  .badge-green {
    background: var(--accent-green);
    box-shadow: 0 0 5px var(--accent-green);
  }

  .badge-yellow {
    background: var(--accent-yellow);
    color: #000;
    box-shadow: 0 0 5px var(--accent-yellow);
  }

  .badge-red {
    background: var(--accent-red);
    box-shadow: 0 0 5px var(--accent-red);
  }

  .legend-caption {
    font-size: 0.6rem;
    color: var(--text-muted);
    margin-top: 1rem;
  }

  /* Bar Mock */
  .bar-chart-mock {
    display: flex;
    align-items: flex-end;
    justify-content: space-around;
    flex: 1;
    padding-bottom: 2rem;
    position: relative;
    border-bottom: 1px solid var(--border-color);
  }

  .bar-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    width: 60px;
  }

  .bar-value {
    font-weight: 700;
    font-size: 1.2rem;
  }

  .bar {
    width: 40px;
    border-radius: 4px 4px 0 0;
  }

  .bar-green {
    background: var(--accent-green);
    box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
  }

  .bar-cyan {
    background: var(--accent-cyan);
    box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
  }

  .bar-red {
    background: var(--accent-red);
    box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
  }

  .bar-label {
    font-size: 0.6rem;
    position: absolute;
    bottom: -1rem;
    color: var(--text-main);
    font-weight: 600;
    letter-spacing: 0.05em;
    white-space: nowrap;
  }

  /* SNAPSHOT BAR & CARDS */
  .snapshot-bar {
    display: none; /* Oculto el viejo estilo */
  }

  .snapshot-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1.5rem;
    margin-bottom: 2rem;
    align-items: stretch;
  }

  .snapshot-card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    box-shadow: var(--shadow-md);
    min-width: 0;
  }

  .snapshot-card-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--text-main);
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 0.75rem;
  }

  .snapshot-card-body {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .snapshot-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    border-right: 1px solid var(--border-color);
    padding-right: 1rem;
    white-space: nowrap;
  }

  .snapshot-badges {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    font-size: 0.65rem;
    font-weight: 600;
  }

  .snap-badge {
    padding: 0.3rem 0.6rem;
    border-radius: 4px;
    border: 1px solid transparent;
    display: flex;
    align-items: center;
  }

  .outline-yellow {
    border-color: rgba(245, 158, 11, 0.4);
    background: rgba(245, 158, 11, 0.05);
  }

  .outline-red {
    border-color: rgba(239, 68, 68, 0.4);
    background: rgba(239, 68, 68, 0.05);
  }

  .outline-cyan {
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
  }

  .outline-dark {
    margin: 0 0.5rem;
    border-left: 1px solid var(--border-color);
    height: 15px;
  }

  /* separator */

  .btn-cyan-outline {
    background: transparent;
    border: 1px solid var(--accent-cyan);
    color: var(--accent-cyan);
    padding: 0.3rem 0.6rem;
    border-radius: 4px;
    font-size: 0.65rem;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    margin-left: 0.5rem;
  }

  .btn-cyan-outline:hover {
    background: rgba(6, 182, 212, 0.2);
  }

  .btn-orange-outline {
    background: transparent;
    border: 1px solid var(--accent-orange);
    color: var(--accent-orange);
    padding: 0.3rem 0.6rem;
    border-radius: 4px;
    font-size: 0.65rem;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    margin-left: 0.5rem;
  }

  .btn-orange-outline:hover {
    background: rgba(249, 115, 22, 0.2);
  }

  /* MODULES GRID */
  .modules-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1rem;
  }

  .module-card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 0.75rem;
    cursor: pointer;
    transition: var(--transition);
    position: relative;
    min-height: 120px;
  }

  .module-card:hover {
    background-color: var(--bg-card-hover);
    border-color: var(--accent-cyan);
    box-shadow: 0 4px 20px rgba(6, 182, 212, 0.15);
    transform: translateY(-2px);
  }

  .module-card .material-symbols-outlined {
    font-size: 2.5rem;
    transition: var(--transition);
  }

  /* Colors for modules */
  .c-blue {
    color: var(--accent-blue);
  }

  .c-orange {
    color: var(--accent-orange);
  }

  .c-white {
    color: var(--text-main);
  }

  .c-red {
    color: var(--accent-red);
  }

  .c-green {
    color: var(--accent-green);
  }

  .c-yellow {
    color: var(--accent-yellow);
  }

  .c-purple {
    color: var(--accent-purple);
  }

  .module-card:hover .c-blue {
    text-shadow: 0 0 10px var(--accent-blue);
    color: #60a5fa;
  }

  .module-card:hover .c-orange {
    text-shadow: 0 0 10px var(--accent-orange);
    color: #fdba74;
  }

  .module-card:hover .c-red {
    text-shadow: 0 0 10px var(--accent-red);
    color: #fca5a5;
  }

  .module-card:hover .c-green {
    text-shadow: 0 0 10px var(--accent-green);
    color: #86efac;
  }

  .module-card:hover .c-yellow {
    text-shadow: 0 0 10px var(--accent-yellow);
    color: #fde047;
  }

  .module-title {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--text-main);
  }

  .module-badge {
    position: absolute;
    top: 0.5rem;
    right: 0.5rem;
    font-size: 0.55rem;
    font-weight: 800;
    padding: 0.15rem 0.3rem;
    border-radius: 3px;
    letter-spacing: 0.05em;
  }

  .mod-b-cyan {
    background: var(--accent-cyan);
    color: #000;
  }

  .mod-b-red {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid var(--accent-red);
    color: var(--accent-red);
  }

  .mod-b-red-solid {
    background: var(--accent-red);
    color: #fff;
  }

  .mod-b-green {
    background: rgba(16, 185, 129, 0.15);
    border: 1px solid var(--accent-green);
    color: var(--accent-green);
  }

  .mod-b-yellow {
    background: rgba(245, 158, 11, 0.15);
    border: 1px solid var(--accent-yellow);
    color: var(--accent-yellow);
  }

  .mod-b-purple {
    background: rgba(139, 92, 246, 0.15);
    border: 1px solid var(--accent-purple);
    color: var(--accent-purple);
  }

  .mod-b-orange {
    background: rgba(249, 115, 22, 0.15);
    border: 1px solid var(--accent-orange);
    color: var(--accent-orange);
  }

  .mod-b-blue {
    background: rgba(59, 130, 246, 0.15);
    border: 1px solid var(--accent-blue);
    color: var(--accent-blue);
  }

  /* Notification dot variant */
  .mod-b-dot {
    position: absolute;
    top: -5px;
    right: -5px;
    width: 14px;
    height: 14px;
    background: var(--accent-red);
    color: white;
    border-radius: 50%;
    font-size: 0.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* FOOTER */
  .dashboard-footer {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--border-color);
    font-size: 0.6rem;
    font-weight: 600;
  }

  /* AI MODAL WINDOW - Replaces Sidebar */
  #ai-modal-overlay {
    z-index: 10000;
  }

  .ai-window {
    width: 450px;
    max-width: 95vw;
    height: 70vh;
    max-height: 800px;
    background-color: var(--bg-panel);
    border: 1px solid var(--border-color);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    border-radius: var(--radius-lg);
  }

  .ai-window .ai-chat {
    padding-bottom: 0;
    /* Let inputbox handle space */
  }

  /* Pulsate Animation for Mercurio Button */
  @keyframes ai-pulse {
    0% {
      transform: scale(1);
      filter: drop-shadow(0 0 0px var(--accent-orange));
    }

    50% {
      transform: scale(1.1);
      filter: drop-shadow(0 0 10px var(--accent-orange));
    }

    100% {
      transform: scale(1);
      filter: drop-shadow(0 0 0px var(--accent-orange));
    }
  }

  .ai-pulse-icon {
    animation: ai-pulse 2s infinite ease-in-out;
  }

  .btn-ai-sidebar {
    background: transparent;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
  }

  .btn-ai-sidebar:hover {
    background: rgba(255, 165, 0, 0.1);
  }

  .ai-header {
    flex: 0 0 auto;
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .ai-title-wrap h2 {
    font-size: 0.8rem;
    font-weight: 800;
    color: var(--text-main);
    letter-spacing: 0.05em;
  }

  .ai-title-wrap span {
    font-size: 0.55rem;
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }

  .ai-prompts {
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    flex: 0 0 auto;
    /* Mantener tamaño */
  }

  .ai-prompts.hidden {
    display: none;
  }

  .ai-caption {
    font-size: 0.7rem;
    color: var(--text-muted);
    font-weight: 500;
    margin-bottom: 0.25rem;
  }

  .ai-btn-prompt {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 0.75rem 1rem;
    border-radius: var(--radius-md);
    font-size: 0.75rem;
    text-align: left;
    cursor: pointer;
    transition: var(--transition);
    line-height: 1.4;
  }

  .ai-btn-prompt:hover {
    background: var(--bg-card-hover);
    border-color: var(--accent-cyan);
    transform: translateX(5px);
  }

  .ai-chat {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .ai-msg {
    max-width: 85%;
    padding: 0.75rem 1rem;
    border-radius: 1rem;
    font-size: 0.8rem;
    line-height: 1.4;
    word-wrap: break-word;
  }

  .ai-msg-bot {
    align-self: flex-start;
    background: var(--bg-card);
    color: var(--text-main);
    border-bottom-left-radius: 0.2rem;
    border: 1px solid var(--border-color);
    border-left: 4px solid var(--accent-cyan);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
  }

  .btn-picker-inline {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(6, 182, 212, 0.1);
    border: 1px solid var(--accent-cyan);
    color: var(--accent-cyan);
    padding: 0.6rem 1rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.75rem;
    font-weight: 600;
    margin-top: 0.75rem;
    transition: all 0.2s;
  }

  .btn-picker-inline:hover {
    background: var(--accent-cyan);
    color: white;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
  }

  .btn-picker-form {
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-picker-form:hover {
    background: var(--bg-card-hover) !important;
    border-color: var(--accent-cyan) !important;
    transform: scale(1.05);
    color: var(--accent-cyan) !important;
  }

  .ai-msg-user {
    align-self: flex-end;
    background: linear-gradient(135deg, #0f172a 0%, var(--accent-blue) 100%);
    color: #fff;
    border-bottom-right-radius: 0.2rem;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 4px 20px rgba(59, 130, 246, 0.2);
  }

  .ai-msg-typing {
    font-style: italic;
    color: var(--text-muted);
    opacity: 0.7;
  }

  .ai-inputbox {
    flex: 0 0 auto;
    padding: 1rem;
    padding-bottom: clamp(1rem, 5vh, 2rem);
    /* Más espacio abajo por si acaso */
    border-top: 1px solid var(--border-color);
    display: flex;
    gap: 0.5rem;
    background: var(--bg-panel);
  }

  .ai-inputbox input {
    flex: 1;
    background: var(--bg-main);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 0.6rem 1rem;
    color: var(--text-main);
    font-family: inherit;
    font-size: 0.8rem;
  }

  .ai-inputbox input:focus {
    outline: none;
    border-color: var(--accent-cyan);
  }

  .btn-send {
    background: var(--accent-blue);
    color: white;
    border: none;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
  }

  .btn-send:hover {
    transform: scale(1.1);
    box-shadow: 0 0 10px var(--accent-blue);
  }

  .ai-inputbox input:focus {
    outline: none;
    border-color: var(--accent-cyan);
  }

  .ai-inputbox .btn-send {
    background: transparent;
    border: none;
    color: var(--border-color);
    cursor: pointer;
    transition: var(--transition);
  }

  .ai-inputbox input:focus+.btn-send {
    color: var(--accent-cyan);
  }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: rgba(5, 10, 17, 0.8);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: var(--transition);
  }

  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .modal {
    background-color: var(--bg-card);
    border-radius: var(--radius-lg);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    width: 600px;
    max-width: 90vw;
    display: flex;
    flex-direction: column;
    transform: translateY(20px);
    transition: var(--transition);
    border: 1px solid var(--accent-cyan);
  }

  .modal-overlay.active .modal {
    transform: translateY(0);
  }

  .modal-header {
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .modal-header h3 {
    flex: 1;
    min-width: 150px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--accent-cyan);
  }

  .modal-body {
    padding: 1.5rem;
  }

  /* FORMS */
  .form-group {
    margin-bottom: 1rem;
  }

  .form-group label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }

  .form-control {
    width: 100%;
    padding: 0.75rem;
    border-radius: 4px;
    border: 1px solid var(--border-color);
    background-color: rgba(0, 0, 0, 0.2);
    color: var(--text-main);
    font-family: inherit;
    font-size: 0.8rem;
    transition: var(--transition);
  }

  .form-control:focus {
    outline: none;
    border-color: var(--accent-cyan);
    background: rgba(6, 182, 212, 0.05);
  }

  select.form-control option {
    background-color: var(--bg-panel);
    color: var(--text-main);
  }

  .form-row {
    display: flex;
    gap: 1rem;
  }

  .form-row .form-group {
    flex: 1;
  }

  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 1rem;
    margin-top: 1.5rem;
  }

  .btn-outline {
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 0.5rem 1.5rem;
    border-radius: 4px;
    font-weight: 600;
    font-size: 0.8rem;
    cursor: pointer;
    transition: var(--transition);
  }

  .btn-outline:hover {
    border-color: var(--text-main);
  }

  .btn-primary {
    background-color: var(--accent-cyan);
    color: var(--bg-main);
    border: none;
    padding: 0.5rem 1.5rem;
    border-radius: 4px;
    font-weight: 700;
    font-size: 0.8rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    transition: var(--transition);
  }

  .btn-primary:hover {
    box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
  }

  /* DATA TABLES */
  .data-table {
    width: 100%;
    border-collapse: collapse;
    color: var(--text-main);
    font-size: 0.8rem;
    text-align: left;
  }

  .data-table th {
    background-color: var(--bg-card-hover);
    color: var(--accent-cyan);
    padding: 1rem;
    border-bottom: 2px solid var(--border-color);
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  .data-table td {
    padding: 1rem;
    border-bottom: 1px solid var(--bg-panel);
    background-color: var(--bg-card);
  }

  .data-table tr {
    cursor: pointer;
    transition: var(--transition);
  }

  .data-table tr:hover td {
    background-color: rgba(6, 182, 212, 0.08);
  }

  .table-badge {
    display: inline-block;
    white-space: nowrap;
    padding: 0.2rem 0.6rem;
    border-radius: 20px;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
  }

  .tb-green {
    background: rgba(16, 185, 129, 0.2);
    color: var(--accent-green);
    border: 1px solid var(--accent-green);
  }

  .tb-yellow {
    background: rgba(251, 191, 36, 0.2);
    color: var(--accent-yellow);
    border: 1px solid var(--accent-yellow);
  }

  .tb-red {
    background: rgba(239, 68, 68, 0.2);
    color: var(--accent-red);
    border: 1px solid var(--accent-red);
  }

  .tb-blue {
    background: rgba(59, 130, 246, 0.2);
    color: var(--accent-blue);
    border: 1px solid var(--accent-blue);
  }

  .badge-red {
    background: rgba(239, 68, 68, 0.3);
    color: #ff4444;
    border: 1px solid #ff4444;
  }

  .badge-yellow {
    background: rgba(251, 191, 36, 0.2);
    color: #fbbf24;
    border: 1px solid #fbbf24;
  }

  /* GRID SCROLL MOCK FIX */
  .modules-grid {
    padding-bottom: 2rem;
  }

  /* SFI Filter Buttons */
  .btn-sfi-grp {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    padding: 0.5rem 1rem;
    border-radius: 0.5rem;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    transition: all 0.2s;
  }

  .btn-sfi-grp:hover {
    border-color: var(--accent-orange);
    color: var(--text-main);
  }

  .btn-sfi-grp.active {
    background: var(--accent-orange);
    border-color: var(--accent-orange);
    color: white;
    box-shadow: 0 0 10px rgba(255, 165, 0, 0.4);
  }

  /* Maintenance SFI Filter Buttons */
  .btn-sfi-grp-maint {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    padding: 0.5rem 1rem;
    border-radius: 0.5rem;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    transition: all 0.2s;
  }

  .btn-sfi-grp-maint:hover {
    border-color: var(--accent-orange);
    color: var(--text-main);
  }

  .btn-sfi-grp-maint.active {
    background: var(--accent-orange);
    border-color: var(--accent-orange);
    color: white;
    box-shadow: 0 0 10px rgba(255, 165, 0, 0.4);
  }

  .view-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .route-kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 0.9rem;
    margin-bottom: 1rem;
  }

  .route-kpi-card,
  .route-panel-card,
  .route-stop-card {
    border: 1px solid rgba(6, 182, 212, 0.12);
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(15, 27, 45, 0.96), rgba(10, 17, 30, 0.94));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
  }

  .route-kpi-card {
    padding: 0.95rem 1rem;
    min-width: 0;
  }

  .route-kpi-label,
  .route-kpi-subvalue,
  .route-panel-note,
  .route-stop-meta,
  .route-stop-coords,
  .route-stop-topline span {
    color: var(--text-muted);
  }

  .route-kpi-label,
  .route-panel-note,
  .route-stop-meta,
  .route-stop-coords,
  .route-stop-topline span {
    font-size: 0.76rem;
  }

  .route-kpi-value {
    display: block;
    margin-top: 0.35rem;
    font-size: 1.05rem;
    color: var(--text-main);
    font-weight: 800;
    letter-spacing: 0.02em;
  }

  .route-kpi-subvalue {
    display: block;
    margin-top: 0.2rem;
    font-size: 0.72rem;
  }

  .route-kpi-ellipsis {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .route-layout-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.45fr) minmax(320px, 0.95fr);
    gap: 1rem;
    min-height: 0;
  }

  .route-panel-card {
    padding: 1rem;
  }

  .route-panel-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.75rem;
    margin-bottom: 0.85rem;
  }

  .route-panel-title {
    color: var(--accent-cyan);
    font-size: 0.9rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 0.35rem;
  }

  .route-map-stage {
    min-height: 420px;
    border-radius: 18px;
    overflow: hidden;
    background:
      radial-gradient(circle at top left, rgba(16, 185, 129, 0.08), transparent 24%),
      radial-gradient(circle at top right, rgba(6, 182, 212, 0.12), transparent 28%),
      linear-gradient(180deg, rgba(6, 14, 26, 0.96), rgba(3, 8, 16, 0.96));
    border: 1px solid rgba(59, 130, 246, 0.16);
    display: flex;
    align-items: stretch;
    justify-content: stretch;
  }

  .route-map-svg {
    width: 100%;
    height: 100%;
    min-height: 420px;
    display: block;
  }

  .route-map-canvas {
    width: 100%;
    min-height: 420px;
    height: 100%;
  }

  .route-map-canvas .leaflet-control-attribution,
  .route-map-canvas .leaflet-control-zoom a {
    background: rgba(10, 17, 30, 0.92);
    color: var(--text-main);
    border-color: rgba(6, 182, 212, 0.22);
  }

  .route-map-canvas .leaflet-popup-content-wrapper,
  .route-map-canvas .leaflet-popup-tip {
    background: #f8fafc;
  }

  .route-map-error {
    min-height: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--text-muted);
    padding: 1.5rem;
  }

  .route-timeline-panel {
    min-height: 420px;
  }

  .route-timeline-list {
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
    max-height: 520px;
    overflow: auto;
    padding-right: 0.25rem;
  }

  .route-stop-card {
    padding: 0.9rem;
    display: flex;
    gap: 0.9rem;
    align-items: flex-start;
  }

  .route-stop-index {
    width: 34px;
    height: 34px;
    border-radius: 999px;
    background: rgba(6, 182, 212, 0.12);
    border: 1px solid rgba(6, 182, 212, 0.28);
    color: var(--accent-cyan);
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }

  .route-stop-body {
    min-width: 0;
    flex: 1;
  }

  .route-stop-topline {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    flex-wrap: wrap;
    margin-bottom: 0.45rem;
    font-size: 0.8rem;
  }

  .route-stop-position {
    color: var(--text-main);
    font-size: 0.92rem;
    font-weight: 700;
    line-height: 1.35;
    margin-bottom: 0.35rem;
    word-break: break-word;
  }

  .route-stop-coords {
    margin-bottom: 0.35rem;
  }

  .route-stop-coords-muted {
    color: rgba(148, 163, 184, 0.85);
  }

  .route-empty-state {
    min-height: 320px;
    border: 1px dashed rgba(148, 163, 184, 0.22);
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    color: var(--text-muted);
    text-align: center;
    padding: 2rem;
    background: rgba(255,255,255,0.02);
  }

  .route-empty-state .material-symbols-outlined {
    font-size: 2rem;
    color: var(--accent-cyan);
  }

  /* MEDIA QUERIES - MOBILE SUPPORT */
  @media (max-width: 768px) {

    body,
    html {
      overflow-y: auto;
      height: auto;
    }

    .app-layout {
      flex-direction: column;
      height: auto;
    }

    .sidebar-mini {
      width: 100%;
      height: auto;
      flex-direction: row;
      padding: 0.5rem 1rem;
      position: sticky;
      top: 0;
      justify-content: space-between;
    }

    .brand-logo {
      margin-bottom: 0;
    }

    .nav-mini {
      flex-direction: row;
      flex: none;
      gap: 0.5rem;
    }

    .sidebar-footer {
      display: none;
    }

    .dashboard-header {
      height: auto;
      min-height: 70px;
      padding: 1rem;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-start;
    }

    .dashboard-header > .d-flex:first-child {
      width: 100%;
    }

    .dashboard-header > .d-flex:last-child {
      width: 100%;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: nowrap;
    }

    .dashboard-header > .d-flex:last-child > div:first-child {
      min-width: 0;
      flex: 1;
    }

    .dashboard-header > .d-flex:last-child .btn-cyan-outline {
      padding: 0.45rem 0.7rem;
      font-size: 0.7rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .dashboard-header > .d-flex:last-child .btn-icon-subtle {
      flex-shrink: 0;
    }

    .header-title-box h1 {
      font-size: 1rem;
    }

    .desktop-only {
      display: none !important;
    }

    .content-wrapper {
      padding: 1rem;
      gap: 1rem;
    }

    .dashboard-grid-3 {
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    .route-kpi-grid,
    .route-layout-grid {
      grid-template-columns: 1fr;
    }

    .route-timeline-list {
      max-height: none;
    }

    .route-map-stage,
    .route-map-svg,
    .route-map-canvas,
    .route-timeline-panel {
      min-height: 320px;
    }

    .snapshot-grid {
      grid-template-columns: 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .snapshot-card {
      width: 100%;
    }

    .charts-row {
      flex-direction: column;
      height: auto;
    }

    .pie-card,
    .bar-card {
      flex: none;
      width: 100%;
    }

    .modules-grid {
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.75rem;
    }

    .module-card {
      padding: 1rem;
      height: 100px;
    }

    .module-card .material-symbols-outlined {
      font-size: 1.5rem;
    }

    .modal {
      width: 95%;
      margin: 10% auto;
    }

    .modal-body {
      grid-template-columns: 1fr !important;
    }

    .data-table {
      display: block;
      overflow-x: auto;
      font-size: 0.75rem;
    }

    .data-table th,
    .data-table td {
      padding: 0.6rem;
    }

    .sfi-filter-bar {
      gap: 0.25rem;
    }

    .btn-sfi-grp,
    .btn-sfi-grp-maint {
      padding: 0.4rem 0.6rem;
      font-size: 0.7rem;
    }

    #field-guide-bar {
      display: none !important;
    }

    .ai-window {
      width: 95vw;
      height: 85vh;
    }

    /* Fix views header on mobile */
    .view-header {
      flex-direction: column !important;
      align-items: stretch !important;
      gap: 1rem !important;
      margin-bottom: 1rem !important;
    }

    .view-header h2 {
      width: 100%;
      font-size: 0.9rem !important;
    }

    .view-header .header-actions {
      display: flex;
      width: 100%;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .view-header select.form-control {
      flex: 1;
      width: auto !important;
      min-width: 0;
    }

    .view-header .btn-icon-subtle {
      background: rgba(255, 255, 255, 0.1);
    }
  }

  @media (max-width: 480px) {
    .modules-grid {
      grid-template-columns: 1fr 1fr;
    }

    .header-title-box h1 {
      font-size: 0.9rem;
    }
  }

  /* --- PRINT STYLES --- */

    }

      background: white !important;
      margin: 0;
      padding: 0;

    }

  /* SPARE PICKER STYLES */
  .spare-picker-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(8px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2000;
  }
