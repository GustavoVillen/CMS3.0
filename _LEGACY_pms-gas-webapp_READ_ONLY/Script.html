  function createOTFromTask(rowIndex) {
    const task = currentMaintenancePlanData.find(d => d._rowIndex === rowIndex);
    if (!task) return;

    // Mapeo inteligente del Plan -> OT
    const today = new Date();
    const tYear = today.getFullYear();
    const tMonth = String(today.getMonth() + 1).padStart(2, '0');
    const tDay = String(today.getDate()).padStart(2, '0');
    const remarksParts = buildMaintenancePlanWorkOrderRemarks(task);

    const prefill = {
      TaskID: getVal(task, "TaskID", "Task ID", "ID"),
      VesselName: getVal(task, "VesselName", "Barco", "Embarcacion"),
      AssetID: getVal(task, "SFI", "AssetID", "CODIGO"),
      Criticidad: getVal(task, "Criticidad", "Criticality"),
      Type: "Preventiva",
      Priority: "Media",
      Status: "ABIERTA",
      OpenDate: `${tYear}-${tMonth}-${tDay}`,
      PlannedDate: parseDateForInput(getVal(task, "Siguiente_Vencimiento_Fecha", "NextDate")),
      Remarks: remarksParts.join("\n"),
      hideCierre: true
    };

    openGeneralModal(null, "WORK_ORDERS", prefill);
  }

  function formatWorkOrderBlock(label, value) {
    const lines = String(value || "")
      .split(/\r?\n/)
      .map(line => line.trim())
      .filter(Boolean);
    if (!lines.length) return "";
    return `${label}\n${lines.map(line => `- ${line}`).join("\n")}`;
  }

  function buildMaintenancePlanWorkOrderRemarks(task) {
    if (!task) return [];
    const equipmentName = getVal(task, "Equipo", "Nombre_Funcional", "Equipo_ID");
    return [
      formatWorkOrderBlock("Tarea programada:", getVal(task, "Tarea_Mantenimiento", "Tarea", "Job", "Description")),
      formatWorkOrderBlock("Evidencia requerida:", getVal(task, "Evidencia_Requerida")),
      formatWorkOrderBlock("Criterio de aceptación:", getVal(task, "Criterio_Aceptacion")),
      equipmentName ? `Equipo: ${equipmentName}` : "",
    ].filter(Boolean);
  }

  function enrichWorkOrderRemarksFromTask(item) {
    if (!item) return "";
    const currentRemarks = String(item.Remarks || "").trim();
    const taskId = String(item.TaskID || "").trim();
    if (!taskId) return currentRemarks;

    const maintenanceTask = (currentMaintenancePlanData || []).find(task => normalizeRefKey(task.TaskID) === normalizeRefKey(taskId));
    if (!maintenanceTask) return currentRemarks;

    const requiredBlocks = buildMaintenancePlanWorkOrderRemarks(maintenanceTask);
    if (!requiredBlocks.length) return currentRemarks;
    if (!currentRemarks) return requiredBlocks.join("\n\n");

    const normalizedRemarks = normalizeSmartText(currentRemarks);
    const missingBlocks = requiredBlocks.filter(block => {
      const firstLine = String(block || "").split(/\r?\n/)[0];
      return firstLine && !normalizedRemarks.includes(normalizeSmartText(firstLine));
    });

    return missingBlocks.length ? `${currentRemarks}\n\n${missingBlocks.join("\n\n")}` : currentRemarks;
  }

  // --- WORK ORDERS (PROC-MAN-01) ---
  let currentWorkOrdersData = [];
  function loadWorkOrdersTable() {
    pendingSparesUsage = []; // Reset al cargar/recargar
    const container = document.getElementById("work-orders-table-container");
    container.innerHTML = `<div class="loading-state" style="padding: 2rem; text-align: center; color: var(--text-muted);"><span class="material-symbols-outlined" style="animation: spin 2s linear infinite;">sync</span> Sincronizando Plan de Mantenimiento...</div>`;
    
    Promise.all([
      cachedRun("apiGetWorkOrders"),
      cachedRun("apiGetDefects").catch(() => currentDefectData || []),
    ])
      .then(([workOrdersData, defectsData]) => {
        currentWorkOrdersData = workOrdersData || [];
        currentDefectData = defectsData || currentDefectData || [];
        populateVesselFilter("vessel-filter-work-orders", currentWorkOrdersData, "VesselName");
        renderWorkOrdersTable();
      })
      .catch(err => {
        container.innerHTML = `<div style="padding: 2rem; color: var(--accent-red);">Error al cargar OTs: ${err.message}</div>`;
      });
  }

  function filterWorkOrdersTable() {
    if (currentActiveModule === "MAINTENANCE_PLAN") {
      renderMaintenancePlanTable();
    } else {
      renderWorkOrdersTable();
    }
  }

  function renderWorkOrdersTable() {
    const container = document.getElementById("work-orders-table-container");
    const vFilter = document.getElementById("vessel-filter-work-orders").value;
    const kpiContainer = document.getElementById("wo-kpi-container");

    let filtered = currentWorkOrdersData;
    if (vFilter && vFilter !== "") {
      filtered = filtered.filter(d => (d.VesselName || "").toString().toUpperCase() === vFilter.toUpperCase());
    }

    if (currentWorkOrdersStatusFilter) {
      filtered = filtered.filter(d => getWorkOrderChartStatus(d) === currentWorkOrdersStatusFilter);
    }

    filtered.sort((a, b) => {
      const idA = (a.OT_ID || "").toString();
      const idB = (b.OT_ID || "").toString();
      return idB.localeCompare(idA);
    });

    // DIFERENCIACIÓN DE VISTAS (Plan vs OTs)
    if (currentActiveModule === "MAINTENANCE_PLAN") {
      // Vista PLAN: Mostrar KPIs de planificación y ocultar OTs cerradas (la historia)
      if (kpiContainer) kpiContainer.style.display = "flex";
      filtered = filtered.filter(ot => normalizeStatus(ot.Status) !== 'CLOSED');
    } else {
      // Vista ÓRDENES DE TRABAJO: Ocultar KPIs de planificación para foco en el log completo
      if (kpiContainer) kpiContainer.style.display = "none";
      // Mostrar todo (historial incluido)
    }

    // Calcular KPIs (basado en el filtrado por barco, pero ignorando el de vista para que los números sean reales)
    const kpiBase = (vFilter && vFilter !== "")
      ? currentWorkOrdersData.filter(d => (d.VesselName || "").toString().toUpperCase() === vFilter.toUpperCase())
      : currentWorkOrdersData;

    const overdueCount = kpiBase.filter(ot => {
      const isCritical = (ot.Criticidad === "A" || ot.Criticidad === "B");
      const dueInfo = getWorkOrderDueDateInfo(ot);
      const isOverdue = normalizeStatus(ot.Status) !== 'CLOSED' && isTaskOverdue(dueInfo.dueDate, dueInfo.tolerance);
      return isCritical && isOverdue;
    }).length;

    const pendingVerifCount = kpiBase.filter(ot => normalizeStatus(ot.Status) === 'PENDING_VERIFICATION').length;

    if (document.getElementById("kpi-wo-overdue")) document.getElementById("kpi-wo-overdue").innerText = overdueCount;
    if (document.getElementById("kpi-wo-pending-verif")) document.getElementById("kpi-wo-pending-verif").innerText = pendingVerifCount;

    const defectOriginMap = new Map(
      (currentDefectData || [])
        .filter(defect => String(defect.OT_Asociada || "").trim())
        .map(defect => [normalizeRefKey(defect.OT_Asociada), String(defect.Defecto_ID || "").trim()])
    );

    filtered.sort((a, b) => {
      const idA = parseInt((a.OT_ID || "").toString().replace(/\D/g, "")) || 0;
      const idB = parseInt((b.OT_ID || "").toString().replace(/\D/g, "")) || 0;
      return idB - idA; // DESC (Más nuevas arriba por ID)
    });

    let html = `
      <div style="margin-bottom: 1.5rem; display: flex; gap: 1rem;">
         <button class="btn-primary" onclick="openGeneralModal(null, 'WORK_ORDERS')" style="display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 1.2rem; text-transform: uppercase;">
           <span class="material-symbols-outlined fs-md">add_circle</span> CREAR NUEVA OT
         </button>
      </div>`;

    if (filtered.length === 0) {
      container.innerHTML = html + `<div style="text-align:center; padding: 2rem; color: var(--text-muted);">No hay Órdenes de Trabajo registradas.</div>`;
      return;
    }

    html += `<table class="data-table">
                <thead>
                    <tr>
                        <th>OT ID / PLAZO</th>
                        <th>ORIGEN DE LA OT</th>
                        <th>EMBARCACIÓN / SFI</th>
                        <th>DESCRIPCIÓN TAREA</th>
                        <th>TIPO / PRIORIDAD</th>
                        <th>ASIGNACIÓN</th>
                        <th>STATUS</th>
                        <th>TRAZA</th>
                    </tr>
                </thead>
                <tbody>`;

    filtered.forEach(item => {
      const canonicalStatus = normalizeStatus(item.Status || 'OPEN');
      const displayStatus = getWorkOrderDisplayStatusText(item);
      const statusClass = getWorkOrderDisplayStatusBadgeClass(item);
      const statusText = displayStatus;
      const originId = defectOriginMap.get(normalizeRefKey(item.OT_ID)) || String(item.TaskID || "").trim() || "-";
      const dueInfo = getWorkOrderDueDateInfo(item);
      const missingExecutor = !String(item.Responsable_Ejecutor || "").trim() || String(item.Responsable_Ejecutor || "").trim() === "-";
      const missingResponsibleName = !String(item.Nombre_Responsable || "").trim() || String(item.Nombre_Responsable || "").trim() === "-";
      const assignmentPending = missingExecutor || missingResponsibleName;
      const enrichedRemarks = enrichWorkOrderRemarksFromTask(item);
      const remarksPreviewLines = String(enrichedRemarks || "-")
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(Boolean)
        .slice(0, 4);
      const remarksPreview = remarksPreviewLines.length
        ? remarksPreviewLines.map(line => escapeInlineHtml(line)).join('<br>')
        : '-';

      const isCritical = (item.Criticidad === "A" || item.Criticidad === "B");
      const isOverdue = canonicalStatus !== 'CLOSED' && isTaskOverdue(dueInfo.dueDate, dueInfo.tolerance);
      const traceActions = [
        item.TaskID ? buildTraceButton("fact_check", "Abrir inspección", `focusInspectionPlanByTaskId(${JSON.stringify(item.TaskID || "")})`) : "",
        item.TaskID ? buildTraceButton("history", "Abrir historial", `focusInspectionLogByTaskId(${JSON.stringify(item.TaskID || "")})`) : "",
        (item.OT_ID || item.TaskID) ? buildTraceButton("report_problem", "Abrir defecto", `focusDefectByReference(${JSON.stringify(item.OT_ID || "")}, ${JSON.stringify(item.TaskID || "")})`) : ""
      ].filter(Boolean).join("");

      let critBadge = `<span class="table-badge ${isCritical ? 'tb-red' : 'tb-blue'}" style="padding: 2px 4px; font-size: 0.6rem;">${item.Criticidad || 'C'}</span>`;
      let overdueAlert = "";
      if (displayStatus === 'DEF Pend.') {
        overdueAlert = `<br><span style="color:var(--accent-yellow); font-weight:bold; font-size:0.7rem;">DEF Pend.</span>`;
      } else if (displayStatus === 'DIFERIDO') {
        overdueAlert = `<br><span style="color:var(--accent-yellow); font-weight:bold; font-size:0.7rem;">DIFERIDO</span>`;
      } else if (isOverdue) {
        overdueAlert = `<br><span style="color:var(--accent-red); font-weight:bold; font-size:0.7rem;">VENCIDA</span>`;
      }

      html += `<tr onclick="openGeneralModal(${item._rowIndex}, 'WORK_ORDERS')" style="cursor: pointer;">
                    <td>
                        <div style="font-weight:700;">${item.OT_ID || "-"}</div>

                    </td>
                    <td style="font-size:0.8rem; font-weight:700; color:var(--accent-cyan);">${originId}</td>
                    <td>
                        <div style="font-weight:600;">${item.VesselName || "-"}</div>
                        <div style="font-size:0.75rem; color:var(--text-muted);">SFI: ${item.AssetID || "-"} ${critBadge}</div>
                    </td>
                    <td style="font-size: 0.85rem;">
                        <strong>${item.Type || "-"}</strong><br>
                        <span style="font-size:0.78rem; color:var(--text-muted); line-height:1.35; display:block; margin-top:0.2rem;">${remarksPreview}</span>
                    </td>
                    <td style="font-size: 0.85rem;">
                       <div>${item.Type || "-"}</div>
                       <div style="font-size:0.75rem; font-weight:bold; color:${item.Priority === 'Emergencia' ? 'var(--accent-red)' : 'var(--text-muted)'}">${item.Priority || "-"}</div>

                    <td style="font-size: 0.85rem;">
                       <div style="color:${assignmentPending ? 'var(--accent-red)' : 'var(--text-main)'};"><strong>Resp:</strong> ${item.Responsable_Ejecutor || "-"}</div>
                       <div style="font-size:0.75rem; color:${assignmentPending ? 'var(--accent-red)' : 'var(--text-muted)'};"><strong>Nombre:</strong> ${item.Nombre_Responsable || "-"}</div>
                       <div style="font-size:0.75rem; color:var(--text-muted);"><strong>Asignó:</strong> ${item.Asignado_Por || "-"}</div>
                       <div style="font-size:0.75rem; color:var(--text-muted);"><strong>Verifica:</strong> ${item.Verificador_Independiente || "-"}</div>
                       ${assignmentPending ? '<div style="margin-top:0.45rem;"><span class="table-badge tb-red" style="font-size:0.68rem;">Asignar Resp</span></div>' : ''}
                    </td>
                    <td><span class="table-badge ${statusClass}" style="display:inline-flex; align-items:center;">${statusText}</span></td>
                    <td style="text-align:center; white-space:nowrap;">${traceActions || "-"}</td>
                </tr>`;
    });
    html += `</tbody></table>`;
    container.innerHTML = html;
  }

  function isTaskOverdue(plannedDateStr, toleranceDays) {
    if (!plannedDateStr) return false;
    const pDate = parseDateManual(plannedDateStr);
    if (!pDate) return false;

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const limitDate = new Date(pDate);
    limitDate.setDate(limitDate.getDate() + (parseInt(toleranceDays) || 0));
    limitDate.setHours(0, 0, 0, 0);

    return today > limitDate;
  }

  /* MODAL LOGIC */

  let currentEvalProveedoresData = [];
  let currentNCProveedoresData = [];
  let currentDefectFormContext = null;
  let pendingDefectBarrierAssessment = null;

    let isEdit = rowIndex !== null;
    let fields = [];
    let dataList = [];

    if (modalElement) {
      modalElement.style.width = "";
      modalElement.style.maxWidth = "";
      modalElement.style.maxHeight = "";
    }

    switch (mode) {

      case 'SPARES': fields = SPARES_FIELDS; dataList = currentSparesData; break;
      case 'SPARE_ORDERS': fields = SPARE_ORDERS_FIELDS; dataList = currentSpareOrdersData; break;
      case 'SPARE_ORDER_RECEIPT': fields = SPARE_ORDER_RECEIPT_FIELDS; dataList = currentSpareOrdersData; break;
      case 'INSPECTIONS': fields = INSPECTION_PLAN_FIELDS; dataList = currentInspectionsData; break;
      case 'INSPECTIONS_LOG': fields = INSPECTION_LOG_FIELDS; dataList = currentInspectionsLogData; break;
      case 'CAPA_LOG': fields = CAPA_FIELDS; dataList = currentCapaData; break;
      case 'RCA_LOG': fields = RCA_FIELDS; dataList = currentRcaData; break;
      case 'DEFECT_LOG': fields = DEFECT_FIELDS; dataList = currentDefectData; break;
      case 'WORK_ORDERS': fields = WORK_ORDERS_FIELDS; dataList = currentWorkOrdersData; break;
      case 'MAINTENANCE_PLAN': fields = MAINTENANCE_PLAN_FIELDS; dataList = currentMaintenancePlanData; break;
      case 'DAILY_REPORTS': fields = DAILY_REPORTS_FIELDS; dataList = currentDailyData; break;
      case 'CERTIFICATES': fields = CERTIFICATE_FIELDS; dataList = currentCertificatesData; break;
      case 'PROVEEDORES': fields = PROVEEDORES_FIELDS; dataList = currentProveedoresData; break;
      case 'EVAL_PROVEEDORES': fields = EVAL_PROVEEDORES_FIELDS; dataList = currentEvalProveedoresData; break;
      case 'NC_PROVEEDORES': fields = NC_PROVEEDORES_FIELDS; dataList = currentNCProveedoresData; break;
      case 'DEFERRALS': fields = DEFERRALS_FIELDS; dataList = currentDeferralsData; break;
      default: fields = INVENTORY_FIELDS; dataList = currentInventoryData;
    }

    let itemData = isEdit ? dataList.find(d => d._rowIndex === rowIndex) : (prefilledData || {});

    if (mode === 'INSPECTIONS') {
      const freqKey = String(itemData?.Frecuencia || '').trim().toUpperCase();
      let freqS = '';

      if (freqKey === 'SEMANAL') freqS = '1';
      else if (freqKey === 'QUINCENAL') freqS = '2';
      else if (freqKey === 'MENSUAL') freqM = '1';
      else if (freqKey === 'TRIMESTRAL') freqM = '3';
      else if (freqKey === 'SEMESTRAL') freqM = '6';
      else if (freqKey === 'ANUAL') freqM = '12';
      itemData = Object.assign({}, itemData, {
        FREQS: itemData?.FREQS || freqS,
        FREQM: itemData?.FREQM || freqM,
      });
    }
    if (mode === 'WORK_ORDERS' && itemData) {
      itemData = Object.assign({}, itemData, {
        Remarks: enrichWorkOrderRemarksFromTask(itemData),
      });
    }

    if (mode === 'DEFECT_LOG') {
      currentDefectFormContext = {
        rowIndex: rowIndex,
        isEdit: isEdit,
        defectId: itemData && itemData.Defecto_ID ? itemData.Defecto_ID : null
      };
      pendingDefectBarrierAssessment = null;
    }

    if (mode === 'WORK_ORDERS') {
      currentWorkOrderModalContext = {
        existingDeferral: null,
        assessmentStale: false,
        assessmentRunning: false,
        lastAssessmentSignature: "",
        statusBeforeDeferred: "",
        rowIndex: rowIndex,
      };
    }

    if (mode === 'SPARES') {
      titleText = isEdit ? `EDITAR SKU: ${itemData?.SKU || ''}` : 'REGISTRAR NUEVO SKU';

    if (mode === 'INVENTARIO') {
      const inventoryRef = itemData?.Nombre_Funcional || itemData?.SFI || itemData?.Equipo_ID || '';
      titleText = isEdit ? `EDITAR INVENTARIO: ${inventoryRef}` : 'REGISTRAR NUEVO INVENTARIO SFI';
    }

    if (mode === 'INSPECTIONS') {
      const inspectionRef = itemData?.Descripcion_Prueba || itemData?.TaskID || 'NUEVA INSPECCIÓN';

    }

    if (mode === 'WORK_ORDERS') {
      titleText = `OT Nro: ${itemData?.OT_ID || 'NUEVA'}`;
    }

      titleText = 'Registro de Fallas';

    if (mode === 'MAINTENANCE_PLAN') {
      titleText = 'Tarea de Mantenimiento';

    if (mode === 'DAILY_REPORTS') {
      modalOverlay.classList.remove("active");
      openDetailedDailyReportModal(rowIndex, itemData);

    const modalBodyMaxHeight = mode === 'INVENTARIO' ? '68vh' : '60vh';
    let html = `<form id="general-form" onsubmit="submitGeneralForm(event, ${rowIndex}, '${mode}')">
                  <div class="modal-body" style="display: grid; grid-template-columns: ${modalGridTemplate}; gap: 1rem; max-height: ${modalBodyMaxHeight}; overflow-y: auto;">`;

    // In RCA mode, inject a prominent AI wizard button at the top

      html += `<div style="grid-column: span 2; background: linear-gradient(135deg, rgba(255,165,0,0.1), rgba(59,130,246,0.1)); border: 1px solid var(--accent-orange); border-radius: var(--radius-md); padding: 1rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem;">

      if (resPruebaSelect && statusSelect) {
        resPruebaSelect.addEventListener("change", (e) => {
          if (e.target.value === "PASS") {
            statusSelect.value = "CLOSED";
            statusSelect.dispatchEvent(new Event("change"));
          }
        });
      }
      setupWorkOrderDeadlineControls();
      setupWorkOrderAssessmentControls();
      setupWorkOrderDeferralControls();
    }
    // Lógica de cálculo automático para Plan de Mantenimiento
    if (mode === 'MAINTENANCE_PLAN') {
      const fFreqHS = document.getElementById("field-Frecuencia_HS");
      const fFreqMes = document.getElementById("field-Frecuencia_Meses");
      const fUltHS = document.getElementById("field-Ultima_Ejecucion_HS");
      const fUltFecha = document.getElementById("field-Ultima_Ejecucion_Fecha");
      const fSigHS = document.getElementById("field-Siguiente_Vencimiento_HS");
      const fSigFecha = document.getElementById("field-Siguiente_Vencimiento_Fecha");

      const recalcHS = () => {
        const freq = parseFloat(fFreqHS.value) || 0;
        const ult = parseFloat(fUltHS.value) || 0;
        if (freq > 0 && ult > 0) fSigHS.value = (ult + freq).toString();
      };

      const recalcStatus = () => {
        const vName = document.getElementById("modal-select-VesselName")?.value || "";
        const sfi = document.getElementById("field-SFI")?.value || "";
        const sDate = fSigFecha.value;
        const statusSelect = document.getElementById("modal-select-Status");
        if (!statusSelect) return;
        const hasOpenOT = currentWorkOrdersData.some(ot =>
          normalizeStatus(ot.Status) !== 'CLOSED' &&
          ot.VesselName === vName &&
          ot.AssetID === sfi
        );
        let newStatus = "VALIDO";
        if (hasOpenOT) newStatus = "EN PROCESO";
        else if (isTaskOverdue(sDate, 0)) newStatus = "VENCIDA";
        statusSelect.value = newStatus;
      };

      const recalcFecha = () => {
        const freq = parseInt(fFreqMes.value) || 0;
        const ultVal = fUltFecha.value;
        if (freq > 0 && ultVal) {
          try {
            const parts = ultVal.split(/[-/]/);
            if (parts.length === 3) {
              let year, month, day;
              if (parts[0].length === 4) {
                // YYYY-MM-DD
                year = parseInt(parts[0], 10);
                month = parseInt(parts[1], 10) - 1;
                day = parseInt(parts[2], 10);
              } else {
                // DD-MM-YYYY
                day = parseInt(parts[0], 10);
                month = parseInt(parts[1], 10) - 1;
                year = parseInt(parts[2], 10);
              }
              let d = new Date(year, month + freq, day);
              let ny = d.getFullYear();
              let nm = String(d.getMonth() + 1).padStart(2, '0');
              let nd = String(d.getDate()).padStart(2, '0');
              fSigFecha.value = `${ny}-${nm}-${nd}`;
              recalcStatus();
            }
          } catch (e) { console.error("Error calculando fecha:", e); }
        }
      };

      if (fFreqHS && fUltHS && fSigHS) {
        fFreqHS.addEventListener("input", recalcHS);
        fUltHS.addEventListener("input", recalcHS);
      }
      if (fFreqMes && fUltFecha && fSigFecha) {
        fFreqMes.addEventListener("input", recalcFecha);
        fUltFecha.addEventListener("change", recalcFecha);
      }
      fSigFecha.addEventListener("change", recalcStatus);
      document.getElementById("modal-select-VesselName")?.addEventListener("change", recalcStatus);
      document.getElementById("field-SFI")?.addEventListener("input", recalcStatus);
      setTimeout(recalcStatus, 100);
    }

    if (mode === 'DAILY_REPORTS') {
      const vSelect = document.getElementById("modal-select-VesselName");
      const updateLabels = () => {
        const vName = vSelect.value;
        const vData = currentVesselsData.find(vd => (vd.VesselName || "").toString().toUpperCase() === (vName || "").toString().toUpperCase());
        const labelMap = {
          "MainEngine_1_Hours": vData?.ME1_SFI ? `Horas Motor Principal 1 (SFI: ${vData.ME1_SFI})` : "Horas Motor Principal 1",
          "MainEngine_2_Hours": vData?.ME2_SFI ? `Horas Motor Principal 2 (SFI: ${vData.ME2_SFI})` : "Horas Motor Principal 2",
          "Gen_1_Hours": vData?.G1_SFI ? `Horas Generador 1 (SFI: ${vData.G1_SFI})` : "Horas Generador 1",
          "Gen_2_Hours": vData?.G2_SFI ? `Horas Generador 2 (SFI: ${vData.G2_SFI})` : "Horas Generador 2",
          "CriticalPumps_Hours": vData?.CP_SFI ? `Horas Bombas Críticas (SFI: ${vData.CP_SFI})` : "Horas Bombas Críticas"
        };
        Object.entries(labelMap).forEach(([fName, newLabel]) => {
          const group = document.getElementById(`form-group-${fName}`);
          if (group) {
            const labelEl = group.querySelector('label');
            if (labelEl) labelEl.innerText = newLabel;
          }
        });
      };
      if (vSelect) {
        vSelect.addEventListener("change", updateLabels);
        setTimeout(updateLabels, 100);
      }
    }

    // Configurar layout para impresión
    if (mode === 'RCA_LOG') {
      document.querySelector(".modal").style.maxWidth = "800px";
    }

    // Lógica dinámica para Equipos EX
    if (mode === 'INVENTARIO') {
      if (modalElement) {
        modalElement.style.width = "96vw";
        modalElement.style.maxWidth = "1180px";
        modalElement.style.maxHeight = "92vh";

      const exSelect = document.getElementById("modal-select-Es_Equipo_Ex");
      const exWrapper = document.getElementById("ex-fields-wrapper");

      if (exSelect && exWrapper) {

          const fieldsToToggle = ["Certificado_Ex", "Ex_Tipo_Proteccion", "Ex_Grupo_Gas", "Ex_Clase_Temp"];
          fieldsToToggle.forEach(f => {

              else el.removeAttribute("required");
            }
          });
        };
        exSelect.addEventListener("change", toggleExFields);
        setTimeout(toggleExFields, 50);
      }
    }
    // Dynamic status calculation for SPARES (PROC-MAN-11-01 Compliance)
    if (mode === 'SPARES') {
      const stockIn = document.getElementById("field-Stock_Actual");
      const minIn = document.getElementById("field-MIN");
      const statusInput = document.getElementById("field-Status");
      const leadTimeValue = document.getElementById("field-Lead_Time_Value");
      const leadTimeUnit = document.getElementById("modal-select-Lead_Time_Unit");

      if (stockIn && minIn && statusInput) {

      if (leadTimeValue && leadTimeUnit && leadTimeField) {

  // Convert basic Markdown to HTML for display in chat bubbles
  function markdownToHtml(text) {
    if (!text) return '';
    return text
      // Escape HTML special chars first
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      // Bold: **text** or __text__
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/__([^_]+)__/g, '<strong>$1</strong>')
      // Italic: *text* or _text_
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/_([^_]+)_/g, '<em>$1</em>')
      // Numbered lists: lines starting with "1. ", "2. ", etc.
      .replace(/^\d+\.\s+(.+)$/gm, '<li>$1</li>')
      // Bullet lists: lines starting with "* " or "- "
      .replace(/^[*\-]\s+(.+)$/gm, '<li>$1</li>')
      // Wrap consecutive <li> in <ul>
      .replace(/((<li>.*<\/li>\n?)+)/g, '<ul style="margin: 0.3rem 0 0.3rem 1.2rem; padding: 0;">$1</ul>')
      // Line breaks
      .replace(/\n/g, '<br>');
  }

  function addRcaMessage(text, isUser) {
    const chat = document.getElementById("rca-wizard-chat");
    if (!chat) return;
    const div = document.createElement("div");
    div.className = `ai-msg ${isUser ? "ai-msg-user" : "ai-msg-bot"}`;

    const labelText = isUser ? "TÚ" : "EXPERTO RCA";
    const labelColor = isUser ? "rgba(255,255,255,0.7)" : "var(--accent-orange)";
    const labelAlign = isUser ? "right" : "left";

    // Detect if text is already HTML (contains <div> or <ul>) or needs Markdown processing
    const htmlContent = (text.indexOf('<div') !== -1 || text.indexOf('<ul') !== -1 || text.indexOf('<span') !== -1) 
                        ? text : markdownToHtml(text);

    div.innerHTML = `
      <div style="font-size: 0.6rem; font-weight: 800; margin-bottom: 0.3rem; color: ${labelColor}; text-align: ${labelAlign}; letter-spacing: 0.05em;">
        ${labelText}
      </div>
      <div>${htmlContent}</div>
    `;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function sendRcaWizardMessage() {
    const inputEl = document.getElementById("rca-wizard-input");
    const userText = (inputEl.value || "").trim();
    if (!userText) return;
    inputEl.value = "";

    addRcaMessage(userText, true);
    rcaWizardHistory.push({ role: "user", parts: [{ text: userText }] });

    // Show typing indicator
    const typingDiv = addRcaMessage('<span class="rca-msg-typing">í¢Å“Â¦ Analizando...</span>', false);

    if (typeof google !== "undefined" && google.script) {
      google.script.run
        .withSuccessHandler(response => {
          typingDiv && typingDiv.remove();

          // --- 1. Try to extract JSON from ```json...``` code fence ---
          let jsonRaw = null;
          const fenceMatch = response.match(/```json\s*(\{[\s\S]*?\})\s*```/);
          if (fenceMatch) {
            jsonRaw = fenceMatch[1];
          } else {
            // Fallback: bare JSON object with ANALYSIS_COMPLETE
            const bareMatch = response.match(/\{[\s\S]*"ANALYSIS_COMPLETE"\s*:\s*true[\s\S]*?\}(?=\s*$|\s*```|\s*\n\s*\n)/);
            if (bareMatch) jsonRaw = bareMatch[0];
          }

          // --- 2. Strip the JSON block (and code fences) from the narrative text ---
          let narrativeText = response
            .replace(/```json[\s\S]*?```/g, '')  // remove ```json ... ```
            .replace(/\{[\s\S]*"ANALYSIS_COMPLETE"[\s\S]*\}/g, '') // remove bare JSON if any
            .trim();

          // --- 3. Always render the narrative (without JSON) ---
          if (narrativeText) {
            addRcaMessage(markdownToHtml(narrativeText), false);
          }

          // --- 4. Process JSON if found ---
          if (jsonRaw) {
            try {
              const result = JSON.parse(jsonRaw);
              window._rcaAnalysisResult = result;
              addRcaMessage(`
                <div style="border: 1px solid var(--accent-green); border-radius: var(--radius-md); padding: 1rem; margin-top: 0.5rem; background: rgba(34,197,94,0.07);">
                  <div style="font-weight:700; color: var(--accent-green); margin-bottom:0.5rem;">í¢Å“â€¦ Análisis RCA Completado</div>

                  <div style="font-size:0.83rem; margin-top:0.3rem;"><strong>Causa Contribuyente:</strong> ${result.Causa_Contribuyente || '-'}</div>
                  <div style="font-size:0.83rem; margin-top:0.3rem;"><strong>Causa Raíz:</strong> ${result.Causa_Raiz || '-'}</div>
                  <div style="font-size:0.83rem; margin-top:0.3rem;"><strong>Barreras Falladas:</strong> ${result.Barreras_Falladas || '-'}</div>
                  <div style="font-size:0.75rem; margin-top:0.5rem; color: var(--text-muted);">Usa el botón <strong>APLICAR ANíLISIS</strong> para completar el formulario.</div>
                </div>
              `, false);
              const applyRow = document.getElementById("rca-wizard-apply-btn-row");
              if (applyRow) applyRow.style.display = "flex";
              const inp = document.getElementById("rca-wizard-input");
              if (inp) inp.disabled = true;
            } catch (parseErr) {
              addRcaMessage("⚠️í¯Â¸Â El análisis fue generado pero hubo un error al leer los resultados: " + parseErr.message, false);
            }
          } else {
            // No terminal JSON detected í¢â‚¬â€ continue conversation
            rcaWizardHistory.push({ role: "model", parts: [{ text: response }] });
          }
        })
        .withFailureHandler(err => {
          typingDiv && typingDiv.remove();
          addRcaMessage("⚠️í¯Â¸Â Error de conexión con la IA: " + err.message, false);
        })
        .apiAskGeminiRca(rcaWizardHistory);
    } else {
      typingDiv && typingDiv.remove();

  function normalizeEstimatedRepairDays(value) {
    const digits = String(value || "").match(/\d+/);
    const parsed = digits ? parseInt(digits[0], 10) : parseInt(value, 10);
    return Number.isFinite(parsed) && parsed > 0 ? parsed : 0;
  }

  function hasOpenDeferralStatus(statusValue) {
    const normalized = normalizeStatus(statusValue || "");
    return ["REQUESTED", "APPROVED", "ACTIVE", "EXPIRED"].includes(normalized);
  }

  function getWorkOrderAiAssessmentFields() {
    return {
      plazo: document.getElementById("field-IA_Plazo_Normal_Dias"),
      riesgo: document.getElementById("field-IA_Nivel_Riesgo"),
      base: document.getElementById("field-IA_Justificacion_Plazo"),
      restriccion: document.getElementById("field-IA_Restriccion_Operativa"),
    };
  }

  function hasWorkOrderAiAssessmentValues() {
    const fields = getWorkOrderAiAssessmentFields();
    return !!String(fields.plazo?.value || "").trim();
  }

  function getWorkOrderAssessmentSignature() {
    const vessel = document.getElementById("modal-select-VesselName")?.value || "";
    const assetId = document.getElementById("field-AssetID")?.value || "";
    const remarks = document.getElementById("field-Remarks")?.value || "";
    const type = document.getElementById("modal-select-Type")?.value || "";
    const criticidad = document.getElementById("modal-select-Criticidad")?.value || "";
    const taskId = document.getElementById("field-TaskID")?.value || "";
    const deferralReason = document.getElementById("field-Deferral_Justificacion")?.value || "";
    const requestedDate = document.getElementById("field-Deferral_Fecha_Vencimiento")?.value || "";
    return [vessel, assetId, remarks, type, criticidad, taskId, deferralReason, requestedDate].map(v => normalizeSmartText(v)).join("|");
  }

  function buildWorkOrderAiContext() {
    const vesselName = document.getElementById("modal-select-VesselName")?.value || "";
    const assetId = document.getElementById("field-AssetID")?.value || "";
    const taskId = document.getElementById("field-TaskID")?.value || "";
    const type = document.getElementById("modal-select-Type")?.value || "";
    const criticidad = document.getElementById("modal-select-Criticidad")?.value || "";
    const openDate = document.getElementById("field-OpenDate")?.value || "";
    const plannedDate = document.getElementById("field-PlannedDate")?.value || "";
    const dueDate = document.getElementById("field-Fecha_Vencimiento_OT")?.value || "";
    const remarks = document.getElementById("field-Remarks")?.value || "";
    const requestedDate = document.getElementById("field-Deferral_Fecha_Vencimiento")?.value || "";
    const deferralReason = document.getElementById("field-Deferral_Justificacion")?.value || "";
    const inventoryAsset = findExactInventoryAssetForDefect(assetId, vesselName);
    const maintenanceTask = taskId
      ? (currentMaintenancePlanData || []).find(item => normalizeRefKey(item.TaskID) === normalizeRefKey(taskId)) || null
      : null;
    const linkedDefect = (currentDefectData || []).find(item =>
      normalizeRefKey(item.OT_Asociada) === normalizeRefKey(document.getElementById("field-OT_ID")?.value || "") ||
      (taskId && normalizeRefKey(item.TaskID) === normalizeRefKey(taskId))
    ) || null;

    return {
      OT_ID: document.getElementById("field-OT_ID")?.value || "",
      VesselName: vesselName,
      AssetID: assetId,
      Equipo: inventoryAsset?.Nombre_Funcional || maintenanceTask?.Equipo || inventoryAsset?.Equipo_ID || "",
      TaskID: taskId,
      Type: type,
      Criticidad: criticidad,
      OpenDate: openDate,
      PlannedDate: plannedDate,
      DueDate: dueDate,
      Remarks: remarks,
      DeferralReason: deferralReason,
      RequestedNewDate: requestedDate,
      DefectDescription: linkedDefect?.Descripcion_Sintoma || "",
      Accion_Inmediata: linkedDefect?.Accion_Inmediata || "",
      Medida_Compensatoria: linkedDefect?.Medida_Compensatoria || "",
      MaintenanceTask: maintenanceTask?.Tarea_Mantenimiento || "",
      MaintenanceCriteria: maintenanceTask?.Criterio_Aceptacion || "",
    };
  }

  function renderWorkOrderAiStatus(message = "") {
    const statusEl = document.getElementById("work-order-ai-status");
    const btnEl = document.getElementById("btn-run-work-order-ai");
    if (!statusEl) return;

    const hasAssessment = hasWorkOrderAiAssessmentValues();
    if (currentWorkOrderModalContext.assessmentRunning) {
      if (btnEl) btnEl.disabled = true;
      statusEl.innerHTML = `<span class="rca-msg-typing">Analizando OT con IA...</span>`;
      return;
    }

    if (btnEl) btnEl.disabled = false;

    if (message) {
      statusEl.innerHTML = `<span style="color:var(--text-main);">${message}</span>`;
      return;
    }

    const requiresDeferral = document.getElementById("modal-select-Deferral_Required")?.value === "Sí";
    if (!requiresDeferral) {
      statusEl.innerHTML = `Responde primero si la OT requiere diferimiento. La IA solo analizará el diferimiento si respondes Sí.`;
      return;
    }

    if (!hasAssessment) {
      statusEl.innerHTML = `Completa la razón del diferimiento y la nueva fecha estimada, luego evalúa con IA.`;
      return;
    }

    if (currentWorkOrderModalContext.assessmentStale) {
      statusEl.innerHTML = `<span style="color:var(--accent-yellow);">La OT cambió después de la última evaluación IA. Debes reevaluarla antes de guardar.</span>`;
      return;
    }

    const fields = getWorkOrderAiAssessmentFields();
    statusEl.innerHTML = `Plazo normal estimado: <strong>${fields.plazo?.value || '-'}</strong> día(s) | Riesgo: <strong>${fields.riesgo?.value || '-'}</strong>`;
  }

  function updateWorkOrderDeadlineDisplay() {
    const plannedDateEl = document.getElementById("field-PlannedDate");
    const toleranceEl = document.getElementById("field-Ventana_Tolerancia");
    const dueDateEl = document.getElementById("field-Fecha_Vencimiento_OT");
    const authStatus = String(document.getElementById("field-Deferral_Autorizacion_Status")?.value || "").trim().toUpperCase();
    const requestedDate = document.getElementById("field-Deferral_Fecha_Vencimiento")?.value || "";
    if (!plannedDateEl || !toleranceEl || !dueDateEl) return;

    if (authStatus === "AUTORIZADO" && String(requestedDate || "").trim()) {
      dueDateEl.value = requestedDate;
      return;
    }

    const plannedDate = parseDateManual(plannedDateEl.value);
    if (!plannedDate) {
      dueDateEl.value = "";
      return;
    }

    const toleranceDays = parseInt(toleranceEl.value, 10) || 0;
    const dueDate = new Date(plannedDate);
    dueDate.setDate(dueDate.getDate() + toleranceDays);
    dueDateEl.value = parseDateForInput(dueDate);
  }

  function applyWorkOrderAiAssessment(result) {
    const fields = getWorkOrderAiAssessmentFields();
    if (fields.plazo) fields.plazo.value = normalizeEstimatedRepairDays(result?.IA_Plazo_Normal_Dias || result?.Plazo_Normal_Estimado_Dias || result?.Tiempo_Normal_Reparacion_Dias || "") || "";
    if (fields.riesgo) fields.riesgo.value = String(result?.IA_Nivel_Riesgo || result?.Nivel_Riesgo || "").trim().toUpperCase();
    if (fields.base) fields.base.value = String(result?.IA_Justificacion_Plazo || result?.Base_Tecnica_Plazo || result?.Justificacion_Tiempo_Normal || "").trim();
    if (fields.restriccion) fields.restriccion.value = String(result?.IA_Restriccion_Operativa || result?.Restriccion_Operativa || "").trim();

    const medCompField = document.getElementById("field-Deferral_Medida_Compensatoria");
    const restriccionesField = document.getElementById("field-Deferral_Restricciones");
    const provisionalPayload = {
      OpenDate: document.getElementById("field-OpenDate")?.value || "",
      PlannedDate: document.getElementById("field-PlannedDate")?.value || "",
      IA_Plazo_Normal_Dias: fields.plazo?.value || "",
      Status: document.getElementById("modal-select-Status")?.value || "OPEN",
    };
    if (document.getElementById("modal-select-Deferral_Required")?.value === "Sí" || hasOpenDeferralStatus(currentWorkOrderModalContext.existingDeferral?.Status || "")) {
      if (medCompField) {
        medCompField.value = String(result?.Deferral_Medida_Compensatoria || result?.Medida_Compensatoria_Sugerida || "").trim();
      }
      if (restriccionesField) {
        restriccionesField.value = String(result?.Deferral_Restricciones || result?.IA_Restriccion_Operativa || result?.Restriccion_Operativa || "").trim();
      }
    }

    currentWorkOrderModalContext.assessmentStale = false;
    currentWorkOrderModalContext.lastAssessmentSignature = getWorkOrderAssessmentSignature();
    renderWorkOrderAiStatus();
    setupWorkOrderDeferralControls();
  }

  function runWorkOrderAiAssessment(manual = false) {
    const requiresDeferral = document.getElementById("modal-select-Deferral_Required")?.value === "Sí";
    if (!requiresDeferral) {
      if (manual) showToast("La evaluación IA del diferimiento solo aplica si respondes Sí en '¿Requiere Diferimiento?'.", "error");
      return;
    }

    const reasonField = document.getElementById("field-Deferral_Justificacion");
    const requestedDateField = document.getElementById("field-Deferral_Fecha_Vencimiento");
    if (reasonField && !String(reasonField.value || "").trim()) {
      const promptedReason = window.prompt("Indica la razón del diferimiento:", reasonField.value || "");
      if (!String(promptedReason || "").trim()) {
        if (manual) showToast("Debes indicar la razón del diferimiento para evaluarlo con IA.", "error");
        return;
      }
      reasonField.value = String(promptedReason).trim();
    }
    if (!String(requestedDateField?.value || "").trim()) {
      if (manual) showToast("Debes indicar la nueva fecha estimada de ejecución.", "error");
      return;
    }

    const context = buildWorkOrderAiContext();
    if (!String(context.VesselName || "").trim() || !String(context.AssetID || "").trim() || !String(context.Remarks || "").trim()) {
      if (manual) showToast("Completa embarcación, SFI/equipo y descripción de la OT antes de evaluar con IA.", "error");
      return;
    }

    currentWorkOrderModalContext.assessmentRunning = true;
    renderWorkOrderAiStatus();
    google.script.run
      .withSuccessHandler(result => {
        currentWorkOrderModalContext.assessmentRunning = false;
        if (!result || result.success === false) {
          renderWorkOrderAiStatus();
          if (manual) showToast(result?.message || "No se pudo evaluar la OT con IA.", "error");
          return;
        }
        applyWorkOrderAiAssessment(result);
        if (manual) showToast("Evaluación IA de la OT actualizada.");
      })
      .withFailureHandler(err => {
        currentWorkOrderModalContext.assessmentRunning = false;
        renderWorkOrderAiStatus();
        if (manual) showToast("Error al evaluar la OT con IA: " + (err.message || err), "error");
      })
      .apiAnalyzeWorkOrderDeferral(context);
  }

  function validateWorkOrderAssessment(payload) {
    if (String(payload?.Deferral_Required || "No").trim() !== "Sí") return { ok: true };
    const normalizedStatus = normalizeStatus(payload?.Status || "");
    if (["CLOSED", "CANCELLED"].includes(normalizedStatus)) return { ok: true };
    if (!String(payload.IA_Plazo_Normal_Dias || "").trim()) {
      return { ok: false, message: "Debes evaluar el diferimiento con IA antes de guardarlo." };
    }
    if (currentWorkOrderModalContext.assessmentStale) {
      return { ok: false, message: "El diferimiento cambió después de la última evaluación IA. Vuelve a evaluar antes de guardar." };
    }
    return { ok: true };
  }

  function organizeWorkOrderDeferralLayout() {
    const requestGrid = document.getElementById("work-order-deferral-request-fields");
    const authGrid = document.getElementById("work-order-auth-fields");
    const aiPanel = document.getElementById("work-order-ai-panel");
    const requestActions = document.getElementById("work-order-request-actions");
    if (!requestGrid || !authGrid) return;

    const config = getWorkOrderDeferralLayoutConfig();
    config.requestFields.forEach(fieldName => {
      const groupEl = document.getElementById(`form-group-${fieldName}`);
      if (groupEl && groupEl.parentElement !== requestGrid) requestGrid.appendChild(groupEl);
    });
    config.authorizationFields.forEach(fieldName => {
      const groupEl = document.getElementById(`form-group-${fieldName}`);
      if (groupEl && groupEl.parentElement !== authGrid) authGrid.appendChild(groupEl);
    });

    if (aiPanel) {
      aiPanel.style.gridColumn = "span 2";
      const justificationGroup = document.getElementById("form-group-Deferral_Justificacion");
      if (justificationGroup && justificationGroup.parentElement === requestGrid) {
        const nextGroup = justificationGroup.nextElementSibling;
        if (nextGroup) requestGrid.insertBefore(aiPanel, nextGroup);
        else requestGrid.appendChild(aiPanel);
      } else if (aiPanel.parentElement !== requestGrid) {
        requestGrid.prepend(aiPanel);
      }
    }

    if (requestActions) {
      requestActions.style.gridColumn = "span 2";
      const restrictionsGroup = document.getElementById("form-group-Deferral_Restricciones");
      if (restrictionsGroup && restrictionsGroup.parentElement === requestGrid) {
        const nextGroup = restrictionsGroup.nextElementSibling;
        if (nextGroup) requestGrid.insertBefore(requestActions, nextGroup);
        else requestGrid.appendChild(requestActions);
      } else if (requestActions.parentElement !== requestGrid) {
        requestGrid.appendChild(requestActions);
      }
    }

    const legacyGrid = document.getElementById("work-order-section-grid-DIFERIMIENTO");
    if (legacyGrid && !legacyGrid.querySelector(".form-group")) {
      legacyGrid.style.display = "none";
    }
  }

  function populateWorkOrderDeferralFieldsFromExisting(deferral) {
    if (!deferral || !hasOpenDeferralStatus(deferral.Status || "")) return;
    const mapping = {
      Deferral_Justificacion: deferral.Motivo,
      Deferral_Medida_Compensatoria: deferral.Medida_Compensatoria,
      Deferral_Restricciones: deferral.Restricciones_Operativas,
      Deferral_Aprobador: deferral.Aprobador,
      Deferral_Comentarios_Autorizacion: deferral.Comentarios_Autorizacion,
      Deferral_Permite_Operacion: deferral.Permite_Operacion,
      Deferral_Declarado_NoGo: deferral.Declarado_NoGo,
      Deferral_Fecha_Vencimiento: parseDateForInput(deferral.Fecha_Vencimiento),
    };

    Object.entries(mapping).forEach(([fieldName, value]) => {
      const field = document.getElementById(fieldName.startsWith("Deferral_") && ["Deferral_Permite_Operacion", "Deferral_Declarado_NoGo"].includes(fieldName)
        ? `modal-select-${fieldName}`
        : `field-${fieldName}`);
      if (field && !String(field.value || "").trim() && String(value || "").trim()) {
        field.value = value;
      }
    });

    const authStatusField = document.getElementById("field-Deferral_Autorizacion_Status");
    if (authStatusField && !String(authStatusField.value || "").trim()) {
      const normalized = normalizeStatus(deferral.Status || "");
      authStatusField.value = normalized === "APPROVED" ? "AUTORIZADO" : (normalized === "REJECTED" ? "NO AUTORIZADO" : "PENDIENTE");
    }
  }

        <div style="font-size:0.72rem; color:var(--text-muted); line-height:1.45;">${requiresDeferral ? 'La OT mantiene un diferimiento formal activo y seguirá sincronizándolo al guardar.' : 'Este diferimiento ya existe; usa los botones de autorización para dejar constancia del resultado vigente.'}</div>

  function validateWorkOrderAuthorization(payload) {
    if (String(payload.Deferral_Required || "No").trim() !== "Sí") return { ok: true };

    const authStatus = String(payload.Deferral_Autorizacion_Status || "").trim().toUpperCase();
    if (!authStatus || authStatus === "PENDIENTE") return { ok: true };

    if (!String(payload.Deferral_Link_PDF || "").trim()) {
      return { ok: false, message: "Debes generar primero la solicitud de aprobación en PDF antes de registrar una autorización." };
    }
    if (!String(payload.Deferral_Aprobador || "").trim()) {
      return { ok: false, message: "Debes indicar el nombre del autorizante." };
    }
    if (authStatus === "AUTORIZADO" && !String(payload.Deferral_Fecha_Vencimiento || "").trim()) {
      return { ok: false, message: "Debes indicar la nueva fecha estimada de ejecución antes de autorizar el diferimiento." };
    }
    if (authStatus === "NO AUTORIZADO" && !String(payload.Deferral_Comentarios_Autorizacion || "").trim()) {
      return { ok: false, message: "Debes registrar comentarios cuando el diferimiento no es autorizado." };
    }

    return { ok: true };
  }

  function setupWorkOrderDeadlineControls() {
    const plannedDateEl = document.getElementById("field-PlannedDate");
    const toleranceEl = document.getElementById("field-Ventana_Tolerancia");
    const requestedDateEl = document.getElementById("field-Deferral_Fecha_Vencimiento");
    const authStatusEl = document.getElementById("field-Deferral_Autorizacion_Status");
    [plannedDateEl, toleranceEl, requestedDateEl, authStatusEl].forEach(el => {
      if (!el || el.dataset.deadlineBound === "true") return;
      el.addEventListener("change", updateWorkOrderDeadlineDisplay);
      el.addEventListener("input", updateWorkOrderDeadlineDisplay);
      el.dataset.deadlineBound = "true";
    });
    updateWorkOrderDeadlineDisplay();

  function updateExistingWorkOrderDeferral(action, workOrderPayload, otId, onSuccess, onFailure) {
    const existingDeferral = currentWorkOrderModalContext.existingDeferral;
    if (!existingDeferral || !hasOpenDeferralStatus(existingDeferral.Status) || action === "KEEP") {
      if (typeof onSuccess === "function") onSuccess({ maintained: true });
      return;
    }

    const updatedPayload = {
      ...existingDeferral,
      OT_Asociada: otId,
      Status: action === "CLOSE" ? "CLOSED" : "REJECTED",
      Notas_Cierre: action === "CLOSE"
        ? `Cerrado desde OT ${otId} al quedar dentro del plazo normal estimado por IA.`
        : `Rechazado desde OT ${otId} al quedar dentro del plazo normal estimado por IA.`,
    };

    google.script.run
      .withSuccessHandler(res => {
        clearCache("apiGetDeferrals");
        currentWorkOrderModalContext.existingDeferral = {
          ...existingDeferral,
          ...updatedPayload,
        };
        if (typeof onSuccess === "function") onSuccess(res);
      })
      .withFailureHandler(err => {
        if (typeof onFailure === "function") onFailure(err.message || err);
      })
      .apiUpdateDeferral(existingDeferral._rowIndex, updatedPayload);
  }

  function startDefectWizardBarrierInterview() {
    if (!defectWizardState.analysisResult) {
      showToast("Primero completa el análisis de falla.", "error");
      return;
    }

    defectWizardState.stage = "barrier";
    defectWizardState.barrierContext = buildDefectWizardBarrierContext(defectWizardState.analysisResult);
    defectWizardState.barrierHistory = [];
    defectWizardState.barrierConclusion = null;

  function normalizeCriticality(value) {
    return String(value || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .trim()
      .toUpperCase();
  }

  function isCriticalLevelAB(value) {
    const normalized = normalizeCriticality(value);
    return normalized === "A" || normalized === "B" || normalized.startsWith("A ") || normalized.startsWith("A-") || normalized.startsWith("B ") || normalized.startsWith("B-");
  }

  function defectNeedsFollowUpWorkOrder(payload) {
    const operationalStatus = normalizeOperationalStateValue(payload?.Estado_Operativo || "");
    return !!operationalStatus && operationalStatus !== "OPERATIVO";
  }

  function deriveDefectRecordStatus(payload) {
    return defectNeedsFollowUpWorkOrder(payload) ? "OPEN" : "CLOSED";
  }

  function shouldAutoCreateDefectWorkOrder(payload) {
    return defectNeedsFollowUpWorkOrder(payload) && !String(payload?.OT_Asociada || "").trim();
  }

  function getDefectWorkOrderCriticality(payload) {
    const explicit = String(payload?.Clasificacion_Falla || "").trim().toUpperCase();
    if (["A", "B", "C"].includes(explicit)) return explicit;

    const asset = findExactInventoryAssetForDefect(payload?.SFI || "", payload?.Embarcacion || "");
    const inherited = String(asset?.Criticidad || "").trim().toUpperCase();
    if (["A", "B", "C"].includes(inherited)) return inherited;
    return "C";
  }

  function getDefectWorkOrderPriority(payload) {
    const crit = getDefectWorkOrderCriticality(payload);
    const operationalStatus = normalizeOperationalStateValue(payload?.Estado_Operativo || "");
    if (crit === "A") return "Emergencia";
    if (crit === "B") return "Alta";
    if (operationalStatus === "FUERA DE USO") return "Alta";
    return "Media";
  }

  function calculateRepairEstimateDeadline(openDateValue, estimateDays) {
    const baseDate = parseDateManual(openDateValue);
    const days = normalizeEstimatedRepairDays(estimateDays);
    if (!baseDate || !days) return null;
    const deadline = new Date(baseDate);
    deadline.setHours(0, 0, 0, 0);
    deadline.setDate(deadline.getDate() + days);
    return deadline;
  }

  function workOrderRequiresDeferral(payload) {
    const normalizedStatus = normalizeStatus(payload?.Status || "");
    if (normalizedStatus === "CLOSED" || normalizedStatus === "CANCELLED") return false;

    const plannedDate = parseDateManual(payload?.PlannedDate);
    const estimateDeadline = calculateRepairEstimateDeadline(payload?.OpenDate, payload?.IA_Plazo_Normal_Dias);
    if (!plannedDate || !estimateDeadline) return false;

    plannedDate.setHours(0, 0, 0, 0);
    return plannedDate > estimateDeadline;
  }

  function hasWorkOrderDeferralData(payload) {
    return [
      payload?.Deferral_Justificacion,
      payload?.Deferral_Medida_Compensatoria,
      payload?.Deferral_Restricciones,
      payload?.Deferral_Aprobador,
      payload?.Deferral_Fecha_Vencimiento,
    ].some(value => String(value || "").trim());
  }

  function validateWorkOrderDeferral(payload) {
    if (String(payload.Deferral_Required || "No").trim() !== "Sí") return { ok: true };

    const missing = [];
    if (!String(payload.Deferral_Fecha_Vencimiento || "").trim()) missing.push("nueva fecha estimada de ejecución");
    if (!String(payload.Deferral_Justificacion || "").trim()) missing.push("justificación");
    if (!String(payload.Deferral_Medida_Compensatoria || "").trim()) missing.push("medidas compensatorias");
    if (!String(payload.Deferral_Restricciones || "").trim()) missing.push("restricciones operativas");

    if (missing.length) {
      return {
        ok: false,
        message: `Debes completar los datos de diferimiento: ${missing.join(", ")}.`,
      };
    }

    // Plan de Inspecciones: si se actualiza Ultima_Fecha, recalcular Siguiente_Fecha según Frecuencia.
    if (mode === 'INSPECTIONS') {
      const fUltFecha = document.getElementById('field-Ultima_Fecha');
      const fSigFecha = document.getElementById('field-Siguiente_Fecha');
      const fFreq = document.getElementById('modal-select-Frecuencia');
      const fFreqS = document.getElementById('field-FREQS');
      const fFreqM = document.getElementById('field-FREQM');

      const pad2 = (n) => String(n).padStart(2, '0');
      const toYmd = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
      const parseYmd = (ymd) => {
        const parts = String(ymd || '').split('-');
        if (parts.length !== 3) return null;
        const y = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10);
        const dd = parseInt(parts[2], 10);
        if (isNaN(y) || isNaN(m) || isNaN(dd)) return null;
        return new Date(y, m - 1, dd);
      };

      const recalcNextInspectionDate = () => {
        if (!fUltFecha || !fSigFecha || !fFreq) return;
        const freq = String(fFreq.value || '').trim().toUpperCase();

        if (fFreqS && fFreqM) {
          fFreqS.value = '';
          fFreqM.value = '';
          if (freq === 'SEMANAL') fFreqS.value = '1';
          else if (freq === 'QUINCENAL') fFreqS.value = '2';
          else if (freq === 'MENSUAL') fFreqM.value = '1';
          else if (freq === 'TRIMESTRAL') fFreqM.value = '3';
          else if (freq === 'SEMESTRAL') fFreqM.value = '6';
          else if (freq === 'ANUAL') fFreqM.value = '12';
        }

        if (!fUltFecha.value || freq === 'OCASIONAL') {
          fSigFecha.value = '';
          return;
        }
        const base = parseYmd(fUltFecha.value);
        if (!base) return;
        const next = new Date(base.getFullYear(), base.getMonth(), base.getDate());
        if (freq === 'DIARIA') next.setDate(next.getDate() + 1);
        else if (freq === 'SEMANAL') next.setDate(next.getDate() + 7);
        else if (freq === 'QUINCENAL') next.setDate(next.getDate() + 15);
        else if (freq === 'MENSUAL') next.setMonth(next.getMonth() + 1);
        else if (freq === 'TRIMESTRAL') next.setMonth(next.getMonth() + 3);
        else if (freq === 'SEMESTRAL') next.setMonth(next.getMonth() + 6);
        else if (freq === 'ANUAL') next.setFullYear(next.getFullYear() + 1);
        fSigFecha.value = toYmd(next);
      };

      if (fUltFecha && fFreq) {
        fUltFecha.addEventListener('change', recalcNextInspectionDate);
        fFreq.addEventListener('change', recalcNextInspectionDate);
        // Autocompletar si hay última fecha y próxima está vacía.
        if (fUltFecha.value && !String(fSigFecha && fSigFecha.value || '').trim()) {
          recalcNextInspectionDate();
        }
      }
    }

    return { ok: true };
  }

  function buildWorkOrderDeferralPayload(workOrderPayload, otId, linkedDefect, existingDeferral) {
    const authStatus = String(workOrderPayload.Deferral_Autorizacion_Status || "PENDIENTE").trim().toUpperCase();
    let deferralStatus = "REQUESTED";
    if (authStatus === "AUTORIZADO") deferralStatus = "APPROVED";
    else if (authStatus === "NO AUTORIZADO") deferralStatus = "REJECTED";

    return {
      Defecto_ID: linkedDefect?.Defecto_ID || existingDeferral?.Defecto_ID || "",
      TaskID_Origen: workOrderPayload.TaskID || existingDeferral?.TaskID_Origen || "",
      OT_Asociada: otId,
      Embarcacion: workOrderPayload.VesselName || existingDeferral?.Embarcacion || "",
      SFI: workOrderPayload.AssetID || existingDeferral?.SFI || "",
      Clasificacion: workOrderPayload.Criticidad || existingDeferral?.Clasificacion || "C",
      Motivo: workOrderPayload.Deferral_Justificacion || existingDeferral?.Motivo || "",
      Medida_Compensatoria: workOrderPayload.Deferral_Medida_Compensatoria || existingDeferral?.Medida_Compensatoria || "",
      Restricciones_Operativas: workOrderPayload.Deferral_Restricciones || existingDeferral?.Restricciones_Operativas || "",
      Fecha_Vencimiento: workOrderPayload.Deferral_Fecha_Vencimiento || existingDeferral?.Fecha_Vencimiento || workOrderPayload.PlannedDate || "",
      Aprobador: workOrderPayload.Deferral_Aprobador || existingDeferral?.Aprobador || "",
      Comentarios_Autorizacion: workOrderPayload.Deferral_Comentarios_Autorizacion || existingDeferral?.Comentarios_Autorizacion || "",
      Declarado_NoGo: workOrderPayload.Deferral_Declarado_NoGo || existingDeferral?.Declarado_NoGo || "No",
      Permite_Operacion: workOrderPayload.Deferral_Permite_Operacion || existingDeferral?.Permite_Operacion || "Sí",
      Status: deferralStatus,
      Notas_Cierre: existingDeferral?.Notas_Cierre || "",
      RCA_ID: existingDeferral?.RCA_ID || "",
    };
  }

  function syncWorkOrderDeferral(workOrderPayload, otId, onSuccess, onFailure) {
    Promise.all([
      cachedRun("apiGetDeferrals", [], 0).catch(() => []),
      cachedRun("apiGetDefects", [], 0).catch(() => currentDefectData || []),
    ]).then(([deferrals, defects]) => {
      currentDeferralsData = deferrals || [];
      currentDefectData = defects || currentDefectData || [];

      const existingDeferral = (deferrals || []).find(item =>
        normalizeRefKey(item.OT_Asociada) === normalizeRefKey(otId) && hasOpenDeferralStatus(item.Status || "")
      ) || null;
      currentWorkOrderModalContext.existingDeferral = existingDeferral;
      const linkedDefect = (defects || []).find(item => normalizeRefKey(item.OT_Asociada) === normalizeRefKey(otId)) || null;
      const deferralPayload = buildWorkOrderDeferralPayload(workOrderPayload, otId, linkedDefect, existingDeferral);

      const successHandler = res => {
        clearCache("apiGetDeferrals");
        currentWorkOrderModalContext.existingDeferral = existingDeferral
          ? { ...existingDeferral, ...deferralPayload }
          : { ...deferralPayload, Status: deferralPayload.Status };
        if (typeof onSuccess === "function") onSuccess(res);
      };
      const failureHandler = err => {
        if (typeof onFailure === "function") onFailure(err.message || err);
      };

      if (existingDeferral) {
        google.script.run
          .withSuccessHandler(successHandler)
          .withFailureHandler(failureHandler)
          .apiUpdateDeferral(existingDeferral._rowIndex, deferralPayload);
      } else {
        google.script.run
          .withSuccessHandler(successHandler)
          .withFailureHandler(failureHandler)
          .apiCreateDeferral(deferralPayload);
      }
    }).catch(err => {
      if (typeof onFailure === "function") onFailure(err.message || err);
    });
  }
