  // --- ASISTENTE DE ACCIONES CORRECTIVAS (PROC-MAN-17, 18) ---
  function evaluateSmartRisk() {
    const s1 = document.getElementById("risk-safety").checked;
    const s2 = document.getElementById("risk-env").checked;
    const s3 = document.getElementById("risk-ops").checked;
    const hasRisk = s1 || s2 || s3;

    const riskWarning = document.getElementById("wizard-risk-warning");
    const hdnCaptain = document.getElementById("hdn-notify-captain");
    const hdnShore = document.getElementById("hdn-notify-shore");
    const hdnNogo = document.getElementById("hdn-declare-nogo");

    if (hasRisk) {
      riskWarning.style.display = "block";
      hdnCaptain.value = "true";
      hdnShore.value = "true";
      hdnNogo.value = "true";
    } else {
      riskWarning.style.display = "none";
      hdnCaptain.value = "false";
      hdnShore.value = "false";
      hdnNogo.value = "false";
    }
  }

  function evaluateSmartResolution() {
    const isResolved = document.getElementById("chk-resolved-now").checked;
    const unresolvedOptions = document.getElementById("wizard-unresolved-options");
    const chkOt = document.getElementById("chk-ot");
    const chkDefect = document.getElementById("chk-defect");

    if (isResolved) {
      unresolvedOptions.style.display = "none";
      // Si se resolvió, no hace falta OT en backlog
      chkOt.checked = false;
      chkDefect.checked = false;
    } else {
      unresolvedOptions.style.display = "flex";
      chkOt.checked = true;
      chkDefect.checked = true;
    }
  }

  function handleResultChange(select) {
    const panel = document.getElementById("corrective-actions-panel");
    const rcaNotice = document.getElementById("notice-rca");
    const badgeCrit = document.getElementById("wizard-criticality-badge");
    const badgeRecurrence = document.getElementById("wizard-recurrence-badge");
    const riskArea = document.getElementById("wizard-risk-assessment");
    const lblDeferral = document.getElementById("lbl-deferral");
    const hdnTriggerRca = document.getElementById("hdn-trigger-rca");

    // Reset wizard
    document.getElementById("risk-safety").checked = false;
    document.getElementById("risk-env").checked = false;
    document.getElementById("risk-ops").checked = false;
    document.getElementById("chk-resolved-now").checked = false;
    if (badgeRecurrence) badgeRecurrence.style.display = "none";
    evaluateSmartRisk();
    evaluateSmartResolution();

    if (select.value === "FALLA") {
      panel.style.display = "block";

      // Buscar SFI en inventario para evaluar criticidad
      const sfiVal = document.getElementById("field-SFI")?.value || "";
      const invItem = currentInventoryData.find(i => i.SFI === sfiVal) || {};
      const crit = (invItem.Criticidad || "").toUpperCase();
      const isCritical = crit === "A" || crit === "B";

      if (isCritical) {
        badgeCrit.style.display = "flex";
        riskArea.style.display = "block";
        lblDeferral.style.display = "block";
        rcaNotice.style.display = "block";
        hdnTriggerRca.value = "true"; // Equipo crítico que falla exige RCA
        
        const chkOt = document.getElementById("chk-ot");
        if (chkOt) {
          chkOt.checked = true;
          chkOt.disabled = false;
        }
      } else {
        // Criticidad C
        badgeCrit.style.display = "none";
        riskArea.style.display = "none"; // No forzamos evaluacion de riesgo rigurosa
        lblDeferral.style.display = "none";
        rcaNotice.style.display = "none";
        hdnTriggerRca.value = "false";
      }

      // CHECK RECURRENCE (PROC-MAN-18)
      const vesselVal = document.getElementById("modal-select-Embarcacion")?.value || "";
      if (vesselVal && sfiVal) {
        google.script.run
          .withSuccessHandler(res => {
             if (res && res.recurrent) {
               const eventCount = res.eventCount || ((res.count || 0) + 1);
               if (badgeRecurrence) badgeRecurrence.style.display = "flex";
                // Force RCA notice even if not critical A/B
                rcaNotice.style.display = "block";
                rcaNotice.innerHTML = `<span class="material-symbols-outlined fs-sm" style="vertical-align:bottom;">support_agent</span> Se detectaron ${res.count} eventos previos de este SFI en los últimos 12 meses. El actual sería el ${eventCount}° evento. Se forzará RCA para analizar el patrón del problema y su causa raíz.`;
                hdnTriggerRca.value = "true";
             }
          })
          .apiCheckSfiRecurrence(vesselVal, sfiVal);
      }
    } else if (select.value === "Con Observaciones") {
      panel.style.display = "block";
      badgeCrit.style.display = "none";
      riskArea.style.display = "none";
      lblDeferral.style.display = "none";
      rcaNotice.style.display = "none";
      hdnTriggerRca.value = "false";
      
      const chkOt = document.getElementById("chk-ot");
      if (chkOt) {
        chkOt.checked = true;
        chkOt.disabled = false;
      }

      // Observaciones: se asume no reparado y sugerimos Defect Log y OT
      document.getElementById("chk-resolved-now").checked = false;
      document.getElementById("chk-ot").checked = true; // Activar OT para observaciones
      document.getElementById("chk-defect").checked = true; // Sugerir loguear observacion en defect
    } else {
      panel.style.display = "none";
      hdnTriggerRca.value = "false";
      document.getElementById("chk-ot").checked = false;
      document.getElementById("chk-defect").checked = false;
    }
  }

  function handleLocalFileUpload(input, targetInputId = "field-Checklist_Link") {
    const file = input.files[0];
    if (!file) return;

    const btnSave = document.getElementById("btn-save");
    const prevBtnSaveHtml = btnSave ? btnSave.innerHTML : "";

    const label = input.parentElement;
    const icon = label.querySelector(".material-symbols-outlined");
    if (!icon) return;
    const originalIcon = icon.innerText;

    label.style.pointerEvents = "none";
    icon.innerText = "sync";
    icon.style.animation = "spin 2s linear infinite";

    if (btnSave) {
      btnSave.disabled = true;
      btnSave.innerHTML = `<span class="material-symbols-outlined fs-sm" style="animation: spin 1.2s linear infinite;">sync</span> Subiendo...`;
    }

    const reader = new FileReader();
    reader.onload = function (e) {
      const base64Data = e.target.result;
      google.script.run
        .withSuccessHandler(res => {
          label.style.pointerEvents = "auto";
          icon.innerText = originalIcon;
          icon.style.animation = "none";
          if (btnSave) {
            btnSave.disabled = false;
            btnSave.innerHTML = prevBtnSaveHtml;
          }
          if (res.success) {
            const targetEl = document.getElementById(targetInputId);
            if (targetEl) {
              targetEl.value = res.url || "";
              targetEl.setAttribute("value", res.url || "");
              targetEl.dispatchEvent(new Event("input", { bubbles: true }));
              targetEl.dispatchEvent(new Event("change", { bubbles: true }));
              targetEl.focus();
            }
            showToast("í¢Å“â€¦ Archivo '" + file.name + "' subido y vinculado.", "success");
          } else {
            showToast("í¢ÂÅ’ Error: " + res.message, "error");
          }
        })
        .withFailureHandler(err => {
          label.style.pointerEvents = "auto";
          icon.innerText = originalIcon;
          icon.style.animation = "none";
          if (btnSave) {
            btnSave.disabled = false;
            btnSave.innerHTML = prevBtnSaveHtml;
          }
          showToast("í¢ÂÅ’ Error: " + err.message, "error");
        })
        .apiUploadFile(base64Data, file.name);
    };
    reader.readAsDataURL(file);
  }

  function submitExecutionLog(event, planRowIndex) {
    event.preventDefault();
    const formData = new FormData(event.target);
    const logPayload = {};
    INSPECTION_LOG_FIELDS.forEach(f => {
      let val = formData.get(f.name);
      logPayload[f.name] = (f.type === "date") ? formatDateUI(val) : val;
    });
    const autoCreateOT = document.getElementById("chk-ot")?.checked || false;
    const logDefect = document.getElementById("chk-defect")?.checked || false;

    // Leer valores inteligentes ocultos
    const notifyCaptain = document.getElementById("hdn-notify-captain")?.value === "true";
    const notifyShore = document.getElementById("hdn-notify-shore")?.value === "true";
    const declareNogo = document.getElementById("hdn-declare-nogo")?.value === "true";
    const triggerRca = document.getElementById("hdn-trigger-rca")?.value === "true";
    
    // Capturar hallazgos limpios (originales) antes de agregar resumen CAPA
    const originalFindings = (logPayload.Hallazgos_Observaciones || "").trim();

    // Si hubo acciones correctivas marcables o desmarcables, gestionar notificaciones
    if (logPayload.Resultado === "FALLA" || logPayload.Resultado === "Con Observaciones") {
      // Simular apertura de correos si hay acciones que lo requieran (notificaciones a capitanes/base)
      if (notifyCaptain || notifyShore) {
        let subject = encodeURIComponent(`${declareNogo ? 'URGENTE NO GO - ' : ''}Reporte de Inspección: ${logPayload.SFI} - ${logPayload.Resultado}`);
        let body = encodeURIComponent(`Se adjunta reporte de inspección para el equipo SFI: ${logPayload.SFI}.\nResultado: ${logPayload.Resultado}\n\nObservaciones:\n${originalFindings}`);
        window.location.href = `mailto:?subject=${subject}&body=${body}`;
      }
    }

    const btn = document.getElementById("btn-save");
    btn.disabled = true;
    btn.innerText = "Procesando...";

    const finalizeExecution = (otId = "") => {
      const planItem = currentInspectionsData.find(d => d._rowIndex === planRowIndex);
      logPayload.TaskID = (planItem && planItem.TaskID) ? planItem.TaskID : (logPayload.TaskID || "");
      if (otId) logPayload.OT_Asociada = otId;

      google.script.run.withSuccessHandler(() => {
        const nextDate = getNextDate(logPayload.Fecha_Ejecucion, planItem.Frecuencia);

        const planUpdate = {
          Ultima_Fecha: logPayload.Fecha_Ejecucion,
          Siguiente_Fecha: nextDate,
          Status: (logPayload.Resultado === "FALLA") ? "FALLIDA" : "CONCLUIDA"
        };

        google.script.run.withSuccessHandler(() => {
          clearCache(); // Clear everything to ensure a fresh read following an update


          // Helper to finalize everything
          const finishChain = (newDefectId, newDifId) => {
            const showAlert = (rcaId = null) => {
              closeModal();
              const summaryLines = [
                logPayload.Resultado === "FALLA" ? "Resultado fallido guardado." : "Registro guardado exitosamente."
              ];
              if (otId) summaryLines.push(`OT correctiva creada: ${otId}`);
              if (newDefectId) summaryLines.push(`Defecto registrado: ${newDefectId}`);
              if (rcaId) summaryLines.push(`Borrador RCA generado: ${rcaId}`);
              if (declareNogo) summaryLines.push(`Estado NO-GO activado.`);

              showToast(
                summaryLines.join("<br>"),
                (logPayload.Resultado === "FALLA" || declareNogo) ? "error" : "success"
              );
              loadInspectionsTable();
            };

            if (triggerRca) {
              const rcaPayload = {
                Fecha_Evento: logPayload.Fecha_Ejecucion,
                Embarcacion: planItem.VesselName,
                Sistema_Equipo: planItem.SFI,
                Tipo_Evento: "Falla Crítica A/B",
                Lider_RCA: "Por Asignar",
                Descripcion_Evento: `Falla detectada durante inspección ${planItem.Descripcion_Prueba}. Hallazgos: ${logPayload.Hallazgos_Observaciones}`,
                Status: "OPEN"
              };
              google.script.run.withSuccessHandler(newRCA => {
                showAlert(newRCA.RCA_ID);
              }).apiCreateRCA(rcaPayload);
            } else {
              showAlert();
            }
          };

          if (logDefect) {
            let classClass = "C";
            if (planItem && planItem.SFI) {
              let invItem = currentInventoryData.find(i => i.SFI === planItem.SFI);
              if (invItem && invItem.Criticidad === "A - SEGURIDAD") classClass = "A";
              else if (invItem && invItem.Criticidad === "B - AMBIENTAL") classClass = "B";
            }

            const defectPayload = {
              Fecha_Reporte: logPayload.Fecha_Ejecucion,
              Embarcacion: planItem.VesselName,
              SFI: planItem.SFI,
              TaskID: planItem.TaskID || '',
              Clasificacion_Falla: classClass,
              Descripcion_Sintoma: originalFindings,
              Accion_Inmediata: `Derivado Automático desde Inspección. Resultado: ${logPayload.Resultado}`,
               Estado_Operativo: declareNogo ? "NO-GO" : (logPayload.Resultado === "FALLA" ? "FALLA" : "REP.TEMP"),
               Responsable_Correccion: logPayload.Responsable,
               OT_Asociada: otId,
               Status: (logPayload.Resultado === "FALLA" ? "OPEN" : "IN_REPAIR")
             };

             google.script.run.withSuccessHandler(newDefect => {
               if (newDefect && newDefect.success !== false && newDefect.Defecto_ID) {
                 finishChain(newDefect.Defecto_ID, null);
                 return;
               }
               alert('La inspección se guardó, pero no se pudo registrar automáticamente el defecto: ' + ((newDefect && newDefect.message) || 'Error desconocido'));
               finishChain(null, null);
             }).withFailureHandler(err => {
               alert('La inspección se guardó, pero falló el registro automático del defecto: ' + ((err && err.message) || err));
               finishChain(null, null);
             }).apiCreateDefect(defectPayload);
          } else {
            finishChain(null, null);
          }

        }).apiUpdateInspection(planRowIndex, planUpdate);

      }).apiCreateInspectionLog(logPayload);
    };

    if (autoCreateOT) {
      const planItem = currentInspectionsData.find(d => d._rowIndex === planRowIndex);
      const otPayload = {
        TaskID: planItem.TaskID || '',
        AssetID: planItem.SFI,
        VesselName: planItem.VesselName,
        Type: "Correctiva",
        Priority: declareNogo ? "Emergencia" : "Alta",
        Status: "OPEN",
        OpenDate: logPayload.Fecha_Ejecucion,
        PlannedDate: logPayload.Fecha_Ejecucion,
        Remarks: originalFindings
      };
      google.script.run
        .withSuccessHandler(newOT => {
          if (newOT && newOT.OT_ID) {
            finalizeExecution(newOT.OT_ID);
          } else {
            console.error("Error al crear OT:", newOT);
            alert("⚠️í¯Â¸Â Error: No se pudo generar la OT. Verifique la consola.");
            finalizeExecution();
          }
        })
        .withFailureHandler(err => {
          console.error("Error crítico al crear OT:", err);
          alert("í¢ÂÅ’ Error crítico del servidor al crear OT: " + err.message);
          finalizeExecution();
        })
        .apiCreateWorkOrder(otPayload);
    } else {
      finalizeExecution();
    }
  }

  function submitGeneralForm(event, rowIndex, mode) {
    event.preventDefault();
    if (mode === 'DEFECT_LOG' && (rowIndex === null || rowIndex === undefined) && currentDefectFormContext && currentDefectFormContext.rowIndex !== null && currentDefectFormContext.rowIndex !== undefined) {
      rowIndex = currentDefectFormContext.rowIndex;
    }
    if (mode === 'WORK_ORDERS' && (rowIndex === null || rowIndex === undefined) && currentWorkOrderModalContext.rowIndex !== null && currentWorkOrderModalContext.rowIndex !== undefined) {
      rowIndex = currentWorkOrderModalContext.rowIndex;
    }
    const form = event.target;
    const payload = {};
    let fields = [];
    switch (mode) {
      case 'FLOTA': fields = VESSEL_FIELDS; break;
      case 'SPARES': fields = SPARES_FIELDS; break;
      case 'SPARE_ORDERS': fields = SPARE_ORDERS_FIELDS; break;
      case 'SPARE_ORDER_RECEIPT': fields = SPARE_ORDER_RECEIPT_FIELDS; break;
      case 'INSPECTIONS': fields = INSPECTION_PLAN_FIELDS; break;
      case 'INSPECTIONS_LOG': fields = INSPECTION_LOG_FIELDS; break;
      case 'CAPA_LOG': fields = CAPA_FIELDS; break;
      case 'RCA_LOG': fields = RCA_FIELDS; break;
      case 'DEFECT_LOG': fields = DEFECT_FIELDS; break;
      case 'WORK_ORDERS': fields = WORK_ORDERS_FIELDS; break;
      case 'MAINTENANCE_PLAN': fields = MAINTENANCE_PLAN_FIELDS; break;
      case 'DAILY_REPORTS': fields = DAILY_REPORTS_FIELDS; break;
      case 'CERTIFICATES': fields = CERTIFICATE_FIELDS; break;
      case 'PROVEEDORES': fields = PROVEEDORES_FIELDS; break;
      case 'EVAL_PROVEEDORES': fields = EVAL_PROVEEDORES_FIELDS; break;
      case 'NC_PROVEEDORES': fields = NC_PROVEEDORES_FIELDS; break;
      case 'DEFERRALS': fields = DEFERRALS_FIELDS; break;
      default: fields = INVENTORY_FIELDS;
    }
    fields.forEach(f => {
      const fieldElement = form[f.name];
      if (fieldElement) {
        let val = fieldElement.value;
        payload[f.name] = (f.type === "date") ? formatDateUI(val) : val;
      }
    });

    // Smart Parser for Spare Consumption in Work Orders
    if (mode === 'WORK_ORDERS' && payload.Repuestos_Consumidos) {
      const sparesStr = payload.Repuestos_Consumidos;
      const parts = sparesStr.split(";");
      const currentVessel = payload.VesselName;
      pendingSparesUsage = [];
      parts.forEach(p => {
        const item = p.trim().split("/");
        if (item.length === 2) {
          const sku = item[0].trim();
          const qty = parseFloat(item[1].trim());
          if (sku && !isNaN(qty)) {
            pendingSparesUsage.push({ sku: sku, quantity: qty, vessel: currentVessel });
          }
        }
      });
    }

    const btnSave = document.getElementById("btn-save");
    btnSave.disabled = true;
    btnSave.innerText = "Guardando...";

    if (mode === 'FLOTA') {
      const onVesselSaveError = err => {
        alert('Error al guardar embarcación: ' + ((err && err.message) || err));
        btnSave.disabled = false;
        btnSave.innerText = rowIndex ? 'Actualizar' : 'Guardar';
      };
      let run = rowIndex ? google.script.run.withSuccessHandler(ref => { clearCache(); closeModal(); loadVesselsTable(); }).withFailureHandler(onVesselSaveError).apiUpdateVessel(rowIndex, payload)
        : google.script.run.withSuccessHandler(ref => { clearCache(); closeModal(); loadVesselsTable(); }).withFailureHandler(onVesselSaveError).apiCreateVessel(payload);
    } else if (mode === 'SPARES') {
      const duplicateMatches = findPotentialSpareDuplicates(payload, rowIndex);
      if (duplicateMatches.length) {
        const duplicateSummary = duplicateMatches
          .map(match => `${match.item.SKU || '-'} | ${match.item.Nombre_Funcional || '-'} | ${match.item.VesselName || '-'} | SFI ${match.item.SFI || '-'}`)
          .join('\n');
        const shouldContinue = confirm(`Se detectaron posibles repuestos duplicados o muy similares:\n\n${duplicateSummary}\n\n¿Deseas guardar de todos modos?`);
        if (!shouldContinue) {
          btnSave.disabled = false;
          btnSave.innerText = rowIndex ? "Actualizar" : "Guardar";
          return;
        }
      }

      const onSpareSaveError = (err) => {
        alert("Error al guardar repuesto: " + (err.message || err));
        btnSave.disabled = false;
        btnSave.innerText = rowIndex ? "Actualizar" : "Guardar";
      };
      let run = rowIndex ? google.script.run.withSuccessHandler(ref => { clearCache(); closeModal(); loadSparesTable(); }).withFailureHandler(onSpareSaveError).apiUpdateSpare(rowIndex, payload)
        : google.script.run.withSuccessHandler(ref => { clearCache(); closeModal(); loadSparesTable(); }).withFailureHandler(onSpareSaveError).apiCreateSpare(payload);
    } else if (mode === 'INSPECTIONS') {
      const restoreInspectionSaveButton = () => {
        btnSave.disabled = false;
        btnSave.innerHTML = `<span class="material-symbols-outlined fs-sm">save</span> ${rowIndex ? "Actualizar" : "Guardar"}`;
      };
      const handleInspectionSaveResult = (ref) => {
        if (ref && ref.success === false) {
          alert(ref.message || "No se pudo guardar la tarea de inspección.");
          restoreInspectionSaveButton();
          return;
        }
        clearCache();
        closeModal();
        if (payload.Resultado === "FALLA") alert("⚠️ Resultado fallido: Se recomienda abrir una OT correctiva de inmediato según Proc-Man-07.");
        loadInspectionsTable(true);
        showToast("Tarea de inspección guardada", "success");
      };
      const handleInspectionSaveFailure = (err) => {
        alert("Error al guardar la tarea de inspección: " + ((err && err.message) || err));
        restoreInspectionSaveButton();

  function getNextDate(lastDateStr, freq) {
    if (!lastDateStr) return "";
    let d = parseDateManual(lastDateStr);
    if (!d || isNaN(d.getTime())) return "";
    const f = (freq || "").toUpperCase();
    if (f === "OCASIONAL") return ""; // No se proyecta fecha automática
    if (f === "DIARIA") d.setDate(d.getDate() + 1);
    else if (f === "SEMANAL") d.setDate(d.getDate() + 7);
    else if (f === "QUINCENAL") d.setDate(d.getDate() + 15);
    else if (f === "MENSUAL") d.setMonth(d.getMonth() + 1);
    else if (f === "TRIMESTRAL") d.setMonth(d.getMonth() + 3);
    else if (f === "SEMESTRAL") d.setMonth(d.getMonth() + 6);
    else if (f === "ANUAL") d.setFullYear(d.getFullYear() + 1);
    return formatDateUI(d);
  }

  // Normalización de estados legacy -> inglés canónico (client-side)
  /**
   * normalizeStatus - Sincronizado con _normalizeStatus_ del backend.
   * Centraliza la lógica de estados para etiquetas y badges.
   */
  function normalizeStatus(raw) {
    if (!raw) return '';
    const map = {
      'ABIERTO': 'OPEN', 'ABIERTA': 'OPEN', 'OPEN': 'OPEN',
      'CERRADO': 'CLOSED', 'CERRADA': 'CLOSED', 'CLOSED': 'CLOSED',
      'CONCLUIDA': 'CLOSED', 'CONCLUIDO': 'CLOSED', 'EJECUTADA': 'CLOSED',
      'PENDIENTE': 'DEFERRED', 'DIFERIDO': 'DEFERRED', 'DEFERRED': 'DEFERRED',
      'PLANIFICADA': 'PLANNED', 'PLANIFICADO': 'PLANNED', 'PLANNED': 'PLANNED',
      'EN PROCESO': 'IN_PROGRESS', 'IN_PROGRESS': 'IN_PROGRESS',
      'EN REPARACION': 'IN_REPAIR', 'EN REPARACIÓN': 'IN_REPAIR', 'IN_REPAIR': 'IN_REPAIR',
      'ESPERANDO REPUESTOS': 'WAITING_SPARES', 'WAITING_SPARES': 'WAITING_SPARES',
      'ESPERANDO PROVEEDOR': 'WAITING_VENDOR', 'WAITING_VENDOR': 'WAITING_VENDOR',
      'PENDIENTE VERIFICACION': 'PENDING_VERIFICATION', 'PENDING_VERIFICATION': 'PENDING_VERIFICATION',
      'SOLICITADO': 'REQUESTED', 'REQUESTED': 'REQUESTED',
      'APROBADO': 'APPROVED', 'APPROVED': 'APPROVED',
      'ACTIVO': 'ACTIVE', 'ACTIVE': 'ACTIVE',
      'VENCIDO': 'EXPIRED', 'EXPIRED': 'EXPIRED',
      'RECHAZADO': 'REJECTED', 'REJECTED': 'REJECTED',
      'CANCELADO': 'CANCELLED', 'CANCELADA': 'CANCELLED', 'CANCELLED': 'CANCELLED'
    };
    const u = String(raw).trim().toUpperCase();
    return map[u] || u;
  }

    { name: 'Notas_Cierre',         label: 'Notas de Cierre',                     type: 'textarea', fullWidth: true },
    { name: 'RCA_ID',               label: 'Vínculo RCA (si aplica)',             type: 'text' }

  let currentDeferralsData = [];

  function switchDeferralTab(tab) {
    currentDeferralTab = tab;

    const btc = document.getElementById('backlog-tab-content');
    const btnD = document.getElementById('tab-btn-deferrals');

    const inactiveStyle = 'background: var(--bg-card-hover); color: var(--text-muted); border: 1px solid var(--border-color);';

      dtc.style.display = 'flex'; btc.style.display = 'none';

  function loadDeferralsView() {
    const container = document.getElementById('deferrals-tab-content');

  function filterDeferralsView() {

  /**
   * renderDeferralTable - Renderiza la tabla de diferimientos.
   * Aplica filtros de embarcación y ordenamiento por urgencia (Regla: Vencidos > Pendientes > Activos).
   */
  function renderDeferralTable() {
    const container = document.getElementById('deferrals-tab-content');
    if (!container) return;
    const vFilter = (document.getElementById('vessel-filter-deferrals') || {}).value || '';
    const sFilter = (document.getElementById('status-filter-deferrals') || {}).value || '';
    const cFilter = (document.getElementById('criticidad-filter-deferrals') || {}).value || '';
    const today = new Date(); today.setHours(0, 0, 0, 0);

    let data = [...currentDeferralsData];
    if (vFilter) {
      data = data.filter(d => (d.Embarcacion || '').toUpperCase() === vFilter.toUpperCase());
    }
    if (sFilter) {
      data = data.filter(d => normalizeStatus(d.Estado_Visible || d.Status) === sFilter);
    }
    if (cFilter) {
      data = data.filter(d => (d.Clasificacion || '').toUpperCase() === cFilter.toUpperCase());
    }

    // Ordenamiento por prioridad: Vencidos (0) > Solicitados (1) > Aprobados (2) > Activos (3) > Cerrados (10)
    data.sort((a, b) => {
      const sA = normalizeStatus(a.Estado_Visible || a.Status);
      const sB = normalizeStatus(b.Estado_Visible || b.Status);
      const prio = { 'EXPIRED': 0, 'REQUESTED': 1, 'APPROVED': 2, 'ACTIVE': 3, 'CLOSED': 10, 'REJECTED': 11 };
      const pA = prio[sA] ?? 5;
      const pB = prio[sB] ?? 5;
      if (pA !== pB) return pA - pB;
      const dA = parseDateManual(a.Fecha_Vencimiento) || new Date(2099, 11, 31);
      const dB = parseDateManual(b.Fecha_Vencimiento) || new Date(2099, 11, 31);
      return dA - dB;
    });

    let html = `
      <div style="margin-bottom:1.5rem;display:flex;gap:1rem;align-items:center;">
        <button class="btn-primary" onclick="openGeneralModal(null, 'DEFERRALS')"
          style="background: var(--accent-yellow); color:#000; display:flex; align-items:center; gap:0.5rem;">
          <span class="material-symbols-outlined fs-md">add_task</span> NUEVO DIFERIMIENTO
        </button>
      </div>`;

    if (data.length === 0) {
      container.innerHTML = html + `<div style="text-align:center;padding:2rem;color:var(--text-muted);">No se encontraron diferimientos registrados para esta selección.</div>`;
      return;
    }

    html += `<table class="data-table"><thead><tr>
      <th>ID / FECHA</th><th>EMBARCACIÓN / SFI</th><th>ORIGEN</th><th>OT ASOCIADA</th><th>MOTIVO</th>
      <th>VENCIMIENTO</th><th>APROBADOR</th><th>ESTADO</th>
    </tr></thead><tbody>`;

    data.forEach(function(item) {
      const vDate = parseDateManual(item.Fecha_Vencimiento);
      const daysLeft = vDate ? Math.ceil((vDate - today) / 86400000) : null;
      let vencStyle = '';
      let vencText = item.Fecha_Vencimiento ? formatDateUI(item.Fecha_Vencimiento) : '-';
      const visibleStatus = getDeferralVisibleStatus(item, daysLeft);

      if (daysLeft !== null) {
        if (daysLeft < 0) vencStyle = 'color:var(--accent-red);font-weight:700;';
        else if (daysLeft <= 7) vencStyle = 'color:var(--accent-yellow);font-weight:700;';
        else vencStyle = 'color:var(--accent-green);';
        vencText += daysLeft < 0 ? ` <span style="font-size:0.7rem;">(VENCIDO ${Math.abs(daysLeft)}d)</span>`
          : ` <span style="font-size:0.7rem;">(${daysLeft}d)</span>`;
      }

      const bClass = statusBadgeClass(visibleStatus);
      // Hardening Point 1: Eliminamos redundancia NO-GO en Diferimientos ya que su creación está bloqueada.
      
      html += `<tr onclick="openGeneralModal(${item._rowIndex}, 'DEFERRALS')" style="cursor:pointer;">
        <td><div style="font-weight:700;">${item.Deferral_ID || '-'}</div>
            <div style="font-size:0.75rem;color:var(--text-muted);">${formatDateUI(item.Fecha_Solicitud) || '-'}</div></td>
        <td><div style="font-weight:600;">${item.Embarcacion || '-'}</div>
            <div style="font-size:0.75rem;color:var(--text-muted);">SFI: ${item.SFI || '-'}</div>
            <div style="font-size:0.7rem;color:var(--text-muted);">DEF: ${item.Defecto_ID || '-'}</div></td>
        <td style="font-size:0.8rem;"><div>TaskID: ${item.TaskID_Origen || '-'}</div></td>
        <td style="font-size:0.8rem; font-weight:600; color:var(--accent-yellow);">${item.OT_Asociada || '-'}</td>
        <td style="font-size:0.85rem;">${(item.Motivo || '-').substring(0, 50)}...</td>
        <td style="${vencStyle}">${vencText}</td>
        <td style="font-size:0.8rem;">${item.Aprobador || '-'}</td>
         <td><span class="table-badge ${bClass}">${statusLabel(visibleStatus)}</span></td>
      </tr>`;
    });
    html += `</tbody></table>`;
    container.innerHTML = html;
  }

            <div style="font-size:0.65rem;color:var(--text-muted);">Diferimientos</div>

  function sendToAssistant() {
    const input = document.getElementById("ai-input");
    const container = document.getElementById("ai-chat-container");
    const prompt = input.value.trim();
    const promptsBox = document.getElementById("ai-prompts-container");

    if (!prompt) return;

    // Ocultar sugerencias tras el primer mensaje
    if (promptsBox) promptsBox.classList.add("hidden");

    // Render User Message
    appendMessage("user", prompt);
    input.value = "";

    // Show Typing indicator
    const typingId = "msg-typing-" + Date.now();
    const typingDiv = document.createElement("div");
    typingDiv.id = typingId;
    typingDiv.className = "ai-msg ai-msg-bot ai-msg-typing";
    typingDiv.innerText = "Mercurio está pensando...";
    container.appendChild(typingDiv);
    container.scrollTop = container.scrollHeight;

    if (typeof google !== "undefined" && google.script) {
      google.script.run
        .withSuccessHandler(response => {
          document.getElementById(typingId).remove();
          if (response.success) {
            appendMessage("bot", response.text);
            // Guardar en historial para mantener contexto
            aiConversationHistory.push({ role: "user", parts: [{ text: prompt }] });
            aiConversationHistory.push({ role: "model", parts: [{ text: response.text }] });
            // Limitar historial para no saturar tokens
            if (aiConversationHistory.length > 10) aiConversationHistory.splice(0, 2);
          } else {
            appendMessage("bot", "Lo siento, tuve un problema: " + response.message);
          }
        })
        .withFailureHandler(err => {
          document.getElementById(typingId).remove();
          appendMessage("bot", "Error de conexión: " + err.message);
        })
        .apiAskAssistant(prompt, aiConversationHistory);
    }
  }

  function appendMessage(role, text, options = {}) {
    const container = document.getElementById("ai-chat-container");
    if (!container) return;

    const msgDiv = document.createElement("div");
    msgDiv.className = `ai-msg ai-msg-${role}`;

    const labelText = role === "bot" ? "MERCURIO AI" : "TÚ";
    const labelColor = role === "bot" ? "var(--accent-cyan)" : "rgba(255,255,255,0.7)";
    const labelAlign = role === "bot" ? "left" : "right";

    const allowHtml = !!options.allowHtml;
    let html = allowHtml ? String(text || "") : markdownToHtml(String(text || ""));

    // Build inner HTML with label
    msgDiv.innerHTML = `
      <div style="font-size: 0.6rem; font-weight: 800; margin-bottom: 0.3rem; color: ${labelColor}; text-align: ${labelAlign}; letter-spacing: 0.05em;">
        ${labelText}
      </div>
      <div>${html}</div>
    `;

    // 4. Inyección de Botón Picker si detecta [SELECT_FILE]
    if (text.includes('[SELECT_FILE]')) {
      const btnWrapper = document.createElement("div");
      const btnPicker = document.createElement("button");
      btnPicker.className = "btn-picker-inline";
      btnPicker.innerHTML = '<span class="material-symbols-outlined">attach_file</span> SELECCIONAR ARCHIVO DE DRIVE';
      btnPicker.onclick = () => openGooglePicker();
      btnWrapper.appendChild(btnPicker);
      msgDiv.appendChild(btnWrapper);
    }

    container.appendChild(msgDiv);
    container.scrollTop = container.scrollHeight;
  }

  // --- GOOGLE DRIVE PICKER INTEGRATION ---
  let pickerApiLoaded = false;
  let oauthToken = null;
  let currentTargetInputId = null;

  function loadPickerApi() {
    gapi.load('picker', { 'callback': () => { pickerApiLoaded = true; } });
  }

  function openGooglePicker(targetInputId = null) {
    currentTargetInputId = targetInputId;
    if (!pickerApiLoaded) {
      loadPickerApi();
      showToast("Cargando servicios de Google...", "info");
    }
    
    google.script.run
      .withSuccessHandler(token => {
        oauthToken = token;
        createPicker();
      })
      .getOAuthToken();
  }

  function createPicker() {
    if (pickerApiLoaded && oauthToken) {
      const view = new google.picker.DocsView(google.picker.ViewId.DOCS);
      view.setIncludeFolders(true);
      
      const picker = new google.picker.PickerBuilder()
        .addView(view)
        .setOAuthToken(oauthToken)
        .setCallback(pickerCallback)
        .setOrigin(window.location.origin)
        .build();
      picker.setVisible(true);
    }
  }

  function pickerCallback(data) {
    if (data.action === google.picker.Action.PICKED) {
      const doc = data.docs[0];
      const url = doc.url;
      const name = doc.name;
      
      if (currentTargetInputId) {
        const input = document.getElementById(currentTargetInputId);
        if (input) {
          input.value = url;
          input.setAttribute('value', url);
          input.dispatchEvent(new Event('input', { bubbles: true }));
          input.dispatchEvent(new Event('change', { bubbles: true }));
          showToast(`Archivo seleccionado: ${name}`, "success");
        }
      } else {
        // Enviar el link al chat (IA)
        appendMessage("user", `He seleccionado: ${name}`);
        appendMessage("bot", `He recibido el documento: <a href="${url}" target="_blank" style="color: var(--accent-cyan); text-decoration: underline;">${name}</a>. ¿Deseas que lo asocie a algún registro actual?`, { allowHtml: true });
      }
    }
    // Reset target after selection
    currentTargetInputId = null;
  }
  
  // Inicializar carga de API
  setTimeout(loadPickerApi, 2000);

  const BARRIER_FAMILY_OPTIONS = [
    { value: 'SEG_DETECCION_ALARMA', label: 'Seguridad · Detección y alarma' },
    { value: 'SEG_INCENDIO_EXTINCION', label: 'Seguridad · Incendio/extinción' },

  ];

  const BARRIER_TRIGGER_OPTIONS = [
    { value: 'DEFECT_LOG', label: 'Defecto reportado' },
    { value: 'TEST_FAIL', label: 'Prueba FAIL' },
    { value: 'TEST_OBSERVATION', label: 'PASS con observación' },
    { value: 'PRE_TRANSFER', label: 'Chequeo pre-transfer' },
    { value: 'REEVALUATION', label: 'Re-evaluación' }
  ];

  const BARRIER_TEST_RESULT_OPTIONS = [
    { value: 'PASS', label: 'PASS' },
    { value: 'PASS_CON_OBSERVACION', label: 'PASS con observación' },
    { value: 'FAIL', label: 'FAIL' }
  ];

  const BARRIER_OPERATIONAL_DECISION_OPTIONS = [
    { value: 'GO', label: 'GO' },
    { value: 'RESTRICTED', label: 'GO con restricción' },
    { value: 'NO_GO', label: 'NO GO' }
  ];

  const BARRIER_YES_NO_OPTIONS = [
    { value: 'YES', label: 'Sí' },
    { value: 'NO', label: 'No' }
  ];

  function escapeBarrierHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function inferBarrierFamily(context, assessment) {
    const source = [
      assessment && assessment.barrier_name,
      assessment && assessment.assessment_basis,
      assessment && assessment.compensatory_measure_description,
      context && context.Descripcion_Sintoma,
      context && context.Accion_Inmediata,
      context && context.SFI
    ].filter(Boolean).join(' ').toLowerCase();

    if (/sobrellen|overfill|alto nivel|high level|nivel/.test(source)) return 'AMB_NIVEL_SOBRELLENADO';
    if (/derrame|spill|contain|contenci|manguera|manifold|transfer|valvula|válvula|linea|línea/.test(source)) return 'AMB_CONTENCION_DERRAME';
    if (/esd|shutdown|cierre remoto|parada de emergencia/.test(source)) return 'SEG_ESD_CIERRES';
    if (/incend|fire|espuma|co2|extinc|bomba contra incendio/.test(source)) return 'SEG_INCENDIO_EXTINCION';
    if (/alarma|detec|sensor|monitor/.test(source)) return 'SEG_DETECCION_ALARMA';
    if (/ventil|aislam/.test(source)) return 'SEG_VENT_AISLAMIENTO';
    if (/gobierno|steering|emergencia/.test(source)) return 'SEG_GOBIERNO_EMERGENCIA';
    if (/energia|energía|generator|generador|power|respaldo|proteccion|protección/.test(source)) return 'ENERGIA_PROTECCIONES';
    if (/atex|iecex|ex /.test(source)) return 'EX_INTEGRIDAD';
    return 'OTRA';
  }

  function inferBarrierDomain(family) {
    if (!family) return 'SEGURIDAD';
    if (family.startsWith('AMB_')) return 'AMBIENTAL';
    if (family.startsWith('EX_')) return 'SEGURIDAD';
    if (family.startsWith('ENERGIA_')) return 'SEGURIDAD';
    return 'SEGURIDAD';
  }

  function inferBarrierAcceptanceCriterion(family) {
    switch (family) {
      case 'SEG_DETECCION_ALARMA':
        return 'La alarma o detección debe activarse dentro del rango esperado, ser audible/visible y sin bypass activo.';
      case 'SEG_INCENDIO_EXTINCION':
        return 'La barrera contra incendio debe estar disponible, operativa y lista para respuesta inmediata.';
      case 'SEG_ESD_CIERRES':
        return 'La parada/cierre debe ejecutar aislamiento seguro y verificable sin demoras anómalas.';
      case 'SEG_VENT_AISLAMIENTO':
        return 'La ventilación o aislamiento debe mantener la condición segura del área y del equipo.';
      case 'SEG_GOBIERNO_EMERGENCIA':
        return 'La función crítica debe responder de forma estable y con alarmas/protecciones activas.';
      case 'AMB_NIVEL_SOBRELLENADO':
        return 'La barrera ambiental debe detectar y alertar oportunamente antes de pérdida de contención.';
      case 'AMB_CONTENCION_DERRAME':
      case 'AMB_TRANSFERENCIA_AISLAMIENTO':
        return 'Debe existir integridad mecánica, aislamiento efectivo y condición de cero fugas visibles.';
      case 'ENERGIA_PROTECCIONES':
        return 'Las protecciones y el respaldo deben mantener la continuidad segura de la función esencial.';
      case 'EX_INTEGRIDAD':
        return 'La integridad Ex debe mantenerse sin daño visible, exposición o pérdida de certificación funcional.';
      default:
        return 'La barrera crítica debe permanecer disponible, verificable y dentro de su criterio de aceptación.';
    }
  }

  function deriveBarrierComplianceDefaults(context, assessment, existing = {}) {
    const family = existing.barrier_family || inferBarrierFamily(context, assessment);
    const testResult = existing.test_result || (assessment && assessment.barrier_status === 'HEALTHY'
      ? 'PASS'
      : (assessment && assessment.barrier_status === 'DEGRADED' ? 'PASS_CON_OBSERVACION' : 'FAIL'));
    const operationalDecision = existing.operational_decision || (assessment && assessment.deferral_impact === 'BLOCKED'
      ? 'NO_GO'
      : (assessment && assessment.deferral_impact === 'REVIEW_REQUIRED' ? 'RESTRICTED' : 'GO'));
    const correctiveActionRequired = existing.corrective_action_required || (testResult === 'PASS' ? 'NO' : 'YES');
    const reassessmentRequired = existing.reassessment_required || ((testResult === 'PASS' && operationalDecision === 'GO') ? 'NO' : 'YES');
    const initialCondition = existing.condition_initial || [
      context && context.Descripcion_Sintoma ? `Falla reportada: ${context.Descripcion_Sintoma}` : '',
      context && context.Estado_Operativo ? `Estado operativo informado: ${context.Estado_Operativo}` : ''
    ].filter(Boolean).join(' | ');

    return {
      barrier_domain: existing.barrier_domain || inferBarrierDomain(family),
      barrier_family: family,
      trigger_event: existing.trigger_event || 'DEFECT_LOG',
      condition_initial: initialCondition,
      acceptance_criterion: existing.acceptance_criterion || inferBarrierAcceptanceCriterion(family),
      test_result: testResult,
      verification_method: existing.verification_method || 'Entrevista IA + validación técnica en sitio',
      operational_decision: operationalDecision,
      operational_restriction: existing.operational_restriction || (operationalDecision === 'RESTRICTED' ? 'Operar con restricción y monitoreo reforzado hasta cierre técnico.' : ''),
      evidence_reference: existing.evidence_reference || '',
      corrective_action_required: correctiveActionRequired,
      corrective_action_description: existing.corrective_action_description || (assessment && assessment.compensatory_measure_description) || '',
      reassessment_required: reassessmentRequired,
      reassessment_due_date: existing.reassessment_due_date || '',
      compliance_status: existing.compliance_status || ''
    };
  }

  function buildBarrierSelectOptions(options, selectedValue) {
    const selected = String(selectedValue || '').trim().toUpperCase();
    return options.map(opt => {
      const value = String(opt.value || '').trim();
      const label = String(opt.label || value).trim();
      const isSelected = value.toUpperCase() === selected ? 'selected' : '';
      return `<option value="${escapeBarrierHtml(value)}" ${isSelected}>${escapeBarrierHtml(label)}</option>`;
    }).join('');
  }

      corrective_action_description: readValue('corrective_action_description'),
      reassessment_required: readValue('reassessment_required'),
      reassessment_due_date: readValue('reassessment_due_date') ? formatDateUI(readValue('reassessment_due_date')) : '',
    };

    const missing = [];
    [
      ['barrier_family', 'familia de barrera'],
      ['condition_initial', 'condición inicial'],
      ['acceptance_criterion', 'criterio de aceptación'],
      ['test_result', 'resultado'],
      ['verification_method', 'método de verificación'],
      ['operational_decision', 'decisión operativa'],
      ['evidence_reference', 'evidencia / referencia'],
    ].forEach(([key, label]) => {
      if (!values[key]) missing.push(label);
    });

    if (values.corrective_action_required === 'YES' && !values.corrective_action_description) {
      missing.push('acción correctiva / compensatoria');
    }

    if ((values.reassessment_required === 'YES' || values.operational_decision === 'RESTRICTED' || values.operational_decision === 'NO_GO') && !values.reassessment_due_date) {
      missing.push('fecha de re-evaluación');
    }

    values.compliance_status = missing.length ? 'PARTIAL' : 'COMPLETE';
    return { values, missing };
  }

    if (!pendingDefectBarrierAssessment) return { ok: true };

    if (!inlineBarrierField) {

        {},
        deriveBarrierComplianceDefaults(context, pendingDefectBarrierAssessment, pendingDefectBarrierAssessment),
        pendingDefectBarrierAssessment,
      );
      return { ok: true };
    }

    const compliance = collectBarrierComplianceForm('inline-barrier');

    pendingDefectBarrierAssessment = Object.assign({}, pendingDefectBarrierAssessment, compliance.values);

    const ansEl = document.getElementById("barrier-ai-answer");

    // Guardar en historial
    currentBarrierInterview.history.push({ q: lastQuestion, a: answer });
    currentBarrierInterview.step++;

    // Mostrar loading

      <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:1.5rem; color: var(--text-muted);">

        </div>

  function _getLatestDailyReportForVessel(vName, currentReportId = null) {
    if (!vName || !currentDailyData || currentDailyData.length === 0) return null;

    const vesselKey = String(vName).toUpperCase().trim();
    const reports = currentDailyData
      .filter(r => String(r.VesselName || '').toUpperCase().trim() === vesselKey)
      .filter(r => !currentReportId || r.ReportID !== currentReportId)
      .sort((a, b) => {
        const dateA = new Date(`${a.Date || '2000-01-01'}T${a.Time || '00:00'}`);
        const dateB = new Date(`${b.Date || '2000-01-01'}T${b.Time || '00:00'}`);
        return dateB - dateA || String(b.ReportID || '').localeCompare(String(a.ReportID || ''));
      });

    return reports[0] || null;
  }

  function _getDailyReportDefaultVessel() {
    if (shouldAutoLockSpareVessel()) {
      const assigned = parseAssignedVessels();
      return assigned.length === 1 ? assigned[0] : "";
    }
    return document.getElementById("vessel-filter-daily")?.value || "";
  }

  function _getDailyVesselConfig(vesselName) {
    const vesselKey = String(vesselName || '').trim().toUpperCase();
    if (!vesselKey) return null;
    return (currentVesselsData || []).find(v => String(v.VesselName || '').trim().toUpperCase() === vesselKey) || null;
  }

  function _safeFieldValue(record, fieldName) {
    if (!record || !Object.prototype.hasOwnProperty.call(record, fieldName)) return "";
    const value = record[fieldName];
    return value == null ? "" : value;
  }

  function _getConfiguredDailySlots(slotConfigs, reportData) {
    const vesselConfig = _getDailyVesselConfig(reportData.VesselName) || {};
    return (slotConfigs || []).filter(slot => {
      const prefix = slot.prefix;
      return String(reportData[`${prefix}_Equipment`] || reportData[`${prefix}_SFI`] || vesselConfig[`${prefix}_Equipment`] || vesselConfig[`${prefix}_SFI`] || '').trim();
    });
  }

  function _recalculateDailyMachineFields(reportData, slotConfigs) {
    (slotConfigs || []).forEach(slot => {
      const prefix = slot.prefix;
      const prev = parseFloat(reportData[`${prefix}_Previous_Hours`] || 0);
      const currRaw = reportData[`${prefix}_Current_Hours`];
      const curr = parseFloat(currRaw || 0);
      if (String(currRaw || '').trim()) {
        reportData[`${prefix}_Operated_Hours`] = Math.max(curr - prev, 0);
      } else {
        reportData[`${prefix}_Operated_Hours`] = "";
      }
      if (!reportData[`${prefix}_General_Status`]) {
        reportData[`${prefix}_General_Status`] = "OPERACION NORMAL";
      }
    });
  }

  function _applyDailyReportVesselConfiguration(reportData, options = {}) {
    const preserveStoredValues = !!options.preserveStoredValues;
    const vesselConfig = _getDailyVesselConfig(reportData.VesselName);
    const latestDaily = _getLatestDailyReportForVessel(reportData.VesselName, reportData.ReportID);
    const machineSlots = DAILY_REPORT_MAIN_SLOT_CONFIG.concat(DAILY_REPORT_GENERATOR_SLOT_CONFIG);

    machineSlots.forEach(slot => {
      const prefix = slot.prefix;
      const equipmentField = `${prefix}_Equipment`;
      const sfiField = `${prefix}_SFI`;
      const previousField = `${prefix}_Previous_Hours`;
      const currentField = `${prefix}_Current_Hours`;
      const rpmField = `${prefix}_Avg_RPM`;
      const loadField = `${prefix}_Avg_Load`;
      const statusField = `${prefix}_General_Status`;

      if (!preserveStoredValues || !String(reportData[equipmentField] || '').trim()) {
        reportData[equipmentField] = _safeFieldValue(vesselConfig, equipmentField);
      }
      if (!preserveStoredValues || !String(reportData[sfiField] || '').trim()) {
        reportData[sfiField] = _safeFieldValue(vesselConfig, sfiField);
      }
      if (!preserveStoredValues || !String(reportData[previousField] || '').trim()) {
        reportData[previousField] = _safeFieldValue(latestDaily, currentField);
      }
      if (!preserveStoredValues) {
        reportData[currentField] = "";
        reportData[rpmField] = "";
        reportData[loadField] = "";
        reportData[statusField] = "OPERACION NORMAL";
      }
      if (!reportData[statusField]) reportData[statusField] = "OPERACION NORMAL";
    });

    DAILY_REPORT_FUEL_TANK_CONFIG.concat(DAILY_REPORT_OIL_TANK_CONFIG).forEach(slot => {
      const prefix = slot.prefix;
      const equipmentField = `${prefix}_Equipment`;
      const sfiField = `${prefix}_SFI`;
      const soundingField = `${prefix}_Sounding`;

      if (!preserveStoredValues || !String(reportData[equipmentField] || '').trim()) {
        reportData[equipmentField] = _safeFieldValue(vesselConfig, equipmentField);
      }
      if (!preserveStoredValues || !String(reportData[sfiField] || '').trim()) {
        reportData[sfiField] = _safeFieldValue(vesselConfig, sfiField);
      }
      if (!preserveStoredValues) {
        reportData[soundingField] = "";
      }
    });

    _recalculateDailyMachineFields(reportData, machineSlots);
  }

      const text = match ? String(match[2] || '').trim() : String(line || '').trim();

  function _persistDailyReportSnapshot(options = {}, onSuccess = null, onFailure = null) {
    _saveCurrentDailyReportForm();
    if (!window._currentDetailedReport) {
      if (typeof onFailure === 'function') onFailure('No se encontró el reporte diario activo.');
      return;
    }

    const payload = JSON.parse(JSON.stringify(window._currentDetailedReport));
    const rowIndex = (window._currentDetailedReportRowIndex !== null && window._currentDetailedReportRowIndex !== undefined)
      ? window._currentDetailedReportRowIndex
      : null;
    if (!payload.Status) payload.Status = rowIndex === null ? 'BORRADOR' : (payload.Status || 'BORRADOR');

    google.script.run
      .withSuccessHandler(res => {
        if (!res || res.success === false) {
          if (typeof onFailure === 'function') onFailure(res?.message || 'No se pudo guardar el snapshot del Daily Report.');
          return;
        }
        if (res.ReportID) window._currentDetailedReport.ReportID = res.ReportID;
        if (res.rowIndex !== null && res.rowIndex !== undefined) window._currentDetailedReportRowIndex = res.rowIndex;
        if (res.pdfUrl) window._currentDetailedReport.Report_PDF_Link = res.pdfUrl;
        clearCache();
        loadDailyReportsTable();
        if (typeof onSuccess === 'function') onSuccess(res);
      })
      .withFailureHandler(err => {
        if (typeof onFailure === 'function') onFailure(err?.message || err || 'No se pudo guardar el snapshot del Daily Report.');
      })
      .apiSaveDeepDailyReport(rowIndex, payload, options);
  }

          <div style="border:1px solid rgba(168,85,247,0.22); border-radius:10px; padding:0.95rem; background:rgba(168,85,247,0.05);">
            <div style="font-size:0.78rem; font-weight:800; color:var(--accent-purple); letter-spacing:0.04em; text-transform:uppercase; margin-bottom:0.65rem;">Hallazgos</div>
            ${insightsHtml}
          </div>
          <div style="border:1px solid rgba(249,115,22,0.22); border-radius:10px; padding:0.95rem; background:rgba(249,115,22,0.05);">
            <div style="font-size:0.78rem; font-weight:800; color:var(--accent-orange); letter-spacing:0.04em; text-transform:uppercase; margin-bottom:0.65rem;">Recomendaciones</div>
            <div style="font-size:0.72rem; color:var(--text-muted); margin-bottom:0.55rem;">Etiquetas por eje: CONFIABILIDAD, COSTO/STOCK y CUMPLIMIENTO.</div>
            ${recommendationsHtml}
          </div>
        </div>`;
    }

    return `<div id="daily-maintenance-insights-panel" style="margin-top:1rem; border:1px solid rgba(168,85,247,0.28); border-radius:12px; padding:1rem; background:rgba(168,85,247,0.05);">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; margin-bottom:0.85rem;">
        <div>
          <div style="font-size:0.8rem; font-weight:800; color:var(--accent-purple); letter-spacing:0.06em; text-transform:uppercase;">Analisis para Optimizar el Sistema de Gestion de Mantenimiento</div>
          <div style="font-size:0.76rem; color:var(--text-muted); margin-top:0.25rem;">La IA revisa 180 dias de históricos para proponer mejoras estructurales del SGM. Se genera solo cuando lo solicitas.</div>
        </div>
        <button type="button" class="btn-cyan-outline" onclick="refreshDailyMaintenanceInsights(true)" style="white-space:nowrap; display:flex; align-items:center; gap:0.4rem;">
          <span class="material-symbols-outlined" style="font-size:1rem;">psychology</span> GENERAR / ACTUALIZAR ANALISIS
        </button>
      </div>
      ${bodyHtml}
    </div>`;
  }

  function _updateDailyMaintenanceInsightsPanel() {
    const panel = document.getElementById('daily-maintenance-insights-panel');
    if (!panel || !window._currentDetailedReport) return;
    const wrapper = document.createElement('div');
    wrapper.innerHTML = _renderDailyMaintenanceInsightsPanel(window._currentDetailedReport);
    const replacement = wrapper.firstElementChild;
    if (replacement) panel.replaceWith(replacement);
  }

  function _clearDailyMaintenanceInsights() {
    if (!window._currentDetailedReport) return;
    window._currentDetailedReport.IA_Maintenance_Priority = '';
    window._currentDetailedReport.IA_Maintenance_Insights_Text = '';
    window._currentDetailedReport.IA_Maintenance_Recommendations_Text = '';
    window._currentDetailedReport.IA_Maintenance_Insights_JSON = '';
    window._currentDetailedReport.IA_Maintenance_Analyzed_At = '';
  }

  function refreshDailyMaintenanceInsights(manual = false) {
    _saveCurrentDailyReportForm();
    const reportData = window._currentDetailedReport || {};
    const vesselName = String(reportData.VesselName || '').trim();
    const reportDate = String(reportData.Date || '').trim();

    if (!vesselName || !reportDate) {
      window._dailyMaintenanceInsightsLoading = false;
      _clearDailyMaintenanceInsights();
      _updateDailyMaintenanceInsightsPanel();
      if (manual) showToast('Selecciona embarcación y fecha para generar el análisis.', 'error');
      return;
    }

    window._dailyMaintenanceInsightsLoading = true;
    const requestId = (window._dailyMaintenanceInsightsRequestId || 0) + 1;
    window._dailyMaintenanceInsightsRequestId = requestId;
    _updateDailyMaintenanceInsightsPanel();

    google.script.run
      .withSuccessHandler(analysis => {
        if (requestId !== window._dailyMaintenanceInsightsRequestId) return;
        window._dailyMaintenanceInsightsLoading = false;
        if (!analysis || analysis.success === false) {
          _clearDailyMaintenanceInsights();
          window._currentDetailedReport.IA_Maintenance_Priority = 'NO DISPONIBLE';
          window._currentDetailedReport.IA_Maintenance_Insights_Text = analysis?.message || 'No se pudo generar el análisis de mantenimiento.';
          window._currentDetailedReport.IA_Maintenance_Recommendations_Text = 'Puedes enviar el reporte igual; este análisis histórico no es bloqueante.';
          window._currentDetailedReport.IA_Maintenance_Analyzed_At = new Date().toLocaleString('es-AR');
          _updateDailyMaintenanceInsightsPanel();
          if (manual) showToast(window._currentDetailedReport.IA_Maintenance_Insights_Text, 'error');
          return;
        }
        _applyDailyMaintenanceInsights(analysis);
        _updateDailyMaintenanceInsightsPanel();
        _persistDailyReportSnapshot({
          finalizeReport: false,
          generatePdf: false,
          updateMachineHours: false,
          recomputeExecutiveSummary: false,
          recomputeMaintenanceInsights: false,
        }, () => {
          if (manual) showToast('Análisis guardado en DAILY_REPORTS.', 'success');
        }, errorMessage => {
          if (manual) showToast(errorMessage, 'error');
        });
      })
      .withFailureHandler(err => {
        if (requestId !== window._dailyMaintenanceInsightsRequestId) return;
        window._dailyMaintenanceInsightsLoading = false;
        _clearDailyMaintenanceInsights();
        window._currentDetailedReport.IA_Maintenance_Priority = 'NO DISPONIBLE';
        window._currentDetailedReport.IA_Maintenance_Insights_Text = 'Error al generar el análisis de mantenimiento: ' + (err.message || err);
        window._currentDetailedReport.IA_Maintenance_Recommendations_Text = 'Puedes enviar el reporte igual; este análisis histórico no es bloqueante.';
        window._currentDetailedReport.IA_Maintenance_Analyzed_At = new Date().toLocaleString('es-AR');
        _updateDailyMaintenanceInsightsPanel();
        if (manual) showToast(window._currentDetailedReport.IA_Maintenance_Insights_Text, 'error');
      })
      .apiAnalyzeDailyMaintenanceInsights(vesselName, reportDate);
  }

  function refreshDailyExecutiveSummary(manual = false) {
    _saveCurrentDailyReportForm();
    const reportData = window._currentDetailedReport || {};
    const vesselName = String(reportData.VesselName || '').trim();
    const reportDate = String(reportData.Date || '').trim();

    if (!vesselName || !reportDate) {
      window._dailyExecutiveSummaryLoading = false;
      _updateDailyExecutiveSummaryPanel();
      if (manual) showToast('Selecciona embarcación y fecha para generar el resumen.', 'error');
      return;
    }

    window._dailyExecutiveSummaryLoading = true;
    _clearDailyMaintenanceInsights();
    const requestId = (window._dailyExecutiveSummaryRequestId || 0) + 1;
    window._dailyExecutiveSummaryRequestId = requestId;
    _updateDailyExecutiveSummaryPanel();
    _updateDailyMaintenanceInsightsPanel();

    google.script.run
      .withSuccessHandler(summary => {
        if (requestId !== window._dailyExecutiveSummaryRequestId) return;
        window._dailyExecutiveSummaryLoading = false;
        if (!summary || summary.success === false) {
          if (manual) showToast(summary?.message || 'No se pudo generar el resumen ejecutivo.', 'error');
          _updateDailyExecutiveSummaryPanel();
          return;
        }
        _applyDailyExecutiveSummary(summary);
        _updateDailyExecutiveSummaryPanel();
        _persistDailyReportSnapshot({
          finalizeReport: false,
          generatePdf: false,
          updateMachineHours: false,
          recomputeExecutiveSummary: false,
          recomputeMaintenanceInsights: false,
        }, () => {
          if (manual) showToast('Resumen guardado en DAILY_REPORTS.', 'success');
        }, errorMessage => {
          if (manual) showToast(errorMessage, 'error');
        });
      })
      .withFailureHandler(err => {
        if (requestId !== window._dailyExecutiveSummaryRequestId) return;
        window._dailyExecutiveSummaryLoading = false;
        _updateDailyExecutiveSummaryPanel();
        if (manual) showToast('Error al generar el resumen ejecutivo: ' + (err.message || err), 'error');
      })
      .apiBuildDailyExecutiveSummary(vesselName, reportDate);
  }

  function _renderDailyFlatField(field, value) {
    if (field.hidden) return "";
    let html = `<div class="form-group" style="margin-bottom:0.9rem;"><label style="font-size:0.75rem; color:var(--text-muted);">${field.label}</label>`;
    const nameAttr = field.name ? `name="${field.name}"` : "";

    if (field.type === "select") {
      html += `<select ${nameAttr} class="form-control" ${field.readOnly ? 'disabled' : ''} style="font-size:0.82rem; padding:0.55rem;">`;
      html += `<option value="">--</option>`;
      (field.options || []).forEach(opt => {
        const optValue = (opt && typeof opt === 'object') ? opt.value : opt;
        const optLabel = (opt && typeof opt === 'object') ? opt.label : opt;
        const selected = String(value || '').toUpperCase() === String(optValue || '').toUpperCase() ? 'selected' : '';
        html += `<option value="${optValue}" ${selected}>${optLabel}</option>`;
      });
      html += `</select>`;
    } else if (field.type === "textarea") {
      html += `<textarea ${nameAttr} class="form-control" rows="4" style="font-size:0.82rem; padding:0.65rem;">${value || ''}</textarea>`;
    } else {
      html += `<div style="display:flex; gap:0.5rem; align-items:center;">
        <input type="${field.type}" ${nameAttr} class="form-control" value="${value || ''}" ${field.readOnly ? 'readonly' : ''} style="font-size:0.82rem; padding:0.55rem; flex:1; ${field.readOnly ? 'opacity:0.75; background:rgba(0,0,0,0.12);' : ''}">`;
      if (field.name === 'Position') {
        html += `<button type="button" onclick="_getGPSPosition(event)" class="btn-icon-subtle" title="Obtener GPS" style="padding:0.35rem; background:rgba(0,184,212,0.1); color:var(--accent-cyan); border-radius:4px; border:1px solid rgba(0,184,212,0.3);">
          <span class="material-symbols-outlined" style="font-size:1.1rem;">location_on</span>
        </button>`;
      }
      html += `</div>`;
    }

    html += `</div>`;
    return html;
  }

  function _renderDailyMachineSection(title, slotConfigs, fields, reportData) {
    const visibleSlots = _getConfiguredDailySlots(slotConfigs, reportData);
    if (!visibleSlots.length) return "";

    let html = `<div style="margin-top:1rem;"><div style="font-size:0.8rem; font-weight:800; color:var(--accent-cyan); letter-spacing:0.06em; margin-bottom:0.9rem; text-transform:uppercase;">${title}</div><div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:1rem;">`;
    visibleSlots.forEach(slot => {
      html += `<div style="border:1px solid var(--border-color); border-radius:10px; padding:1rem; background:rgba(255,255,255,0.02); border-left:4px solid var(--accent-cyan);">
        <div style="font-size:0.86rem; font-weight:800; margin-bottom:0.85rem; color:var(--text-main);">${slot.label}</div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem 1rem;">`;
      fields.forEach(field => {
        const fieldName = `${slot.prefix}_${field.suffix}`;
        html += _renderDailyFlatField({ name: fieldName, label: field.label, type: field.type, readOnly: field.readOnly, options: field.options }, reportData[fieldName] || "");
      });
      html += `</div></div>`;
    });
    html += `</div></div>`;
    return html;
  }

  function _renderDailyTankSection(title, slotConfigs, reportData) {
    const visibleSlots = _getConfiguredDailySlots(slotConfigs, reportData);
    if (!visibleSlots.length) return "";

    let html = `<div style="margin-top:1rem;"><div style="font-size:0.8rem; font-weight:800; color:var(--accent-cyan); letter-spacing:0.06em; margin-bottom:0.9rem; text-transform:uppercase;">${title}</div><div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:1rem;">`;
    visibleSlots.forEach(slot => {
      html += `<div style="border:1px solid var(--border-color); border-radius:10px; padding:1rem; background:rgba(255,255,255,0.02); border-left:4px solid var(--accent-orange);">
        <div style="font-size:0.86rem; font-weight:800; margin-bottom:0.85rem; color:var(--text-main);">${slot.label}</div>`;
      DAILY_REPORT_TANK_FIELDS.forEach(field => {
        const fieldName = `${slot.prefix}_${field.suffix}`;
        html += _renderDailyFlatField({ name: fieldName, label: field.label, type: field.type, readOnly: field.readOnly }, reportData[fieldName] || "");
      });
      html += `</div>`;
    });
    html += `</div></div>`;
    return html;
  }

  function _saveCurrentDailyReportForm() {
    const form = document.getElementById("daily-flat-form");
    if (!form || !window._currentDetailedReport) return;
    form.querySelectorAll("[name]").forEach(el => {
      window._currentDetailedReport[el.name] = el.value;
    });
    _recalculateDailyMachineFields(window._currentDetailedReport, DAILY_REPORT_MAIN_SLOT_CONFIG.concat(DAILY_REPORT_GENERATOR_SLOT_CONFIG));
  }

  function _bindDailyReportFormEvents(rowIndex) {
    const form = document.getElementById("daily-flat-form");
    if (!form || !window._currentDetailedReport) return;

    const vesselSelect = form.querySelector("[name='VesselName']");
    const dateInput = form.querySelector("[name='Date']");
    if (vesselSelect) {
      const assignedVessels = parseAssignedVessels();
      if (shouldAutoLockSpareVessel() && assignedVessels.length === 1) {
        vesselSelect.value = assignedVessels[0];
        vesselSelect.setAttribute("disabled", "disabled");
      }
      vesselSelect.addEventListener("change", () => {
        _saveCurrentDailyReportForm();
        window._currentDetailedReport.VesselName = vesselSelect.value;
        _clearDailyExecutiveSummary();
        _clearDailyMaintenanceInsights();
        _applyDailyReportVesselConfiguration(window._currentDetailedReport, { preserveStoredValues: false });
        _renderDailyReportForm(rowIndex);
      });
    }

    if (dateInput) {
      dateInput.addEventListener("change", () => {
        _saveCurrentDailyReportForm();
        window._currentDetailedReport.Date = dateInput.value;
        _clearDailyExecutiveSummary();
        _clearDailyMaintenanceInsights();
        _updateDailyExecutiveSummaryPanel();
        _updateDailyMaintenanceInsightsPanel();
      });
    }

    DAILY_REPORT_MAIN_SLOT_CONFIG.concat(DAILY_REPORT_GENERATOR_SLOT_CONFIG).forEach(slot => {
      const currentInput = form.querySelector(`[name='${slot.prefix}_Current_Hours']`);
      if (!currentInput) return;
      currentInput.addEventListener("input", () => {
        _saveCurrentDailyReportForm();
        const operatedInput = form.querySelector(`[name='${slot.prefix}_Operated_Hours']`);
        if (operatedInput) operatedInput.value = window._currentDetailedReport[`${slot.prefix}_Operated_Hours`] || "";
      });
    });

    if (rowIndex === null && !window._currentDetailedReport.Position && !window._dailyGpsAutoRequested) {
      window._dailyGpsAutoRequested = true;
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(pos) {
            const coords = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
            window._currentDetailedReport.Position = coords;
            const positionInput = form.querySelector("[name='Position']");
            if (positionInput) positionInput.value = coords;
          },
          function() {},
          { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 },
        );
      }
    }

    _updateDailyExecutiveSummaryPanel();
    _updateDailyMaintenanceInsightsPanel();
  }

  function _renderDailyReportForm(rowIndex) {
    const modalBody = document.getElementById("daily-modal-body");
    const modalTitle = document.getElementById("daily-modal-title");
    const reportData = window._currentDetailedReport || {};
    const vesselField = DAILY_REPORT_GENERAL_FIELDS_FLAT.find(f => f.name === 'VesselName');
    if (vesselField) {
      vesselField.options = (currentVesselsData || []).map(v => v.VesselName || v.Nombre).filter(Boolean);
    }

    if (modalTitle) {
      modalTitle.innerHTML = `<span class="material-symbols-outlined">description</span> ${rowIndex !== null ? `EDITAR REPORTE ${reportData.ReportID || ''}` : 'REPORTE DIARIO DE OPERACIONES'}`;
    }

    let contentHtml = `<div style="padding:1.25rem; flex:1; overflow-y:auto; background: var(--bg-card);"><form id="daily-flat-form">`;
    contentHtml += `<div style="font-size:0.8rem; font-weight:800; color:var(--accent-cyan); letter-spacing:0.06em; margin-bottom:0.9rem; text-transform:uppercase;">General</div>`;
    contentHtml += `<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:1rem 1.25rem;">`;
    DAILY_REPORT_GENERAL_FIELDS_FLAT.forEach(field => {
      contentHtml += _renderDailyFlatField(field, reportData[field.name] || "");
    });
    contentHtml += `</div>`;
    contentHtml += _renderDailyMachineSection("Motores Principales", DAILY_REPORT_MAIN_SLOT_CONFIG, DAILY_REPORT_MACHINE_FIELDS, reportData);
    contentHtml += _renderDailyMachineSection("Generadores", DAILY_REPORT_GENERATOR_SLOT_CONFIG, DAILY_REPORT_GENERATOR_FIELDS, reportData);
    contentHtml += _renderDailyTankSection("Tanques de Combustible", DAILY_REPORT_FUEL_TANK_CONFIG, reportData);
    contentHtml += _renderDailyTankSection("Tanques de Aceite", DAILY_REPORT_OIL_TANK_CONFIG, reportData);
    contentHtml += `<div style="margin-top:1rem;">${_renderDailyFlatField({ name: 'Observaciones', label: 'Observaciones', type: 'textarea' }, reportData.Observaciones || '')}</div>`;
    contentHtml += _renderDailyExecutiveSummaryPanel(reportData);
    contentHtml += _renderDailyMaintenanceInsightsPanel(reportData);
    contentHtml += `</form></div>`;

    const footerHtml = `<div class="modal-footer" style="padding: 1rem 1.5rem; border-top: 1px solid var(--border-color); background: var(--bg-main); display:flex; justify-content:flex-end; gap:1rem; flex-shrink:0;">
                         <button class="btn-outline" onclick="closeDailyModal()">Cancelar</button>
                         <button class="btn-primary" id="btn-save-daily" onclick="submitDetailedDailyReport(event, ${rowIndex})" style="background:var(--accent-cyan); color: white; border: none;">ENVIAR REPORTE</button>
                       </div>`;

    modalBody.innerHTML = contentHtml + footerHtml;
    _bindDailyReportFormEvents(rowIndex);
  }

  function openDetailedDailyReportModal(rowIndex, headerData) {
    if (!currentVesselsData || currentVesselsData.length === 0 || !currentDailyData) {
      showToast("Sincronizando datos maestros...");
      Promise.all([
        cachedRun("apiGetVessels"),
        cachedRun("apiGetDailyReports")
      ]).then(([vessels, daily]) => {
        currentVesselsData = vessels || [];
        currentDailyData = daily || [];
        openDetailedDailyReportModal(rowIndex, headerData);
      }).catch(err => {
        showToast("Error al cargar datos maestros del reporte: " + (err.message || err), "error");
      });
      return;
    }

    const overlay = document.getElementById("daily-modal-overlay");
    const modalBody = document.getElementById("daily-modal-body");
    if (!overlay || !modalBody) return;
    overlay.classList.add("active");
    window._currentDetailedReportRowIndex = rowIndex;
    window._dailyExecutiveSummaryLoading = false;
    window._dailyExecutiveSummaryRequestId = 0;
    window._dailyMaintenanceInsightsLoading = false;
    window._dailyMaintenanceInsightsRequestId = 0;

    const baseData = rowIndex !== null ? Object.assign({}, headerData || {}) : {};
    window._currentDetailedReport = _buildDailyReportState(baseData, rowIndex !== null);
    _renderDailyReportForm(rowIndex);
  }

  function _getGPSPosition(event) {
    const btn = event.target.closest("button");
    if (btn) btn.innerText = "...";
    if (!navigator.geolocation) { alert("Geolocalización no soportada."); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const coords = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
        const input = document.querySelector("[name='Position']");
        if (input) input.value = coords;
        if (btn) btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:1.1rem;">location_on</span>';
        showToast("GPS: " + coords);
      },
      (err) => { alert("Error GPS: " + err.message); },
      { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
    );
  }

  function submitDetailedDailyReport(event, rowIndex) {
    if (event) event.preventDefault();
    _saveCurrentDailyReportForm(); 
    if ((rowIndex === null || rowIndex === undefined) && window._currentDetailedReportRowIndex !== null && window._currentDetailedReportRowIndex !== undefined) {
      rowIndex = window._currentDetailedReportRowIndex;
    }

    const btn = document.getElementById("btn-save-daily");
    if (!btn) return;
    btn.disabled = true;
    btn.innerText = "Procesando...";

    const payload = JSON.parse(JSON.stringify(window._currentDetailedReport));
    if (!payload.VesselName || !payload.Date) {
      alert("Error: Embarcación y Fecha son obligatorios.");
      btn.disabled = false; btn.innerText = "ENVIAR REPORTE";
      return;
    }

    if (!payload.Status || payload.Status === 'BORRADOR') payload.Status = 'ENVIADO';

    google.script.run
      .withSuccessHandler(res => {
        if (res.success) {
          if (res.summary) _applyDailyExecutiveSummary(res.summary);
          if (res.maintenanceInsights) _applyDailyMaintenanceInsights(res.maintenanceInsights);
          if (res.pdfUrl) window._currentDetailedReport.Report_PDF_Link = res.pdfUrl;
          clearCache();
          closeDailyModal();
          loadDailyReportsTable();
          showToast("Reporte Diario enviado y documentado");
          if (res.pdfUrl || res.pdfPreviewUrl) {
            openPdfPreviewModal(res.pdfPreviewUrl || res.pdfUrl, res.pdfName || payload.ReportID || 'PDF Reporte Diario');
          }
        } else {
          alert("Error: " + res.message);
          btn.disabled = false; btn.innerText = "Reintentar";
        }
      })
      .withFailureHandler(err => {
        alert("Error: " + (err.message || err));
        btn.disabled = false;
        btn.innerText = "Reintentar";
      })
      .apiSaveDeepDailyReport(rowIndex, payload, {
        finalizeReport: true,
        generatePdf: true,
        updateMachineHours: true,
        recomputeExecutiveSummary: false,
        recomputeMaintenanceInsights: false,
      });
  }

</script>
