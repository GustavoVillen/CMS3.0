<script>
  console.log("DIAGNÓSTICO: Ejecutando Script.html (23:30)...");
  // NUCLEAR DIAGNOSTIC & GLOBAL ERROR HANDLING
  window.onerror = function(msg, url, line, col, error) {
    const errorMsg = "🛑 ERROR GLOBAL: " + msg + "\nFila: " + line + "\nCol: " + col + "\nURL: " + url;
    console.error(errorMsg, error);
    // alert(errorMsg); // Removed as per user request
    return false;
  };
  window.onunhandledrejection = function(event) {
    const errorMsg = "🛑 PROMISE REJECTED: " + event.reason;
    console.error(errorMsg);
    // alert(errorMsg); // Removed as per user request
  };

  const AUTH_TOKEN_STORAGE_KEY = 'mercurio_auth_token';

  function getStoredAuthToken() {
    try {
      return String(localStorage.getItem(AUTH_TOKEN_STORAGE_KEY) || '').trim();
    } catch (e) {
      return '';
    }
  }

  function setStoredAuthToken(token) {
    try {
      const normalized = String(token || '').trim();
      if (normalized) localStorage.setItem(AUTH_TOKEN_STORAGE_KEY, normalized);
      else localStorage.removeItem(AUTH_TOKEN_STORAGE_KEY);
    } catch (e) {}
  }

  function initApp() {
    try {
      if (window.__FORCE_LOGIN__) {
        showLoginOverlay();
        return;
      }
      // Only Dark mode for this specific dashboard theme
      document.documentElement.setAttribute("data-theme", "dark");
      renderDashboardGrid();
      initFieldGuide();
      loadDashboardCharts();
    } catch (e) {
      console.error("Critical Initialization Error:", e);
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initApp);
  } else {
    initApp();
  }

  /* CACHE SYSTEM (Optimization for local performance) */
  window._cache = {};
  const CACHE_TTL = 5 * 60 * 1000; // 5 minutos

  /**
   * Wrapper para google.script.run que cachea los resultados
   * @param {string} method - Nombre de la función en el servidor
   * @param {Array} args - Argumentos para la función
   * @param {number} ttl - Tiempo de vida opcional
   */
  function cachedRun(method, args = [], ttl = CACHE_TTL, retryOptions = {}) {
    console.log(`cachedRun calling: ${method}`, args);
    // Basic Offline Detection
    if (!navigator.onLine) {
      console.warn("OFFLINE status detected");
      showToast("Sin conexión a internet. Usando datos locales.", "error");
      // If we have it in cache, return it even if expired, otherwise fail
      const cacheKey = method + JSON.stringify(args);
      if (window._cache[cacheKey]) {
        console.log("Returning cached data (offline)");
        return Promise.resolve(window._cache[cacheKey].data);
      }
      return Promise.reject(new Error("OFFLINE: No hay conexión ni datos en caché para esta operación."));
    }

    const cacheKey = method + JSON.stringify(args);
    const now = Date.now();

    if (window._cache[cacheKey] && (now - window._cache[cacheKey].timestamp < ttl)) {
      console.log(`Returning cached data for ${method}`);
      return Promise.resolve(window._cache[cacheKey].data);
    }

    return new Promise((resolve, reject) => {
      console.log(`Executing google.script.run for ${method}...`);
      google.script.run
        .withSuccessHandler(data => {
          console.log(`google.script.run SUCCESS: ${method}`);
          window._cache[cacheKey] = { data: data, timestamp: Date.now() };
          resolve(data);
        })
        .withFailureHandler(err => {
          console.error(`google.script.run FAILURE: ${method}`, err);
          const shouldRetryAuth = !retryOptions.retriedAfterAuth &&
            method !== 'apiResumeSession' &&
            method !== 'apiLogin' &&
            /Unauthorized: no authorized app user context|Sesión expirada|Unauthorized/i.test(String((err && err.message) || err || ''));

          if (shouldRetryAuth) {
            resumeSessionSilently()
              .then(() => cachedRun(method, args, ttl, { retriedAfterAuth: true }))
              .then(resolve)
              .catch(resumeErr => {
                showToast("Sesión expirada. Vuelve a ingresar.", "error");
                reject(resumeErr || err);
              });
            return;
          }

          showToast("Error de servidor: " + err.message, "error");
          reject(err);
        })
        [method](...args);
    });
  }

  /**
   * Limpia el caché para un método específico o todo el caché
   */
  function clearCache(method = null) {
    if (method) {
      Object.keys(window._cache).forEach(key => {
        if (key.startsWith(method)) delete window._cache[key];
      });
    } else {
      window._cache = {};
    }
  }

  function showToast(message, type = "success") {
    let toast = document.createElement("div");
    toast.style.position = "fixed";
    toast.style.bottom = "2rem";
    toast.style.right = "2rem";
    toast.style.padding = "0.75rem 1.5rem";
    toast.style.borderRadius = "var(--radius-md)";
    toast.style.background = type === "success" ? "var(--accent-green)" : "var(--accent-red)";
    toast.style.color = "white";
    toast.style.boxShadow = "0 10px 15px -3px rgba(0,0,0,0.3)";
    toast.style.zIndex = "3000";
    toast.style.fontSize = "0.85rem";
    toast.style.fontWeight = "600";
    toast.style.display = "flex";
    toast.style.alignItems = "center";
    toast.style.gap = "0.5rem";
    toast.style.opacity = "0";
    toast.style.transition = "opacity 0.3s ease";
    
    const icon = type === "success" ? "check_circle" : "error";
    toast.innerHTML = `<span class="material-symbols-outlined fs-sm">${icon}</span> ${message}`;
    
    document.body.appendChild(toast);
    setTimeout(() => toast.style.opacity = "1", 10);
    setTimeout(() => {
      toast.style.opacity = "0";
      setTimeout(() => toast.remove(), 300);
    }, 3000);
  }

  function showLoginOverlay() {
    document.documentElement.setAttribute("data-theme", "dark");
    const overlay = document.getElementById('login-overlay');
    if (overlay) overlay.style.display = 'flex';
  }

  function hideLoginOverlay() {
    const overlay = document.getElementById('login-overlay');
    if (overlay) overlay.style.display = 'none';
  }

  function refreshCurrentUserUI() {
    const userId = String(window.__CURRENT_USER_ID__ || '').trim();
    const role = String(window.__CURRENT_USER_ROLE__ || '').trim();
    const initialEl = document.getElementById('sidebar-user-initial');
    const headerInitialEl = document.getElementById('header-user-initial');
    const headerUserIdEl = document.getElementById('header-user-id');
    const headerRoleEl = document.getElementById('header-user-role');

    if (initialEl) initialEl.innerText = userId ? userId.charAt(0).toUpperCase() : 'N';
    if (headerInitialEl) headerInitialEl.innerText = userId ? userId.charAt(0).toUpperCase() : 'N';
    if (headerUserIdEl) headerUserIdEl.innerText = userId || '-';
    if (headerRoleEl) headerRoleEl.innerText = role || '-';
  }

  function parseAssignedVessels() {
    const values = [
      String(window.__CURRENT_USER_ASSIGNED_VESSEL__ || ''),
      String(window.__CURRENT_USER_ASSIGNED_VESSELS__ || '')
    ].join('|');

    return [...new Set(values
      .split(/[|,;]+/)
      .map(v => String(v || '').trim())
      .filter(Boolean))];
  }

  function shouldAutoLockSpareVessel() {
    const userId = String(window.__CURRENT_USER_ID__ || '').trim().toUpperCase();
    const role = String(window.__CURRENT_USER_ROLE__ || '').trim().toUpperCase();
    if (role === 'ADMIN' || userId === 'ADMIN' || userId === 'BARCAZAS') return false;
    return parseAssignedVessels().length === 1;
  }

  function submitInlineLogin() {
    const userId = document.getElementById('login-user-id')?.value.trim();
    const password = document.getElementById('login-password')?.value || '';
    const btn = document.getElementById('login-submit-btn');
    const error = document.getElementById('login-inline-error');

    if (error) error.textContent = '';
    if (!userId || !password) {
      if (error) error.textContent = 'Ingresá USER_ID y contraseña.';
      return;
    }

    if (btn) {
      btn.disabled = true;
      btn.textContent = 'Validando...';
    }

    google.script.run
      .withSuccessHandler((res) => {
        window.__FORCE_LOGIN__ = false;
        setStoredAuthToken(res && res.sessionToken);
        const userIdInput = document.getElementById('login-user-id');
        window.__CURRENT_USER_ID__ = (res && res.userId) ? String(res.userId).trim() : (userIdInput ? userIdInput.value.trim() : '');
        window.__CURRENT_USER_ROLE__ = (res && res.role) ? String(res.role).trim() : '';
        window.__CURRENT_USER_ASSIGNED_VESSEL__ = (res && res.assignedVessel) ? String(res.assignedVessel).trim() : '';
        window.__CURRENT_USER_ASSIGNED_VESSELS__ = (res && res.assignedVessels) ? String(res.assignedVessels).trim() : '';
        hideLoginOverlay();
        refreshCurrentUserUI();
        initApp();
      })
      .withFailureHandler(err => {
        if (error) error.textContent = (err && err.message) ? err.message : 'No se pudo iniciar sesión.';
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Ingresar';
        }
      })
      .apiLogin(userId, password);
  }

  function tryResumePersistentSession() {
    const sessionToken = getStoredAuthToken();
    if (!window.__FORCE_LOGIN__ || !sessionToken) return;

    const btn = document.getElementById('login-submit-btn');
    const error = document.getElementById('login-inline-error');
    if (error) error.textContent = '';
    if (btn) {
      btn.disabled = true;
      btn.textContent = 'Restaurando sesión...';
    }

    google.script.run
      .withSuccessHandler((res) => {
        window.__FORCE_LOGIN__ = false;
        window.__CURRENT_USER_ID__ = (res && res.userId) ? String(res.userId).trim() : '';
        window.__CURRENT_USER_ROLE__ = (res && res.role) ? String(res.role).trim() : '';
        window.__CURRENT_USER_ASSIGNED_VESSEL__ = (res && res.assignedVessel) ? String(res.assignedVessel).trim() : '';
        window.__CURRENT_USER_ASSIGNED_VESSELS__ = (res && res.assignedVessels) ? String(res.assignedVessels).trim() : '';
        hideLoginOverlay();
        refreshCurrentUserUI();
        initApp();
      })
      .withFailureHandler(() => {
        setStoredAuthToken('');
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Ingresar';
        }
      })
      .apiResumeSession(sessionToken);
  }

  function resumeSessionSilently() {
    const sessionToken = getStoredAuthToken();
    if (!sessionToken) {
      return Promise.reject(new Error('Sesión no disponible'));
    }

    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler((res) => {
          window.__FORCE_LOGIN__ = false;
          window.__CURRENT_USER_ID__ = (res && res.userId) ? String(res.userId).trim() : '';
          window.__CURRENT_USER_ROLE__ = (res && res.role) ? String(res.role).trim() : '';
          window.__CURRENT_USER_ASSIGNED_VESSEL__ = (res && res.assignedVessel) ? String(res.assignedVessel).trim() : '';
          window.__CURRENT_USER_ASSIGNED_VESSELS__ = (res && res.assignedVessels) ? String(res.assignedVessels).trim() : '';
          refreshCurrentUserUI();
          resolve(res);
        })
        .withFailureHandler((err) => {
          setStoredAuthToken('');
          reject(err);
        })
        .apiResumeSession(sessionToken);
    });
  }

  window.addEventListener('DOMContentLoaded', () => {
    refreshCurrentUserUI();
    const loginPassword = document.getElementById('login-password');
    const loginUserId = document.getElementById('login-user-id');
    if (loginPassword) {
      loginPassword.addEventListener('keydown', e => {
        if (e.key === 'Enter') submitInlineLogin();
      });
    }
    if (loginUserId) {
      loginUserId.addEventListener('keydown', e => {
        if (e.key === 'Enter') submitInlineLogin();
      });
    }

    tryResumePersistentSession();
  });

  function logoutApp() {
    const sessionToken = getStoredAuthToken();
    google.script.run
      .withSuccessHandler(() => {
        setStoredAuthToken('');
        window.location.reload();
      })
      .withFailureHandler(err => {
        showToast("Error al cerrar sesión: " + (err.message || err), "error");
      })
      .apiLogout(sessionToken);
  }

  /* FECHAS UTILIDADES */
  function formatDateUI(dateInput) {
    if (!dateInput || dateInput === "-" || dateInput === "null") return "-";

    // Si ya es un string con formato correcto, normalizar separadores
    if (typeof dateInput === 'string') {
      const dmy = dateInput.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
      if (dmy) return `${dmy[1].padStart(2, '0')}-${dmy[2].padStart(2, '0')}-${dmy[3]}`;

      const ymd = dateInput.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
      if (ymd) return `${ymd[3].padStart(2, '0')}-${ymd[2].padStart(2, '0')}-${ymd[1]}`;
    }

    let d = (dateInput instanceof Date) ? dateInput : new Date(dateInput);
    if (isNaN(d.getTime())) return dateInput;

    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const year = d.getFullYear();
    return `${day}-${month}-${year}`;
  }

  // Global state for Maintenance Plan filtering
  let currentMaintenancePlanStatusFilter = null;
  let currentMaintenanceSfiTextFilter = "";

  function filterMaintenancePlanByStatus(status) {
    if (currentMaintenancePlanStatusFilter === status) {
      currentMaintenancePlanStatusFilter = null; // Toggle off
    } else {
      currentMaintenancePlanStatusFilter = status;
    }
    renderMaintenancePlanTable();
  }

  function filterMaintenancePlanBySfiText(value) {
    const activeElement = document.activeElement;
    const cursorStart = activeElement && activeElement.selectionStart !== undefined ? activeElement.selectionStart : null;
    const cursorEnd = activeElement && activeElement.selectionEnd !== undefined ? activeElement.selectionEnd : null;
    currentMaintenanceSfiTextFilter = String(value || "").trim().toUpperCase();
    renderMaintenancePlanTable();

    window.requestAnimationFrame(() => {
      const input = document.getElementById("maintenance-sfi-filter-input");
      if (!input) return;
      input.focus();
      const nextPos = cursorStart === null ? input.value.length : Math.min(cursorStart, input.value.length);
      const nextEnd = cursorEnd === null ? nextPos : Math.min(cursorEnd, input.value.length);
      if (input.setSelectionRange) input.setSelectionRange(nextPos, nextEnd);
    });
  }

  function navigateToMaintenancePlanFilter(status) {
    currentMaintenancePlanStatusFilter = status;
    showModule('PLAN DE MANTENIMIENTO', true);
  }

  function _isMaintenanceDueNextWeek_(item) {
    const nextDateRaw = getVal(item, "Siguiente_Vencimiento_Fecha", "NextDate", "Siguiente_Fecha", "Vencimiento");
    const nextDate = parseDateManual(nextDateRaw);
    if (!nextDate) return false;

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    nextDate.setHours(0, 0, 0, 0);

    const diffDays = Math.ceil((nextDate - today) / (1000 * 60 * 60 * 24));
    return diffDays >= 0 && diffDays <= 7;
  }

  // Global state for Inspections filtering
  let currentInspectionsStatusFilter = null;

  function setInspectionsStatusFilter(status) {
    if (currentInspectionsStatusFilter === status) {
      currentInspectionsStatusFilter = null; // Toggle
    } else {
      currentInspectionsStatusFilter = status;
    }
    renderInspectionsTable();
  }

  function navigateToInspectionsFilter(status) {
    currentInspectionsStatusFilter = status;
    showModule('PLAN DE INSPECCIONES PERIÓDICAS', true);
  }

  function getInspectionStatus(item, today) {
    if (String(item?.Estado_Visible || '').trim()) {
      return String(item.Estado_Visible).trim().toUpperCase();
    }
    const nextDate = parseDateManual(item.Siguiente_Fecha);
    if (!nextDate) return "VALIDO";

    const localToday = new Date(today);
    localToday.setHours(0, 0, 0, 0);
    const localNext = new Date(nextDate);
    localNext.setHours(0, 0, 0, 0);

    let warningDays = 7;
    const lastDate = parseDateManual(item.Ultima_Fecha);
    if (lastDate && !isNaN(lastDate.getTime()) && !isNaN(localNext.getTime())) {
      const totalLifespanDays = Math.ceil((localNext.getTime() - lastDate.getTime()) / (1000 * 60 * 60 * 24));
      if (totalLifespanDays > 0) warningDays = totalLifespanDays * 0.20;
    }

    const diffDays = Math.ceil((localNext.getTime() - localToday.getTime()) / (1000 * 60 * 60 * 24));

    if (item.Frecuencia === "OCASIONAL") {
      return (item.Status === "FALLIDA") ? "VENCIDA" : "VALIDO";
    }

    if (diffDays < 0) return "VENCIDA";
    if (diffDays <= warningDays) return "PROXIMO VENCIMIENTO";
    return "VALIDO";
  }

  function getCertificateVisibleStatus(item) {
    if (String(item?.Estado_Visible || '').trim()) {
      return String(item.Estado_Visible).trim().toUpperCase();
    }

    if (item.Status === "CANCELADO" || item.Status === "INACTIVO") return String(item.Status).trim().toUpperCase();

    const eDate = parseDateManual(item.Fecha_Emision);
    const vDate = parseDateManual(item.Fecha_Vencimiento);
    const today = new Date();
    const diffDays = vDate ? Math.ceil((vDate - today) / 86400000) : 999;

    let warningDays = 30;
    if (eDate && vDate && !isNaN(eDate.getTime()) && !isNaN(vDate.getTime())) {
      const totalLifespanDays = Math.ceil((vDate - eDate) / 86400000);
      if (totalLifespanDays > 0) warningDays = totalLifespanDays * 0.20;
    }

    if (diffDays < 0) return "VENCIDO";
    if (diffDays <= warningDays) return "PROXIMO VENCIMIENTO";
    return "VALIDO";
  }

  function getDeferralVisibleStatus(item, daysLeft = null) {
    if (String(item?.Estado_Visible || '').trim()) {
      return String(item.Estado_Visible).trim().toUpperCase();
    }

    const normalizedStatus = normalizeStatus(item?.Status || 'REQUESTED');
    if (normalizedStatus === 'CLOSED') return 'CERRADO';
    if (normalizedStatus === 'REJECTED') return 'RECHAZADO';
    if (normalizedStatus === 'APPROVED') return 'APROBADO';
    if (normalizedStatus === 'REQUESTED') return 'SOLICITADO';
    if (normalizedStatus === 'ACTIVE') {
      if (daysLeft !== null && daysLeft < 0) return 'VENCIDO';
      return 'ACTIVO';
    }
    if (normalizedStatus === 'EXPIRED') return 'VENCIDO';
    return String(item?.Status || '-').trim().toUpperCase();
  }

  function parseDateManual(dateInput) {
    if (!dateInput || dateInput === "-") return null;
    let d = new Date(dateInput);
    if (!isNaN(d.getTime())) return d;

    const parts = dateInput.split(/[-/]/);
    if (parts.length === 3) {
      if (parts[0].length === 4) {
        // YYYY-MM-DD
        return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      }
      // DD-MM-YYYY
      return new Date(parseInt(parts[2], 10), parseInt(parts[1], 10) - 1, parseInt(parts[0], 10));
    }
    return null;
  }

  /**
   * Universal Date Normalizer (PROC-MAN-01 Compliance)
   */
  function normalizeDate(dateVal) {
    if (!dateVal || dateVal === "-" || dateVal === "null") return null;
    const d = parseDateManual(dateVal);
    if (!d || isNaN(d.getTime())) return null;
    return d;
  }

  // Helper para mapeo robusto de cabeceras (busca por coincidencia parcial o mayúsculas)
  const getVal = (obj, ...keys) => {
    if (!obj) return "-";
    const entryKeys = Object.keys(obj);
    for (const k of keys) {
      if (obj[k] !== undefined) return obj[k];
      const match = entryKeys.find(ek => ek.toString().toUpperCase().replace(/\s/g, "") === k.toUpperCase().replace(/\s/g, ""));
      if (match) return obj[match];
    }
    return "-";
  };

  function parseDateForInput(dateStr) {
    const d = parseDateManual(dateStr);
    if (!d) return "";
    let year = d.getFullYear();
    let month = String(d.getMonth() + 1).padStart(2, '0');
    let day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  /* CHARTS LOGIC */
  function loadDashboardCharts() {
    if (typeof google === "undefined" || !google.script) return;

    // Equipos Críticos
    cachedRun("apiGetInventory")
      .then(data => {
        currentInventoryData = data || [];
        renderCriticalPieChart(data);
      })
      .catch(error => {
        const el = document.getElementById("critical-pie-legend");
        if (el) el.innerHTML = `<div class="legend-item" style="color:var(--accent-red);">${error.message}</div>`;
      });

    // Repuestos Críticos
    cachedRun("apiGetSpares")
      .then(data => {
        currentSparesData = data || [];
        renderSparesPieChart(data);
      })
      .catch(error => {
        const el = document.getElementById("spares-pie-legend");
        if (el) el.innerHTML = `<div class="legend-item" style="color:var(--accent-red);">${error.message}</div>`;
      });

    // Precarga de Buques y Proveedores
    cachedRun("apiGetVessels").then(data => { currentVesselsData = data || []; });
    cachedRun("apiGetProveedores").then(data => { currentProveedoresData = data || []; });

    // Certificados Snapshot
    cachedRun("apiGetCertificates").then(data => {
      currentCertificatesData = data || [];
      updateCertificatesSnapshot(currentCertificatesData);
    });

    // Pedidos de Repuestos Snapshot
    cachedRun("apiGetSpareOrders").then(data => {
      currentSpareOrdersData = data || [];
      updateSpareOrdersSnapshot(currentSpareOrdersData);
    });

    // Inspecciones Periódicas
    cachedRun("apiGetInspections").then(data => {
      currentInspectionsData = data || [];
      renderInspectionsPieChart(data);
    }).catch(error => {
      const el = document.getElementById("inspections-pie-legend");
      if (el) el.innerHTML = `<div class="legend-item" style="color:var(--accent-red);">${error.message}</div>`;
    });

    // Estado Plan de Mantenimiento (Pie Chart)
    Promise.all([
      cachedRun("apiGetMaintenancePlan"),
      cachedRun("apiGetWorkOrders"),
      cachedRun("apiGetDailyReports"),
      cachedRun("apiGetVessels")
    ]).then(([planData, woData, dailyData, vesselsData]) => {
      currentMaintenancePlanData = planData || [];
      currentWorkOrdersData = woData || [];
      currentDailyData = dailyData || [];
      currentVesselsData = vesselsData || [];
      renderPlanPieChart(planData, woData, dailyData, vesselsData);
      renderWorkOrdersPieChart(woData);
    }).catch(err => {
      const lp = document.getElementById("plan-pie-legend");
      const woLegend = document.getElementById("work-orders-pie-legend");
      if (lp) lp.innerHTML = `<div class="legend-item" style="color:var(--accent-red);">${err.message}</div>`;
      if (woLegend) woLegend.innerHTML = `<div class="legend-item" style="color:var(--accent-red);">${err.message}</div>`;
    });
  }

  function updateCertificatesSnapshot(data) {
    const container = document.getElementById("snapshot-certificados");
    if (!container) return;
    if (!data || data.length === 0) {
      container.innerHTML = `<div style="text-align:center; padding: 1rem; color: var(--text-muted); font-size: 0.8rem;">Sin certificados</div>`;
      return;
    }

    let vencidos = 0;
    let proximos = 0;

    data.forEach(item => {
      if (item.Status === "CANCELADO" || item.Status === "INACTIVO") return; // Ignorar si aplica
      const visibleStatus = getCertificateVisibleStatus(item);
      if (visibleStatus === 'VENCIDO') {
        vencidos++;
      } else if (visibleStatus === 'PROXIMO VENCIMIENTO') {
        proximos++;
      }
    });

    let html = '';
    if (vencidos > 0) {
      html += `<div onclick="navigateToCertificatesFilter('VENCIDO')" style="display:flex; justify-content:space-between; align-items:center; background: rgba(239, 68, 68, 0.05); border: 1px solid rgba(239, 68, 68, 0.4); padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; transition: var(--transition);" onmouseover="this.style.transform='translateX(5px)'" onmouseout="this.style.transform='none'">
                <span style="color: var(--text-main); font-weight: 600; font-size: 0.8rem;"><span class="dot-red"></span> VENCIDOS</span>

  function renderCriticalPieChart(data) {
    if (!data || !data.length) return;

    const criticalEqs = data.filter(item => {
      let crit = String(item.Criticidad || "").toUpperCase().trim();
      return crit.includes("A") || crit.includes("B");
    });

    let total = criticalEqs.length;
    let legendContainer = document.getElementById("critical-pie-legend");
    let chartMock = document.getElementById("critical-pie-chart");

    if (!legendContainer || !chartMock) return;

    if (total === 0) {
      legendContainer.innerHTML = `<div class="legend-item">0 equipos críticos A/B registrados</div>`;
      chartMock.style.background = `var(--surface-color)`;
      return;
    }

    let statusCounts = {};
    criticalEqs.forEach(eq => {
      // Usamos el campo Status del inventario. Quitamos tildes para evitar errores.
      let rawSt = String(eq.Status || eq.Estado || "N/A");
      let st = rawSt.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim();
      statusCounts[st] = (statusCounts[st] || 0) + 1;
    });

    let legendHtml = "";
    let gradientParts = [];
    let currentPct = 0;

    const statusColors = {
      "OPERATIVO": "var(--accent-green)",
      "REP.TEMP": "var(--accent-yellow)",
      "FALLA": "var(--accent-red)",
      "PREVENTIVO": "var(--accent-yellow)",
      "N/A": "var(--text-muted)"
    };
    const fallbackColors = ["var(--accent-blue)", "var(--accent-purple)", "var(--accent-orange)"];
    let fallbackIdx = 0;

    Object.keys(statusCounts).forEach((st, idx) => {
      let count = statusCounts[st];
      let realPct = (count / total) * 100;
      let displayPct = Math.round(realPct);

      let color = statusColors[st];
      if (!color) {
        color = fallbackColors[fallbackIdx % fallbackColors.length];
        fallbackIdx++;
      }

      legendHtml += `<div class="legend-item" onclick="filterInventoryByStatus('${st}')" style="cursor:pointer; transition: var(--transition);" onmouseover="this.style.transform='translateX(5px)'" onmouseout="this.style.transform='none'">
                       <span class="badge" style="background:${color}; box-shadow: 0 0 5px ${color};">${displayPct}%</span> ${st}
                     </div>`;

      let nextPct = currentPct + realPct;
      gradientParts.push(`${color} ${currentPct}% ${nextPct}%`);
      currentPct = nextPct;
    });

    legendHtml += `<div class="legend-caption">TOTAL A/B: ${total} EQUIPOS</div>`;

    chartMock.style.background = `conic-gradient(${gradientParts.join(', ')})`;
    legendContainer.innerHTML = legendHtml;
  }

  function renderPlanPieChart(planData, woData, dailyData, vesselsData) {
    if (!planData || !planData.length) return;
    const plan = planData || [];
    const wos = woData || [];
    const daily = dailyData || [];
    const vessels = vesselsData || [];

    let total = plan.length;
    let legendContainer = document.getElementById("plan-pie-legend");
    let chartMock = document.getElementById("plan-pie-chart");
    if (!legendContainer || !chartMock) return;

    // 1. Calculate latest accumulated hours per vessel and per specific mapped SFI
    const latestHoursByVessel = {};
    const latestHoursBySFI = {}; 

    if (daily && daily.length > 0) {
      daily.forEach(d => {
        const v = (getVal(d, "VesselName", "Embarcacion") || "").toString().toUpperCase();
        const dateObj = parseDateManual(getVal(d, "Date", "Fecha")) || new Date(2000, 0, 1);
        const machinePrefixes = ["MP1", "MP2", "MP3", "MP4", "MG1", "MG2", "MG3", "MG4"];
        const totalHours = machinePrefixes.reduce((sum, prefix) => sum + (parseFloat(getVal(d, `${prefix}_Current_Hours`)) || 0), 0);
        if (!latestHoursByVessel[v] || dateObj > latestHoursByVessel[v].date) {
          latestHoursByVessel[v] = { hours: totalHours, date: dateObj };
        }
        machinePrefixes.forEach(prefix => {
          const mappedSfi = getVal(d, `${prefix}_SFI`);
          const hours = getVal(d, `${prefix}_Current_Hours`);
          if (mappedSfi && mappedSfi !== "-" && mappedSfi !== "undefined") {
            const key = `${v}_${mappedSfi.toString().trim().toUpperCase()}`;
            const hNum = parseFloat(hours) || 0;
            if (!latestHoursBySFI[key] || dateObj > latestHoursBySFI[key].date) {
              latestHoursBySFI[key] = { hours: hNum, date: dateObj };
            }
          }
        });
      });
    }

    let statusCounts = { "VALIDO": 0, "EN PROCESO": 0, "VENCIDA": 0 };

    plan.forEach(item => {
      const status = normalizeMaintenancePlanDisplayStatus(getVal(item, "Status", "Estado"));
      statusCounts[status] = (statusCounts[status] || 0) + 1;
    });

    let legendHtml = "";
    let gradientParts = [];
    let currentPct = 0;

    const colors = {
      "VALIDO": "var(--accent-green)",
      "EN PROCESO": "var(--accent-yellow)",
      "VENCIDA": "var(--accent-red)"
    };

    ["VENCIDA", "EN PROCESO", "VALIDO"].forEach(st => {
      let count = statusCounts[st];
      if (count === 0 && total > 0) return;

      let realPct = (count / total) * 100;
      let displayPct = Math.round(realPct);
      let color = colors[st];

      legendHtml += `<div class="legend-item" onclick="navigateToMaintenancePlanFilter('${st}')" style="cursor:pointer; transition: var(--transition);" onmouseover="this.style.transform='translateX(5px)'" onmouseout="this.style.transform='none'">
                       <span class="badge" style="background:${color}; box-shadow: 0 0 5px ${color};">${displayPct}%</span> ${st}
                     </div>`;

      if (realPct > 0) {
        let nextPct = currentPct + realPct;
        gradientParts.push(`${color} ${currentPct}% ${nextPct}%`);
        currentPct = nextPct;
      }
    });

    legendHtml += `<div class="legend-caption">TOTAL: ${total} TAREAS</div>`;

    if (gradientParts.length > 0) {
      chartMock.style.background = `conic-gradient(${gradientParts.join(', ')})`;
    } else {
      chartMock.style.background = `var(--bg-panel)`;
    }
    legendContainer.innerHTML = legendHtml;
  }

  function getWorkOrderDueDateInfo(workOrder, fallbackDate, fallbackTolerance) {
    const dueDate = workOrder
      ? (workOrder.Fecha_Vencimiento_OT || workOrder.PlannedDate || "")
      : (fallbackDate || "");
    const tolerance = workOrder
      ? (String(workOrder.Fecha_Vencimiento_OT || "").trim() ? 0 : workOrder.Ventana_Tolerancia)
      : fallbackTolerance;
    return { dueDate, tolerance };
  }

  function normalizeMaintenancePlanDisplayStatus(raw) {
    const upper = String(raw || '').trim().toUpperCase();
    if (upper === 'IN_PROGRESS' || upper === 'EN PROCESO') return 'EN PROCESO';
    if (upper === 'VENCIDA') return 'VENCIDA';
    return 'VALIDO';
  }

  function normalizeWorkOrderDisplayStatusValue(raw) {
    const upper = String(raw || '').trim().toUpperCase();
    const spanishMap = {
      'DEF PEND.': 'PENDIENTE DE DIFERIMIENTO',
      'PEND. VERIFICACION': 'PENDIENTE DE VERIFICACION',
      'PEND. VERIFICACIÓN': 'PENDIENTE DE VERIFICACION',
      'VENCIDA': 'VENCIDA',
      'ABIERTA': 'ABIERTA',
      'ABIERTO': 'ABIERTA',
      'PLANIFICADA': 'PLANIFICADA',
      'DIFERIDA': 'DIFERIDA',
      'DIFERIDO': 'DIFERIDA',
      'PENDIENTE DE DIFERIMIENTO': 'PENDIENTE DE DIFERIMIENTO',
      'EN PROCESO': 'EN PROCESO',
      'EN ESPERA': 'EN ESPERA',
      'PENDIENTE DE VERIFICACION': 'PENDIENTE DE VERIFICACION',
      'CERRADA': 'CERRADA',
      'CERRADO': 'CERRADA',
      'CANCELADA': 'CANCELADA',
      'EN REPARACION': 'EN REPARACION',
      'EN REPARACIÓN': 'EN REPARACION',
    };
    if (spanishMap[upper]) return spanishMap[upper];

    const canon = normalizeStatus(raw);
    const canonMap = {
      'OPEN': 'ABIERTA',
      'PLANNED': 'PLANIFICADA',
      'IN_PROGRESS': 'EN PROCESO',
      'IN_REPAIR': 'EN REPARACION',
      'DEFERRED': 'DIFERIDA',
      'CLOSED': 'CERRADA',
      'CANCELLED': 'CANCELADA',
      'WAITING_SPARES': 'EN ESPERA',
      'WAITING_VENDOR': 'EN ESPERA',
      'PENDING_VERIFICATION': 'PENDIENTE DE VERIFICACION',
    };
    return canonMap[canon] || upper;
  }

  function workOrderDisplayStatusBadgeClass(displayStatus) {
    const normalized = normalizeWorkOrderDisplayStatusValue(displayStatus);
    const map = {
      'VENCIDA': 'tb-red',
      'ABIERTA': 'tb-red',
      'PLANIFICADA': 'tb-blue',
      'DIFERIDA': 'tb-yellow',
      'PENDIENTE DE DIFERIMIENTO': 'tb-yellow',
      'EN PROCESO': 'tb-cyan',
      'EN REPARACION': 'tb-cyan',
      'EN ESPERA': 'tb-yellow',
      'PENDIENTE DE VERIFICACION': 'tb-yellow',
      'CERRADA': 'tb-green',
      'CANCELADA': 'tb-blue'
    };
    return map[normalized] || 'tb-blue';
  }

  function getWorkOrderDeferralDisplayState(workOrder) {
    if (!workOrder || typeof workOrder !== 'object') return null;

    const normalizedStatus = normalizeStatus(workOrder.Status || '');
    const authStatus = String(workOrder.Deferral_Autorizacion_Status || '').trim().toUpperCase();
    const requiresDeferral = String(workOrder.Deferral_Required || 'No').trim() === 'Sí';

    if (normalizedStatus === 'CLOSED' || normalizedStatus === 'CANCELLED') return null;

    if (normalizedStatus === 'DEFERRED' || authStatus === 'AUTORIZADO') {
      return { key: 'DIFERIDA', label: 'DIFERIDA', badgeClass: 'tb-yellow' };
    }

    if (requiresDeferral && authStatus === 'PENDIENTE') {
      return { key: 'PENDIENTE DE DIFERIMIENTO', label: 'PENDIENTE DE DIFERIMIENTO', badgeClass: 'tb-yellow' };
    }

    return null;
  }

  function getWorkOrderDisplayStatusText(workOrderOrStatus, plannedDate, toleranceDays) {
    if (typeof workOrderOrStatus === 'object' && workOrderOrStatus !== null) {
      if (String(workOrderOrStatus.Estado_Visible || '').trim()) {
        return normalizeWorkOrderDisplayStatusValue(workOrderOrStatus.Estado_Visible);
      }
      return normalizeWorkOrderDisplayStatusValue(workOrderOrStatus.Status || '');
    }
    const normalizedVisibleStatus = normalizeWorkOrderDisplayStatusValue(workOrderOrStatus);
    return normalizedVisibleStatus || statusLabel(workOrderOrStatus).toUpperCase();
  }

  function getWorkOrderDisplayStatusBadgeClass(workOrderOrStatus) {
    if (typeof workOrderOrStatus === 'object' && workOrderOrStatus !== null) {
      if (String(workOrderOrStatus.Estado_Visible || '').trim()) {
        return workOrderDisplayStatusBadgeClass(workOrderOrStatus.Estado_Visible);
      }
      return workOrderDisplayStatusBadgeClass(normalizeWorkOrderDisplayStatusValue(workOrderOrStatus.Status || ''));
    }
    const normalizedVisibleStatus = normalizeWorkOrderDisplayStatusValue(workOrderOrStatus);
    return normalizedVisibleStatus ? workOrderDisplayStatusBadgeClass(normalizedVisibleStatus) : statusBadgeClass(workOrderOrStatus);
  }

  function getWorkOrderChartStatus(workOrderOrStatus, plannedDate, toleranceDays) {
    const workOrder = typeof workOrderOrStatus === 'object' && workOrderOrStatus !== null
      ? workOrderOrStatus
      : null;
    if (workOrder && String(workOrder.Estado_Visible || '').trim()) {
      return normalizeWorkOrderDisplayStatusValue(workOrder.Estado_Visible);
    }
    const rawStatus = workOrder ? workOrder.Status : workOrderOrStatus;
    return normalizeWorkOrderDisplayStatusValue(rawStatus || 'OPEN');
  }

  function renderSparePickerList(query, vesselName) {
    const resultsContainer = document.getElementById("spare-picker-results");
    if (!resultsContainer) return;
    
    const filtered = currentSparesData.filter(s => {
      const matchVessel = s.VesselName === vesselName;
      const matchStock = (parseFloat(s.Stock_Actual) || 0) >= 1;
      const matchQuery = s.Nombre_Funcional.toUpperCase().includes(query.toUpperCase()) ||
                         s.SKU.toUpperCase().includes(query.toUpperCase());
      return matchVessel && matchStock && matchQuery;
    }).slice(0, 20);

    if (filtered.length === 0) {
      resultsContainer.innerHTML = `<div style="text-align:center; padding: 2rem; color: var(--text-muted); font-size: 0.85rem;">No se encontraron repuestos con stock para esta embarcación.</div>`;
      return;
    }

    resultsContainer.innerHTML = filtered.map(s => `
      <div class="spare-item-row">
        <div class="spare-item-info">
          <div class="spare-item-name">${s.Nombre_Funcional}</div>
          <div class="spare-item-sku">${s.SKU}</div>
          <div class="spare-item-stock">Stock: <b>${s.Stock_Actual}</b> ${s.Unidad || 'un.'}</div>
        </div>
        <div class="spare-item-actions">
          <input type="number" class="form-control spare-qty-input" placeholder="0" min="0" max="${s.Stock_Actual}" data-sku="${s.SKU}" data-name="${s.Nombre_Funcional}">
          <span style="font-size: 0.75rem; color: var(--text-muted);">${s.Unidad || 'un.'}</span>
        </div>
      </div>
    `).join("");
  }

  function confirmSpareUsage() {
    const inputs = document.querySelectorAll(".spare-qty-input");
    const textarea = document.getElementById("field-Repuestos_Consumidos");
    if (!textarea) return;

    let spareStrings = [];
    let currentVal = textarea.value.trim();
    
    // Si ya hay contenido, tratamos de parsearlo o simplemente agregamos al final
    // Según el req: "VP-KIT-BOMBA/1; VP-IMPULSOR/2"
    
    inputs.forEach(input => {
      const qty = parseFloat(input.value);
      if (qty > 0) {
        const sku = input.getAttribute("data-sku");
        spareStrings.push(`${sku}/${qty}`);
      }
    });

    if (spareStrings.length === 0) {
      document.getElementById('spare-picker-overlay').remove();
      return;
    }

    const newSparesStr = spareStrings.join("; ");
    textarea.value = currentVal ? (currentVal.endsWith(";") ? currentVal + " " + newSparesStr : currentVal + "; " + newSparesStr) : newSparesStr;
    
    document.getElementById('spare-picker-overlay').remove();
    showToast("Repuestos agregados al registro.");
  }

  function initFieldGuide() {
    const guideText = document.getElementById("guide-text");
    document.addEventListener("mouseover", (e) => {
      let target = e.target;
      let info = null;

      while (target && target !== document.body) {
        // Buscar por ID, Name (Inputs), Clases o Texto
        if (target.id && GUIDE_DB[target.id]) { info = GUIDE_DB[target.id]; break; }
        if (target.name && GUIDE_DB[target.name]) { info = GUIDE_DB[target.name]; break; }
        if (target.classList) {
          for (let cls of target.classList) {
            if (GUIDE_DB[cls]) { info = GUIDE_DB[cls]; break; }
          }
        }
        if (target.innerText && GUIDE_DB[target.innerText.trim()]) {
          info = GUIDE_DB[target.innerText.trim()];
          break;
        }
        target = target.parentElement;
      }

      if (info) {
        guideText.innerHTML = info;
        guideText.style.color = "var(--text-main)";
        guideText.parentElement.style.borderColor = "var(--accent-orange)";
      } else {
        guideText.innerHTML = "Pase el mouse sobre un elemento para obtener información y ejemplos...";
        guideText.style.color = "var(--text-muted)";
        guideText.parentElement.style.borderColor = "var(--border-color)";
      }
    });
  }

  function areViewStatesEqual(a, b) {
    if (!a || !b) return false;
    return a.type === b.type && a.moduleName === b.moduleName;
  }

  function pushCurrentViewToHistory(nextState) {
    if (!currentViewState || areViewStatesEqual(currentViewState, nextState)) return;
    const lastState = viewHistoryStack[viewHistoryStack.length - 1];
    if (areViewStatesEqual(lastState, currentViewState)) return;
    viewHistoryStack.push({ ...currentViewState });
  }

  function closeCurrentView() {
    const previousState = viewHistoryStack.pop();
    if (!previousState || previousState.type === "dashboard") {
      showDashboard(true);
      return;
    }
    if (previousState.type === "route") {
      showVoyageRouteView(true);
      return;
    }
    showModule(previousState.moduleName, true, true);
  }

  function filterVesselsTable() {
    const filterValue = document.getElementById("vessel-filter-vessels").value;
    const container = document.getElementById("vessels-table-container");

    let filteredData = filterValue === "" ? currentVesselsData : currentVesselsData.filter(v => v.VesselName === filterValue);

    if (filteredData.length === 0) {
      container.innerHTML = `<div style="text-align:center; padding: 2rem; display:flex; flex-direction:column; align-items:center; gap:1rem;"><p style="color:var(--text-muted); margin:0;">No existen embarcaciones que coincidan.</p><button class="btn-primary" onclick="openVesselModal()" style="display:flex; align-items:center; gap:0.5rem;"><span class="material-symbols-outlined fs-sm">add</span>AGREGAR EMBARCACIÓN</button></div>`;
      return;
    }

    let html = `<div style="width:100%; overflow-x:auto;"><table class="data-table" style="min-width: 1200px;"><thead><tr><th>NOMBRE DE LA EMBARCACIÓN</th><th>TIPO</th><th>MATRÍCULA</th><th>MP CONFIG.</th><th>MG CONFIG.</th><th>TK CONFIG.</th><th>ESTADO</th></tr></thead><tbody>`;
    filteredData.forEach(item => {
      let st = (item.Status || "").toLowerCase();
      let statusClass = st.includes("activo") ? "tb-green" : "tb-red";
      const mpSummary = [item.MP1_Equipment, item.MP2_Equipment, item.MP3_Equipment, item.MP4_Equipment].filter(Boolean).join(", ") || "-";
      const mgSummary = [item.MG1_Equipment, item.MG2_Equipment, item.MG3_Equipment, item.MG4_Equipment].filter(Boolean).join(", ") || "-";
      const tkSummary = [item.TK_COMB_1_Equipment, item.TK_COMB_2_Equipment, item.TK_COMB_3_Equipment, item.TK_ACEITE_1_Equipment, item.TK_ACEITE_2_Equipment, item.TK_ACEITE_3_Equipment].filter(Boolean).join(", ") || "-";
      html += `<tr onclick="openGeneralModal(${item._rowIndex}, 'FLOTA')" style="cursor: pointer;">
                <td style="font-weight: 700; color: var(--text-main);"><div>${item.VesselName || "-"}</div><div style="font-size:0.72rem; color: var(--text-muted);">COD: ${item.Codigo_Embarcacion || "-"}</div></td>
                <td style="color: var(--text-muted);">${item.Tipo || "-"}</td>
                <td>${item.Matricula || "-"}</td>
                <td style="font-size:0.78rem; color: var(--text-muted);">${mpSummary}</td>
                <td style="font-size:0.78rem; color: var(--text-muted);">${mgSummary}</td>
                <td style="font-size:0.78rem; color: var(--text-muted);">${tkSummary}</td>
                <td><span class="table-badge ${statusClass}">${item.Status || "N/A"}</span></td>
              </tr>`;
    });
    html += `</tbody></table></div>`;
    container.innerHTML = html;
  }

  function normalizeInventoryStatusKey(value) {
    return String(value || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^A-Z0-9]/gi, "")
      .toUpperCase()
      .trim();
  }

  function normalizeInventorySfiMatchKey(value) {
    const raw = String(value || "").trim().toUpperCase();
    if (!raw) return "";
    const match = raw.match(/^(\d{3}(?:\.\d+[A-Z0-9]*)?)/);
    if (match) return match[1];
    return raw.split(/\s|-|\//)[0].replace(/[^0-9A-Z.]/g, "");
  }

  function deriveInventoryStatusFromDefects(inventoryRows, defectRows) {
    const openStatusByAsset = new Map();
    const historyByAsset = new Set();

    (defectRows || []).forEach(item => {
      const vesselKey = normalizeInventoryStatusKey(item.Embarcacion || item.VesselName);
      const sfiKey = normalizeInventorySfiMatchKey(item.SFI);
      if (!sfiKey) return;
      const assetKey = `${vesselKey}||${sfiKey}`;
      historyByAsset.add(assetKey);

      const defectRecordStatus = normalizeStatus(item.Status || 'OPEN');
      if (["CLOSED", "REJECTED", "CANCELLED"].includes(defectRecordStatus)) return;

      const operationalState = normalizeOperationalStateValue(item.Estado_Operativo || "");
      const mappedStatus = operationalState === "REP.TEMP"
        ? "REP.TEMP"
        : (operationalState === "OPERATIVO" ? "OPERATIVO" : "FALLA");

      if (mappedStatus === "OPERATIVO") return;

      const currentStatus = openStatusByAsset.get(assetKey);
      if (mappedStatus === "FALLA" || !currentStatus) {
        openStatusByAsset.set(assetKey, mappedStatus);
      }
    });

    return (inventoryRows || []).map(item => {
      const cloned = Object.assign({}, item);
      const assetKey = `${normalizeInventoryStatusKey(item.VesselName)}||${normalizeInventorySfiMatchKey(item.SFI)}`;
      const openStatus = openStatusByAsset.get(assetKey);
      if (openStatus) {
        cloned.Status = openStatus;
      } else if (historyByAsset.has(assetKey)) {
        const currentStatus = normalizeOperationalStateValue(item.Status || "");
        if (currentStatus === "FALLA" || currentStatus === "REP.TEMP") {
          cloned.Status = "OPERATIVO";
        }
      }
      return cloned;
    });
  }

  function renderInventory(data, defects = currentDefectData) {
    currentDefectData = defects || currentDefectData || [];
    currentInventoryData = deriveInventoryStatusFromDefects(data || [], currentDefectData);
    currentSFIFilter = null; // Reset filter on reload
    populateVesselFilter("vessel-filter-inventory", currentInventoryData, "VesselName");
    filterInventoryTable();
  }

  function setSFIFilter(group) {
    currentSFIFilter = group;
    // Actualizar UI de botones
    const btns = document.querySelectorAll(".btn-sfi-grp");
    btns.forEach(b => b.classList.remove("active"));

    if (group === null) {
      document.getElementById("btn-sfi-all").classList.add("active");
    } else {
      if (group === 'EX') {
        const exBtn = document.getElementById('btn-sfi-ex');
        if (exBtn) exBtn.classList.add("active");
      } else {
        btns.forEach(b => {
          if (b.innerText === "G" + group) b.classList.add("active");
        });
      }
    }
    filterInventoryTable();
  }

  function filterInventoryTable() {
    const vesselFilter = document.getElementById("vessel-filter-inventory").value;

    // Si estamos en módulos específicos, delegamos a su renderizador
    if (currentActiveModule === "INVENTARIO_SPARES") {
      renderSparesTable();
      return;
    }
    if (currentActiveModule === "SPARE_ORDERS") {
      renderSpareOrdersTable();
      return;
    }
    if (currentActiveModule === "INSPECTIONS_PLAN") {
      renderInspectionsTable();
      return;
    }
    if (currentActiveModule === "INSPECTIONS_LOG") {
      loadInspectionsLogData({ force: false });
      return;
    }

    const container = document.getElementById("inventory-table-container");

    let filteredData = currentInventoryData;

    // Filtro por Barco
    if (vesselFilter !== "") {
      filteredData = filteredData.filter(i => i.VesselName === vesselFilter);
    }

    // Filtro por Grupo SFI (primer dígito) o Equipos EX
    if (currentSFIFilter !== null) {
      if (currentSFIFilter === 'EX') {
        filteredData = filteredData.filter(i => {
          const isEx = String(i.Es_Equipo_Ex || "").toUpperCase().trim();
          return isEx === "SI";
        });
      } else {
        filteredData = filteredData.filter(i => {
          const sfiStr = String(i.SFI || "");
          return sfiStr.startsWith(currentSFIFilter);
        });
      }
    }

    // Filtro por Estado (desde el gráfico de Equipos Críticos)
    if (currentInventoryStatusFilter !== null) {
      const searchSt = currentInventoryStatusFilter.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim();
      filteredData = filteredData.filter(i => {
        let st = String(i.Status || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim();
        return st === searchSt;
      });
    }

    // Ordenar por SFI (Mayor a Menor)
    filteredData.sort((a, b) => {
      const sfiA = (a.SFI || "").toString();
      const sfiB = (b.SFI || "").toString();
      return sfiB.localeCompare(sfiA);
    });

    // Filtros Especiales por Módulo
    if (currentActiveModule === "INVENTARIO_CRITICAL") {
      filteredData = filteredData.filter(i => {
        const c = (i.Criticidad || "").toUpperCase();
        return c === "A" || c === "B";
      });
    } else if (currentActiveModule === "INVENTARIO_SPARES") {
      filteredData = filteredData.filter(i => (i.Repuestos_Criticos_Stock || "").trim() !== "");
    }

    if (filteredData.length === 0) {
      container.innerHTML = `<div style="text-align:center; padding: 2rem; display:flex; flex-direction:column; align-items:center; gap:1rem;"><p style="color:var(--text-muted); margin:0;">Sin registros que coincidan con los criterios de este módulo.</p><button class="btn-primary" onclick="openInventoryModal()" style="display:flex; align-items:center; gap:0.5rem; background:var(--accent-orange);"><span class="material-symbols-outlined fs-sm">add_circle</span>REGISTRAR NUEVO INVENTARIO</button></div>`;
      return;
    }

    let html = `<table class="data-table">
                  <thead>
                    <tr>
                      <th>SFI</th>
                      <th>NOMBRE FUNCIONAL</th>
                      <th>VESSEL</th>
                      <th>CRITICIDAD</th>
                      <th>ESTADO</th>
                    </tr>
                  </thead>

  function getSpareManagementStatus(stockValue, minValue) {
    const stock = parseFloat(stockValue);
    const min = parseFloat(minValue);
    const safeStock = isNaN(stock) ? 0 : stock;
    const safeMin = isNaN(min) ? 0 : min;

    if (safeStock === 0) return "ATENCION!";
    if (safeStock < safeMin) return "CRITICO";
    if (safeStock === safeMin) return "BAJO. Hacer Solicitud.";
    return "OK";
  }

  function normalizeSpareStatusKey(status) {
    return String(status || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[.!]/g, "")
      .toUpperCase()
      .trim();
  }

  function parseLeadTimeParts(rawValue) {
    const raw = String(rawValue || "").trim();
    const match = raw.match(/^(\d+(?:[\.,]\d+)?)\s*(SEMANA|SEMANAS|MES|MESES)?$/i);
    if (!match) return { amount: raw, unit: "SEMANAS" };
    const amount = String(match[1] || "").replace(',', '.');
    const unitRaw = String(match[2] || "SEMANAS").toUpperCase();
    const unit = (unitRaw === "MES" || unitRaw === "MESES") ? "MESES" : "SEMANAS";
    return { amount, unit };
  }

  function composeLeadTimeValue(amount, unit) {
    const cleanAmount = String(amount || "").trim();
    const cleanUnit = String(unit || "SEMANAS").trim();
    if (!cleanAmount) return "";
    return `${cleanAmount} ${cleanUnit.toLowerCase()}`;
  }

  function renderSparesTable() {
    const container = document.getElementById("inventory-table-container");
    const vFilter = document.getElementById("vessel-filter-inventory").value;

    let filtered = currentSparesData;
    if (vFilter && vFilter !== "") {
      const searchVal = vFilter.trim().toUpperCase();
      filtered = filtered.filter(d => {
        const val = (d.VesselName || "").toString().trim().toUpperCase();
        return val === searchVal;
      });
    }

    // Filtro por Grupo SFI (G0-G9) o Equipos EX (Proc-Man-11 Re-implementation)
    if (typeof currentSFIFilter !== 'undefined' && currentSFIFilter !== null) {
      if (currentSFIFilter === 'EX') {
        filtered = filtered.filter(i => {
          const isEx = String(i["EX (Si/No)"] || i.Es_Equipo_Ex || "").toUpperCase().trim();
          return isEx === "SI";
        });
      } else {
        filtered = filtered.filter(i => {
          const sfiStr = String(i.SFI || "");
          return sfiStr.startsWith(currentSFIFilter);
        });
      }
    }

    if (currentSparesStatusFilter) {
      const searchSt = normalizeSpareStatusKey(currentSparesStatusFilter);
      filtered = filtered.filter(item => {
        let st = normalizeSpareStatusKey(getSpareManagementStatus(item.Stock_Actual, item.MIN));

  function normalizeSmartText(value) {
    return String(value || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .replace(/[^a-z0-9\s]/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function normalizeOperationalStateValue(value) {
    const normalized = String(value || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .trim()
      .toUpperCase();

    if (!normalized) return "";
    if (normalized.includes("OPERAT")) return "OPERATIVO";
    if (normalized.includes("REP.TEMP") || normalized.includes("REPARACION") || normalized.includes("TEMP") || normalized.includes("RESTRICC")) return "REP.TEMP";
    if (normalized.includes("FUERA DE USO") || normalized.includes("FUERA DE SERVICIO") || normalized.includes("NO-GO") || normalized.includes("NOGO") || normalized.includes("FALLA")) return "FUERA DE USO";
    return normalized;
  }

  function normalizeOperationalStateForStorage(value) {
    const normalized = normalizeOperationalStateValue(value);
    if (normalized === "FUERA DE USO") return "FALLA";
    return normalized;
  }

  function getOperationalStateBadgeMeta(value) {
    const normalized = normalizeOperationalStateValue(value) || "FUERA DE USO";
    if (normalized === "OPERATIVO") return { label: "OPERATIVO", badgeClass: "tb-green" };
    if (normalized === "REP.TEMP") return { label: "REP.TEMP", badgeClass: "tb-yellow" };
    return { label: "FUERA DE USO", badgeClass: "tb-red" };
  }

  function escapeInlineHtml(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function tokenizeSmartText(value) {
    return normalizeSmartText(value)
      .split(" ")
      .filter(token => token && token.length > 2 && !["del", "con", "para", "por", "las", "los"].includes(token));
  }

  function buildSuggestedVesselCode(vesselName) {
    const normalized = normalizeSmartText(vesselName);
    if (!normalized) return "GEN";

    const tokens = normalized.split(" ").filter(Boolean);
    if (tokens.length === 1) return tokens[0].slice(0, 4).toUpperCase();

    return tokens.slice(0, 3).map(token => token.charAt(0).toUpperCase()).join("") || "GEN";
  }

  function buildSuggestedSku(description, sfi, vesselName) {
    const normalizedSfi = String(sfi || "GEN").replace(/[^0-9A-Z]/gi, "").slice(0, 6) || "GEN";
    const vesselCode = buildSuggestedVesselCode(vesselName);
    const tokens = tokenizeSmartText(description);
    const code = (tokens.slice(0, 3).map(token => token.slice(0, 3).toUpperCase()).join("") || "ITEM").slice(0, 9);
    const prefix = `SP-${vesselCode}-${normalizedSfi}-${code}`;

    const existing = new Set((currentSparesData || []).map(item => String(item.SKU || "").trim().toUpperCase()).filter(Boolean));
    let counter = 1;
    let candidate = `${prefix}-${String(counter).padStart(3, "0")}`;
    while (existing.has(candidate.toUpperCase())) {
      counter += 1;
      candidate = `${prefix}-${String(counter).padStart(3, "0")}`;
    }
    return candidate;
  }

  function scoreAssetMatch(asset, tokens, vesselName) {
    const haystack = normalizeSmartText([
      asset.Nombre_Funcional,
      asset.Equipo_ID,
      asset.Funcion_Critica,
      asset.Medio_Servicio,
      asset.SFI
    ].join(" "));
    if (!haystack) return 0;

    let score = 0;
    tokens.forEach(token => {
      if (haystack.includes(token)) score += 3;
    });

    const assetVessel = String(asset.VesselName || "").trim().toUpperCase();
    const targetVessel = String(vesselName || "").trim().toUpperCase();
    if (targetVessel && assetVessel === targetVessel) score += 4;
    return score;
  }

  function findBestAssetSuggestion(description, vesselName) {
    const tokens = tokenizeSmartText(description);
    if (tokens.length < 2 || !currentInventoryData || !currentInventoryData.length) return null;

    let bestAsset = null;
    let bestScore = 0;
    currentInventoryData.forEach(asset => {
      const score = scoreAssetMatch(asset, tokens, vesselName);
      if (score > bestScore) {
        bestScore = score;
        bestAsset = asset;
      }
    });

    if (!bestAsset || bestScore < 6) return null;
    return bestAsset;
  }

  function findBestSfiReference(description) {
    const normalized = normalizeSmartText(description);
    if (!normalized) return null;

    if ((normalized.includes("bomba de carga") || normalized.includes("bomba carga") || normalized.includes("cargo pump")) &&
        (normalized.includes("filtro") || normalized.includes("aceite") || normalized.includes("motor"))) {
      return SPARE_SFI_REFERENCE.find(ref => ref.sfi === "280") || null;
    }

    let bestRef = null;
    let bestScore = 0;
    SPARE_SFI_REFERENCE.forEach(ref => {
      let score = 0;
      ref.keywords.forEach(keyword => {
        if (normalized.includes(normalizeSmartText(keyword))) score += 2;
      });
      const refDescription = normalizeSmartText(ref.description);
      if (refDescription && normalized.includes(refDescription)) score += 3;
      if (score > bestScore) {
        bestScore = score;
        bestRef = ref;
      }
    });

    return bestScore > 0 ? bestRef : null;
  }

  function inferSpareLevel(description, asset, sfiCode) {
    const explicit = String(asset?.Criticidad || "").trim().toUpperCase();
    if (["A", "B", "C"].includes(explicit)) return explicit;

    const normalized = normalizeSmartText(description);
    const highRiskTerms = ["emergency", "emergencia", "fire", "incendio", "alarm", "alarma", "main engine", "motor principal", "thruster", "propeller", "steering", "battery", "generador"];
    const mediumRiskTerms = ["pump", "bomba", "valve", "valvula", "compressor", "compresor", "cooling", "fuel", "lubric", "control", "sensor"];
    if (highRiskTerms.some(term => normalized.includes(normalizeSmartText(term)))) return "A";
    if (mediumRiskTerms.some(term => normalized.includes(normalizeSmartText(term)))) return "B";

    const sfiGroup = String(sfiCode || "").trim().charAt(0);
    if (["6", "7", "8", "9"].includes(sfiGroup)) return "B";
    return "C";
  }

  function inferSpareEx(description, asset) {
    const explicitAssetEx = String(asset?.Es_Equipo_Ex || "").trim().toUpperCase();
    if (explicitAssetEx === "SI" || explicitAssetEx === "NO") return explicitAssetEx;
    if (String(asset?.Certificado_Ex || "").trim()) return "SI";

    const normalized = normalizeSmartText(description);
    const exTerms = ["atex", "iecex", "ex proof", "ex-proof", "flameproof", "intrinsically safe", "explosion", "gas detector", "zona ex"];
    return exTerms.some(term => normalized.includes(normalizeSmartText(term))) ? "SI" : "NO";
  }

  function computeTokenOverlapScore(tokensA, tokensB) {
    const setA = new Set(tokensA || []);
    const setB = new Set(tokensB || []);
    if (!setA.size || !setB.size) return 0;

    let matches = 0;
    setA.forEach(token => {
      if (setB.has(token)) matches += 1;
    });
    return matches / Math.max(setA.size, setB.size);
  }

  function findPotentialSpareDuplicates(payload, excludedRowIndex = null) {
    const description = String(payload?.Nombre_Funcional || "").trim();
    const vesselName = String(payload?.VesselName || "").trim().toUpperCase();
    const sfi = String(payload?.SFI || "").trim().toUpperCase();
    const descriptionNormalized = normalizeSmartText(description);
    const descriptionTokens = tokenizeSmartText(description);
    if (!descriptionNormalized || descriptionTokens.length < 2) return [];

    return (currentSparesData || [])
      .filter(item => !excludedRowIndex || item._rowIndex !== excludedRowIndex)
      .map(item => {
        const existingDescription = String(item.Nombre_Funcional || "").trim();
        const existingNormalized = normalizeSmartText(existingDescription);
        const existingTokens = tokenizeSmartText(existingDescription);
        const sameVessel = vesselName && String(item.VesselName || "").trim().toUpperCase() === vesselName;
        const sameSfi = sfi && String(item.SFI || "").trim().toUpperCase() === sfi;
        const exactDescription = existingNormalized && existingNormalized === descriptionNormalized;
        const containsDescription = existingNormalized && (existingNormalized.includes(descriptionNormalized) || descriptionNormalized.includes(existingNormalized));
        const overlapScore = computeTokenOverlapScore(descriptionTokens, existingTokens);

        let score = 0;
        if (sameVessel) score += 3;
        if (sameSfi) score += 3;
        if (exactDescription) score += 6;
        else if (containsDescription) score += 4;
        score += overlapScore * 4;

        return {
          item,
          score,
          sameVessel,
          sameSfi,
          exactDescription,
          overlapScore,
        };
      })
      .filter(match => match.score >= 6 || (match.sameVessel && match.overlapScore >= 0.5) || (match.sameSfi && match.overlapScore >= 0.5))
      .sort((a, b) => b.score - a.score)
      .slice(0, 3);
  }

  function getSmartSpareSuggestion(description, vesselName) {
    const cleanDescription = String(description || "").trim();
    const tokens = tokenizeSmartText(cleanDescription);
    if (!cleanDescription || cleanDescription.length < 12 || tokens.length < 2) return null;

    const asset = findBestAssetSuggestion(cleanDescription, vesselName);
    const ref = asset ? null : findBestSfiReference(cleanDescription);
    const sfi = String(asset?.SFI || ref?.sfi || "").trim();
    const equipment = String(asset?.Nombre_Funcional || ref?.description || "").trim();
    const nivel = inferSpareLevel(cleanDescription, asset, sfi);
    const exFlag = inferSpareEx(cleanDescription, asset);
    const sku = buildSuggestedSku(cleanDescription, sfi || "GEN", vesselName || "");

    return {
      sku,
      sfi,
      equipment,
      nivel,
      exFlag,
      source: asset ? `Coincidencia con inventario: ${asset.Nombre_Funcional || asset.SFI}` : (ref ? `Referencia SFI: ${ref.sfi} ${ref.description}` : "Sugerencia por descripción")
    };
  }

  function setupSpareSmartAssist(isEdit) {
    if (isEdit) return;

    const descriptionField = document.getElementById("field-Nombre_Funcional");
    const vesselField = document.getElementById("modal-select-VesselName");
    const skuField = document.getElementById("field-SKU");
    const sfiField = document.getElementById("field-SFI");
    const equipmentField = document.getElementById("field-Equipo/Sistema");
    const nivelField = document.getElementById("modal-select-Nivel");
    const exField = document.getElementById("modal-select-EX (Si/No)");
    const descriptionGroup = document.getElementById("form-group-Nombre_Funcional");
    if (!descriptionField || !skuField || !sfiField || !descriptionGroup) return;

    const hintId = "spare-smart-hint";
    let hint = document.getElementById(hintId);
    if (!hint) {
      hint = document.createElement("div");
      hint.id = hintId;
      hint.style.marginTop = "0.5rem";
      hint.style.fontSize = "0.72rem";
      hint.style.color = "var(--text-muted)";
      hint.style.lineHeight = "1.45";
      descriptionGroup.appendChild(hint);
    }

    const duplicateHintId = "spare-duplicate-hint";
    let duplicateHint = document.getElementById(duplicateHintId);
    if (!duplicateHint) {
      duplicateHint = document.createElement("div");
      duplicateHint.id = duplicateHintId;
      duplicateHint.style.marginTop = "0.6rem";
      duplicateHint.style.fontSize = "0.72rem";
      duplicateHint.style.lineHeight = "1.45";
      duplicateHint.style.display = "none";
      duplicateHint.style.padding = "0.6rem 0.75rem";
      duplicateHint.style.borderRadius = "8px";
      duplicateHint.style.border = "1px solid rgba(249, 115, 22, 0.35)";
      duplicateHint.style.background = "rgba(249, 115, 22, 0.08)";
      duplicateHint.style.color = "#fdba74";
      descriptionGroup.appendChild(duplicateHint);
    }

    if (descriptionField.dataset.smartAssistBound !== "true") {
      [skuField, sfiField, equipmentField, nivelField, exField].filter(Boolean).forEach(field => {
        field.addEventListener(field.tagName === "SELECT" ? "change" : "input", () => {
          field.dataset.userEdited = "true";
        });
      });
      descriptionField.dataset.smartAssistBound = "true";
    }

    const maybeApply = (field, value) => {
      if (!field || !String(value || "").trim()) return;
      if (field.dataset.userEdited === "true") return;
      field.value = value;
    };

    const applySuggestion = () => {
      const suggestion = getSmartSpareSuggestion(descriptionField.value, vesselField?.value || "");
      const duplicateMatches = findPotentialSpareDuplicates({
        Nombre_Funcional: descriptionField.value,
        VesselName: vesselField?.value || "",
        SFI: sfiField?.value || "",
      });
      window.__currentSpareDuplicateMatches = duplicateMatches;

      if (!suggestion) {
        hint.textContent = "Describe mejor el repuesto y espera un instante. La sugerencia automática aparece cuando detecta suficiente contexto.";
        if (duplicateMatches.length) {
          duplicateHint.style.display = "block";
          duplicateHint.innerHTML = `Posibles duplicados detectados:<br>${duplicateMatches.map(match => `• <strong>${match.item.SKU || '-'}</strong> | ${match.item.Nombre_Funcional || '-'} | ${match.item.VesselName || '-'} | SFI ${match.item.SFI || '-'}`).join('<br>')}`;
        } else {
          duplicateHint.style.display = "none";
          duplicateHint.innerHTML = "";
        }
        return;
      }

      maybeApply(skuField, suggestion.sku);
      maybeApply(sfiField, suggestion.sfi);
      maybeApply(equipmentField, suggestion.equipment);
      maybeApply(nivelField, suggestion.nivel);
      maybeApply(exField, suggestion.exFlag);

      hint.innerHTML = `Sugerencia automática: <strong>SKU</strong> ${suggestion.sku} | <strong>SFI</strong> ${suggestion.sfi || "-"} | <strong>Nivel</strong> ${suggestion.nivel} | <strong>EX</strong> ${suggestion.exFlag}.<br>Base: ${suggestion.source}.`;

      if (duplicateMatches.length) {
        duplicateHint.style.display = "block";
        duplicateHint.innerHTML = `Posibles duplicados detectados:<br>${duplicateMatches.map(match => `• <strong>${match.item.SKU || '-'}</strong> | ${match.item.Nombre_Funcional || '-'} | ${match.item.VesselName || '-'} | SFI ${match.item.SFI || '-'}${match.exactDescription ? ' | misma descripción' : ''}`).join('<br>')}`;
      } else {
        duplicateHint.style.display = "none";
        duplicateHint.innerHTML = "";
      }
    };

    const scheduleSuggestion = () => {
      clearTimeout(window.__spareSuggestTimer);
      window.__spareSuggestTimer = setTimeout(applySuggestion, 650);
    };

    if (descriptionField.dataset.smartAssistInputBound !== "true") {
      descriptionField.addEventListener("input", scheduleSuggestion);
      if (vesselField) vesselField.addEventListener("change", scheduleSuggestion);
      descriptionField.dataset.smartAssistInputBound = "true";
    }
    scheduleSuggestion();
  }
