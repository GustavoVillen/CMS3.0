  function normalizeAssetSfiBase(sfi) {
    const raw = String(sfi || "").trim();
    if (!raw) return "";
    const numericPrefix = raw.match(/^(\d{3})/);
    if (numericPrefix) return numericPrefix[1];
    return raw.split(".")[0].replace(/[^0-9A-Z]/gi, "").slice(0, 6);
  }

  function findExactInventoryAssetForDefect(query, vesselName) {
    const rawQuery = String(query || "").trim();
    if (!rawQuery) return null;
    
    // Support for format "SFI - Name"
    const parts = rawQuery.split("-");
    const possibleSfi = parts[0].trim().toUpperCase();
    
    const normalizedQuery = normalizeSmartText(query);
    const upperQuery = rawQuery.toUpperCase();
    const upperVessel = String(vesselName || "").trim().toUpperCase();

    return (currentInventoryData || []).find(asset => {
      const assetVessel = String(asset.VesselName || "").trim().toUpperCase();
      const sameVessel = !upperVessel || !assetVessel || assetVessel === upperVessel;
      if (!sameVessel) return false;

      const assetSFI = String(asset.SFI || "").trim().toUpperCase();
      const assetName = normalizeSmartText(asset.Nombre_Funcional);
      const assetId = normalizeSmartText(asset.Equipo_ID);

      if (assetSFI === upperQuery || assetName === normalizedQuery || assetId === normalizedQuery) return true;
      if (parts.length > 1 && assetSFI && assetSFI === possibleSfi) return true;
      
      return false;
    }) || null;
  }

  function findTopAssetMatches(query, vesselName, limit = 5) {
    const normalizedQuery = normalizeSmartText(query);
    const queryTokens = tokenizeSmartText(query);
    const upperQuery = String(query || "").trim().toUpperCase();
    const upperVessel = String(vesselName || "").trim().toUpperCase();
    if (!normalizedQuery && !upperQuery) return [];

    return (currentInventoryData || [])
      .map(asset => {
        const assetVessel = String(asset.VesselName || "").trim().toUpperCase();
        // ESTRICTO: Solo equipos de la embarcación seleccionada (si tiene vessel)
        if (upperVessel && assetVessel && assetVessel !== upperVessel) return null;

        const haystackText = [asset.Nombre_Funcional, asset.Equipo_ID, asset.Funcion_Critica, asset.Medio_Servicio, asset.SFI].join(" ");
        const haystackNormalized = normalizeSmartText(haystackText);
        const haystackTokens = tokenizeSmartText(haystackText);
        const exactSfi = String(asset.SFI || "").trim().toUpperCase() === upperQuery || 
                         (upperQuery.includes("-") && upperQuery.split("-")[0].trim() === String(asset.SFI || "").trim().toUpperCase());
        const exactName = normalizeSmartText(asset.Nombre_Funcional) === normalizedQuery;
        const exactId = normalizeSmartText(asset.Equipo_ID) === normalizedQuery;
        const overlapScore = computeTokenOverlapScore(queryTokens, haystackTokens);
        let score = scoreAssetMatch(asset, queryTokens, vesselName);

        if (exactSfi) score += 20;
        if (exactName || exactId) score += 12;
        if (normalizedQuery && haystackNormalized.includes(normalizedQuery)) score += 5;
        if (upperVessel && assetVessel === upperVessel) score += 2;
        score += overlapScore * 8;

        return { asset, score, exactSfi, exactName, exactId, overlapScore };
      })
      .filter(Boolean)
      .filter(match => match.score >= 5 || match.exactSfi || match.exactName || match.exactId)
      .sort((a, b) => b.score - a.score)
      .slice(0, limit);
  }

  function buildSuggestedEquipmentId(description, sfi, vesselName) {
    const vesselCode = buildSuggestedVesselCode(vesselName);
    const normalizedSfi = normalizeAssetSfiBase(sfi) || String(sfi || "GEN").replace(/[^0-9A-Z]/gi, "").slice(0, 6) || "GEN";
    const tokens = tokenizeSmartText(description);
    const code = (tokens.slice(0, 2).map(token => token.slice(0, 3).toUpperCase()).join("") || "EQP").slice(0, 6);
    const prefix = `EQ-${vesselCode}-${normalizedSfi}-${code}`;
    const existing = new Set((currentInventoryData || []).map(item => String(item.Equipo_ID || "").trim().toUpperCase()).filter(Boolean));

    let counter = 1;
    let candidate = `${prefix}-${String(counter).padStart(2, "0")}`;
    while (existing.has(candidate.toUpperCase())) {
      counter += 1;
      candidate = `${prefix}-${String(counter).padStart(2, "0")}`;
    }
    return candidate;
  }

  function buildSuggestedAssetSfi(query, vesselName) {
    const bestMatch = findTopAssetMatches(query, vesselName, 1)[0]?.asset || null;
    const ref = bestMatch ? null : findBestSfiReference(query);
    const baseSfi = normalizeAssetSfiBase(bestMatch?.SFI || ref?.sfi || "");
    if (!baseSfi) return "";

    let maxSuffix = 0;
    (currentInventoryData || []).forEach(asset => {
      const sameVessel = !vesselName || String(asset.VesselName || "").trim().toUpperCase() === String(vesselName || "").trim().toUpperCase();
      if (!sameVessel) return;
      if (normalizeAssetSfiBase(asset.SFI) !== baseSfi) return;

      const suffix = parseInt(String(asset.SFI || "").split(".")[1], 10) || 0;
      maxSuffix = Math.max(maxSuffix, suffix);
    });

    return `${baseSfi}.${String(maxSuffix + 1).padStart(2, "0")}`;
  }

  function findInventorySfiReferenceByCode(sfi) {
    const baseSfi = normalizeAssetSfiBase(sfi);
    if (!baseSfi) return null;
    return INVENTORY_SFI_REFERENCE.find(ref => ref.sfi === baseSfi) || null;
  }

  function renderInventorySfiReferenceTable(filterText) {
    const query = normalizeSmartText(filterText || "");
    const rows = INVENTORY_SFI_REFERENCE.filter(ref => {
      if (!query) return true;
      const haystack = normalizeSmartText(`${ref.group} ${ref.sfi} ${ref.description}`);
      return haystack.includes(query);
    });

    if (!rows.length) {
      return `<div style="padding:0.85rem; text-align:center; color:var(--text-muted);">No hay coincidencias en la referencia SFI.</div>`;
    }

    return `<table class="data-table" style="margin:0; font-size:0.75rem;">
      <thead>
        <tr>
          <th>GRUPO</th>
          <th style="text-align:center;">SFI</th>
          <th>DESCRIPCIÓN</th>
          <th style="text-align:center;">USAR</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(ref => `<tr>
          <td>${escapeInlineHtml(ref.group)}</td>
          <td style="text-align:center; color:var(--accent-orange); font-weight:700;">${escapeInlineHtml(ref.sfi)}</td>
          <td>${escapeInlineHtml(ref.description)}</td>
          <td style="text-align:center;">
            <button type="button" class="btn-icon-subtle" onclick="applyInventorySfiReference('${ref.sfi}')" title="Usar ${ref.sfi}" style="padding:0.25rem 0.45rem; min-width:auto;">
              <span class="material-symbols-outlined fs-md">south_west</span>
            </button>
          </td>
        </tr>`).join("")}
      </tbody>
    </table>`;
  }

  function toggleInventorySfiReference(forceState) {
    if (typeof forceState === "boolean") inventorySfiAssistState.showReference = forceState;
    else inventorySfiAssistState.showReference = !inventorySfiAssistState.showReference;

    const toggleButton = document.getElementById("inventory-sfi-reference-toggle");
    const wrapper = document.getElementById("inventory-sfi-reference-wrapper");
    if (toggleButton) {
      toggleButton.innerHTML = inventorySfiAssistState.showReference
        ? `<span class="material-symbols-outlined fs-sm">expand_less</span> OCULTAR REFERENCIA OFICIAL SFI`
        : `<span class="material-symbols-outlined fs-sm">menu_book</span> VER REFERENCIA OFICIAL SFI`;
    }
    if (wrapper) {
      wrapper.style.display = inventorySfiAssistState.showReference ? "block" : "none";
    }
    if (inventorySfiAssistState.showReference) refreshInventorySfiAssist();
  }

  function refreshInventorySfiAssist() {
    const nameField = document.getElementById("field-Nombre_Funcional");
    const sfiField = document.getElementById("field-SFI");
    const vesselField = document.getElementById("field-VesselName") || document.getElementById("modal-select-VesselName");
    const equipmentIdField = document.getElementById("field-Equipo_ID");
    const searchField = document.getElementById("inventory-sfi-reference-search");
    const summaryBox = document.getElementById("inventory-sfi-assist-summary");
    const tableBox = document.getElementById("inventory-sfi-reference-table");
    const wrapper = document.getElementById("inventory-sfi-reference-wrapper");
    if (!nameField || !sfiField || !summaryBox) return;

    const nameValue = String(nameField.value || "").trim();
    const vesselName = String(vesselField?.value || "").trim();
    const currentSfi = String(sfiField.value || "").trim();
    const suggestedSfi = nameValue ? buildSuggestedAssetSfi(nameValue, vesselName) : "";
    const effectiveSfi = inventorySfiAssistState.manualOverride ? currentSfi : (suggestedSfi || currentSfi);
    const reference = findInventorySfiReferenceByCode(effectiveSfi || currentSfi || suggestedSfi);

    if (!inventorySfiAssistState.manualOverride && suggestedSfi && suggestedSfi !== currentSfi) {
      sfiField.value = suggestedSfi;
    }

    if (equipmentIdField && !inventorySfiAssistState.manualEquipmentId && nameValue) {
      equipmentIdField.value = buildSuggestedEquipmentId(nameValue, sfiField.value, vesselName);
    }

    const statusTone = reference
      ? "color:#86efac; border-color:rgba(34,197,94,0.35); background:rgba(34,197,94,0.08);"
      : (String(sfiField.value || "").trim()
        ? "color:#fbbf24; border-color:rgba(251,191,36,0.35); background:rgba(251,191,36,0.08);"
        : "color:var(--text-muted); border-color:rgba(255,255,255,0.08); background:rgba(255,255,255,0.03);");

    let summary = "Escribe el nombre funcional del equipo para sugerir automáticamente el código base + sub-SFI.";
    if (reference) {
      summary = `${inventorySfiAssistState.manualOverride ? "SFI manual validado" : "SFI sugerido"}: <strong>${escapeInlineHtml(sfiField.value || reference.sfi)}</strong> | Base <strong>${escapeInlineHtml(reference.sfi)}</strong> | ${escapeInlineHtml(reference.group)} | ${escapeInlineHtml(reference.description)}`;
    } else if (String(sfiField.value || "").trim()) {
      summary = `El SFI <strong>${escapeInlineHtml(sfiField.value)}</strong> no coincide con una base del catálogo oficial. Puedes corregirlo manualmente o elegir una base de la tabla.`;
    } else if (suggestedSfi) {
      summary = `SFI sugerido: <strong>${escapeInlineHtml(suggestedSfi)}</strong>. Revisa la base en la tabla oficial antes de guardar.`;
    }

    summaryBox.innerHTML = `<div style="padding:0.75rem 0.85rem; border:1px solid; border-radius:8px; font-size:0.74rem; line-height:1.45; ${statusTone}">${summary}</div>`;
    if (wrapper) {
      wrapper.style.display = inventorySfiAssistState.showReference ? "block" : "none";
    }
    if (tableBox && inventorySfiAssistState.showReference) {
      tableBox.innerHTML = renderInventorySfiReferenceTable(searchField?.value || "");
    }
  }

  function applyInventorySfiReference(baseSfi) {
    const sfiField = document.getElementById("field-SFI");
    const nameField = document.getElementById("field-Nombre_Funcional");
    const vesselField = document.getElementById("field-VesselName") || document.getElementById("modal-select-VesselName");
    if (!sfiField) return;

    const currentValue = String(sfiField.value || "").trim();
    const suffixMatch = currentValue.match(/\.(\d{2,})$/);
    const vesselName = String(vesselField?.value || "").trim();
    const nextSfi = suffixMatch ? `${baseSfi}.${suffixMatch[1]}` : (String(nameField?.value || "").trim() ? buildSuggestedAssetSfi(nameField.value, vesselName) : `${baseSfi}.01`);

    sfiField.value = normalizeAssetSfiBase(nextSfi) === baseSfi ? nextSfi : `${baseSfi}.01`;
    inventorySfiAssistState.manualOverride = true;
    refreshInventorySfiAssist();
  }

  function setupInventorySfiAssist(isEdit) {
    const nameField = document.getElementById("field-Nombre_Funcional");
    const sfiField = document.getElementById("field-SFI");
    const equipmentIdField = document.getElementById("field-Equipo_ID");
    const vesselField = document.getElementById("field-VesselName") || document.getElementById("modal-select-VesselName");
    const searchField = document.getElementById("inventory-sfi-reference-search");
    if (!nameField || !sfiField) return;

    inventorySfiAssistState = {
      manualOverride: !!(isEdit && String(sfiField.value || "").trim()),
      manualEquipmentId: !!(isEdit && equipmentIdField && String(equipmentIdField.value || "").trim()),
      showReference: false,
    };

    nameField.addEventListener("input", refreshInventorySfiAssist);
    sfiField.addEventListener("input", () => {
      inventorySfiAssistState.manualOverride = true;
      refreshInventorySfiAssist();
    });
    if (equipmentIdField) {
      equipmentIdField.addEventListener("input", () => {
        inventorySfiAssistState.manualEquipmentId = true;
      });
    }
    if (vesselField) {
      vesselField.addEventListener("change", refreshInventorySfiAssist);
    }
    if (searchField) {
      searchField.addEventListener("input", refreshInventorySfiAssist);
    }

    toggleInventorySfiReference(false);
    refreshInventorySfiAssist();
  }

  function buildDefectNewAssetDraft() {
    const query = document.getElementById("field-SFI")?.value || "";
    const vesselName = document.getElementById("modal-select-Embarcacion")?.value || "";
    const matchedAsset = findTopAssetMatches(query, vesselName, 1)[0]?.asset || null;
    const suggestedSfi = buildSuggestedAssetSfi(query, vesselName);
    const selectedCriticality = document.getElementById("modal-select-Clasificacion_Falla")?.value || "";
    const statusValue = normalizeOperationalStateValue(document.getElementById("modal-select-Estado_Operativo")?.value || "FUERA DE USO") || "FUERA DE USO";
    const criticidad = ["A", "B", "C"].includes(selectedCriticality)
      ? selectedCriticality
      : inferSpareLevel(query, matchedAsset, suggestedSfi || matchedAsset?.SFI || "");

    return {
      nombre: String(query || "").trim(),
      sfi: suggestedSfi,
      equipoId: buildSuggestedEquipmentId(query, suggestedSfi, vesselName),
      criticidad,
      status: statusValue,
      source: matchedAsset
        ? `Base sugerida por similitud con ${matchedAsset.Nombre_Funcional || matchedAsset.SFI}`
        : (suggestedSfi ? `Base sugerida por referencia SFI ${normalizeAssetSfiBase(suggestedSfi)}` : "Completa manualmente el código SFI si no coincide con la sugerencia.")
    };
  }

    cancelDefectNewAssetPanel();

    if (!match || !match.asset) return;
    applyDefectAssetSelection(match.asset);
  }

  function saveNewDefectInventoryAsset() {
    const vesselName = document.getElementById("modal-select-Embarcacion")?.value || "";
    const name = document.getElementById("defect-new-asset-name")?.value || "";
    const sfi = document.getElementById("defect-new-asset-sfi")?.value || "";
    const equipoId = document.getElementById("defect-new-asset-id")?.value || "";
    const criticidad = document.getElementById("defect-new-asset-crit")?.value || "C";
    const status = normalizeOperationalStateValue(document.getElementById("defect-new-asset-status")?.value || "FUERA DE USO") || "FUERA DE USO";
    const btn = document.getElementById("btn-save-defect-asset");

    if (!String(vesselName || "").trim()) {
      showToast("Selecciona la embarcación antes de registrar el equipo.", "error");
      return;
    }
    if (!String(name || "").trim()) {
      showToast("Completa el nombre funcional del equipo.", "error");
      return;
    }
    if (!String(sfi || "").trim()) {
      showToast("Completa el código SFI sugerido o corrígelo manualmente.", "error");
      return;
    }

    const duplicateAsset = (currentInventoryData || []).find(asset =>
      String(asset.VesselName || "").trim().toUpperCase() === String(vesselName || "").trim().toUpperCase() &&
      String(asset.SFI || "").trim().toUpperCase() === String(sfi || "").trim().toUpperCase()
    );
    if (duplicateAsset) {
      showToast(`Ya existe un equipo con SFI ${sfi} para ${vesselName}.`, "error");
      return;
    }

    const payload = {
      SFI: sfi,
      Equipo_ID: equipoId,
      Nombre_Funcional: name,
      VesselName: vesselName,
      Criticidad: criticidad,
      Status: normalizeOperationalStateForStorage(status),
    };

    if (btn) {
      btn.disabled = true;
      btn.innerHTML = `<span class="material-symbols-outlined fs-sm">sync</span> REGISTRANDO...`;
    }

    google.script.run
      .withSuccessHandler(res => {
        if (res && res.success === false) {
          showToast(res.message || "No se pudo registrar el equipo en inventario.", "error");
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = `<span class="material-symbols-outlined fs-sm">inventory_2</span> REGISTRAR Y USAR`;
          }
          return;
        }

        clearCache("apiGetInventory");
        cachedRun("apiGetInventory", [], 0)
          .then(data => {
            currentInventoryData = data || [];
            const createdAsset = findExactInventoryAssetForDefect(sfi, vesselName) || payload;
            applyDefectAssetSelection(createdAsset);
            cancelDefectNewAssetPanel();
            showToast(`Equipo registrado en inventario SFI: ${sfi}`);
          })
          .catch(() => {
            currentInventoryData = (currentInventoryData || []).concat([payload]);
            applyDefectAssetSelection(payload);
            cancelDefectNewAssetPanel();
            showToast(`Equipo registrado en inventario SFI: ${sfi}`);
          })
          .finally(() => {
            if (btn) {
              btn.disabled = false;
              btn.innerHTML = `<span class="material-symbols-outlined fs-sm">inventory_2</span> REGISTRAR Y USAR`;
            }
          });
      })
      .withFailureHandler(err => {
        showToast("Error al registrar el equipo: " + (err.message || err), "error");
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<span class="material-symbols-outlined fs-sm">inventory_2</span> REGISTRAR Y USAR`;
        }
      })
      .apiCreateInventory(payload);
  }

  function renderDefectAssetAssist(queryOverride = null) {
    const selectedBox = document.getElementById("defect-asset-selected");
    const infoBox = document.getElementById("defect-asset-match-hint");
    const listBox = document.getElementById("defect-asset-match-list");
    const createPanel = document.getElementById("defect-asset-create-panel");
    const sfiField = document.getElementById("field-SFI");
    const vesselField = document.getElementById("modal-select-Embarcacion");
    if (!selectedBox || !infoBox || !listBox || !createPanel || !sfiField) return;

    const query = String(queryOverride !== null ? queryOverride : sfiField.value || "").trim();
    const vesselName = vesselField?.value || "";
    if (!query) {
      defectAssetAssistState.matches = [];
      defectAssetAssistState.selectedAssetSfi = "";
      syncDefectSelectionSummary(null);
      infoBox.innerHTML = "";
      listBox.innerHTML = "";
      cancelDefectNewAssetPanel();
      return;
    }

    if (!String(vesselName || "").trim()) {
      syncDefectSelectionSummary(null);
      infoBox.innerHTML = `<div style="font-size:0.72rem; color:var(--text-muted); line-height:1.45;">Selecciona primero la embarcación para buscar coincidencias en el inventario SFI.</div>`;
      listBox.innerHTML = "";
      cancelDefectNewAssetPanel();
      return;
    }

    const exactQueryAsset = findExactInventoryAssetForDefect(query, vesselName);
    if (exactQueryAsset) {
      defectAssetAssistState.selectedAssetSfi = String(exactQueryAsset.SFI || "").trim();
      
      const namePart = String(exactQueryAsset.Nombre_Funcional || "").trim();
      const expectedVal = exactQueryAsset.SFI ? (namePart ? `${exactQueryAsset.SFI} - ${namePart}` : exactQueryAsset.SFI) : namePart;
      
      if (String(sfiField.value || "").trim() !== expectedVal) {
        sfiField.value = expectedVal;
      }
    }

    const selectedAsset = defectAssetAssistState.selectedAssetSfi
      ? findExactInventoryAssetForDefect(defectAssetAssistState.selectedAssetSfi, vesselName)
      : null;
    syncDefectSelectionSummary(selectedAsset);

    if (selectedAsset) {
      infoBox.innerHTML = "";
      listBox.innerHTML = "";
      cancelDefectNewAssetPanel();
      return;
    }

    defectAssetAssistState.matches = findTopAssetMatches(query, vesselName, 5);
    const matchesHtml = defectAssetAssistState.matches.length
      ? defectAssetAssistState.matches.map((match, index) => `
          <div style="display:flex; justify-content:space-between; align-items:center; gap:0.8rem; border:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.03); border-radius:8px; padding:0.7rem 0.8rem;">
            <div style="min-width:0;">
              <div style="font-weight:700; color:var(--text-main);">${escapeInlineHtml(match.asset.Nombre_Funcional || match.asset.SFI || "-")}</div>
              <div style="font-size:0.72rem; color:var(--text-muted);">SFI ${escapeInlineHtml(match.asset.SFI || "-")} | ID ${escapeInlineHtml(match.asset.Equipo_ID || "-")} | ${escapeInlineHtml(match.asset.VesselName || "-")}</div>
            </div>
            <button type="button" class="btn-cyan-outline" onclick="selectDefectAssetMatch(${index})" style="white-space:nowrap; padding:4px 10px; font-size:0.72rem;">USAR</button>

  function prepareWorkOrderPayloadForSave(payload) {
    payload = payload || {};
    payload.Deferral_Required = String(payload.Deferral_Required || 'No').trim() || 'No';
    if (payload.Deferral_Required === 'Sí' && !String(payload.Deferral_Permite_Operacion || '').trim()) payload.Deferral_Permite_Operacion = 'Sí';
    if (payload.Deferral_Required === 'Sí' && !String(payload.Deferral_Declarado_NoGo || '').trim()) payload.Deferral_Declarado_NoGo = 'No';
    if (payload.Deferral_Required === 'Sí' && String(payload.Deferral_Autorizacion_Status || '').trim().toUpperCase() === 'AUTORIZADO' && String(payload.Deferral_Fecha_Vencimiento || '').trim()) {
      payload.Status = 'DEFERRED';
      payload.Fecha_Vencimiento_OT = payload.Deferral_Fecha_Vencimiento;
    }
    return payload;
  }

  function validateWorkOrderPayloadForSave(payload) {
    const workOrderAssessmentValidation = validateWorkOrderAssessment(payload);
    if (!workOrderAssessmentValidation.ok) return workOrderAssessmentValidation;

    const deferralValidation = validateWorkOrderDeferral(payload);
    if (!deferralValidation.ok) return deferralValidation;

    const authorizationValidation = validateWorkOrderAuthorization(payload);
    if (!authorizationValidation.ok) return authorizationValidation;

    const existingDeferralValidation = validateExistingWorkOrderDeferralAction(payload);
    if (!existingDeferralValidation.ok) return existingDeferralValidation;

    return { ok: true };
  }

  function persistCurrentWorkOrderDeferralRequest(onSuccess, onFailure) {
    const form = document.getElementById("general-form");
    if (!form) {
      if (typeof onFailure === 'function') onFailure('No se encontró el formulario de OT.');
      return;
    }

    const payload = prepareWorkOrderPayloadForSave(collectWorkOrderFormPayload(form));
    payload.Deferral_Required = 'Sí';
    payload.Deferral_Autorizacion_Status = 'PENDIENTE';

    const validation = validateWorkOrderPayloadForSave(payload);
    if (!validation.ok) {
      if (typeof onFailure === 'function') onFailure(validation.message);
      return;
    }

    const rowIndex = currentWorkOrderModalContext.rowIndex;
    const successHandler = res => {
      if (!res || res.success === false) {
        if (typeof onFailure === 'function') onFailure(res?.message || 'No se pudo guardar la OT antes de emitir la solicitud.');
        return;
      }

      if ((!payload.OT_ID || payload.OT_ID === '-') && res.OT_ID) {
        payload.OT_ID = res.OT_ID;
        if (form["OT_ID"]) form["OT_ID"].value = res.OT_ID;
      }
      if (res.rowIndex !== undefined && res.rowIndex !== null) {
        currentWorkOrderModalContext.rowIndex = res.rowIndex;
      }

      syncWorkOrderDeferral(payload, payload.OT_ID, () => {
        clearCache();
        loadWorkOrdersTable();
        if (typeof onSuccess === 'function') onSuccess(payload, res);
      }, errorMessage => {
        if (typeof onFailure === 'function') onFailure('La OT se guardó, pero no se pudo sincronizar el diferimiento: ' + errorMessage);
      });
    };

    const failureHandler = err => {
      if (typeof onFailure === 'function') onFailure(err?.message || err || 'No se pudo guardar la OT antes de emitir la solicitud.');
    };

    if (rowIndex !== undefined && rowIndex !== null) {
      google.script.run
        .withSuccessHandler(successHandler)
        .withFailureHandler(failureHandler)
        .apiUpdateWorkOrder(rowIndex, payload);
    } else {
      google.script.run
        .withSuccessHandler(successHandler)
        .withFailureHandler(failureHandler)
        .apiCreateWorkOrder(payload);
    }
  }

  function generateWorkOrderDeferralRequestPdf(customPayload = null) {
    const payload = collectWorkOrderPdfPayload(null, customPayload);
    payload.Deferral_Autorizacion_Status = "PENDIENTE";
    if (String(payload.Deferral_Required || "No").trim() !== "Sí") {
      showToast("Marca primero que la OT requiere diferimiento.", "error");
      return;
    }
    const deferralValidation = validateWorkOrderDeferral(payload);
    if (!deferralValidation.ok) {
      showToast(deferralValidation.message, "error");
      return;
    }
    const assessmentValidation = validateWorkOrderAssessment(payload);
    if (!assessmentValidation.ok) {
      showToast(assessmentValidation.message, "error");
      return;
    }
    if (!String(payload.IA_Plazo_Normal_Dias || "").trim()) {
      showToast("Evalúa primero el diferimiento con IA antes de generar la solicitud en PDF.", "error");
      return;
    }

    const emitPdf = (pdfPayload, persistLink) => {
      google.script.run
        .withSuccessHandler(res => {
          if (!(res && res.url)) {
            showToast("No se pudo generar el PDF de solicitud de diferimiento", "error");
            return;
          }

          const linkField = document.getElementById("field-Deferral_Link_PDF");
          const authStatusField = document.getElementById("field-Deferral_Autorizacion_Status");
          if (linkField) linkField.value = res.url;
          if (authStatusField && String(authStatusField.value || "").trim().toUpperCase() !== "AUTORIZADO") authStatusField.value = "PENDIENTE";
          syncWorkOrderStatusWithAuthorization();
          renderWorkOrderAuthorizationStatus();

          const finalizeSuccess = () => {
            showToast("Solicitud de aprobación emitida y OT actualizada", "success");
            openPdfPreviewModal(res.previewUrl || res.url, res.name || pdfPayload.OT_ID || 'PDF Diferimiento');
          };

          if (!persistLink) {
            finalizeSuccess();
            return;
          }

          persistWorkOrderDeferralRequestLink(res.url, pdfPayload, () => {
            finalizeSuccess();
          }, errorMessage => {
            showToast(errorMessage, "error");
            openPdfPreviewModal(res.previewUrl || res.url, res.name || pdfPayload.OT_ID || 'PDF Diferimiento');
          });
        })
        .withFailureHandler(err => {
          showToast("Error al generar PDF de solicitud de diferimiento: " + (err.message || err), "error");
        })
        .apiGenerateWorkOrderDeferralRequestPdf(pdfPayload);
    };

    if (customPayload) {
      emitPdf(payload, false);
      return;
    }

    persistCurrentWorkOrderDeferralRequest(savedPayload => {
      const pdfPayload = collectWorkOrderPdfPayload(null, savedPayload);
      pdfPayload.Deferral_Autorizacion_Status = 'PENDIENTE';
      emitPdf(pdfPayload, true);
    }, errorMessage => {
      showToast(errorMessage, "error");
    });
  }

  function syncWorkOrderStatusWithAuthorization() {
    const authStatusField = document.getElementById("field-Deferral_Autorizacion_Status");
    const statusSelect = document.getElementById("modal-select-Status");
    if (!authStatusField || !statusSelect) return;

    const authStatus = String(authStatusField.value || "").trim().toUpperCase();
    const currentStatus = normalizeStatus(statusSelect.value || "");

    if (!authStatus) return;

    if (authStatus === "AUTORIZADO") {
      if (currentStatus !== "DEFERRED") {
        currentWorkOrderModalContext.statusBeforeDeferred = statusSelect.value || currentWorkOrderModalContext.statusBeforeDeferred || "OPEN";
      }
      statusSelect.value = "DEFERRED";
      return;
    }

    if (currentStatus === "DEFERRED") {
      statusSelect.value = currentWorkOrderModalContext.statusBeforeDeferred || "OPEN";
    }
  }

  function renderWorkOrderAuthorizationStatus() {
    const box = document.getElementById("work-order-auth-status-box");
    const statusField = document.getElementById("field-Deferral_Autorizacion_Status");
    if (!box || !statusField) return;

    const value = String(statusField.value || "").trim().toUpperCase();
    if (!value) {
      box.innerHTML = `<span style="color:var(--text-muted);">Estado actual: Sin definir. Genera la solicitud de aprobación para dejarla en PENDIENTE.</span>`;
      return;
    }

    const color = value === "AUTORIZADO" ? "var(--accent-green)" : (value === "NO AUTORIZADO" ? "var(--accent-red)" : "var(--accent-yellow)");
    const detail = value === "AUTORIZADO"
      ? "El vencimiento y el estado de la OT se actualizarán a Diferido al guardar."
      : (value === "NO AUTORIZADO"
        ? "Debes registrar comentarios y nombre del autorizante antes de guardar."
        : "La solicitud ya está lista para ser evaluada por el autorizante.");
    box.innerHTML = `<div style="font-weight:700; color:${color};">Estado actual: ${value}</div><div style="margin-top:0.25rem; color:var(--text-muted);">${detail}</div>`;
  }

  let currentInspectionsTab = "PLAN"; // "PLAN" o "LOG"

  function updateInspectionsHeader() {
    const inventoryHeader = document.getElementById("inventory-title-h2");
    if (!inventoryHeader) return;

    if (currentInspectionsTab === "LOG") {
      inventoryHeader.innerHTML = `<span class="material-symbols-outlined fs-md">history</span> REGISTROS DE INSPECCIONES PERIÓDICAS`;
    } else {
      inventoryHeader.innerHTML = `<span class="material-symbols-outlined fs-md">fact_check</span> PLAN DE INSPECCIONES PERIÓDICAS (Sección 10)`;
    }
  }

  function populateInspectionVesselFilter() {
    if (currentVesselsData && currentVesselsData.length) {
      populateVesselFilter("vessel-filter-inventory", currentVesselsData, "VesselName");
      return;
    }

    const source = currentInspectionsTab === "LOG" ? currentInspectionsLogData : currentInspectionsData;
    populateVesselFilter("vessel-filter-inventory", source || [], "VesselName");
  }

  function maybeSyncInspectionTaskIds(planData) {
    const rows = planData || [];
    const hasMissingTaskId = rows.some(item => {
      const taskId = String(item.TaskID || "").trim();
      return !taskId || taskId === "-";
    });

    if (!hasMissingTaskId) return Promise.resolve(rows);

    return cachedRun("apiSyncInspectionIDs", [], 0)
      .catch(() => null)
      .then(() => {
        clearCache("apiGetInspections");
        return cachedRun("apiGetInspections", [], 0);
      });
  }

  function loadInspectionsPlanData(force = false) {
    const container = document.getElementById("inventory-table-container");
    container.innerHTML = `<div class="loading-state" style="padding: 2rem; text-align: center; color: var(--text-muted);"><span class="material-symbols-outlined" style="animation: spin 2s linear infinite;">sync</span> Sincronizando Plan de Inspecciones...</div>`;

    if (typeof google !== "undefined" && google.script) {
      cachedRun("apiGetInspections", [], force ? 0 : CACHE_TTL)
        .then(planData => maybeSyncInspectionTaskIds(planData || []))
        .then(planData => {
      currentInspectionsData = planData || [];
      populateInspectionVesselFilter();
      updateInspectionsHeader();
      renderInspectionsTable();
    }).catch(err => {
      container.innerHTML = `<div style="padding: 2rem; color: var(--accent-red);">Error en sincronización: ${err.message}</div>`;
    });
    }
  }

  function loadInspectionsLogData(options = {}) {
    const append = !!options.append;
    const force = !!options.force;
    const container = document.getElementById("inventory-table-container");
    const vesselFilter = document.getElementById("vessel-filter-inventory")?.value || "";
    const offset = append ? currentInspectionsLogData.length : 0;

    if (!append) {
      container.innerHTML = `<div class="loading-state" style="padding: 2rem; text-align: center; color: var(--text-muted);"><span class="material-symbols-outlined" style="animation: spin 2s linear infinite;">sync</span> Sincronizando Registros de Inspecciones...</div>`;
    }

    if (typeof google !== "undefined" && google.script) {
      cachedRun("apiGetInspectionsLog", [vesselFilter, INSPECTIONS_LOG_PAGE_SIZE, offset], force ? 0 : CACHE_TTL)
        .then(result => {
          const rows = (result && result.rows) || [];
          currentInspectionsLogData = append ? currentInspectionsLogData.concat(rows) : rows;
          currentInspectionsLogHasMore = !!(result && result.hasMore);
          populateInspectionVesselFilter();
          updateInspectionsHeader();
          renderInspectionsTable();
        })
        .catch(err => {
          container.innerHTML = `<div style="padding: 2rem; color: var(--accent-red);">Error al cargar registros: ${err.message}</div>`;
        });
    }
  }

  function loadInspectionsTable(force = false) {
    if (currentInspectionsTab === "LOG") {
      loadInspectionsLogData({ force: force });
      return;
    }
    loadInspectionsPlanData(force);
  }

  function setInspectionsTab(tab) {
    currentInspectionsTab = tab;
    currentActiveModule = tab === "LOG" ? "INSPECTIONS_LOG" : "INSPECTIONS_PLAN";
    loadInspectionsTable();
  }

  function renderInspectionsTable() {
    const container = document.getElementById("inventory-table-container");

    let html = `
      <div class="tabs-container" style="display: flex; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">
        <button class="btn-tab ${currentInspectionsTab === 'PLAN' ? 'active' : ''}" onclick="setInspectionsTab('PLAN')" style="background:none; border:none; color:${currentInspectionsTab === 'PLAN' ? 'var(--accent-cyan)' : 'var(--text-muted)'}; font-weight:700; cursor:pointer; padding: 0.5rem 1rem; border-bottom: 2px solid ${currentInspectionsTab === 'PLAN' ? 'var(--accent-cyan)' : 'transparent'}">
          PLAN DE INSPECCIONES
        </button>
        <button class="btn-tab ${currentInspectionsTab === 'LOG' ? 'active' : ''}" onclick="setInspectionsTab('LOG')" style="background:none; border:none; color:${currentInspectionsTab === 'LOG' ? 'var(--accent-cyan)' : 'var(--text-muted)'}; font-weight:700; cursor:pointer; padding: 0.5rem 1rem; border-bottom: 2px solid ${currentInspectionsTab === 'LOG' ? 'var(--accent-cyan)' : 'transparent'}">
          REGISTROS
        </button>
      </div>`;

    if (currentInspectionsTab === "PLAN") {
      html += renderInspectionsPlan();
    } else {
      html += renderInspectionsLog();
    }

    container.innerHTML = html;
  }

  function renderInspectionsPlan() {
    const vFilter = document.getElementById("vessel-filter-inventory").value;
    let filtered = currentInspectionsData;
    if (vFilter && vFilter !== "") {
      filtered = filtered.filter(d => (d.VesselName || "").toString().toUpperCase() === vFilter.toUpperCase());
    }

    const today = new Date();
    const todayStr = formatDateUI(today);
    today.setHours(0, 0, 0, 0);

    const calculatedData = filtered.map(item => {
      const computedStatus = getInspectionStatus(item, today);
      return { ...item, _computedStatus: computedStatus };
    });

    if (currentInspectionsStatusFilter) {
      filtered = calculatedData.filter(d => {
        if (currentInspectionsStatusFilter === "PROX.VENC") return d._computedStatus === "PROXIMO VENCIMIENTO";
        return d._computedStatus === currentInspectionsStatusFilter;
      });
    } else {
      filtered = calculatedData;
    }

    filtered.sort((a, b) => {
      const idA = (a.TaskID || a.SFI || "").toString();
      const idB = (b.TaskID || b.SFI || "").toString();
      return idB.localeCompare(idA);
    });

    let html = `
      <div style="margin-bottom: 1.5rem; display: flex; gap: 1rem; align-items: center;">
        <button class="btn-primary" onclick="openGeneralModal(null, 'INSPECTIONS')" style="background-color: var(--accent-cyan); display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 1.2rem; text-transform: uppercase;">
          <span class="material-symbols-outlined fs-md">add_box</span> DEFINIR NUEVA TAREA
        </button>
        ${currentInspectionsStatusFilter ? `
          <div class="active-filter-badge" style="background: var(--bg-main); border: 1px solid var(--accent-cyan); padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.75rem; color: var(--accent-cyan); display:flex; align-items:center; gap: 0.5rem;">
            Filtrando por: <b>${currentInspectionsStatusFilter}</b>
            <span class="material-symbols-outlined fs-sm" style="cursor:pointer;" onclick="setInspectionsStatusFilter(null)">close</span>
          </div>
        ` : ''}
      </div>`;

    if (filtered.length === 0) {
      return html + `<div style="text-align:center; padding: 2rem; color: var(--text-muted);">Sin tareas configuradas.</div>`;
    }

    html += `<table class="data-table">
                <thead>
                    <tr>
                        <th style="width: 130px;">TASK ID</th>
                        <th>DESCRIPCIÓN DE LA PRUEBA / EMBARCACIÓN</th>
                        <th style="width: 80px;">FREQS</th>
                        <th style="width: 80px;">FREQM</th>
                        <th>RESPONSABLE</th>
                        <th>ÚLTIMA REV</th>
                        <th>PRÓXIMA REV</th>
                        <th>ESTADO</th>
                        <th style="text-align: center; width: 60px;">CHK</th>
                        <th style="text-align: right;">ACCIONES</th>
                    </tr>
                </thead>
                <tbody>`;

    filtered.forEach(item => {
      const status = item._computedStatus;
      let statusClass = "tb-blue";

      if (status === "VENCIDA") statusClass = "tb-red";
      else if (status === "PROXIMO VENCIMIENTO") statusClass = "tb-yellow";
      else if (status === "VALIDO") statusClass = "tb-green";

      const freqKey = String(item.Frecuencia || "").trim().toUpperCase();
      let freqS = "";
      let freqM = "";
      if (freqKey === "SEMANAL") freqS = "1";
      else if (freqKey === "QUINCENAL") freqS = "2";
      else if (freqKey === "MENSUAL") freqM = "1";
      else if (freqKey === "TRIMESTRAL") freqM = "3";
      else if (freqKey === "SEMESTRAL") freqM = "6";
      else if (freqKey === "ANUAL") freqM = "12";

      html += `<tr onclick="openGeneralModal(${item._rowIndex}, 'INSPECTIONS')">
                    <td style="font-weight:800; color:var(--accent-cyan);">${item.TaskID || "-"}</td>
                    <td>
                        <div style="font-weight:700; color:var(--text-main);">${item.Descripcion_Prueba || "-"}</div>
                        <div style="font-size:0.75rem; color:var(--text-muted);">${item.VesselName || ""}</div>
                        <div style="font-size:0.72rem; color:rgba(255,255,255,0.72); font-weight:600;">SFI: ${item.SFI || "-"}</div>
                    </td>
                    <td title="Frecuencia: ${escapeInlineHtml(item.Frecuencia || '-')}"><span style="font-size:0.85rem; font-weight:800;">${freqS || "-"}</span></td>
                    <td title="Frecuencia: ${escapeInlineHtml(item.Frecuencia || '-')}"><span style="font-size:0.85rem; font-weight:800;">${freqM || "-"}</span></td>
                    <td style="font-size:0.8rem;">${item.Responsable || "-"}</td>
                    <td style="font-size:0.85rem;">${formatDateUI(item.Ultima_Fecha)}</td>
                    <td style="font-size:0.85rem; font-weight:700; color:${status === 'VENCIDA' ? 'var(--accent-red)' : ''}">${formatDateUI(item.Siguiente_Fecha)}</td>
                    <td><span class="table-badge ${statusClass}">${status}</span></td>
                    <td style="text-align: center;">
                        ${item.Checklist_Link ? `
                            <a href="${item.Checklist_Link}" target="_blank" class="btn-icon-subtle" title="Ver Lista de Chequeo" style="color: var(--accent-cyan); text-decoration: none;" onclick="event.stopPropagation()">
                                <span class="material-symbols-outlined fs-md">checklist</span>
                            </a>
                        ` : '<span style="color: var(--border-color);">-</span>'}
                    </td>
                    <td style="text-align: right; display: flex; gap:0.5rem; justify-content: flex-end;">
                        <button class="btn-icon-subtle" onclick="event.stopPropagation(); openGeneralModal(${item._rowIndex}, 'INSPECTIONS')" title="Configurar Plan">
                           <span class="material-symbols-outlined fs-md">settings</span>
                        </button>
                        ${item.TaskID ? buildTraceButton("history", "Abrir historial", `focusInspectionLogByTaskId(${JSON.stringify(item.TaskID || "")})`) : ''}
                        ${item.TaskID ? buildTraceButton("engineering", "Abrir OT", `focusWorkOrderById("", ${JSON.stringify(item.TaskID || "")})`) : ''}
                        ${item.TaskID ? buildTraceButton("report_problem", "Abrir defecto", `focusDefectByReference(${JSON.stringify(item._openOTNumber || "")}, ${JSON.stringify(item.TaskID || "")})`) : ''}
                        <button class="btn-primary" onclick="event.stopPropagation(); openExecutionModal(${item._rowIndex})" style="padding: 0.4rem 0.8rem; font-size: 0.75rem; background-color: var(--accent-green);">
                           REGISTRAR RESULTADO
                        </button>
                    </td>
                </tr>`;
    });
    html += `</tbody></table>`;
    return html;
  }

  function renderInspectionsLog() {
    const vFilter = document.getElementById("vessel-filter-inventory").value;
    let filtered = currentInspectionsLogData;
    if (vFilter && vFilter !== "") {
      filtered = filtered.filter(d => (d.VesselName || "").toString().toUpperCase() === vFilter.toUpperCase());
    }

    filtered.sort((a, b) => {
      const idA = (a.PI_ID || "").toString();
      const idB = (b.PI_ID || "").toString();
      return idB.localeCompare(idA);
    });

    let html = ``;

    if (filtered.length === 0) {
      return html + `<div style="text-align:center; padding: 2rem; color: var(--text-muted);">No hay registros de ejecuciones históricas.</div>`;
    }

    html += `<table class="data-table">
                <thead>
                    <tr>
                        <th>ID EJECUCIÓN</th>
                        <th>FECHA</th>
                        <th>TASKID</th>
                        <th>SFI</th>
                        <th>DESCRIPCIÓN</th>
                        <th style="text-align: center;">RES</th>
                        <th>RESPONSABLE / PARÍMETROS</th>
                        <th>EMBARCACIÓN</th>
                        <th>OT ASOCIADA</th>
                        <th>EVIDENCIA</th>
                        <th>TRAZA</th>
                    </tr>
                </thead>
                <tbody>`;

    filtered.forEach(item => {
      let resClass = item.Resultado === "FALLA" ? "tb-red" : (item.Resultado === "Satisfactorio" ? "tb-green" : "tb-yellow");
      const traceActions = [
        item.TaskID ? buildTraceButton("fact_check", "Abrir inspección", `focusInspectionPlanByTaskId(${JSON.stringify(item.TaskID || "")})`) : "",
        item.OT_Asociada ? buildTraceButton("engineering", "Abrir OT", `focusWorkOrderById(${JSON.stringify(item.OT_Asociada || "")})`) : "",
        (item.OT_Asociada || item.TaskID) ? buildTraceButton("report_problem", "Abrir defecto", `focusDefectByReference(${JSON.stringify(item.OT_Asociada || "")}, ${JSON.stringify(item.TaskID || "")})`) : ""
      ].filter(Boolean).join("");
      html += `<tr style="cursor: pointer" onclick="openGeneralModal(${item._rowIndex}, 'INSPECTIONS_LOG')">
                    <td style="font-weight:700; color:var(--accent-cyan);">${item.PI_ID || "-"}</td>
                    <td style="font-size:0.85rem; font-weight:600;">${formatDateUI(item.Fecha_Ejecucion)}</td>
                    <td style="font-size:0.78rem; font-weight:700; color:var(--accent-cyan);">${item.TaskID || "-"}</td>
                    <td style="font-size:0.85rem;">${item.SFI || "-"}</td>
                    <td style="font-size:0.85rem; font-weight:600;">${item.Descripcion || "-"}</td>
                    <td style="text-align: center;"><span class="table-badge ${resClass}">${item.Resultado || "-"}</span></td>
                    <td>
                        <div style="font-weight:600; font-size:0.8rem;">${item.Responsable || "-"}</div>
                        <div style="font-size:0.75rem; color:var(--text-muted);">${item.Parametros || "-"}</div>
                    </td>
                    <td style="font-size:0.85rem;">${item.VesselName || "-"}</td>
                    <td style="font-size:0.85rem; font-weight:600; color:var(--accent-cyan);">${item.OT_Asociada || "-"}</td>
                    <td style="text-align: center;">
                        ${item.Evidencia_Link ? `<a href="${item.Evidencia_Link}" target="_blank" class="btn-icon-subtle" onclick="event.stopPropagation()"><span class="material-symbols-outlined fs-md">link</span></a>` : "-"}
                    </td>
                    <td style="text-align:center; white-space:nowrap;">${traceActions || "-"}</td>
                </tr>`;
    });
    html += `</tbody></table>`;
    if (currentInspectionsLogHasMore) {
      html += `<div style="display:flex; justify-content:center; padding: 1rem 0 0;">
        <button class="btn-secondary" onclick="loadInspectionsLogData({ append: true })" style="display:flex; align-items:center; gap:0.5rem;">
          <span class="material-symbols-outlined fs-md">expand_more</span>CARGAR MÁS REGISTROS
        </button>
      </div>`;
    }
    return html;
  }

  /* UTILS */
  function populateVesselFilter(selectId, data, propertyName) {
    const select = document.getElementById(selectId);
    if (!select) return;

    // Obtener nombres únicos y ordenarlos
    const uniqueVessels = [...new Set(data.map(item => item[propertyName]).filter(v => v))].sort();

    // Guardar opción actual
    const currentVal = select.value;

    select.innerHTML = `<option value="">Todas las Embarcaciones</option>`;
    uniqueVessels.forEach(v => {
      select.innerHTML += `<option value="${v}" ${v === currentVal ? 'selected' : ''}>${v}</option>`;
    });
  }

  function normalizeRefKey(value) {
    return String(value || "").trim().toUpperCase();
  }

  function escapeInlineJsString(value) {
    return String(value || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
  }

  function buildTraceButton(icon, title, handlerCall) {
    return `<button class="btn-icon-subtle" onclick="event.stopPropagation(); ${handlerCall}" title="${title}" style="padding:0.2rem 0.35rem; min-width:auto;">
      <span class="material-symbols-outlined fs-md">${icon}</span>
    </button>`;
  }

  function focusWorkOrderById(otId, taskId) {
    const normalizedOtId = String(otId || "").trim();
    const normalizedTaskId = String(taskId || "").trim();
    if ((!normalizedOtId || normalizedOtId === "-") && (!normalizedTaskId || normalizedTaskId === "-")) return;

    currentWorkOrdersStatusFilter = null;
    showModule("ÓRDENES DE TRABAJO", false);
    clearCache("apiGetWorkOrders");
    cachedRun("apiGetWorkOrders", [], 0).then(data => {
      currentWorkOrdersData = data || [];
      populateVesselFilter("vessel-filter-work-orders", currentWorkOrdersData, "VesselName");
      const vesselFilterEl = document.getElementById("vessel-filter-work-orders");
      if (vesselFilterEl) vesselFilterEl.value = "";
      renderWorkOrdersTable();
      const match = currentWorkOrdersData.find(item => normalizedOtId && normalizeRefKey(item.OT_ID) === normalizeRefKey(normalizedOtId))
        || currentWorkOrdersData.find(item => normalizedTaskId && normalizeRefKey(item.TaskID) === normalizeRefKey(normalizedTaskId));
      if (match) {
        setTimeout(() => openGeneralModal(match._rowIndex, "WORK_ORDERS"), 0);
      }
      else showToast(`No se encontró la OT relacionada`, "error");
    }).catch(err => showToast("Error al abrir OT: " + err.message, "error"));
  }

  function focusInspectionPlanByTaskId(taskId) {
    const normalizedTaskId = String(taskId || "").trim();
    if (!normalizedTaskId || normalizedTaskId === "-") return;

    currentInspectionsTab = "PLAN";
    currentActiveModule = "INSPECTIONS_PLAN";
    showModule("PLAN DE INSPECCIONES PERIÓDICAS", true);
    cachedRun("apiGetInspections").then(data => {
      currentInspectionsData = data || [];
      populateVesselFilter("vessel-filter-inventory", currentInspectionsData, "VesselName");
      renderInspectionsTable();
      const match = currentInspectionsData.find(item => normalizeRefKey(item.TaskID) === normalizeRefKey(normalizedTaskId));
      if (match) openGeneralModal(match._rowIndex, "INSPECTIONS");
      else showToast(`No se encontró la inspección ${normalizedTaskId}`, "error");
    }).catch(err => showToast("Error al abrir inspección: " + err.message, "error"));
  }

  function focusInspectionLogByTaskId(taskId) {
    const normalizedTaskId = String(taskId || "").trim();
    if (!normalizedTaskId || normalizedTaskId === "-") return;

    currentInspectionsTab = "LOG";
    currentActiveModule = "INSPECTIONS_LOG";
    showModule("REGISTROS DE INSPECCIONES PERIÓDICAS", true);
    cachedRun("apiFindLatestInspectionLogByTaskId", [normalizedTaskId], 0).then(match => {
      if (match) {
        currentInspectionsLogData = [match];
        renderInspectionsTable();
        openGeneralModal(match._rowIndex, "INSPECTIONS_LOG");
      }
      else showToast(`No se encontró historial para ${normalizedTaskId}`, "error");
    }).catch(err => showToast("Error al abrir historial: " + err.message, "error"));
  }

  function focusDefectByReference(otId, taskId) {
    const normalizedOtId = String(otId || "").trim();
    const normalizedTaskId = String(taskId || "").trim();
    if ((!normalizedOtId || normalizedOtId === "-") && (!normalizedTaskId || normalizedTaskId === "-")) return;

    showModule("DEFECT LOG", true);
    clearCache("apiGetDefects");
    cachedRun("apiGetDefects", [], 0).then(data => {
      currentDefectData = data || [];
      populateVesselFilter("vessel-filter-defect", currentDefectData, "Embarcacion");
      renderDefectTable();
      const match = currentDefectData.find(item => normalizedOtId && normalizeRefKey(item.OT_Asociada) === normalizeRefKey(normalizedOtId))
        || currentDefectData.find(item => normalizedTaskId && normalizeRefKey(item.TaskID) === normalizeRefKey(normalizedTaskId));
      if (match) openGeneralModal(match._rowIndex, "DEFECT_LOG");
      else showToast("No se encontró defecto relacionado", "error");
    }).catch(err => showToast("Error al abrir defecto: " + err.message, "error"));
  }

  // --- CAPA LOG (PROC-MAN-19) ---
  let currentCapaData = [];
  function loadCapaTable() {
    const container = document.getElementById("capa-table-container");
    container.innerHTML = `<div class="loading-state" style="padding: 2rem; text-align: center; color: var(--text-muted);"><span class="material-symbols-outlined" style="animation: spin 2s linear infinite;">sync</span> Sincronizando Registros CAPA...</div>`;
    
    cachedRun("apiGetCAPAs")
      .then(data => {
        currentCapaData = data || [];
        populateVesselFilter("vessel-filter-capa", currentCapaData, "Embarcacion");
        renderCapaTable();
      })
      .catch(err => {
        container.innerHTML = `<div style="padding: 2rem; color: var(--accent-red);">Error al cargar CAPA: ${err.message}</div>`;
      });
  }

  function filterCapaTable() {
    renderCapaTable();
  }

  function renderCapaTable() {
    const container = document.getElementById("capa-table-container");
    const vFilter = document.getElementById("vessel-filter-capa").value;

    let filtered = currentCapaData;
    if (vFilter && vFilter !== "") {
      filtered = filtered.filter(d => (d.Embarcacion || "").toString().toUpperCase() === vFilter.toUpperCase());
    }

    filtered.sort((a, b) => {
      const idA = (a.CAPA_ID || "").toString();
      const idB = (b.CAPA_ID || "").toString();
      return idB.localeCompare(idA);
    });

    let html = `
      <div style="margin-bottom: 1.5rem; display: flex; gap: 1rem;">
         <button class="btn-primary" onclick="openGeneralModal(null, 'CAPA_LOG')" style="background-color: var(--accent-cyan); display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 1.2rem; text-transform: uppercase;">
           <span class="material-symbols-outlined fs-md">add_shield</span> REGISTRAR NUEVA ACCIÓN CAPA
         </button>
      </div>`;

    if (filtered.length === 0) {
      container.innerHTML = html + `<div style="text-align:center; padding: 2rem; color: var(--text-muted);">No hay acciones CAPA registradas.</div>`;
      return;
    }

    html += `<table class="data-table">
                <thead>
                    <tr>
                        <th>ID / ORIGEN</th>
                        <th>EMBARCACIÓN</th>
                        <th>DESCRIPCIÓN</th>
                        <th>RESPONSABLE</th>
                        <th>DEADLINE (SLA)</th>
                        <th>ESTADO</th>
                    </tr>
                </thead>
                <tbody>`;

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    filtered.forEach(item => {
      const deadline = parseDateManual(item.Fecha_Compromiso);
      let slaClass = "tb-blue";
      let slaText = formatDateUI(item.Fecha_Compromiso) || "Sin Fecha";

      // SLA Semáforo Login (PROC-MAN-19)
      if (deadline) {
        const diffTime = deadline.getTime() - today.getTime();
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        if (item.Status === "CLOSED" || item.Status === "VERIFIED") {
          slaClass = "tb-green";
        } else if (diffDays < 0) {
          slaClass = "tb-red";
          slaText += " (VENCIDA)";
        } else if (diffDays <= 7) {
          slaClass = "tb-yellow";

  function collectCurrentDefectPdfPayload() {
    const existing = getCurrentDefectRecordFromContext() || {};
    const form = document.getElementById('general-form');
    const payload = Object.assign({}, existing);

    DEFECT_FIELDS.forEach(field => {
      const el = form && form[field.name];
      if (el) payload[field.name] = el.value;
    });

    payload.Defecto_ID = (currentDefectFormContext && currentDefectFormContext.defectId) || existing.Defecto_ID || '';
    payload.RCA_ID = payload.RCA_ID || existing.RCA_ID || '';
    payload.Status = payload.Status || existing.Status || '';

  function handleDefectPdfAction() {
    const rowIndex = currentDefectFormContext && currentDefectFormContext.rowIndex;
    const defectId = currentDefectFormContext && currentDefectFormContext.defectId;
    if (!rowIndex || !defectId) {
      showToast('Guardá primero el defecto para generar el PDF.', 'error');
      return;
    }

    const btn = document.getElementById('btn-defect-pdf');
    const originalHtml = btn ? btn.innerHTML : '';
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = `<span class="material-symbols-outlined fs-sm" style="animation: spin 2s linear infinite;">sync</span> PROCESANDO...`;
    }

    const payload = collectCurrentDefectPdfPayload();

    google.script.run
      .withSuccessHandler(res => {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = originalHtml;
        }

        if (!res || res.success === false) {
          showToast((res && res.message) || 'No se pudo generar el PDF del defecto.', 'error');
          return;
        }

        const linkField = document.getElementById('field-Link_PDF');
        if (linkField) linkField.value = res.url || '';
        updateDefectPdfButtonState(res.url || '');

        const existing = getCurrentDefectRecordFromContext();
        if (existing) existing.Link_PDF = res.url || '';

        clearCache('apiGetDefects');
        showToast('PDF del defecto generado', 'success');
        openPdfPreviewModal(res.previewUrl || res.url, res.name || defectId || 'PDF Defecto');
      })
      .withFailureHandler(err => {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = originalHtml;
        }
        showToast('Error al generar PDF del defecto: ' + ((err && err.message) || err), 'error');
      })
      .apiGenerateDefectPdf(rowIndex, payload);
  }

    const stamp = new Date(`${item?.Date || '2000-01-01'}T${item?.Time || '00:00'}`);
    return isNaN(stamp.getTime()) ? new Date('2000-01-01T00:00:00') : stamp;
  }

  function _parseRoutePosition_(rawValue) {
    const raw = String(rawValue || '').trim();
    if (!raw) return null;

    function parseSignedCoordinate(segment, negativeHemisphere, positiveHemisphere) {
      const text = String(segment || '').trim().toUpperCase();
      const match = text.match(/-?\d+(?:\.\d+)?/);
      if (!match) return null;

      let value = parseFloat(match[0]);
      if (!isFinite(value)) return null;
      if (text.indexOf(negativeHemisphere) >= 0) value = -Math.abs(value);
      if (text.indexOf(positiveHemisphere) >= 0) value = Math.abs(value);
      return value;
    }

    const splitSegments = raw.split(/[,;|\/]/).map(item => String(item || '').trim()).filter(Boolean);
    if (splitSegments.length >= 2) {
      const latSegment = splitSegments[0];
      const lonSegment = splitSegments[1];
      const lat = parseSignedCoordinate(latSegment, 'S', 'N');
      const lon = parseSignedCoordinate(lonSegment, 'W', 'E');
      if (isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180) {
        return { lat, lon };
      }
    }

    const matches = raw.replace(/[°]/g, ' ').match(/-?\d+(?:\.\d+)?/g);
    if (!matches || matches.length < 2) return null;

    let lat = parseFloat(matches[0]);
    let lon = parseFloat(matches[1]);
    const upper = raw.toUpperCase();
    if (upper.indexOf('S') >= 0 && upper.indexOf('N') === -1) lat = -Math.abs(lat);
    if (upper.indexOf('W') >= 0 && upper.indexOf('E') === -1) lon = -Math.abs(lon);
    if (!isFinite(lat) || !isFinite(lon)) return null;
    if (Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;

    return { lat, lon };
  }

  function _getDefaultRouteVessel_() {
    const assigned = parseAssignedVessels();
    if (shouldAutoLockSpareVessel() && assigned.length === 1) return assigned[0];

    const available = [...new Set((currentDailyData || []).map(item => String(item.VesselName || '').trim()).filter(Boolean))].sort();
    if (!available.length) return '';
    if (currentRouteSelectedVessel && available.includes(currentRouteSelectedVessel)) return currentRouteSelectedVessel;

    const latest = (currentDailyData || [])
      .filter(item => String(item.VesselName || '').trim())
      .sort((a, b) => _getDailyReportTimestamp_(b) - _getDailyReportTimestamp_(a))[0];

    return latest && latest.VesselName ? String(latest.VesselName).trim() : available[0];
  }

  function loadVoyageRouteData(forceReload = false) {
    const container = document.getElementById('route-view-content');
    const vesselSelect = document.getElementById('vessel-filter-route');
    if (!container || !vesselSelect) return;

    if (forceReload) {
      clearCache('apiGetDailyReports');
      clearCache('apiGetVessels');
    }

    container.innerHTML = `<div class="loading-state" style="padding: 2rem; text-align: center; color: var(--text-muted);"><span class="material-symbols-outlined" style="animation: spin 2s linear infinite;">sync</span> Consolidando posiciones reportadas...</div>`;

    Promise.all([
      forceReload || !currentDailyData.length ? cachedRun('apiGetDailyReports', [], 0) : Promise.resolve(currentDailyData),
      forceReload || !currentVesselsData.length ? cachedRun('apiGetVessels', [], 0) : Promise.resolve(currentVesselsData)
    ]).then(([dailyData, vesselsData]) => {
      currentDailyData = dailyData || [];
      currentVesselsData = vesselsData || [];

      populateVesselFilter('vessel-filter-route', currentDailyData, 'VesselName');
      if (vesselSelect.options.length) vesselSelect.options[0].text = 'Selecciona embarcacion';

      const defaultVessel = _getDefaultRouteVessel_();
      vesselSelect.value = defaultVessel || '';

      const assigned = parseAssignedVessels();
      vesselSelect.disabled = shouldAutoLockSpareVessel() && assigned.length === 1;
      renderVoyageRouteView();
    }).catch(err => {
      container.innerHTML = `<div style="padding: 2rem; color: var(--accent-red);">Error al cargar recorrido: ${escapeInlineHtml((err && err.message) || err)}</div>`;
    });
  }

  function _buildVoyageRouteRecords_(vesselName) {
    const vesselKey = String(vesselName || '').trim().toUpperCase();
    if (!vesselKey) return [];

    return (currentDailyData || [])
      .filter(item => String(item.VesselName || '').trim().toUpperCase() === vesselKey)
      .sort((a, b) => {
        const stampDiff = _getDailyReportTimestamp_(a) - _getDailyReportTimestamp_(b);
        if (stampDiff !== 0) return stampDiff;
        return String(a.ReportID || '').localeCompare(String(b.ReportID || ''));
      })
      .map((item, index) => {
        const coords = _parseRoutePosition_(item.Position);
        const timestamp = _getDailyReportTimestamp_(item);
        return {
          index: index + 1,
          reportId: String(item.ReportID || '').trim() || '-',
          vesselName: String(item.VesselName || '').trim() || '-',
          voyageNumber: String(item.Voyage_Number || '').trim() || '-',
          positionRaw: String(item.Position || '').trim() || '-',
          operationalStatus: String(item.Operational_Status || '').trim() || '-',
          status: String(item.Status || 'BORRADOR').trim() || 'BORRADOR',
          dateLabel: formatDateUI(item.Date) || '-',
          timeLabel: String(item.Time || '').trim() || '-',
          timestamp: timestamp,
          coords: coords,
        };
      });
  }

    const coordRecords = (records || []).filter(record => record.coords);
    if (!coordRecords.length) {
      return `<div class="route-empty-state"><span class="material-symbols-outlined">explore_off</span><div>No hay coordenadas numéricas suficientes para trazar el recorrido.</div><div style="font-size:0.78rem; color:var(--text-muted);">La línea de tiempo igualmente muestra las posiciones textuales informadas en DAILY_REPORTS.</div></div>`;
    }

    return `

        <div id="voyage-route-map" class="route-map-canvas" role="img" aria-label="Mapa con recorrido reportado de la embarcacion"></div>
      </div>`;

  function _destroyVoyageRouteMap_() {
    if (currentVoyageRouteMap) {
      currentVoyageRouteMap.remove();
      currentVoyageRouteMap = null;
    }
  }

  function _renderVoyageRouteMap_(records) {
    const coordRecords = (records || []).filter(record => record.coords);
    const mapContainer = document.getElementById('voyage-route-map');
    _destroyVoyageRouteMap_();
    if (!coordRecords.length || !mapContainer) return;

    if (!window.L || typeof window.L.map !== 'function') {
      mapContainer.innerHTML = `<div class="route-map-error">No se pudo cargar la librería de mapas en este navegador.</div>`;
      return;
    }

    currentVoyageRouteMap = window.L.map(mapContainer, {
      zoomControl: true,
      attributionControl: true,
    });

    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(currentVoyageRouteMap);

    const latLngs = coordRecords.map(item => [item.coords.lat, item.coords.lon]);
    window.L.polyline(latLngs, {
      color: '#06b6d4',
      weight: 4,
      opacity: 0.85,
    }).addTo(currentVoyageRouteMap);

    coordRecords.forEach((item, idx) => {
      const isFirst = idx === 0;
      const isLast = idx === coordRecords.length - 1;
      const marker = window.L.circleMarker([item.coords.lat, item.coords.lon], {
        radius: isLast ? 8 : (isFirst ? 7 : 5),
        color: isFirst ? '#10b981' : (isLast ? '#f97316' : '#06b6d4'),
        weight: 2,
        fillColor: isFirst ? '#10b981' : (isLast ? '#f97316' : '#06b6d4'),
        fillOpacity: 0.92,
      }).addTo(currentVoyageRouteMap);

      marker.bindPopup(`
        <div style="min-width:190px; color:#0f172a; font-family:Inter,sans-serif;">
          <div style="font-weight:800; margin-bottom:4px;">${escapeInlineHtml(item.positionRaw)}</div>
          <div style="font-size:12px; margin-bottom:4px;">${escapeInlineHtml(item.dateLabel)} ${escapeInlineHtml(item.timeLabel)}</div>
          <div style="font-size:12px; margin-bottom:4px;">Reporte ${escapeInlineHtml(item.reportId)} | Viaje ${escapeInlineHtml(item.voyageNumber)}</div>
          <div style="font-size:12px;">Lat ${item.coords.lat.toFixed(5)} | Lon ${item.coords.lon.toFixed(5)}</div>
        </div>`);
    });

    if (latLngs.length === 1) {
      currentVoyageRouteMap.setView(latLngs[0], 11);
    } else {
      currentVoyageRouteMap.fitBounds(latLngs, { padding: [30, 30] });
    }

    requestAnimationFrame(() => {
      if (currentVoyageRouteMap) currentVoyageRouteMap.invalidateSize();
    });
  }

  function loadMaintenancePlanTable() {
    const container = document.getElementById("work-orders-table-container");
    const kpiContainer = document.getElementById("wo-kpi-container");
    if (kpiContainer) kpiContainer.style.display = "none";

    container.innerHTML = `<div class="loading-state" style="padding: 2rem; text-align: center; color: var(--text-muted);"><span class="material-symbols-outlined" style="animation: spin 2s linear infinite;">sync</span> Sincronizando Plan Maestro y OTs desde Spreadsheet...</div>`;

    const finalizePlanLoad = (planData, woIndexData, vesselsData, dailyHoursIndex) => {
      const sfiCounters = {};
      (planData || []).forEach(item => {
        const sfi = (getVal(item, "SFI", "AssetID", "CODIGO") || "N/A").toString().trim();
        if (!sfiCounters[sfi]) sfiCounters[sfi] = 0;
        sfiCounters[sfi]++;
        if (!item.TaskID || item.TaskID === "-" || item.TaskID === "") {
          item.TaskID = `${sfi}-T${String(sfiCounters[sfi]).padStart(2, '0')}`;
        }
      });

      currentMaintenancePlanData = planData || [];
      currentMaintenanceWorkOrdersIndex = woIndexData || [];
      currentVesselsData = vesselsData || [];
      currentMaintenanceDailyHoursIndex = dailyHoursIndex || { latestHoursByVessel: {}, latestHoursBySFI: {} };
      populateVesselFilter("vessel-filter-work-orders", currentMaintenancePlanData, "VesselName");
      renderMaintenancePlanTable();
    };

    Promise.all([
      cachedRun("apiGetMaintenancePlan"),
      cachedRun("apiGetWorkOrdersPlanIndex"),
      cachedRun("apiGetVessels"),
      cachedRun("apiGetDailyHoursIndex")
    ]).then(([planData, woIndexData, vesselsData, dailyHoursIndex]) => {
      const hasMissingTaskIds = (planData || []).some(item => !item.TaskID || item.TaskID === "-" || item.TaskID === "");

      if (!hasMissingTaskIds) {
        finalizePlanLoad(planData, woIndexData, vesselsData, dailyHoursIndex);
        return;
      }

      cachedRun("apiSyncMaintenanceIDs", [], 0)
        .catch(err => {
          console.warn("No se pudieron sincronizar TaskID del plan antes de cargar:", err);
        })
        .finally(() => {
          clearCache("apiGetMaintenancePlan");
          cachedRun("apiGetMaintenancePlan", [], 0)
            .then(refreshedPlanData => finalizePlanLoad(refreshedPlanData, woIndexData, vesselsData, dailyHoursIndex))
            .catch(err => {
              container.innerHTML = `<div class="error-state" style="padding:2rem; color:var(--accent-red);">Error cargando datos: ${err.message || err}</div>`;
            });
        });
    }).catch(err => {
      container.innerHTML = `<div class="error-state" style="padding:2rem; color:var(--accent-red);">Error cargando datos: ${err.message || err}</div>`;
    });
  }
