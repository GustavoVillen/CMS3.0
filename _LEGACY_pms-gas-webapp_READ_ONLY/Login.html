<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mercurio PMS - Ingreso</title>
    <style>
      :root {
        --bg-main: #08111f;
        --bg-card: #13233a;
        --border: rgba(51, 214, 255, 0.25);
        --accent: #18c7e6;
        --accent-2: #f97316;
        --text: #eef6ff;
        --muted: #8aa3bf;
        --danger: #ff6b6b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(24,199,230,0.12), transparent 35%),
          radial-gradient(circle at bottom right, rgba(249,115,22,0.10), transparent 30%),
          var(--bg-main);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, sans-serif;
      }
      .card {
        width: min(420px, calc(100vw - 32px));
        background: linear-gradient(180deg, rgba(19,35,58,0.98), rgba(13,25,44,0.98));
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 24px 80px rgba(0,0,0,0.35);
      }
      .eyebrow { color: var(--accent); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; margin-bottom: 10px; }
      h1 { margin: 0 0 8px; font-size: 28px; }
      p { margin: 0 0 20px; color: var(--muted); line-height: 1.5; }
      label { display:block; margin: 14px 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
      input {
        width: 100%;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(5,13,25,0.75);
        color: var(--text);
        border-radius: 12px;
        padding: 14px 15px;
        font-size: 15px;
        outline: none;
      }
      input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(24,199,230,.15); }
      button {
        width: 100%;
        margin-top: 20px;
        border: 0;
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: .06em;
        text-transform: uppercase;
        background: linear-gradient(90deg, var(--accent), #10b3de);
        color: #04101d;
        cursor: pointer;
      }
      button[disabled] { opacity: .6; cursor: wait; }
      .helper { margin-top: 16px; font-size: 12px; color: var(--muted); }
      .error { margin-top: 14px; color: var(--danger); min-height: 18px; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="eyebrow">Mercurio PMS</div>
      <h1>Ingreso seguro</h1>
      <p>Iniciá sesión con tu <strong>USER_ID</strong> y contraseña. El acceso queda definido por la tabla <code>_USERS</code>.</p>

      <label for="user-id">USER_ID</label>
      <input id="user-id" type="text" autocomplete="username">

      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password">

      <button id="login-btn" type="button" onclick="submitLogin()">Ingresar</button>
      <div class="error" id="login-error"></div>
      <div class="helper">Si es el primer acceso, un administrador debe cargar tu usuario en <code>_USERS</code> y definir tu contraseña con <code>setUserPassword('USER_ID','clave')</code>.</div>
    </div>

    <script>
      function submitLogin() {
        const userId = document.getElementById('user-id').value.trim();
        const password = document.getElementById('password').value;
        const btn = document.getElementById('login-btn');
        const error = document.getElementById('login-error');

        error.textContent = '';
        if (!userId || !password) {
          error.textContent = 'Ingresá USER_ID y contraseña.';
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Validando...';

        google.script.run
          .withSuccessHandler(function () {
            window.location.reload();
          })
          .withFailureHandler(function (err) {
            error.textContent = (err && err.message) ? err.message : 'No se pudo iniciar sesión.';
            btn.disabled = false;
            btn.textContent = 'Ingresar';
          })
          .apiLogin(userId, password);
      }

      document.getElementById('password').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') submitLogin();
      });
      document.getElementById('user-id').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') submitLogin();
      });
    </script>
  </body>
</html>
