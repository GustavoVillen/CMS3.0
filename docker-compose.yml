version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: gpms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pms_saas
    ports:
      - "5434:5432"
    volumes:
      - gpms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pms_saas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gpms_pgdata:
