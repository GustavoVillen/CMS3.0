name: cms3

services:
  postgres:
    image: postgres:16-alpine
    container_name: cms3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cms3
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cms3"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
