<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>OT Equipo Nuevo — Preview V1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* Tokens LIGHT reales de apps/web-modern/src/index.css */
  :root{
    --bg:#F4F5F7; --surface:#FFFFFF; --fg:#1A1D24; --border:#E2E4E9;
    --accent:#0284C7; --accent-fg:#fff; --success:#0E9F6E; --warning:#D97706; --danger:#DC2626;
    --fg5:rgba(26,29,36,.05); --fg10:rgba(26,29,36,.10); --fg25:rgba(26,29,36,.25);
    --muted:rgba(26,29,36,.60); --faint:rgba(26,29,36,.40);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:14px}
  button{font-family:inherit;cursor:pointer}
  button:disabled{cursor:not-allowed}

  .pv-bar{position:sticky;top:0;z-index:100;background:#111827;color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .pv-bar b{font-size:13px;margin-right:8px}
  .pv-bar .tag{background:#F59E0B;color:#111;font-weight:800;font-size:10px;padding:2px 8px;border-radius:99px;letter-spacing:.05em}
  .pv-bar button{background:#374151;color:#fff;border:0;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600}
  .pv-bar button.on{background:var(--accent)}
  .pv-bar .sp{flex:1}
  .pv-bar .grp{display:flex;gap:4px;align-items:center;font-size:11px;color:#D1D5DB}

  .app-bg{min-height:calc(100vh - 48px);padding:24px 16px}
  .fake-page{max-width:1100px;margin:0 auto;opacity:.55}
  .fake-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .fake-header h1{font-size:18px;margin:0}
  .fake-row{height:38px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:6px}
  .overlay{position:fixed;inset:48px 0 0 0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}

  .modal{width:100%;max-width:672px;background:var(--surface);border:1px solid var(--fg10);border-radius:16px;box-shadow:0 25px 50px -12px rgba(0,0,0,.35);display:flex;flex-direction:column;max-height:calc(100vh - 96px)}
  .modal.wide{max-width:780px}
  .m-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 24px;border-bottom:1px solid var(--fg10)}
  .m-head h2{font-size:14px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px}
  .m-body{padding:20px 24px;overflow-y:auto;flex:1}
  .m-foot{display:flex;align-items:center;gap:8px;padding:14px 24px;border-top:1px solid var(--fg10)}
  .close{width:32px;height:32px;border-radius:99px;background:#E11D48;color:#fff;border:0;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .close:hover{background:#F43F5E}
  .ic{width:16px;height:16px}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  .btn-primary{background:var(--accent);color:var(--accent-fg);border:0;border-radius:12px;padding:9px 18px;font-weight:700;font-size:12px;display:inline-flex;align-items:center;gap:6px}
  .btn-primary:hover{filter:brightness(1.1)}
  .btn-ghost{background:transparent;border:0;border-radius:12px;padding:9px 14px;font-size:12px;color:var(--fg)}
  .btn-ghost:hover{background:var(--fg5)}
  .lnk{background:none;border:0;color:var(--accent);font-size:11px;font-weight:600;padding:0}

  .stepper{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .st{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--faint)}
  .st .dot{width:20px;height:20px;border-radius:99px;border:1.5px solid var(--fg25);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
  .st.done{color:var(--success)} .st.done .dot{background:var(--success);border-color:var(--success);color:#fff}
  .st.cur{color:var(--accent)} .st.cur .dot{border-color:var(--accent);background:rgba(2,132,199,.1)}
  .st-line{width:16px;height:1px;background:var(--fg25)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:rgba(2,132,199,.05);border:1px solid rgba(2,132,199,.25);color:var(--fg);border-radius:99px;padding:4px 10px;font-size:11px}
  .chip svg{width:12px;height:12px}
  .q{font-size:17px;font-weight:800;margin:4px 0 4px}
  .q-sub{font-size:12px;color:var(--muted);margin:0 0 16px}

  .opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--fg5);border:1.5px solid var(--fg10);border-radius:16px;padding:14px 16px;margin-bottom:10px;transition:.15s;color:var(--fg)}
  .opt:hover{border-color:rgba(2,132,199,.5);background:rgba(2,132,199,.05)}
  .opt.sel{border-color:var(--accent);background:rgba(2,132,199,.06)}
  .opt .oi{width:40px;height:40px;border-radius:12px;background:rgba(2,132,199,.1);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .opt .oi svg{width:22px;height:22px}
  .opt .ot{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .opt .od{font-size:12px;color:var(--muted);margin-top:2px}
  .opt .chev{margin-left:auto;color:var(--faint);width:16px;height:16px;flex-shrink:0}
  .opt.green .oi{background:rgba(14,159,110,.1);color:var(--success)}
  .opt.amber .oi{background:rgba(217,119,6,.1);color:var(--warning)}
  .opt.muted-i .oi{background:var(--fg5);color:var(--muted)}
  .badge{font-size:10px;font-weight:700;border-radius:99px;padding:2px 8px}
  .b-new{background:rgba(14,159,110,.12);color:#047857}
  .b-rec{background:rgba(2,132,199,.12);color:var(--accent)}
  .b-st{background:var(--fg5);color:var(--muted)}
  .b-ok{background:rgba(14,159,110,.12);color:#047857}
  .b-warn{background:rgba(217,119,6,.12);color:#B45309}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}}

  .search{position:relative}
  .search input{width:100%;background:var(--fg5);border:1px solid var(--fg10);border-radius:12px;padding:11px 12px 11px 38px;font-size:14px;color:var(--fg);font-family:inherit}
  .search input:focus{outline:none;border-color:rgba(2,132,199,.5)}
  .search svg{position:absolute;left:12px;top:12px;width:16px;height:16px;color:var(--faint)}
  .list{margin-top:10px;border:1px solid var(--fg10);border-radius:12px;max-height:300px;overflow:auto}
  .li{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--fg10);background:var(--surface);padding:10px 12px;font-size:13px;color:var(--fg)}
  .li:last-child{border-bottom:0}
  .li:hover{background:rgba(2,132,199,.05)}
  .li .nm{flex:1;min-width:0;font-weight:600}
  .li .sub{display:block;font-weight:400;font-size:11px;color:var(--muted)}
  .li .code{font-family:ui-monospace,monospace;font-size:11px;color:var(--faint)}

  .sec{border:1px solid var(--fg10);border-radius:14px;padding:14px 16px;margin-bottom:12px}
  .sec-t{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px;display:flex;align-items:center;gap:8px}
  .f{margin-top:12px}
  .lbl-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
  .lbl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .req{color:var(--danger)}
  .need{font-size:10px;font-weight:700;color:#B45309;background:rgba(217,119,6,.12);border-radius:99px;padding:1px 7px}
  .in{width:100%;background:var(--fg5);border:1px solid var(--fg10);border-radius:12px;padding:8px 12px;font-size:14px;color:var(--fg);font-family:inherit}
  .in:focus{outline:none;border-color:rgba(2,132,199,.5)}
  .in.miss{border-color:rgba(217,119,6,.55);background:rgba(217,119,6,.04)}
  .in.mono{font-family:ui-monospace,monospace;font-size:13px}
  textarea.in{resize:vertical;min-height:62px;line-height:1.45}
  .row{display:grid;gap:12px}
  .c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}
  @media(max-width:640px){.c2,.c3{grid-template-columns:1fr}}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg button{background:var(--fg5);border:1.5px solid var(--fg10);border-radius:10px;padding:7px 14px;font-size:12px;font-weight:700;color:var(--fg)}
  .seg button.on[data-v="A"]{background:#B91C1C;border-color:#B91C1C;color:#fff}
  .seg button.on[data-v="B"]{background:#D97706;border-color:#D97706;color:#fff}
  .seg button.on[data-v="C"]{background:#475569;border-color:#475569;color:#fff}
  .ai{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--accent);background:rgba(2,132,199,.08);border:1px solid rgba(2,132,199,.25);border-radius:99px;padding:2px 9px}
  .ai svg{width:12px;height:12px}
  .tog{display:flex;align-items:flex-start;gap:10px;margin-top:12px;font-size:13px;cursor:pointer}
  .tog input{width:16px;height:16px;margin-top:2px;accent-color:var(--accent)}
  .help{font-size:11px;color:var(--muted);margin-top:4px}

  .banner{display:flex;gap:10px;border-radius:12px;padding:10px 12px;font-size:12px;margin-bottom:14px;line-height:1.45}
  .banner svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}
  .banner.info{background:rgba(2,132,199,.06);border:1px solid rgba(2,132,199,.22)} .banner.info svg{color:var(--accent)}
  .banner.ok{background:rgba(14,159,110,.07);border:1px solid rgba(14,159,110,.25)} .banner.ok svg{color:var(--success)}
  .banner.warn{background:rgba(217,119,6,.07);border:1px solid rgba(217,119,6,.3)} .banner.warn svg{color:var(--warning)}
  .banner b{font-weight:700}

  .cmp{width:100%;border-collapse:collapse;font-size:12px;margin:-4px 0 14px}
  .cmp th{text-align:left;font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding:4px 8px}
  .cmp td{padding:6px 8px;border-top:1px solid var(--fg10)}
  .cmp td.diff{color:#B45309;font-weight:700}
  .cmp td.same{color:#047857;font-weight:700}

  .radio-card{border:1.5px solid var(--fg10);border-radius:14px;margin-bottom:10px;background:var(--surface)}
  .radio-card.sel{border-color:var(--accent);background:rgba(2,132,199,.04)}
  .radio-card .rh{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:12px 14px;color:var(--fg)}
  .radio{width:18px;height:18px;border-radius:99px;border:2px solid var(--fg25);margin-top:1px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .sel .radio{border-color:var(--accent)}
  .sel .radio::after{content:"";width:8px;height:8px;border-radius:99px;background:var(--accent)}
  .rt{font-weight:700;font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .rd{font-size:12px;color:var(--muted);margin-top:2px}
  .rb{padding:0 14px 14px 44px}

  .mocli{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--fg10);border-radius:10px;background:var(--surface);padding:8px 10px;margin-top:6px;font-size:12px;color:var(--fg)}
  .mocli.on{border-color:var(--accent);background:rgba(2,132,199,.05)}
  .mocli .mc{font-family:ui-monospace,monospace;font-weight:700;font-size:11px}

  .srcs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .srcs button{background:var(--fg5);border:1.5px solid var(--fg10);border-radius:10px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--fg);display:inline-flex;gap:6px;align-items:center}
  .srcs button.on{border-color:var(--accent);background:rgba(2,132,199,.08);color:var(--accent)}
  .srcs button svg{width:14px;height:14px}
  .tasks{border:1px solid var(--fg10);border-radius:12px;overflow:hidden}
  .tasks-h{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--fg5);font-size:11px;color:var(--muted);font-weight:600}
  .task{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-top:1px solid var(--fg10);font-size:13px;cursor:pointer}
  .task input{width:16px;height:16px;margin-top:2px;accent-color:var(--accent)}
  .task .tc{font-family:ui-monospace,monospace;font-size:11px;color:var(--faint)}
  .task .fr{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap;padding-left:8px}
  .task.off{opacity:.5}
  .empty{border:1.5px dashed var(--fg25);border-radius:12px;padding:18px;text-align:center;font-size:12px;color:var(--muted)}

  .sum{border:1px solid var(--fg10);border-radius:14px;margin-bottom:12px}
  .sum-r{display:flex;gap:12px;padding:10px 14px;border-top:1px solid var(--fg10);font-size:13px;align-items:flex-start}
  .sum-r:first-child{border-top:0}
  .sum-r .k{width:120px;flex-shrink:0;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
  .sum-r .v{flex:1;min-width:0}
  .sum-r .v small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
  .when{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:640px){.when{grid-template-columns:1fr}}
  .when > div{border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.5}
  .when h4{margin:0 0 6px;font-size:12px;display:flex;align-items:center;gap:6px}
  .when h4 svg{width:14px;height:14px}
  .when ul{margin:0;padding-left:18px}
  .now{background:rgba(2,132,199,.05);border:1px solid rgba(2,132,199,.2)}
  .later{background:rgba(14,159,110,.06);border:1px solid rgba(14,159,110,.25)}

  .alert-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
  .alert{background:var(--surface);border-radius:16px;max-width:420px;width:100%;padding:20px;box-shadow:0 25px 50px -12px rgba(0,0,0,.4)}
  .alert h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
  .alert p{margin:0 0 6px;font-size:13px;color:var(--muted);white-space:pre-line}
  .alert .ok{display:flex;justify-content:flex-end;margin-top:14px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#065F46;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:300;display:flex;gap:8px;align-items:center}
  .wo-desc{white-space:pre-line;font-size:13px;line-height:1.55;background:var(--fg5);border:1px solid var(--fg10);border-radius:12px;padding:10px 12px}
</style>
</head>

<div class="pv-bar">
  <b>Nueva OT · Para un Equipo Nuevo · Preview V1</b><span class="tag">DEMO · DATOS FICTICIOS</span>

const root = document.getElementById("root"), layer = document.getElementById("layer");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
const vesselName = () => VESSELS.find(v => v.code === S.vessel)?.name ?? "";
const oldAsset = () => ASSETS.find(a => a.id === S.oldId) ?? null;

// Código sugerido: mismo algoritmo que buildFormattedAssetCode (Assets.tsx)
function tok(v){ return (v||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g,"-").replace(/-+/g,"-").replace(/^-+|-+$/g,""); }
function namePrefix(n){ const t = tok(n).split("-").filter(Boolean); if(!t.length) return "AS"; return t.length>=2 ? (t[0][0]+t[1][0]) : t[0].slice(0,4); }
function suggestCode(){
  if (!S.f.group || !S.f.name.trim()) return "";
  const prefix = `${S.vessel}-${S.f.group}-${namePrefix(S.f.name)}`;
  let max = 0;
  for (const a of ASSETS) { const m = a.code.match(new RegExp("^"+prefix+"-(\\d{3,4})$")); if (m) max = Math.max(max, +m[1]); }
  return `${prefix}-${String(max+1).padStart(3,"0")}`;
}

// Recomendación de MOC: mismo criterio que la ventana "¿Tu cambio necesita MOC?" (Moc.tsx)
function mocAdvice(){
  if (S.kind === "ADD") return { needs:true, why:"Es un equipo que el buque no tenía: cambia lo que hay que operar y mantener." };
  const o = oldAsset();
  const same = o && norm(o.maker) && norm(o.maker) === norm(S.f.maker) && norm(o.model) === norm(S.f.model);
  if (same) return { needs:false, why:`Reemplazo por el mismo modelo (${o.maker} ${o.model}): igual por igual.` };
  return { needs:true, why:`Cambia marca o modelo respecto del equipo que sale (${o?.maker || "sin marca"} ${o?.model || ""}).` };
}
function fleetMatches(){
  if (!norm(S.f.maker) || !norm(S.f.model)) return [];
  return ASSETS.filter(a => a.id !== S.oldId && norm(a.maker) === norm(S.f.maker) && norm(a.model) === norm(S.f.model));
}

// ───────────── Piezas comunes ─────────────
const ICON = (n, cls="ic") => `<i data-lucide="${n}" class="${cls}"></i>`;
const STEPS = ["Para qué","Buque","Equipo","MOC","Tareas","Confirmar"];
const IDX = { category:0, vessel:1, kind:2, pickOld:2, data:2, moc:3, tasks:4, confirm:5 };
function stepper(){
  const cur = IDX[S.step];
  return `<div class="stepper">${STEPS.map((l,i)=>`${i?'<span class="st-line"></span>':""}<span class="st ${i<cur?"done":i===cur?"cur":""}"><span class="dot">${i<cur?"✓":i+1}</span>${l}</span>`).join("")}</div>`;
}
function chips(){
  if (S.step === "category") return "";
  const c = [`<span class="chip">${ICON("package-plus")} Equipo nuevo <button class="lnk" data-go="category">Cambiar</button></span>`];
  if (S.vessel && S.step !== "vessel") c.push(`<span class="chip">${ICON("ship")} <b>${esc(vesselName())}</b> <button class="lnk" data-go="vessel">Cambiar</button></span>`);
  if (S.kind === "REPLACE" && !["kind","pickOld"].includes(S.step)) c.push(`<span class="chip">${ICON("log-out")} Sale <b>${esc(oldAsset()?.name)}</b> <button class="lnk" data-go="kind">Cambiar</button></span>`);
  if (["moc","tasks","confirm"].includes(S.step) && S.f.name) {
    const mm = [S.f.maker, S.f.model].filter(Boolean).join(" ");
    c.push(`<span class="chip">${ICON("log-in")} ${S.kind==="ADD"?"Adicional":"Entra"} <b>${esc(S.f.name)}</b>${mm?` <span class="faint">${esc(mm)}</span>`:""} <button class="lnk" data-go="data">Cambiar</button></span>`);
  }
  return `<div class="chips">${c.join("")}</div>`;
}
const q = (t, s) => `<p class="q">${t}</p>${s?`<p class="q-sub">${s}</p>`:""}`;
function opt({ icon, title, desc, tone="", badge="", act, sel=false }){

}
function frame(body, foot, wide=false){
  return `<div class="modal ${wide?"wide":""}">
    <div class="m-head"><div style="min-width:0"><h2>${ICON("wrench","ic")} Nueva Orden de Trabajo</h2>${stepper()}</div><button class="close" data-act="x">${ICON("x")}</button></div>

}

  return frame(`${q("¿Este cambio necesita MOC?")}

}

      ? `<p class="help" style="margin:0 0 6px">Equipos <b>${esc(S.f.maker)} ${esc(S.f.model)}</b> en la flota:</p><div class="list" style="margin-top:0">${matches.map(a=>`<button class="li" data-act="fsrc:${a.id}">${ICON("ship","ic faint")}<span class="nm">${esc(a.name)}<span class="sub">${esc(VESSELS.find(v=>v.code===a.vessel).name)} · ${PLANS[a.id].length} tareas</span></span><span class="code">${a.code}</span></button>`).join("")}</div>`

  }
  return frame(`${q("Tareas del plan del equipo nuevo","Se copian con código nuevo. Criterios, bloqueo, riesgo y repuestos vienen con cada tarea.")}
    <div class="banner info">${ICON("hourglass")}<span>Las tareas quedan <b>en espera</b> y empiezan a contar al <b>cerrar la OT de instalación</b>, desde esa fecha. Más tareas se agregan después desde la ficha del equipo.</span></div>
    <div class="srcs">
      ${S.kind==="REPLACE"?`<button class="${S.tsrc==="OLD"?"on":""}" data-src="OLD">${ICON("repeat")} Del equipo que sale (${(PLANS[S.oldId]??[]).length})</button>`:""}

    </div>${body}`,
    `${back}<button class="btn-primary" data-act="tasks-next">Siguiente ${ICON("chevron-right")}</button>`);

// Si el que entra se llama igual que el que sale, el título nombra la marca y el modelo nuevos.

function chosenCount(){ return srcPlans().filter(p => S.checked.has(p[0])).length; }

// Después de crear: MOC (ventana existente) y OT en el editor
function mocAfter(){
  return `<div class="modal"><div class="m-head"><div><h2>${ICON("git-branch","ic")} MOC-DCH-26-0008 <span class="badge b-st">Solicitado</span></h2><p class="help" style="margin:6px 0 0">Es la ventana de MOC que ya existe, abierta con estos datos cargados.</p></div><button class="close" data-act="moc-done">${ICON("x")}</button></div>
    <div class="m-body">
      <div class="row c2"><div><span class="lbl">Tipo</span><p style="margin:4px 0 0">Cambio de equipo</p></div><div><span class="lbl">Buque</span><p style="margin:4px 0 0">${esc(vesselName())}</p></div></div>
      <div class="f"><span class="lbl">Título</span><p style="margin:4px 0 0">${esc(woTitle())}</p></div>
      <div class="f"><span class="lbl">Motivo del cambio</span><p style="margin:4px 0 0">${esc(S.moc.reason)}</p></div>
      <div class="f"><span class="lbl">Cambio propuesto</span><p style="margin:4px 0 0">${S.kind==="REPLACE"?`Reemplazo de ${esc(oldAsset().name)} (${esc(oldAsset().maker)} ${esc(oldAsset().model)}) por ${esc(S.f.name)} (${esc(S.f.maker)} ${esc(S.f.model)}).`:`Instalación de ${esc(S.f.name)} (${esc(S.f.maker)} ${esc(S.f.model)}).`}</p></div>
      <div class="f"><span class="lbl">Vinculado a</span><p style="margin:4px 0 0">Equipo ${esc(S.f.code)} · ${S.created}</p></div>
      <div class="banner info" style="margin-top:14px">${ICON("info")}<span>Acá sigue el formulario REGI-GES-06.1 completo (evaluación previa, opinión técnica, plan de acción), igual que hoy.</span></div>
    </div>
    <div class="m-foot"><span style="flex:1"></span><button class="btn-primary" data-act="moc-done">Guardar y seguir a la OT</button></div></div>`;
}
function otAfter(){
  const ml = mocLine(), n = chosenCount();
  const desc = `${S.kind==="REPLACE" ? `${woTitle()} (sale ${oldAsset().code}, entra ${S.f.code}).` : `Instalación de equipo nuevo: ${S.f.name} (${S.f.code}).`}
Marca/modelo: ${[S.f.maker,S.f.model].filter(Boolean).join(" ") || "—"} · N° de serie: ${S.f.serial || "—"}
MOC: ${S.moc.mode==="NEW" ? "MOC-DCH-26-0008" : S.moc.mode==="EXISTING" ? MOCS.find(y=>y.id===S.moc.mocId).code : "No requiere — " + S.moc.notReq}
Tareas del plan copiadas: ${n} (en espera hasta el cierre de esta OT).
Al cerrar esta OT: las tareas del equipo nuevo empiezan a contar${S.kind==="REPLACE" ? ` y ${oldAsset().name} se da de baja con sus tareas` : ""}.`;
  return `<div class="modal wide"><div class="m-head"><div><h2>${ICON("wrench","ic")} ${S.created} <span class="badge b-st">Planificada</span></h2><p class="help" style="margin:6px 0 0">Editor de la OT que ya existe (resumido para el preview).</p></div><button class="close" data-act="x">${ICON("x")}</button></div>
    <div class="m-body">
      <div class="f" style="margin-top:0"><span class="lbl">Título</span><p style="margin:4px 0 0;font-weight:700">${esc(woTitle())}</p></div>
      <div class="row c3"><div class="f"><span class="lbl">Equipo</span><p style="margin:4px 0 0">${esc(S.f.name)}</p></div><div class="f"><span class="lbl">Tipo</span><p style="margin:4px 0 0">Correctivo programado</p></div><div class="f"><span class="lbl">Prioridad</span><p style="margin:4px 0 0">Dentro de la semana</p></div></div>
      <div class="f"><span class="lbl">Descripción (armada sola, editable)</span><div class="wo-desc" style="margin-top:6px">${esc(desc)}</div></div>
    </div>
    <div class="m-foot"><span class="help" style="margin:0">Probá «Al cerrar la OT de instalación» en la barra negra.</span></div></div>`;
}

// ───────────── Render y eventos ─────────────
function render(){
  if (S.step === "mocAfter") root.innerHTML = mocAfter();
  else if (S.step === "otAfter") root.innerHTML = otAfter();
  else root.innerHTML = V[S.step]();
  lucide.createIcons();
  const oq = document.getElementById("oldq");
  if (oq) { oq.focus(); oq.setSelectionRange(oq.value.length, oq.value.length); }
}
function alertBox(title, msg, icon="triangle-alert", color="var(--warning)"){
  layer.innerHTML = `<div class="alert-ov"><div class="alert"><h3><i data-lucide="${icon}" class="ic" style="color:${color}"></i>${title}</h3><p>${esc(msg)}</p><div class="ok"><button class="btn-primary" id="alert-ok">OK</button></div></div></div>`;
  lucide.createIcons();
  document.getElementById("alert-ok").onclick = () => layer.innerHTML = "";
}
function toast(msg){
  const el = document.createElement("div"); el.className = "toast"; el.innerHTML = `<i data-lucide="circle-check" class="ic"></i>${esc(msg)}`;
  document.body.appendChild(el); lucide.createIcons(); setTimeout(() => el.remove(), 2600);
}
function prefillFromOld(){
  const o = oldAsset();
  S.f = { group:o.group, name:o.name, code:"", codeTouched:false, maker:"", model:"", serial:"", crit:o.crit, safety:o.safety, rationale:"" };
  S.f.code = suggestCode();
}
function goBack(){
  const prev = { vessel:"category", kind:"vessel", pickOld:"kind", data: S.kind==="REPLACE"?"pickOld":"kind", moc:"data", tasks:"moc", confirm:"tasks" };
  if (S.step === "tasks" && S.tsrc === "FLEET" && S.tsrcAsset && S.kind !== "REPLACE") { S.tsrcAsset = null; return render(); }
  S.step = prev[S.step] ?? "category"; render();
}
function enterMoc(){
  const adv = mocAdvice();
  if (!S.mocTouched) {
    S.moc.mode = adv.needs ? "NEW" : "NOT_REQUIRED";
    if (!adv.needs && !S.moc.notReq) S.moc.notReq = "Reemplazo por el mismo modelo (igual por igual).";
  }
  S.step = "moc";
}
function enterTasks(){
  if (!S.tsrc) {
    // Si entra un modelo distinto y hay uno igual en la flota, sus tareas le corresponden más que las del que sale.
    const sameAsOld = S.kind === "REPLACE" && !mocAdvice().needs;
    S.tsrc = sameAsOld ? "OLD" : fleetMatches().length ? "FLEET" : S.kind === "REPLACE" ? "OLD" : "NONE";
    if (S.tsrc === "FLEET" && fleetMatches().length === 1) S.tsrcAsset = fleetMatches()[0].id;
    S.checked = new Set(srcPlans().map(p => p[0]));
  }
  S.step = "tasks";
}

root.addEventListener("click", e => {
  const t = e.target.closest("button,[data-chk]"); if (!t) return;
  const act = t.dataset.act, go = t.dataset.go;
  if (go) { if (go==="vessel" || go==="category") { S.step = go; } else if (go==="kind") S.step = "kind"; else if (go==="data") S.step = "data"; return render(); }
  if (t.dataset.crit) { S.f.crit = t.dataset.crit; return render(); }
  if (t.dataset.moc) { S.moc.mode = t.dataset.moc; S.mocTouched = true; return render(); }
  if (t.dataset.mocid) { S.moc.mocId = t.dataset.mocid; return render(); }
  if (t.dataset.src) { S.tsrc = t.dataset.src; S.tsrcAsset = null;
    if (S.tsrc === "FLEET" && fleetMatches().length === 1) S.tsrcAsset = fleetMatches()[0].id;
    S.checked = new Set(srcPlans().map(p => p[0])); return render(); }
  if (!act) return;
  if (act === "x") { S = { ...S0(), role:S.role }; return render(); }
  if (act === "back") return goBack();
  if (act === "noop") return alertBox("Fuera del preview", "Esta opción funciona como hoy. El preview muestra sólo «Para un Equipo Nuevo».", "info", "var(--accent)");
  if (act === "cat-new") { S.step = "vessel"; return render(); }
  if (act.startsWith("vessel:")) { S.vessel = act.split(":")[1]; S.kind = null; S.oldId = null; S.tsrc = null; S.mocTouched = false; S.step = "kind"; return render(); }
  if (act.startsWith("kind:")) { S.kind = act.split(":")[1]; S.tsrc = null; S.mocTouched = false;
    if (S.kind === "ADD") { S.oldId = null; S.f = S0().f; S.step = "data"; } else { S.step = "pickOld"; } return render(); }
  if (act.startsWith("old:")) { S.oldId = act.split(":")[1]; prefillFromOld(); S.tsrc = null; S.mocTouched = false; S.step = "data"; return render(); }
  if (act === "same-model") { const o = oldAsset(); S.f.maker = o.maker; S.f.model = o.model; S.mocTouched = false; S.tsrc = null; return render(); }
  if (act === "ai-crit") { S.f.crit = "A"; S.f.safety = true; S.f.rationale = "Sugerencia IA (ejemplo): su falla deja al buque sin arranque de los motores principales; criticidad A y crítico para la seguridad."; return render(); }
  if (act === "data-next") { const m = missing(); if (m.length) return alertBox("Faltan datos del equipo", "Completá: " + m.join(", ") + "."); enterMoc(); return render(); }
  if (act === "moc-next") {
    const m = S.moc;
    if (m.mode === "NEW" && !m.reason.trim()) return alertBox("Falta el motivo del cambio", "Escribí por qué se hace el cambio: es lo primero que pide el MOC.");
    if (m.mode === "EXISTING" && !m.mocId) return alertBox("Falta elegir el MOC", "Elegí de la lista el MOC que cubre este cambio.");
    if (m.mode === "NOT_REQUIRED" && !m.notReq.trim()) return alertBox("Falta el motivo", "Escribí por qué este cambio no requiere MOC. Queda registrado en la OT.");
    enterTasks(); return render();
  }
  if (act.startsWith("fsrc:")) { S.tsrcAsset = act.split(":")[1]; S.checked = new Set(srcPlans().map(p => p[0])); return render(); }
  if (act === "fsrc-change") { S.tsrcAsset = null; return render(); }
  if (act === "chk-all") { S.checked = new Set(srcPlans().map(p => p[0])); return render(); }
  if (act === "chk-none") { S.checked = new Set(); return render(); }
  if (act === "tasks-next") {
    if (S.tsrc === "FLEET" && !S.tsrcAsset && fleetMatches().length) return alertBox("Falta elegir el equipo", "Elegí de qué equipo de la flota se copian las tareas, o cambiá a «Ninguna por ahora».");
    S.step = "confirm"; return render();
  }
  if (act === "create") { S.created = "OT-DCH-26-0142"; toast("Equipo DCH y OT-DCH-26-0142 creados"); S.step = S.moc.mode === "NEW" ? "mocAfter" : "otAfter"; return render(); }
  if (act === "moc-done") { S.step = "otAfter"; return render(); }
});
root.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "oldq") { S.oldQuery = el.value; return render(); }
  if (el.dataset.f && el.type !== "checkbox") {
    S.f[el.dataset.f] = el.value;
    if (el.dataset.f === "code") S.f.codeTouched = true;
    if ((el.dataset.f === "name" || el.dataset.f === "group") && !S.f.codeTouched) S.f.code = suggestCode();
    if (el.dataset.f === "maker" || el.dataset.f === "model") { S.mocTouched = false; S.tsrc = null; }
    if (el.tagName === "SELECT") render(); else { const pos = el.selectionStart; render(); const again = root.querySelector(`[data-f="${el.dataset.f}"]`); if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch {} } }
  }
  if (el.dataset.m) { S.moc[el.dataset.m] = el.value; const pos = el.selectionStart; render(); const again = root.querySelector(`[data-m="${el.dataset.m}"]`); if (again) { again.focus(); again.setSelectionRange(pos, pos); } }
});
root.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.f === "safety") { S.f.safety = el.checked; render(); }
  if (el.dataset.chk) { el.checked ? S.checked.add(el.dataset.chk) : S.checked.delete(el.dataset.chk); render(); }
});

document.querySelectorAll("[data-role]").forEach(b => b.onclick = () => {
  document.querySelectorAll("[data-role]").forEach(x => x.classList.toggle("on", x === b));
  S = { ...S0(), role:b.dataset.role }; render();
});
document.getElementById("pv-restart").onclick = () => { S = { ...S0(), role:S.role }; render(); };
document.getElementById("pv-close").onclick = () => {
  if (!S.created) return alertBox("Primero creá la OT", "Recorré el asistente hasta «Crear equipo y OT» y después probá el cierre.", "info", "var(--accent)");
  const m = S.moc;
  const pending = m.mode === "NEW" || (m.mode === "EXISTING" && !MOCS.find(x => x.id === m.mocId).ok);
  if (pending) {
    const code = m.mode === "NEW" ? "MOC-DCH-26-0008 (Solicitado)" : `${MOCS.find(x => x.id === m.mocId).code} (${MOCS.find(x => x.id === m.mocId).status})`;
    return alertBox("No se puede cerrar la OT", `Este cambio requiere MOC y ${code} todavía no está aprobado.\nCuando el Superintendente o el DPA lo aprueben, volvé a cerrar la OT.`, "git-branch", "var(--warning)");
  }
  const lines = [`OT ${S.created} cerrada.`, `${S.f.name}: fecha de instalación = hoy.`];
  if (chosenCount()) lines.push(`${chosenCount()} tareas activas, con vencimiento contado desde hoy.`);
  if (S.kind === "REPLACE") lines.push(`${oldAsset().name}: dado de baja; sus ${(PLANS[S.oldId]??[]).length} tareas desactivadas; las rutinas que lo revisaban pasan al equipo nuevo.`);
  alertBox("Cambio aplicado (ejemplo)", lines.join("\n"), "circle-check", "var(--success)");
};
// La barra negra del preview crece en celular: el fondo oscuro arranca debajo de ella.
const fitOverlay = () => { root.style.top = document.querySelector(".pv-bar").offsetHeight + "px"; };
addEventListener("resize", fitOverlay); fitOverlay();
render();
</script>
</body>
</html>
