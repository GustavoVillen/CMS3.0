<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recepción de repuestos - V1</title>
<style>
  :root {
    --fg: #0f172a;
    --fg60: #475569;
    --fg40: #94a3b8;
    --fg10: #e2e8f0;
    --fg5: #f1f5f9;
    --input: #eef1f6;
    --accent: #2563eb;
    --sea: #0f9b8e;
    --sea-bg: #e8f7f5;
    --new: #2563eb;
    --new-bg: #eff5ff;
    --amber: #d97706;
    --amber-bg: #fff7ed;
    --yellow-bg: #fefce8;
    --yellow-bd: #fde68a;
    --yellow-fg: #a16207;
    --red: #e11d48;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", Inter, system-ui, sans-serif; color: var(--fg);
    background: #5b6170; min-height: 100vh; padding: 16px;
  }
  .proto-bar {
    max-width: 960px; margin: 0 auto 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    color: #fff; font-size: 12px;
  }
  .proto-bar b { background: #f59e0b; color: #1f2937; padding: 3px 8px; border-radius: 6px; font-size: 11px; }
  .seg { display: inline-flex; background: rgba(255,255,255,.15); border-radius: 8px; padding: 2px; }
  .seg button { border: 0; background: transparent; color: #fff; font-size: 12px; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
  .seg button.on { background: #fff; color: var(--fg); font-weight: 600; }

  .modal { max-width: 960px; margin: 0 auto; background: #fff; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.35); overflow: hidden; }
  .mhead { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid var(--fg10); }
  .mhead h2 { margin: 0; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .mhead h2 svg { color: var(--sea); }
  .xbtn { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--red); color: #fff; font-size: 18px; cursor: pointer; display: grid; place-items: center; }
  .mbody { padding: 20px; }
  .title { font-size: 14px; font-weight: 700; margin: 0; }
  .sub { font-size: 12px; color: var(--fg40); margin: 2px 0 16px; }

  .label { display: block; font-size: 10px; font-weight: 700; color: var(--fg40); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
  .req { color: var(--red); margin-left: 2px; }
  input, select {
    width: 100%; font: inherit; font-size: 13px; color: var(--fg); background: var(--input);
    border: 1px solid #dfe3ea; border-radius: 10px; padding: 8px 11px; outline: none;
  }
  input:focus, select:focus { border-color: #93b4f5; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  input::placeholder { color: #a7b0bf; }
  input.miss { border: 2px solid #f59e0b; background: var(--amber-bg); }
  .tag-miss { display: inline-block; margin-left: 6px; background: #f97316; color: #fff; font-size: 9px; font-weight: 800; padding: 1px 6px; border-radius: 999px; vertical-align: 1px; }
  .help { font-size: 11px; color: var(--fg40); margin-top: 4px; }
  .help code { font-family: Consolas, monospace; color: var(--fg60); background: var(--fg5); padding: 0 4px; border-radius: 4px; }

  /* Filas */
  .rows { display: flex; flex-direction: column; gap: 8px; }
  .row { border: 1px solid var(--fg10); border-radius: 12px; padding: 12px; }
  .row.matched { border-color: #b7e4de; background: var(--sea-bg); }
  .row.new { border-color: #c7d9fb; background: var(--new-bg); }
  .row.ambiguous { border-color: var(--yellow-bd); background: var(--yellow-bg); }
  .rtop { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
  .rname { flex: 1; min-width: 220px; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; padding: 2px 8px; border-radius: 7px; }
  .b-matched { background: #cdeee9; color: var(--sea); }
  .b-new { background: #dbe7fe; color: var(--new); }
  .b-amb { background: #fdf0b8; color: var(--yellow-fg); }
  .rname .nm { font-size: 14px; font-weight: 600; margin-top: 4px; word-break: break-word; }
  .rname .meta { font-size: 11px; color: var(--fg60); margin-top: 2px; }
  .rname .meta .mono { font-family: Consolas, monospace; color: var(--fg40); }
  .stockflow { font-size: 11px; color: var(--fg60); margin-top: 2px; }
  .stockflow strong { color: var(--sea); }
  .w-qty { width: 92px; } .w-unit { width: 76px; }
  .trash { margin-top: 18px; border: 0; background: transparent; color: var(--fg40); cursor: pointer; padding: 6px; border-radius: 8px; }
  .trash:hover { color: var(--red); background: #ffe4e6; }
  .linkbtn { border: 0; background: transparent; color: var(--fg40); text-decoration: underline; font-size: 11px; cursor: pointer; padding: 0; margin-left: 8px; }
  .linkbtn:hover { color: var(--fg); }
  .newgrid { display: grid; grid-template-columns: 2fr 1fr 110px; gap: 8px; margin-top: 10px; }
  .simil { margin-top: 8px; font-size: 11px; color: var(--yellow-fg); }
  .simil button.toggle { border: 0; background: transparent; color: var(--yellow-fg); font-size: 11px; font-weight: 700; cursor: pointer; padding: 0; text-decoration: underline; }
  .simil .list { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }

  /* Opciones de búsqueda */
  .opt { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; font: inherit;
    font-size: 12px; color: var(--fg); background: #fafbfc; border: 1px solid var(--fg10); border-radius: 9px; padding: 7px 11px; cursor: pointer; }
  .opt:hover, .opt.hl { border-color: #9fd9d1; background: #effaf8; }
  .opt .mono { font-family: Consolas, monospace; color: var(--fg40); font-size: 11px; margin-left: 4px; }
  .opt .st { color: var(--fg40); font-size: 11px; flex-shrink: 0; }
  .opt .use { color: var(--sea); font-weight: 700; font-size: 11px; flex-shrink: 0; }
  .opt.create { border-style: dashed; border-color: #a9c3f7; background: var(--new-bg); color: var(--new); font-weight: 600; }
  .opt.create:hover, .opt.create.hl { background: #e2ecff; border-color: var(--new); }
  .ambpick { margin-top: 10px; }
  .ambpick p { font-size: 11px; font-weight: 700; color: var(--yellow-fg); margin: 0 0 6px; }
  .ambpick .list { display: flex; flex-direction: column; gap: 4px; }

  /* Agregar */
  .add { margin-top: 12px; border: 1px dashed #cfd6e0; border-radius: 12px; padding: 12px; }
  .searchwrap { position: relative; }
  .searchwrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--fg40); }
  .searchwrap input { padding-left: 32px; }
  .results { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; }
  .add .opt.create { width: 100%; }
  .noresult { font-size: 11px; color: var(--fg40); padding: 2px 2px 4px; }
  .empty { text-align: center; font-size: 12px; color: var(--fg40); padding: 18px 0 6px; }

  .mfoot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; border-top: 1px solid var(--fg10); }
  .btn { font: inherit; font-size: 12px; font-weight: 700; border-radius: 10px; padding: 8px 16px; cursor: pointer; }
  .btn-sec { background: #fff; border: 1px solid var(--fg10); color: var(--fg60); }
  .btn-pri { background: var(--sea); border: 1px solid var(--sea); color: #fff; display: inline-flex; align-items: center; gap: 6px; }
  .btn-pri:disabled { opacity: .4; cursor: not-allowed; }
  .pending { font-size: 12px; font-weight: 700; color: var(--yellow-fg); margin-right: 12px; }

  /* Resumen */
  .done-line { display: flex; justify-content: space-between; gap: 12px; border: 1px solid var(--fg10); border-radius: 9px; padding: 8px 12px; font-size: 12px; margin-bottom: 4px; }
  .done-line .mono { font-family: Consolas, monospace; color: var(--fg40); }

  /* Ventanita de aviso (AlertDialog) */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 16px; }
  .overlay.on { display: flex; }
  .alert { background: #fff; border-radius: 14px; max-width: 380px; width: 100%; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  .alert p { font-size: 13px; margin: 0 0 16px; }
  .alert .btn { float: right; }

  @media (max-width: 640px) {
    body { padding: 8px; }
    .mbody { padding: 14px; }
    .rname { min-width: 100%; }
    .newgrid { grid-template-columns: 1fr; }
    .w-qty, .w-unit { width: calc(50% - 30px); }
  }
</style>
</head>
<body>

<div class="proto-bar">
  <b>PROTOTIPO V1</b>
  <span>Datos de ejemplo. No guarda nada.</span>
  <span style="flex:1"></span>
  <span>Escenario:</span>
  <div class="seg" role="tablist">
    <button id="scManual" class="on" onclick="setScenario('manual')">Carga a mano</button>
    <button id="scRemito" onclick="setScenario('remito')">Remito leído</button>
  </div>
</div>

<div class="modal" role="dialog" aria-labelledby="mtitle">
  <div class="mhead">
    <h2 id="mtitle">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 16h6M19 13v6M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l2-1.14"/><path d="m7.5 4.27 9 5.15M3.29 7 12 12l8.71-5M12 22V12"/></svg>
      Recepción de repuestos
    </h2>
    <button class="xbtn" aria-label="Cerrar">&times;</button>
  </div>

  <div class="mbody" id="body"></div>

  <div class="mfoot" id="foot">
    <button class="btn btn-sec">Volver</button>
    <div style="display:flex;align-items:center">
      <span class="pending" id="pending"></span>
      <button class="btn btn-pri" id="confirm" onclick="confirmar()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg>
        Confirmar recepción
      </button>
    </div>
  </div>
</div>

<div class="overlay" id="alert"><div class="alert" role="alertdialog"><p id="alertMsg"></p><button class="btn btn-pri" onclick="closeAlert()">OK</button><div style="clear:both"></div></div></div>

<script>
// ── Datos de ejemplo: stock del buque ────────────────────────────────────────
const CATALOG = [
  { id: "s1", sku: "RE 504836",       name: "Filtro de aceite para generador John Deere", unit: "u", onHand: 0 },
  { id: "s2", sku: "FIL-ACE-02",      name: "Filtro de aceite by-pass para Volvo Penta D16 MH", unit: "u", onHand: 0 },
  { id: "s3", sku: "CR-FIL-ACE-01",   name: "Filtro de aceite spin-on para caja Twin Disc MG-5170DC", unit: "u", onHand: 0 },
  { id: "s4", sku: "COMP-FIL-ACE-01", name: "Filtro de aceite (unidad sellada) para electrocompresor CETEC NK", unit: "u", onHand: 0 },
  { id: "s5", sku: "ACE-MOT-01",      name: "Aceite lubricante aprobado para Volvo Penta D16 MH", unit: "l", onHand: 40 },
  { id: "s6", sku: "FIL-COM-01",      name: "Filtro de combustible primario Racor 2040PM", unit: "u", onHand: 3 },
  { id: "s7", sku: "COR-ALT-01",      name: "Correa de alternador motor principal", unit: "u", onHand: 2 },
  { id: "s8", sku: "IMP-BOM-01",      name: "Impulsor bomba de agua salada Jabsco 1210-0001", unit: "u", onHand: 1 },
];

const STOP = new Set(["de","del","la","el","los","las","para","con","y","en","sae"]);
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();

// Parecido simple por palabras (en el sistema real lo hace el buscador del stock).
function score(q, c) {
  const qw = norm(q).split(" ").filter(w => w.length > 1 && !STOP.has(w));
  if (!qw.length) return 0;
  const hay = norm(c.name + " " + c.sku);
  return qw.filter(w => hay.includes(w)).length / qw.length;
}
function search(q) {
  if (norm(q).length < 2) return [];
  return CATALOG.map(c => ({ c, s: score(q, c) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s).map(x => x.c);
}
// Mismo criterio que ya usa el cierre de OT para la ficha nueva: "FIL-ACE-01".
function proposeSku(name, taken) {
  const words = norm(name).split(" ").filter(w => w && !STOP.has(w));
  const spec = words.filter(w => /\d/.test(w)).join("").toUpperCase().slice(0, 8);
  const plain = words.filter(w => !/\d/.test(w)).map(w => w.slice(0, 3).toUpperCase());
  const base = [plain[0] || "REP", spec || plain[1]].filter(Boolean).join("-");
  for (let n = 1; n < 100; n++) {
    const sku = `${base}-${String(n).padStart(2, "0")}`;
    if (!taken.has(sku)) return sku;
  }
  return base;
}
function takenSkus(exceptKey) {
  const t = new Set(CATALOG.map(c => c.sku.toUpperCase()));
  rows.forEach(r => { if (r.kind === "new" && r.key !== exceptKey) t.add((r.sku || r.autoSku).toUpperCase()); });
  return t;
}

// ── Estado ───────────────────────────────────────────────────────────────────
let rows = [];
let query = "";
let hl = -1;
let step = "review";
let seq = 0;
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

function setScenario(sc) {
  document.getElementById("scManual").classList.toggle("on", sc === "manual");
  document.getElementById("scRemito").classList.toggle("on", sc === "remito");
  step = "review"; query = ""; hl = -1;
  rows = sc === "manual" ? [] : [
    { key: "r" + (++seq), kind: "matched", spare: CATALOG[5], qty: "4", unit: "u", remito: "FILTRO COMB. RACOR 2040PM", pn: "2040PM" },
    { key: "r" + (++seq), kind: "ambiguous", qty: "2", unit: "u", remito: "FILTRO ACEITE JD RE504836", pn: null, cands: [CATALOG[0], CATALOG[1]] },
    { key: "r" + (++seq), kind: "ambiguous", qty: "1", unit: "u", remito: "KIT JUNTAS BOMBA AGUA SALADA", pn: null, cands: [CATALOG[7]] },
  ];
  render();
}

function addExisting(c, fromKey) {
  if (fromKey) {
    const r = rows.find(x => x.key === fromKey);
    Object.assign(r, { kind: "matched", spare: c, unit: c.unit });
  } else {
    rows.push({ key: "r" + (++seq), kind: "matched", spare: c, qty: "1", unit: c.unit });
  }
  query = ""; hl = -1; render(fromKey ? null : "qty-" + rows[rows.length - 1].key);
}
function addNew(name, fromKey) {
  if (fromKey) {
    const r = rows.find(x => x.key === fromKey);
    Object.assign(r, { kind: "new", name: titleCase(r.remito), sku: "", crit: "B", showSim: false });
  } else {
    rows.push({ key: "r" + (++seq), kind: "new", name: name.trim(), sku: "", crit: "B", qty: "1", unit: "u", showSim: false });
  }
  query = ""; hl = -1; render(fromKey ? "name-" + fromKey : "qty-" + rows[rows.length - 1].key);
}
function titleCase(s) { const t = s.toLowerCase(); return t.charAt(0).toUpperCase() + t.slice(1); }
function removeRow(key) { rows = rows.filter(r => r.key !== key); render(); }
function backToPick(key) {
  const r = rows.find(x => x.key === key);
  if (r.remito) { r.kind = "ambiguous"; r.cands = search(r.remito).slice(0, 3); }
  else { rows = rows.filter(x => x.key !== key); query = r.kind === "new" ? r.name : r.spare.name; }
  render("search");
}

function rowReady(r) {
  const q = Number(r.qty);
  if (!(q > 0)) return false;
  if (r.kind === "matched") return true;
  if (r.kind === "new") return !!r.name.trim();
  return false;
}

// ── Render ───────────────────────────────────────────────────────────────────
function render(focusId) {
  const body = document.getElementById("body");
  const foot = document.getElementById("foot");
  if (step === "done") { body.innerHTML = renderDone(); foot.style.display = "none"; return; }
  foot.style.display = "";
  rows.forEach(r => { if (r.kind === "new") r.autoSku = proposeSku(r.name || "rep", takenSkus(r.key)); });

  body.innerHTML = `
    <p class="title">Revisá antes de guardar</p>
    <p class="sub">Nada se guarda hasta que confirmes. Cada línea suma stock al repuesto que elijas.</p>
    <div class="rows">${rows.map(renderRow).join("") || `<p class="empty">Todavía no hay ítems. Buscalos abajo.</p>`}</div>
    ${renderAdd()}
  `;
  const pend = rows.filter(r => !rowReady(r)).length;
  document.getElementById("pending").textContent = pend ? `${pend} sin completar` : "";
  document.getElementById("confirm").disabled = rows.length === 0;
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) { el.focus(); if (el.select && focusId.startsWith("qty")) el.select(); }
  }
}

function qtyUnit(r) {
  const ok = Number(r.qty) > 0;
  return `
    <div class="w-qty"><label class="label" for="qty-${r.key}">Cantidad<span class="req">*</span></label>
      <input id="qty-${r.key}" type="number" min="0" step="0.01" value="${esc(r.qty)}" class="${ok ? "" : "miss"}"
        oninput="upd('${r.key}','qty',this.value)"></div>
    <div class="w-unit"><label class="label" for="unit-${r.key}">Unidad</label>
      <input id="unit-${r.key}" value="${esc(r.unit)}" oninput="upd('${r.key}','unit',this.value,true)"></div>
    <button class="trash" title="Quitar línea" aria-label="Quitar línea" onclick="removeRow('${r.key}')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>`;
}
function remitoLine(r) {
  return r.remito ? `<div class="meta">Remito: ${esc(r.remito)}${r.pn ? ` <span class="mono">P/N ${esc(r.pn)}</span>` : ""}</div>` : "";
}

function renderRow(r) {
  if (r.kind === "matched") {
    const q = Number(r.qty) || 0;
    return `<div class="row matched"><div class="rtop">
      <div class="rname">
        <span class="badge b-matched">Del stock</span>
        <div class="nm">${esc(r.spare.name)} <span class="mono" style="font-family:Consolas,monospace;font-size:11px;color:var(--fg40);font-weight:400">${esc(r.spare.sku)}</span></div>
        ${remitoLine(r)}
        <div class="stockflow">Stock: ${r.spare.onHand} &rarr; <strong>${r.spare.onHand + q}</strong>
          <button class="linkbtn" onclick="backToPick('${r.key}')">Cambiar</button></div>
      </div>${qtyUnit(r)}</div></div>`;
  }
  if (r.kind === "ambiguous") {
    return `<div class="row ambiguous"><div class="rtop">
      <div class="rname">
        <span class="badge b-amb">Elegí cuál es</span>
        <div class="nm">${esc(r.remito)}</div>
        ${r.pn ? `<div class="meta"><span class="mono">P/N ${esc(r.pn)}</span></div>` : ""}
      </div>${qtyUnit(r)}</div>
      <div class="ambpick"><p>¿Es alguno de estos?</p><div class="list">
        ${r.cands.map(c => `<button class="opt" onclick="addExisting(CATALOG.find(x=>x.id==='${c.id}'),'${r.key}')">
          <span>${esc(c.name)}<span class="mono">${esc(c.sku)}</span></span><span class="st">Stock ${c.onHand}</span></button>`).join("")}
        <button class="opt create" onclick="addNew('', '${r.key}')">
          <span>+ Ninguno: cargarlo como repuesto nuevo</span></button>
      </div></div></div>`;
  }
  // Nuevo
  const sim = search(r.name).filter(c => score(r.name, c) >= 0.5).slice(0, 3);
  const nameOk = !!r.name.trim();
  return `<div class="row new"><div class="rtop">
    <div class="rname">
      <span class="badge b-new">Repuesto nuevo</span>
      <div class="meta" style="margin-top:4px">Se da de alta en el stock del buque con esta cantidad.</div>
      ${remitoLine(r)}
    </div>${qtyUnit(r)}</div>
    <div class="newgrid">
      <div><label class="label" for="name-${r.key}">Nombre<span class="req">*</span>${nameOk ? "" : '<span class="tag-miss">FALTA</span>'}</label>
        <input id="name-${r.key}" value="${esc(r.name)}" class="${nameOk ? "" : "miss"}" oninput="upd('${r.key}','name',this.value)"></div>
      <div><label class="label" for="sku-${r.key}">Código</label>
        <input id="sku-${r.key}" value="${esc(r.sku)}" placeholder="${esc(r.autoSku)}" oninput="upd('${r.key}','sku',this.value.toUpperCase(),true)" style="font-family:Consolas,monospace">
        <div class="help">${r.sku ? "Código propio." : `Si no lo cambiás queda <code>${esc(r.autoSku)}</code>`}</div></div>
      <div><label class="label" for="crit-${r.key}">Criticidad</label>
        <select id="crit-${r.key}" onchange="upd('${r.key}','crit',this.value,true)">
          ${["A","B","C"].map(c => `<option ${r.crit === c ? "selected" : ""}>${c}</option>`).join("")}</select></div>
    </div>
    ${sim.length ? `<div class="simil">&#9888; Hay ${sim.length} parecido${sim.length > 1 ? "s" : ""} en el stock.
      <button class="toggle" onclick="toggleSim('${r.key}')">${r.showSim ? "Ocultar" : "Ver"}</button>
      ${r.showSim ? `<div class="list">${sim.map(c => `<button class="opt" onclick="addExisting(CATALOG.find(x=>x.id==='${c.id}'),'${r.key}')">
        <span>${esc(c.name)}<span class="mono">${esc(c.sku)}</span></span><span class="use">Usar este</span></button>`).join("")}</div>` : ""}
    </div>` : ""}
  </div>`;
}

function renderAdd() {
  const hits = search(query).slice(0, 6);
  const typed = query.trim();
  const opts = [];
  hits.forEach(c => opts.push(`<button class="opt${opts.length === hl ? " hl" : ""}" onmousedown="event.preventDefault()" onclick="addExisting(CATALOG.find(x=>x.id==='${c.id}'))">
      <span>${esc(c.name)}<span class="mono">${esc(c.sku)}</span></span><span class="st">Stock ${c.onHand}</span></button>`));
  // La opción de alta va FUERA de la lista con scroll: siempre a la vista.
  const create = typed.length >= 2 ? `<button class="opt create${hits.length === hl ? " hl" : ""}" style="margin-top:6px" onmousedown="event.preventDefault()" onclick="addNew(query)">
      <span>+ No es ninguno: cargar <b>«${esc(typed)}»</b> como repuesto nuevo</span></button>` : "";
  return `<div class="add">
    <label class="label" for="search">Agregar un ítem</label>
    <div class="searchwrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" autocomplete="off" placeholder="Escribí el nombre, el código o el P/N" value="${esc(query)}"
        oninput="onSearch(this.value)" onkeydown="onKey(event)">
    </div>
    ${typed.length >= 2 ? `<div class="results">${hits.length ? "" : `<div class="noresult">No hay nada parecido en el stock de este buque.</div>`}${opts.join("")}</div>${create}` : ""}
  </div>`;
}

function renderDone() {
  const lines = rows.map(r => {
    const name = r.kind === "matched" ? r.spare.name : r.name;
    const sku = r.kind === "matched" ? r.spare.sku : (r.sku || r.autoSku);
    const before = r.kind === "matched" ? r.spare.onHand : 0;
    const q = Number(r.qty);
    return `<div class="done-line"><span>${esc(name)} <span class="mono">${esc(sku)}</span>
      ${r.kind === "new" ? '<span class="badge b-new" style="margin-left:6px">Alta nueva</span>' : ""}</span>
      <span>+${q} ${esc(r.unit)} · ${before} &rarr; <strong style="color:var(--sea)">${before + q}</strong></span></div>`;
  }).join("");
  return `<p class="title" style="color:var(--sea)">Recepción guardada <span style="font-family:Consolas,monospace;color:var(--fg40);font-weight:400;font-size:12px">RCP-DCH-26-0007</span></p>
    <p class="sub">Ejemplo del resumen final.</p>${lines}
    <div style="text-align:right;margin-top:12px"><button class="btn btn-sec" onclick="setScenario('manual')">Cerrar</button></div>`;
}

// ── Eventos ──────────────────────────────────────────────────────────────────
function upd(key, field, val, noRerender) {
  const r = rows.find(x => x.key === key); r[field] = val;
  if (noRerender) { if (field === "sku") render("sku-" + key); return; }
  const active = document.activeElement && document.activeElement.id;
  const pos = document.activeElement && document.activeElement.selectionStart;
  render(active);
  const el = document.getElementById(active);
  if (el && pos != null && el.setSelectionRange && el.type !== "number") el.setSelectionRange(pos, pos);
}
function toggleSim(key) { const r = rows.find(x => x.key === key); r.showSim = !r.showSim; render(); }
function onSearch(v) {
  query = v; hl = search(v).length ? 0 : (v.trim().length >= 2 ? 0 : -1);
  render("search");
  const el = document.getElementById("search"); el.setSelectionRange(v.length, v.length);
}
function onKey(e) {
  const n = search(query).slice(0, 6).length + (query.trim().length >= 2 ? 1 : 0);
  if (e.key === "ArrowDown") { e.preventDefault(); hl = Math.min(n - 1, hl + 1); render("search"); }
  else if (e.key === "ArrowUp") { e.preventDefault(); hl = Math.max(0, hl - 1); render("search"); }
  else if (e.key === "Enter" && hl >= 0) {
    e.preventDefault();
    const hits = search(query).slice(0, 6);
    if (hl < hits.length) addExisting(hits[hl]); else addNew(query);
  } else if (e.key === "Escape") { query = ""; hl = -1; render("search"); }
}
function confirmar() {
  const i = rows.findIndex(r => !rowReady(r));
  if (i >= 0) {
    const r = rows[i];
    const msg = r.kind === "ambiguous" ? `La línea ${i + 1} todavía no tiene repuesto: elegí uno de la lista o cargalo como nuevo.`
      : !(Number(r.qty) > 0) ? `La cantidad de la línea ${i + 1} tiene que ser mayor a cero.`
      : `Falta el nombre del repuesto nuevo en la línea ${i + 1}.`;
    document.getElementById("alertMsg").textContent = msg;
    document.getElementById("alert").classList.add("on");
    return;
  }
  step = "done"; render();
}
function closeAlert() { document.getElementById("alert").classList.remove("on"); }

setScenario("manual");
</script>
</body>
</html>
