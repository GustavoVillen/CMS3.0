<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero — Preview V14</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  :root{ --bg:#F4F5F7; --surface:#fff; --fg:#1A1D24; --accent:#0284C7; --success:#0E9F6E;
    --fg5:rgba(26,29,36,.05); --fg10:rgba(26,29,36,.10); --fg25:rgba(26,29,36,.25); --muted:rgba(26,29,36,.60); --faint:rgba(26,29,36,.40); }
  *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:14px}
  button{font-family:inherit;cursor:pointer}
  .pv-bar{position:sticky;top:0;z-index:100;background:#111827;color:#fff;padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .pv-bar b{font-size:13px;margin-right:6px} .pv-bar .tag{background:#F59E0B;color:#111;font-weight:800;font-size:10px;padding:2px 8px;border-radius:99px}
  .pv-bar button{background:#374151;color:#fff;border:0;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600} .pv-bar button.on{background:var(--accent)}
  .pv-bar .sep{width:1px;height:20px;background:#4B5563;margin:0 4px} .pv-bar .lab{font-size:11px;color:#9CA3AF}
  .app{display:flex;min-height:calc(100vh - 46px)}
  .side{width:210px;background:#0F172A;color:#CBD5E1;padding:16px 10px;flex-shrink:0}
  .side .logo{color:#fff;font-weight:800;font-size:15px;margin:0 8px 18px}
  .side a{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;font-size:13px;color:#CBD5E1;text-decoration:none}
  .side a.on{background:rgba(56,189,248,.15);color:#fff}
  @media(max-width:800px){.side{display:none}}
  .main{flex:1;min-width:0;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
  @media(max-width:600px){.main{padding:14px 12px}}
  i[data-lucide], svg.lucide{flex-shrink:0}

  /* 4 · encabezado */
  .hdr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .hdr h1{margin:0;font-size:20px;font-weight:800;display:flex;gap:8px;align-items:center}
  .hdr .date{font-size:12px;color:var(--muted)}
  .daily{margin-left:auto;display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:6px 8px 6px 12px;font-size:12px;font-weight:600}
  .daily.miss{background:#FFFBEB;border:1.5px solid #FCD34D;color:#92400E}
  .daily.ok{background:#ECFDF5;border:1.5px solid #6EE7B7;color:#065F46;padding-right:12px}
  .daily button{border:0;background:#D97706;color:#fff;border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700}
  @media(max-width:600px){.daily{margin-left:0;width:100%}.daily button{margin-left:auto}}

  /* 1 · lo urgente */
  .urgent{background:var(--surface);border:1px solid var(--fg10);border-radius:16px;padding:12px}
  .urgent h2{margin:0 0 10px;font-size:13px;font-weight:800;display:flex;gap:6px;align-items:center}
  .urgent h2 span{font-weight:500;color:var(--faint);font-size:11px}
  .ugrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  @media(max-width:1200px){.ugrid{grid-template-columns:repeat(3,1fr)}} @media(max-width:560px){.ugrid{grid-template-columns:repeat(2,1fr)}}
  .ut{border:1.5px solid var(--fg10);border-left-width:4px;border-radius:12px;padding:8px 10px;text-align:left;background:var(--surface);display:flex;flex-direction:column;gap:1px;transition:.15s}
  .ut:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
  .ut .n{font-size:24px;font-weight:800;line-height:1.1}
  .ut .l{font-size:12px;font-weight:700;display:flex;gap:5px;align-items:center}
  .ut .h{font-size:10px;color:var(--faint)}
  .ut.red{border-left-color:#DC2626;background:#FEF2F2} .ut.red .n{color:#B91C1C}
  .ut.amber{border-left-color:#D97706;background:#FFFBEB} .ut.amber .n{color:#B45309}
  .ut.blue{border-left-color:#2563EB;background:#EFF6FF} .ut.blue .n{color:#1D4ED8}
  .ut.zero{border-left-color:#0E9F6E;background:var(--surface);opacity:.7} .ut.zero .n{color:#047857}
  .alldone{display:flex;align-items:center;gap:10px;background:#ECFDF5;border:1.5px solid #6EE7B7;border-radius:12px;padding:12px 14px;color:#065F46;font-weight:700}
  .alldone small{display:block;font-weight:500;color:#047857;font-size:11px}

  /* 2 · accesos */
  .sec h3{margin:0 0 6px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);display:flex;gap:6px;align-items:center}
  .tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  @media(max-width:1200px){.tiles{grid-template-columns:repeat(4,1fr)}} @media(max-width:900px){.tiles{grid-template-columns:repeat(3,1fr)}} @media(max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}
  .tile{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--fg10);border-radius:12px;padding:9px 10px;text-align:left;transition:.15s;min-width:0}
  .tile:hover{border-color:var(--fg25);box-shadow:0 3px 10px rgba(0,0,0,.06)}
  .tile .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center}
  .tile .tx{min-width:0} .tile .t{font-size:13px;font-weight:700;line-height:1.2} .tile .d{font-size:10.5px;color:var(--faint);line-height:1.25;margin-top:1px}
  .tile .badge{margin-left:auto;font-size:11px;font-weight:800;border-radius:8px;padding:1px 7px}
  @media(max-width:560px){.tile{padding:8px}.tile .d{display:none}.tile .ic{width:30px;height:30px}}
  .ic.green{background:rgba(14,159,110,.12);color:#047857} .ic.teal{background:rgba(8,145,178,.12);color:#0E7490}
  .ic.orange{background:rgba(234,88,12,.12);color:#C2410C} .ic.blue{background:rgba(2,132,199,.12);color:#0369A1}
  .ic.violet{background:rgba(124,58,237,.12);color:#6D28D9}
  .secrow{display:grid;grid-template-columns:1fr;gap:12px}

  /* 3 · estado */
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:1200px){.cards{grid-template-columns:repeat(2,1fr)}} @media(max-width:560px){.cards{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--fg10);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
  .card .top{display:flex;align-items:center;gap:6px} .card .top b{font-size:12px} .card .top button{margin-left:auto;border:0;background:none;color:var(--faint);padding:2px}
  .head{border-radius:10px;padding:6px 10px;display:flex;align-items:baseline;gap:6px;text-align:left;border:0;width:100%}
  .head .n{font-size:22px;font-weight:800} .head .l{font-size:12px;font-weight:700}
  .head.red{background:#FEF2F2;color:#B91C1C} .head.amber{background:#FFFBEB;color:#B45309} .head.blue{background:#EFF6FF;color:#1D4ED8} .head.ok{background:#ECFDF5;color:#047857}
  .body{display:flex;align-items:center;gap:10px}
  .donut{width:64px;height:64px;border-radius:50%;position:relative;flex-shrink:0}
  .donut::after{content:"";position:absolute;inset:12px;background:var(--surface);border-radius:50%}
  .donut span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;z-index:1}
  .leg{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .leg button{display:flex;align-items:center;gap:6px;border:0;background:none;padding:1px 4px;border-radius:5px;font-size:11.5px;text-align:left;color:var(--muted)}
  .leg button:hover{background:var(--fg5);color:var(--fg)}
  .leg i.dot{width:8px;height:8px;border-radius:99px;display:inline-block} .leg b{margin-left:auto;color:var(--fg)}

  /* referencia */
  .note{background:#DC2626;color:#fff;font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;display:inline-block;margin:0 4px 4px 0}
  .refbtn{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:12px;background:rgba(14,159,110,.1);border:1px solid rgba(14,159,110,.3);font-weight:700;font-size:13px}
  .refgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px} @media(max-width:900px){.refgrid{grid-template-columns:repeat(2,1fr)}}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#065F46;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:300}
</style>
</head>
<body>
<div class="pv-bar">
  <b>Tablero · Preview V14</b><span class="tag">DEMO · DATOS FICTICIOS</span><span class="sep"></span>
  <button data-v="new" class="on">Propuesta</button><button data-v="ref">Hoy (referencia)</button>
  <span class="sep"></span><span class="lab">Ver como:</span>
  <button data-role="admin" class="on">Superintendente / DPA</button><button data-role="crew">Tripulación</button>
  <span class="sep"></span><span class="lab">Día:</span>
  <button data-day="busy" class="on">Con pendientes</button><button data-day="clean">Todo al día</button>
</div>
<div class="app">
  <nav class="side"><div class="logo">CMS3.0</div>
    <a class="on"><i data-lucide="layout-dashboard" style="width:15px;height:15px"></i>Tablero</a>
    <a><i data-lucide="wrench" style="width:15px;height:15px"></i>Órdenes de Trabajo</a>
    <a><i data-lucide="handshake" style="width:15px;height:15px"></i>Solicitudes de Servicio</a>
    <a><i data-lucide="clipboard-list" style="width:15px;height:15px"></i>Plan de Mantenimiento</a>
    <a><i data-lucide="gauge" style="width:15px;height:15px"></i>Horas de Equipos</a>
  </nav>
  <main class="main" id="root"></main>
</div>
<script>
const S={view:"new",role:"admin",day:"busy",toast:null};
const I=(n,s=15)=>`<i data-lucide="${n}" style="width:${s}px;height:${s}px"></i>`;

function data(){
  const busy=S.day==="busy";
  return {
    dailySent: !busy,
    urgent:[
      {key:"mp",cls:"red",icon:"calendar-x",n:busy?6:0,l:"Planes vencidos",h:"Tareas del plan fuera de fecha"},
      {key:"sign",cls:"blue",icon:S.role==="admin"?"pen-line":"hourglass",n:busy?3:0,l:S.role==="admin"?"Esperan tu firma":"Esperando firma",h:S.role==="admin"?"OT y SS para aprobar o autorizar":"OT y SS en aprobación en tierra"},
      {key:"shop",cls:"red",icon:"clock-alert",n:busy?1:0,l:"SS +15 días en taller",h:"Revisar con el proveedor"},
      {key:"cert",cls:"red",icon:"file-warning",n:busy?1:0,l:"Certificados vencidos",h:"2 más vencen en 30 días"},
      {key:"def",cls:"amber",icon:"shield-question",n:busy?2:0,l:"Defectos por verificar",h:"Confirmar que no volvió a fallar"},
      {key:"pend",cls:"amber",icon:"inbox",n:busy?4:0,l:"Reportes sin procesar",h:busy?"Análisis 2 · Permisos 1 · Diferim. 1":"—"},
    ],
    wo:{ segs:busy?[["En proceso",2,"#047857"],["Autorizada",3,"#6EE7B7"],["Pend. autorización",1,"#8B5CF6"],["Pend. aprobación",2,"#60A5FA"],["En preparación",4,"#94A3B8"],["Diferida",1,"#EAB308"]]:[["En proceso",2,"#047857"],["Autorizada",3,"#6EE7B7"]] },
    ss:{ segs:busy?[["En preparación",1,"#64748b"],["Pend. aprobación",1,"#EAB308"],["Pend. autorización",0,"#3B82F6"],["Autorizada",1,"#8B5CF6"],["En el taller",3,"#D97706"]]:[["En el taller",2,"#D97706"]] },
    mp:{ segs:busy?[["Vencidos",6,"#EF4444"],["Nunca ejecutados",3,"#64748b"],["En ventana",5,"#EAB308"],["Próximos 30 días",14,"#F97316"],["Al día",212,"#06D6A0"]]:[["Próximos 30 días",9,"#F97316"],["Al día",231,"#06D6A0"]] },
    def:{ segs:busy?[["Solicitados",1,"#60A5FA"],["En revisión",1,"#EAB308"],["Aprobados",2,"#06D6A0"],["Activos",1,"#A78BFA"]]:[["Activos",1,"#A78BFA"]] },
  };
}

function page(){
  const d=data();
  const urgentN=d.urgent.reduce((a,u)=>a+u.n,0);
  const busy=S.day==="busy";
  const hdr=`<div class="hdr">
    <h1>${I("ship",20)}BUQUE DEMO I</h1><span class="date">Lunes 14 de septiembre</span>
    ${d.dailySent
      ? `<span class="daily ok">${I("check-circle-2",15)}Reporte diario de hoy enviado</span>`
      : `<span class="daily miss">${I("file-clock",15)}Falta el reporte diario de hoy<button onclick="toast('Abre el reporte diario (demo)')">Cargar</button></span>`}
  </div>`;

  const urgent = urgentN===0
    ? `<div class="alldone">${I("badge-check",26)}<div>Todo al día<small>No hay vencidos, firmas pendientes ni reportes sin procesar.</small></div></div>`
    : `<section class="urgent"><h2>${I("siren",16)}Para atender hoy <span>· tocá un número para ir a la lista</span></h2>
      <div class="ugrid">${d.urgent.map(u=>`<button class="ut ${u.n?u.cls:'zero'}" onclick="toast('Abre la lista: ${u.l} (demo)')">
        <span class="n">${u.n}</span><span class="l">${I(u.icon,13)}${u.l}</span><span class="h">${u.n?u.h:'Al día'}</span></button>`).join("")}</div></section>`;

  const tile=(ic,cls,t,desc,badge="")=>`<button class="tile" onclick="toast('Abre: ${t} (demo)')"><span class="ic ${cls}">${I(ic,18)}</span><span class="tx"><div class="t">${t}</div><div class="d">${desc}</div></span>${badge}</button>`;
  const weekBadge=`<span class="badge" style="background:${busy?'#FEE2E2':'rgba(2,132,199,.1)'};color:${busy?'#B91C1C':'#0369A1'}">${busy?21:9}</span>`;
  const access=`<div class="secrow">
    <div class="sec"><h3>${I("timer",12)}Horas</h3><div class="tiles">
      ${tile("timer","blue","Cargar horas de equipos","Horómetros del día")}
    </div></div>
    <div class="sec"><h3>${I("plus-circle",12)}Crear</h3><div class="tiles">
      ${tile("wrench","green","Nueva Orden de Trabajo","Mantenimiento o reparación")}
      ${tile("handshake","green","Nueva Solicitud de Servicio","Pedido a un taller externo")}
      ${tile("shield-check","green","Generar inspección","Por evento, periódica o de clase")}
      ${S.role==="admin"?tile("shield-alert","green","Nuevo permiso de trabajo","Trabajo en caliente, altura…"):""}
    </div></div>
    <div class="sec"><h3>${I("notebook-pen",12)}Registrar</h3><div class="tiles">
      ${tile("notebook-pen","teal","Registro de avance","De una OT o una SS en el taller")}
      ${tile("package-minus","teal","Consumo de repuestos","Lo usado en una OT")}
      ${tile("package-plus","teal","Recepción de repuestos","Lo que llegó al buque")}
      ${tile("list-checks","teal","Completar checklist","Rutinas de a bordo")}
      ${S.role==="admin"?tile("flask-conical","teal","Análisis de laboratorio","Subir varios PDF juntos"):""}
    </div></div>
    <div class="sec"><h3>${I("search",12)}Consultar</h3><div class="tiles">
      ${tile("table-2","orange","Planilla de mantenimiento","El plan como en papel")}
      ${tile("calendar-clock","blue","Tareas de la semana","Hasta el domingo",weekBadge)}
      ${tile("gauge","blue","Estado de equipos","Semáforo e historial")}
    </div></div>
    ${S.role==="admin"?`<div class="sec"><h3>${I("clipboard-check",12)}Auditorías</h3><div class="tiles">
      ${tile("clipboard-check","violet","Auditoría TMSA","Elemento 4 / 4A")}
      ${tile("life-buoy","violet","Auditoría ISM","Capítulo 10")}
    </div></div>`:""}
  </div>`;

  const donut=segs=>{ const tot=segs.reduce((a,s)=>a+s[1],0); let acc=0;
    const g=segs.filter(s=>s[1]).map(s=>{const a=acc/tot*360; acc+=s[1]; return `${s[2]} ${a}deg ${acc/tot*360}deg`;}).join(",");
    return `<div class="donut" style="background:conic-gradient(${g||'#E5E7EB 0 360deg'})"><span>${tot}</span></div>`; };
  const legend=segs=>`<div class="leg">${segs.filter(s=>s[1]).map(s=>`<button onclick="toast('Filtra: ${s[0]} (demo)')"><i class="dot" style="background:${s[2]}"></i>${s[0]}<b>${s[1]}</b></button>`).join("")}</div>`;
  const card=(icon,title,head,segs)=>`<div class="card"><div class="top">${I(icon,14)}<b>${title}</b><button title="Abrir">${I("arrow-up-right",15)}</button></div>
    <button class="head ${head.cls}" onclick="toast('Abre la lista: ${head.l} (demo)')">${head.cls==='ok'?I("check",16):`<span class="n">${head.n}</span>`}<span class="l">${head.l}</span></button>
    <div class="body">${donut(segs)}${legend(segs)}</div></div>`;
  const cards=`<div class="cards">
    ${card("wrench","Órdenes de Trabajo", busy?(S.role==="admin"?{cls:"blue",n:3,l:"esperan tu firma"}:{cls:"amber",n:4,l:"sin enviar a aprobar"}):{cls:"ok",l:"Al día"}, d.wo.segs)}
    ${card("handshake","Solicitudes de Servicio", busy?{cls:"red",n:1,l:"con +15 días en el taller"}:{cls:"ok",l:"Al día"}, d.ss.segs)}
    ${card("clipboard-list","Plan de Mantenimiento", busy?{cls:"red",n:6,l:"tareas vencidas"}:{cls:"ok",l:"Al día"}, d.mp.segs)}
    ${card("clock","Diferimientos", busy?{cls:"amber",n:2,l:"para revisar"}:{cls:"ok",l:"Al día"}, d.def.segs)}
  </div>`;
  return hdr+urgent+access+cards;
}

function ref(){
  const b=(t)=>`<div class="refbtn">${I("square",18)}${t}</div>`;
  return `<div><span class="note">Sin encabezado: no dice buque, fecha ni si falta el reporte diario</span></div>
  <div class="refgrid">${b("Cargar horas de equipos")}</div>
  <div class="refgrid">${["Nueva Orden de Trabajo","Nueva Solicitud de Servicio","Generar inspección","Nuevo permiso","Registro de avance","Consumo de repuestos","Completar checklist","Análisis de laboratorio","Recepción de repuestos"].map(b).join("")}</div>
  <div><span class="note">9 botones verdes iguales, sin explicación: cuesta encontrar el que buscás</span><span class="note">En celular: uno debajo del otro, mucho scroll</span></div>
  <div class="refgrid">${["Planilla de mantenimiento","Tareas de la semana","Estado de equipos"].map(b).join("")}</div>
  <div style="background:#FFFBEB;border:1px solid #FCD34D;border-radius:12px;padding:10px 14px;font-size:12px;font-weight:700;color:#92400E">⚠ Reportes sin procesar: Análisis 2 · Permisos 1 · Diferimientos 1</div>
  <div><span class="note">Lo urgente queda abajo de todos los botones</span></div>
  <div class="refgrid">${["Órdenes de Trabajo","Solicitudes de Servicio","Planes de Mantenimiento","Diferimientos"].map(t=>`<div class="card"><b style="font-size:12px">${t}</b><div class="body"><div class="donut" style="background:conic-gradient(#94A3B8 0 120deg,#60A5FA 120deg 200deg,#047857 200deg 360deg)"><span>13</span></div><div class="leg"><button>…</button><button>…</button><button>…</button></div></div></div>`).join("")}</div>
  <div><span class="note">Las donas no dicen qué hay que hacer: los vencidos se leen en la leyenda</span><span class="note">Certificados vencidos y SS demoradas no aparecen</span></div>`;
}

function render(){
  document.querySelectorAll(".pv-bar button[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===S.view));
  document.querySelectorAll(".pv-bar button[data-role]").forEach(b=>b.classList.toggle("on",b.dataset.role===S.role));
  document.querySelectorAll(".pv-bar button[data-day]").forEach(b=>b.classList.toggle("on",b.dataset.day===S.day));
  const root=document.getElementById("root"); const y=window.scrollY;
  root.innerHTML = S.view==="ref" ? ref() : page();
  if(S.toast) root.insertAdjacentHTML("beforeend",`<div class="toast">${S.toast}</div>`);
  lucide.createIcons(); window.scrollTo(0,y);
}
function toast(m){ S.toast=m; render(); setTimeout(()=>{S.toast=null;render();},1600); }
document.querySelectorAll(".pv-bar button[data-v]").forEach(b=>b.onclick=()=>{S.view=b.dataset.v;render();});
document.querySelectorAll(".pv-bar button[data-role]").forEach(b=>b.onclick=()=>{S.role=b.dataset.role;render();});
document.querySelectorAll(".pv-bar button[data-day]").forEach(b=>b.onclick=()=>{S.day=b.dataset.day;render();});
render();
</script>
</body>
</html>
