 {id:2,eq:"Motor principal Br",t:"Toma de muestra de aceite",code:"DEM1-6-015",g:6,type:"M",freq:"250 h",last:"41.100 h",due:"41.350 h",dueTxt:"pasada por 10 h",st:"over",act:"wo",lab:"Laboratorio Demo",wo:"OT-DEM1-26-0088",v:"BUQUE DEMO I"},
 {id:3,eq:"Generador auxiliar 2",t:"Inspección de acoplamiento",code:"DEM1-7-031",g:7,type:"I",freq:"3 meses",last:"12/06/2026",due:"12/09/2026",dueTxt:"vencida hace 3 días",st:"over",act:"report",v:"BUQUE DEMO I"},
 {id:4,eq:"Bomba contra incendio",t:"Prueba de funcionamiento",code:"DEM1-8-004",g:8,type:"I",freq:"1 mes",last:"20/08/2026",due:"20/09/2026",dueTxt:"faltan 5 días · en ventana",st:"win",act:"report",v:"BUQUE DEMO I"},
 {id:5,eq:"Separador de sentina",t:"Limpieza de filtro coalescente",code:"DEM1-7-044",g:7,type:"M",freq:"6 meses",last:"02/04/2026",due:"02/10/2026",dueTxt:"faltan 17 días",st:"soon",act:"wo",v:"BUQUE DEMO I"},
 {id:6,eq:"Molinete de proa",t:"Engrase general",code:"DEM1-4-002",g:4,type:"M",freq:"1 mes",last:"01/09/2026",due:"01/10/2026",dueTxt:"faltan 16 días",st:"oos",act:"",v:"BUQUE DEMO I"},
 {id:7,eq:"Hélice de proa",t:"Medición de huelgo axial",code:"DEM1-2-009",g:2,type:"I",freq:"12 meses",last:"—",due:"—",dueTxt:"sin fecha de inicio",st:"none",act:"start",v:"BUQUE DEMO I"},
 {id:8,eq:"Motor principal Er",t:"Calibración de inyectores",code:"DEM1-6-020",g:6,type:"M",freq:"2.000 h",last:"—",due:"—",dueTxt:"sin horas de referencia",st:"none",act:"start",v:"BUQUE DEMO I",prov:"Taller Naval Demo"},
 {id:9,eq:"Generador auxiliar 1",t:"Service 1.000 h",code:"DEM1-7-030",g:7,type:"M",freq:"1.000 h",last:"17.800 h",due:"18.800 h",dueTxt:"faltan 400 h · ~50 días",st:"ok",act:"",v:"BUQUE DEMO I"},
];
const STL={over:["Vencida","c-over"],win:["Hacer ahora","c-win"],soon:["Vence pronto","c-soon"],ok:["Al día","c-ok"],none:["Sin vencimiento","c-none"],oos:["Equipo parado","c-oos"]};
const cardM=(p,k)=>k==="over"?p.st==="over":k==="win"?p.st==="win":k==="soon"?p.st==="soon":k==="none"?p.st==="none":k==="oos"?p.st==="oos":true;
const stageM=(p,k)=>k==="todo"?(p.st==="over"||p.st==="win"):k==="next"?(p.st==="soon"):k==="ok"?(p.st==="ok"||p.st==="oos"):true;
const Q={none:[561,"bad","Sin próximo vencimiento","Nunca van a avisar: falta la última ejecución o la fecha de inicio"],crit:[447,"warn","Sin criterio de aceptación","No dicen cómo se sabe si quedó bien"],resp:[20,"warn","Sin responsable","Nadie asignado a hacerla"],risk:[312,"warn","Sin nivel de riesgo","No se puede priorizar"]};
function actionBtn(p){
  if(p.act==="wo") return p.wo?`<a class="wolink" onclick="event.stopPropagation();toast('Abre ${p.wo} (demo)')">${I("external-link",11)}${p.wo} abierta</a>`:`<button class="act ${p.st==='over'?'red':''}" onclick="event.stopPropagation();toast('Abre la OT (demo)')">${I("zap",12)}Abrir OT</button>`;
  if(p.act==="report") return `<button class="act green" onclick="event.stopPropagation();toast('Abre Reportar ejecución (demo)')">${I("check-circle-2",12)}Reportar</button>`;
  if(p.act==="start") return `<button class="act orange" onclick="event.stopPropagation();toast('Abre la tarea en Cuándo se hace (demo)')">${I("calendar-plus",12)}Poner fecha de inicio</button>`;
  return "";
}
function listPage(){
  const q=S.q.toLowerCase();
  let L=P.filter(p=>(!S.card||cardM(p,S.card))&&(S.card||S.qsel||stageM(p,S.stage))&&(!q||(p.eq+p.t+p.code).toLowerCase().includes(q)));
  if(S.qsel==="none") L=P.filter(p=>p.st==="none");
  const cnt=k=>({over:75,win:94,soon:128,none:561,oos:23})[k];
  const sc=(k,cls,ic,l,h)=>`<button class="sc ${cls} ${S.card===k?'on':''}" onclick="S.card=S.card==='${k}'?'':'${k}';S.qsel='';render()"><span class="n">${cnt(k)}</span><span class="l">${I(ic,13)}${l}</span><span class="h">${h}</span></button>`;
  const groups=[...new Set(L.map(p=>p.eq))];
  const row=p=>`<tr class="${p.st==='over'?'over':p.st==='win'?'win':''}" onclick="toast('Abre la tarea (demo)')">
    <td onclick="event.stopPropagation()"><input type="checkbox" ${S.marked.has(p.id)?'checked':''} onchange="S.marked.has(${p.id})?S.marked.delete(${p.id}):S.marked.add(${p.id});render()" title="Marcar para juntar en una OT"></td>
    <td><div style="display:flex;gap:6px;align-items:center">${I(p.type==='I'?'shield-check':'wrench',13)}<b style="font-size:12.5px">${p.t}</b>${p.risk?'<span class="chipst c-over" style="padding:0 5px">riesgo alto</span>':''}</div>
      <div class="icoline">${p.code} · G${p.g}${p.lab?` · <span style="color:#047857;font-family:Inter">${I("flask-conical",10)} ${p.lab}</span>`:''}${p.prov?` · <span style="color:#6D28D9;font-family:Inter">${I("truck",10)} ${p.prov}</span>`:''}</div></td>
    <td style="font-family:ui-monospace,monospace;font-size:12px">${p.freq}</td>
    <td style="font-family:ui-monospace,monospace;font-size:12px;color:var(--muted)">${p.last}</td>
    <td><span class="due d-${p.st==='oos'?'ok':p.st}">${p.due}<small>${p.dueTxt}</small></span></td>
    <td><span class="chipst ${STL[p.st][1]}">${STL[p.st][0]}</span></td>
    <td>${actionBtn(p)}</td></tr>`;
  return `<div class="main">
  <div class="ph"><h1>${I("clipboard-list",20)}Plan de Mantenimiento</h1><span class="count">${L.length} a la vista</span>
   <div class="right" style="flex-wrap:wrap">
    <div class="views">${[["list","list","Lista"],["sheet","table","Planilla"],["matrix","grid-3x3","Matriz"],["cal","calendar-days","Calendario"]].map(([k,ic,l])=>`<button class="${S.view===k?'on':''}" onclick="S.view='${k}';toast('Cambia a ${l} (demo)')">${I(ic,13)}${l}</button>`).join("")}</div>
    <button class="btn">${I("more-horizontal",14)}Más <span class="sub">(Excel, importar, próximos a vencer)</span></button>
    <button class="btn blue">${I("plus",14)}Nueva tarea</button></div></div>

  <div class="sum five">${sc("over","red","alarm-clock","Vencidas","Pasaron la fecha u horas")}${sc("win","violet","play-circle","Hacer ahora","En su ventana de ejecución")}${sc("soon","blue","calendar-clock","Vencen en 30 días","Para planificar")}${sc("none","red","calendar-x","Sin vencimiento","Nunca van a avisar")}${sc("oos","green","power-off","Equipo parado","Tareas de equipos fuera de servicio")}</div>

  <details class="quality" ${S.qopen?'open':''} ontoggle="S.qopen=this.open"><summary>${I("clipboard-check",15)}Calidad del plan <span class="sub" style="font-weight:600">· lo que falta para que el plan avise y se pueda auditar (ISM 10.1)</span><span style="margin-left:auto" class="chipst c-none">4 temas</span></summary>
   <div class="qgrid">${Object.entries(Q).map(([k,[n,cls,l,h]])=>`<button class="qi ${cls} ${S.qsel===k?'on':''}" onclick="S.qsel=S.qsel==='${k}'?'':'${k}';S.card='';render()"><b>${n}</b><span>${l}</span><small>${h}</small></button>`).join("")}</div></details>

  <div class="fbar"><div class="stage">
    ${[["todo","Para hacer",169],["next","Próximas",128],["ok","Al día",2474],["all","Todas",3232]].map(([k,l,n])=>`<button class="${S.stage===k&&!S.card&&!S.qsel?'on':''}" onclick="S.stage='${k}';S.card='';S.qsel='';render()">${l} <span class="c">${n}</span></button>`).join("")}</div>
   <div class="frow"><select class="sel"><option>Buque: BUQUE DEMO I</option></select><select class="sel sfisel"><option>Sistema: todos</option><option>6 · Máquina principal</option><option>7 · Sistemas de máquina</option></select><select class="sel"><option>Tipo: todos</option><option>Mantenimiento</option><option>Inspección</option></select><select class="sel"><option>Quién: todos</option><option>A bordo</option><option>Proveedor / laboratorio</option></select>
    <label class="ck" style="padding:5px 9px;border-radius:10px"><input type="checkbox" checked> Agrupar por equipo</label>
    <div class="search">${I("search")}<input id="q" placeholder="Buscar tarea, equipo o código…" value="${S.q}" oninput="S.q=this.value;render();const e=document.getElementById('q');e.focus();e.setSelectionRange(e.value.length,e.value.length)"></div></div></div>

  ${S.qsel==="none"?`<div class="next n-draft" style="margin:0"><div class="top"><div class="ni">${I("calendar-x",20)}</div><div><div class="nt">561 tareas sin próximo vencimiento</div><div class="nd">Abrí cada una y en <b>Cuándo se hace</b> cargá la última vez que se hizo (fecha u horas). Desde ahí el sistema calcula el próximo vencimiento y empieza a avisar.</div></div></div></div>`:''}

  <div class="tbl"><table style="min-width:980px"><tr><th style="width:30px" title="Marcar para juntar en una OT">${I("layers",12)}</th><th>Tarea</th><th>Cada</th><th>Última vez</th><th>Vence</th><th>Situación</th><th></th></tr>
   ${groups.map(g=>`<tr class="grp"><td colspan="7">${I("cog",12)} ${g} <span class="sub">· ${L.filter(p=>p.eq===g).length} tareas</span></td></tr>${L.filter(p=>p.eq===g).map(row).join("")}`).join("")}
  </table></div>
  <div class="cards">${L.map(p=>`<div class="card ${p.st==='over'?'hot':''}"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="chipst ${STL[p.st][1]}">${STL[p.st][0]}</span><span class="sub">${p.eq}</span></div><b>${p.t}</b><span class="due d-${p.st==='oos'?'ok':p.st}">${p.due} <small>${p.dueTxt}</small></span>${actionBtn(p)}</div>`).join("")}</div>

  ${S.marked.size?`<div class="bundlebar">${I("layers",16)}<b>${S.marked.size} tareas marcadas</b><span style="font-size:12px;opacity:.75">BUQUE DEMO I · se hacen juntas en una sola OT (p. ej. parada o astillero)</span><span style="flex:1"></span><button style="background:#374151;color:#fff" onclick="S.marked.clear();render()">Desmarcar</button><button style="background:#0284C7;color:#fff" onclick="toast('Abre una OT con las ${S.marked.size} tareas (demo)')">${I("zap",12)} Abrir una OT con las ${S.marked.size}</button></div>`:''}
  </div>`;
}
function refPage(){
  return `<div class="main"><div class="fix" style="background:#fff;border:1px solid var(--fg10);border-radius:14px;padding:14px 18px;font-size:13px;line-height:1.55">
  <b style="font-size:14px">Qué cambia respecto de hoy</b>
  <ol style="padding-left:18px">
   <li><b>Abre en "Para hacer"</b> (vencidas + en ventana) en lugar de mostrar todas las tareas mezcladas.</li>
   <li><b>Tarjetas arriba</b>: vencidas, hacer ahora, vencen en 30 días, sin vencimiento y equipo parado. Tocar una filtra.</li>
   <li><b>Vence contado</b>: "vencida hace 3 días", "pasada por 180 h", "faltan 400 h · ~50 días" (con el uso real del equipo).</li>
   <li><b>OT ya abierta</b> visible en la fila con enlace; no se ofrece abrir otra.</li>
   <li><b>Proveedor o laboratorio</b> visible cuando la tarea es tercerizada.</li>
   <li><b>Tareas sin vencimiento</b> ya no se ven "al día": se marcan en naranja con el botón "Poner fecha de inicio".</li>
   <li><b>Juntar en una OT</b>: al marcar tareas aparece una barra abajo con "Abrir una OT con las N" (hoy es una casilla sin explicación).</li>
   <li><b>Encabezado ordenado</b>: selector de vista Lista / Planilla / Matriz / Calendario y un botón "Más" para Excel, importar y el reporte de próximos a vencer.</li>
   <li><b>Calidad del plan</b> (plegable): sin próximo vencimiento, sin criterio, sin responsable, sin riesgo. Cada uno filtra la lista para corregir.</li>
   <li><b>Filtros visibles</b>: buque, sistema, tipo y "quién lo hace" (a bordo / proveedor).</li>
   <li><b>Celular</b>: tarjetas con la acción a mano.</li>
  </ol>
  <p class="sub">No cambia: la ventana de la tarea (V15–V17), Reportar ejecución (V16), la Planilla y la Matriz actuales, ni las reglas de vencimiento. "Calendario" abre la vista de carga que ya existe.</p>
  <p class="sub">Cifras de la copia local de la base (31/08): 3.232 tareas activas, 75 vencidas, 94 en ventana, 561 sin vencimiento, 447 sin criterio, 20 sin responsable.</p>
  </div></div>`;
}
function render(){
  document.querySelectorAll(".pv-bar button").forEach(b=>{const k=Object.keys(b.dataset)[0];b.classList.toggle("on",S[k]===b.dataset[k]);});
  let h=S.v==="new"?listPage():refPage();
  if(S.toast)h+=`<div class="toast">${S.toast}</div>`;
  document.getElementById("root").innerHTML=h; lucide.createIcons();
}
document.querySelectorAll(".pv-bar button").forEach(b=>b.onclick=()=>{const k=Object.keys(b.dataset)[0];S[k]=b.dataset[k];render();});
render();
</script>
</body>
