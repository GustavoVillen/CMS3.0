<style>

<body>
<div class="pv-bar">
  <b>Equipos · Repuestos · Proveedores · Preview V23</b><span class="tag">DEMO · DATOS FICTICIOS</span><span class="sep"></span>
  <button data-m="eq" class="on">Equipos</button><button data-m="sp">Repuestos</button><button data-m="pr">Proveedores</button>
  <span class="sep"></span><button data-w="list" class="on">Listado</button><button data-w="detail">Ventana abierta</button>
  <span class="sep"></span><button data-v="new" class="on">Propuesta</button><button data-v="ref">Qué cambia</button>
</div>
<div id="root"></div>
<script>
const I=(n,s=15)=>`<i data-lucide="${n}" style="width:${s}px;height:${s}px"></i>`;
const S={m:"eq",w:"list",v:"new",card:"",q:"",sfi:"",dlg:null,toast:null};
function toast(t){S.toast=t;render();setTimeout(()=>{S.toast=null;render();},1800);}
function keep(){const p=document.getElementById("q").selectionStart;render();const e=document.getElementById("q");e.focus();e.setSelectionRange(p,p);}
const go=(t)=>`<span class="lnk" onclick="event.stopPropagation();toast('Abre ${t} (demo)')">${I("arrow-up-right",12)}</span>`;

/* ───────────── EQUIPOS ───────────── */

 {c:"PRV-0007",n:"Taller Naval Demo",cat:"Taller",st:"ACTIVE",ct:"Jorge Ruiz",tel:"+595 21 111 111",ss:22,ssOpen:5,wo:30,plans:12,gr:0},
 {c:"PRV-0011",n:"Distribuidora Demo S.A.",cat:"Repuestos",st:"ACTIVE",ct:"Luis Gómez",tel:"+595 21 222 222",ss:3,ssOpen:0,wo:0,plans:0,gr:5},

const prCard=(x,k)=>k==="open"?x.ssOpen>0:k==="plans"?x.plans>0:k==="nocontact"?(x.st==="ACTIVE"&&!x.ct):k==="inactive"?x.st!=="ACTIVE":true;
function prList(){
  const q=S.q.toLowerCase(); const L=PR.filter(x=>(!S.card||prCard(x,S.card))&&(!q||(x.c+x.n+x.cat).toLowerCase().includes(q)));
  const cnt=k=>PR.filter(x=>prCard(x,k)).length;
  const sc=(k,cls,ic,l,h)=>`<button class="sc ${cls} ${S.card===k?'on':''}" onclick="S.card=S.card==='${k}'?'':'${k}';render()"><span class="n">${cnt(k)}</span><span class="l">${I(ic,13)}${l}</span><span class="h">${h}</span></button>`;
  return `<div class="main">
  <div class="ph"><h1>${I("truck",20)}Proveedores</h1><span class="count">${L.length} a la vista</span><div class="right"><button class="btn">${I("file-spreadsheet",14)}Excel</button><button class="btn" style="background:#0F766E;border-color:#0F766E;color:#fff">${I("plus",14)}Nuevo proveedor</button></div></div>
  <div class="sum">${sc("open","blue","wrench","Con SS abiertas","Trabajos pedidos sin terminar")}${sc("plans","violet","calendar-check","Con tareas del plan","Tienen tareas asignadas")}${sc("nocontact","red","phone-off","Sin contacto","Activos sin nombre ni teléfono")}${sc("inactive","green","archive","Inactivos","Dados de baja")}</div>
  <div class="fbar"><div class="frow"><select class="sel"><option>Categoría: todas</option><option>Laboratorio</option><option>Taller</option><option>Repuestos</option></select><select class="sel"><option>Activos</option><option>Inactivos</option><option>Todos</option></select>
   <div class="search">${I("search")}<input id="q" placeholder="Buscar nombre, código, categoría o contacto…" value="${S.q}" oninput="S.q=this.value;keep()"></div></div></div>
  <div class="tbl"><table><tr><th>Proveedor</th><th>Categoría</th><th>Contacto</th><th>Trabajo con nosotros</th><th>Estado</th></tr>
  ${L.map(x=>`<tr class="${x.st!=='ACTIVE'?'':''}" onclick="openW()"><td><b>${x.n}</b><div class="sub">${x.c}</div></td><td>${x.cat}</td>
   <td>${x.ct?`${x.ct}<div class="sub">${x.tel||"sin teléfono"}</div>`:`<span class="mini bad">${I("phone-off",12)}Falta contacto</span>`}</td>
   <td>${x.ssOpen?`<span class="mini bad" style="color:#1D4ED8">${I("wrench",12)}${x.ssOpen} SS abiertas</span>`:""}${x.ss?`<span class="mini">${x.ss} SS</span>`:""}${x.plans?`<span class="mini">${I("calendar-check",12)}${x.plans} tareas</span>`:""}${x.gr?`<span class="mini">${I("package",12)}${x.gr} recepciones</span>`:""}${!x.ss&&!x.plans&&!x.gr?`<span class="sub">Sin movimiento</span>`:""}</td>
   <td><span class="stg ${x.st==='ACTIVE'?'s-CLOSED':'s-DRAFT'}">${x.st==='ACTIVE'?'Activo':'Inactivo'}</span></td></tr>`).join("")}</table></div>
  <div class="cards">${L.map(x=>`<div class="card" onclick="openW()"><b>${x.n}</b><div class="sub">${x.c} · ${x.cat}</div><div>${x.ssOpen?`<span class="mini">${x.ssOpen} SS abiertas</span>`:""}${x.plans?`<span class="mini">${x.plans} tareas</span>`:""}</div></div>`).join("")}</div>
  </div>`;
}

  return `<div class="overlay"><div class="modal m-pr">
  <div class="mh"><div class="ic" style="background:#CCFBF1;color:#0F766E">${I("flask-conical",24)}</div><div style="min-width:0;flex:1"><div class="kicker" style="color:#0F766E">Proveedor · Laboratorio</div><h1>Laboratorio Demo S.A.</h1><div class="d">Asunción · Ana Pérez</div>
   <div class="chips"><span class="chip mono">PRV-0003</span><span class="stg s-CLOSED">Activo</span><a class="chip link">${I("phone",11)}+595 21 000 000</a><a class="chip link">${I("mail",11)}lab@demo.com</a></div></div><button class="close">${I("x",18)}</button></div>
  <div class="body"><div class="col">
   <div class="sec"><div class="sech"><span class="num">1</span><div><h2>Datos del proveedor</h2><div class="hint">Nombre, rubro y estado</div></div></div><div class="secb">
    <div><div class="lbl">Nombre</div><input class="inp" value="Laboratorio Demo S.A."></div>

   <div class="sec"><div class="sech"><span class="num">2</span><div><h2>Contacto</h2><div class="hint">A quién se llama</div></div></div><div class="secb">
    <div><div class="lbl">Nombre</div><input class="inp" value="Ana Pérez"></div>
    <div class="row2"><div><div class="lbl">Teléfono</div><input class="inp" value="+595 21 000 000"></div><div><div class="lbl">Email</div><input class="inp" value="lab@demo.com"></div></div>
    <div><div class="lbl">Notas</div><textarea class="inp" rows="3">Retira muestras los martes. Informe en 10 días hábiles.</textarea></div></div></div>
  </div><div class="col">
   <div class="box"><h3>${I("bar-chart-3",15)}Trabajo con nosotros</h3><div class="bb"><div class="kpis"><div><small>SS abiertas</small><b style="color:#1D4ED8">2</b></div><div><small>SS en total</small><b>4</b></div><div><small>Tareas del plan</small><b>121</b></div></div></div></div>
   <div class="box"><h3>${I("wrench",15)}Solicitudes de servicio<span class="r"><span class="lnk">Ver todas</span></span></h3><div class="bb">
    <div class="rel"><span class="wo">SS-DEM-26-0012</span>Toma de muestras de aceite<span class="r"><span class="stg s-REQUESTED">En taller</span>${I("chevron-right",14)}</span></div>
    <div class="rel"><span class="wo">SS-DEM-26-0009</span>Análisis de combustible<span class="r"><span class="stg s-APPROVED">Autorizada</span>${I("chevron-right",14)}</span></div></div></div>
   <div class="box"><h3>${I("calendar-check",15)}Tareas del plan asignadas<span class="r"><span class="lnk">Ver en planes</span></span></h3><div class="bb">
    <div class="rel"><b>BUQUE DEMO I</b><span class="sub">64 tareas · muestreo de aceite y vibraciones</span><span class="r">${I("chevron-right",14)}</span></div>
    <div class="rel"><b>BUQUE DEMO II</b><span class="sub">57 tareas · muestreo de aceite</span><span class="r">${I("chevron-right",14)}</span></div></div></div>
   <div class="box"><h3>${I("package",15)}Recepciones de repuestos</h3><div class="bb"><div class="empty">No entregó repuestos.</div></div></div>
  </div></div>
  <div class="mf"><button class="btn red">${I("trash-2",14)}Eliminar</button><span class="sp"></span><button class="btn ghost">Cerrar</button><button class="btn" style="background:#0F766E;border-color:#0F766E;color:#fff">${I("save",14)}Guardar</button></div>
  </div></div>`;
}

/* ───────────── Qué cambia ───────────── */
const REF={
 eq:`<b>Listado</b><br>• Tarjetas: críticos sin plan, ISM 10.3, no operativos y con defectos abiertos.<br>• Filtro de buque visible (hoy está programado pero no aparece).<br>• Sistema SFI con nombre, no sólo el número. Criticidad con color.<br>• Columnas nuevas: plan (tareas / vencidas / exento), horas y defectos abiertos.<br>• En celular, tarjetas en vez de tabla con scroll.<br><br><b>Ventana del equipo</b><br>• Aviso arriba si le falta el plan.<br>• Formulario en 3 bloques en vez de una sola columna larga.<br>• A la derecha, los nexos: plan, <b>defectos abiertos (nuevo)</b> con "Reportar" ya cargado, últimas OT, horas y análisis de aceite (nuevo), repuestos de sus tareas (nuevo).<br>• Errores en ventanita y textos traducidos.`,
 sp:`<b>Listado</b><br>• Tarjetas: sin stock, bajo el mínimo, para reponer, críticos A en falta.<br>• Stock con barra y marca del mínimo.<br>• "Se usa en" (tareas del plan que llevan el repuesto).<br>• Acción por fila: Pedir / Pedido en curso / Ajustar.<br>• "Nuevo repuesto" deja elegir: cargar desde remito con IA (como hoy) o alta simple.<br><br><b>Ventana del repuesto</b><br>• Arriba: cuánto hay contra mínimo/reorden/objetivo, y "Ajustar stock" como botón (hoy está escondido en un recuadro).<br>• A la derecha: equipos y tareas donde se usa, movimientos con la OT clickeable, y quién lo trae (último proveedor de las recepciones).<br>• Borrar con ventanita propia, errores en ventanita, textos traducidos.`,
 pr:`<b>Listado</b><br>• Buscador y filtros de categoría y estado (hoy están programados pero no se ven).<br>• Tarjetas: con SS abiertas, con tareas del plan, activos sin contacto, inactivos.<br>• Columna "Trabajo con nosotros": SS, tareas asignadas y recepciones.<br><br><b>Ventana del proveedor</b><br>• Teléfono y mail tocables.<br>• A la derecha: SS del proveedor (abre la SS), tareas del plan asignadas por buque (p. ej. el laboratorio con sus muestreos) y recepciones de repuestos.<br>• Permiso de edición por "Gestionar proveedores" de Equipo → Permisos (hoy es una lista fija de roles).<br>• Borrar con ventanita propia, textos traducidos.<br><br><b>No incluido</b>: evaluaciones y no conformidades de proveedores (no hay datos ni forma de cargarlas).`,
};
function refPage(){ return `<div class="main"><div class="proplist">${REF[S.m]}</div></div>`; }

function adjDlg(){ return `<div class="dlg" onclick="if(event.target===this){S.dlg=null;render()}"><div><div class="dh">${I("sliders-horizontal",18)}Ajustar stock<button class="close" style="width:30px;height:30px" onclick="S.dlg=null;render()">${I("x",16)}</button></div><div class="db">
  <div class="sub">Filtro de aceite generador Cummins · hoy hay <b>1 ud</b></div><div><div class="lbl">Cantidad contada</div><input class="inp" value="3"></div><div><div class="lbl">Motivo</div><input class="inp" placeholder="Ej.: conteo de pañol"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" onclick="S.dlg=null;render()">Volver</button><button class="btn green" onclick="S.dlg=null;toast('Stock ajustado y registrado (demo)')">Guardar ajuste</button></div></div></div></div>`; }
function newDlg(){ return `<div class="dlg" onclick="if(event.target===this){S.dlg=null;render()}"><div style="max-width:560px"><div class="dh">${I("package-plus",18)}Nuevo repuesto<button class="close" style="width:30px;height:30px" onclick="S.dlg=null;render()">${I("x",16)}</button></div><div class="db">
  <div class="newpick"><button onclick="S.dlg=null;toast('Abre la carga desde remito (como hoy)')"><b>${I("scan-line",16)} Desde un remito</b><span class="sub">Sacale foto al remito y la IA carga los ítems y el stock.</span></button>
  <button onclick="S.dlg=null;S.w='detail';render()"><b>${I("pencil",16)} Alta simple</b><span class="sub">Cargar un repuesto a mano, sin stock todavía.</span></button></div></div></div></div>`; }

function openW(){S.w="detail";render();}
function render(){
  document.querySelectorAll(".pv-bar button").forEach(b=>{const k=Object.keys(b.dataset)[0];b.classList.toggle("on",S[k]===b.dataset[k]);});
  const pages={eq:[eqList,eqDetail],sp:[spList,spDetail],pr:[prList,prDetail]};
  let h=S.v==="ref"?refPage():pages[S.m][S.w==="list"?0:1]();
  if(S.dlg==="adj")h+=adjDlg(); if(S.dlg==="new")h+=newDlg();
  if(S.toast)h+=`<div class="toast">${S.toast}</div>`;
  document.getElementById("root").innerHTML=h; lucide.createIcons();
}
document.querySelectorAll(".pv-bar button").forEach(b=>b.onclick=()=>{const k=Object.keys(b.dataset)[0];S[k]=b.dataset[k];if(k==="m"){S.card="";S.q="";S.sfi="";S.w="list";}S.dlg=null;render();});
render();
</script>
