function filled(w,i){ if(S.s==="full") return true; if(S.s==="empty") return false; return i%2===0; }
function field(w,[l,val,k],i){
  const has=filled(w,i)&&val; const isReq=k==="req"; const isCond=k.startsWith("cond:"); const condOn=isCond&&S.s!=="full";
  const miss=!has&&(isReq||condOn);
  return `<div class="gf ${miss?'miss':''}"><div class="lbl">${l}${miss?`<span class="need">${I("pencil",9)}Completar</span>`:""}${isCond&&miss?`<span class="cond">${k.slice(5)}</span>`:""}${k==="opt*"&&!has?`<span class="cond">recomendado (ya estaba)</span>`:""}</div><input class="inp" value="${has?val:""}" placeholder=""></div>`;
}
function cards(){
  return `<div class="main">
  <div class="rule">
   <div><b>${I("pencil",13)} Qué se marca</b>Sólo lo que hoy el sistema exige para guardar (u otro paso). No se agregan obligaciones nuevas.</div>
   <div><b>${I("paint-bucket",13)} Cómo se ve</b>Franja y fondo naranja con la etiqueta "Completar", igual que en la OT, la SS, el plan y el permiso nuevo. Al completarlo, la marca se va sola.</div>
   <div><b>${I("list-checks",13)} Resumen</b>Cada bloque dice "Faltan N datos" o "Completo", y el botón de guardar muestra "(faltan N)". Si igual se toca Guardar, sigue saliendo la ventanita de aviso.</div>
   <div><b>${I("git-branch",13)} Condicionales</b>Se marcan sólo cuando aplican (ej. "motivo de la exención" sólo si se tilda que no lleva plan).</div>
  </div>
  <div class="grid">${W.map(w=>{ const miss=w.f.filter(([l,val,k],i)=>!(filled(w,i)&&val)&&(k==="req"||(k.startsWith("cond:")&&S.s!=="full"))).length;
    return `<div class="win"><div class="wh">${I(w.ic,15)}<b>${w.n}</b><span class="pillm ${miss?'':'ok'}" style="margin-left:auto">${miss?(miss===1?"Falta 1 dato":`Faltan ${miss} datos`):"Completo"}</span><span class="v">${w.v}</span></div>
    <div class="wb">${w.f.map((f,i)=>field(w,f,i)).join("")}</div>
    <div class="wf"><button class="btn ghost">Cerrar</button><button class="btn blue">${I("save",13)}${w.save}${miss?` <span style="font-size:10px;opacity:.85">(faltan ${miss})</span>`:""}</button></div></div>`; }).join("")}</div></div>`;
}
function table(){
  const rows=W.flatMap(w=>w.f.filter(f=>f[2]!=="opt").map(f=>`<tr><td><b>${w.n}</b> <span class="sub">${w.v}</span></td><td>${f[0]}</td><td>${f[2]==="req"?"Siempre":f[2]==="opt*"?"Recomendado":f[2].slice(5)}</td><td>${f[2]==="opt*"||(w.n.startsWith("Permiso")&&f[0].startsWith("Peligros"))||(w.n==="Reportar ejecución"&&f[0].startsWith("Deficiencias"))?'<span class="yes">Ya marcado</span>':'<span class="no">Se agrega</span>'}</td></tr>`)).join("");
  return `<div class="main"><div class="tbl2"><table><tr><th>Ventana</th><th>Campo</th><th>Cuándo es obligatorio</th><th>Hoy</th></tr>${rows}</table></div>
  <div class="proplist"><b>Sin cambios:</b> Completar OT y Completar SS (V7/V8) y el Nuevo permiso (V19) ya marcan todo. <b>Listados</b> (V12, V13, V18, V21–V23) no tienen campos. <b>Carga masiva de análisis</b> y <b>recepción de repuestos</b>: las filas incompletas ya quedan bloqueadas; se les suma la misma marca naranja en la celda que falta.</div></div>`;
}
function render(){
  document.querySelectorAll(".pv-bar button").forEach(b=>{const k=Object.keys(b.dataset)[0];b.classList.toggle("on",S[k]===b.dataset[k]);});
  document.getElementById("root").innerHTML=S.v==="cards"?cards():table(); lucide.createIcons();
}
document.querySelectorAll(".pv-bar button").forEach(b=>b.onclick=()=>{const k=Object.keys(b.dataset)[0];S[k]=b.dataset[k];render();});
render();
</script>
