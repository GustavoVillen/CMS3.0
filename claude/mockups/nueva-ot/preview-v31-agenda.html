<title>Agenda de mantenimiento</title>
<meta name="theme-color" content="#0D1B2A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --stage:#E7EAEF; --bg:#F4F5F7; --surface:#FFFFFF; --surface2:#EEF1F5;
  --fg:#1A1D24; --muted:#586070; --faint:#8A919D; --line:#E2E5EA;
  --ac:#0284C7; --acfg:#FFFFFF; --acsoft:#E0F2FE;
  --ok:#0E9F6E; --oksoft:#DCFCE7; --okfg:#166534;
  --warn:#D97706; --warnsoft:#FEF3C7; --warnfg:#92400E;
  --bad:#DC2626; --badsoft:#FEE2E2; --badfg:#991B1B;
  --navy:#0D1B2A; --navyfg:#E0E1DD; --frame:#1A1D24;
  --shadow:0 30px 60px -24px rgba(13,27,42,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --stage:#050914; --bg:#080D1D; --surface:#141D36; --surface2:#1C2541;
    --fg:#E0E1DD; --muted:#A6ADB9; --faint:#7B8394; --line:rgba(255,255,255,.10);
    --ac:#38BDF8; --acfg:#0B132B; --acsoft:rgba(56,189,248,.15);
    --ok:#06D6A0; --oksoft:rgba(6,214,160,.14); --okfg:#34D399;
    --warn:#FBBF24; --warnsoft:rgba(251,191,36,.13); --warnfg:#FBBF24;
    --bad:#F87171; --badsoft:rgba(248,113,113,.14); --badfg:#FCA5A5;
    --navy:#0B132B; --frame:#000; --shadow:0 30px 60px -24px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --stage:#050914; --bg:#080D1D; --surface:#141D36; --surface2:#1C2541;
  --fg:#E0E1DD; --muted:#A6ADB9; --faint:#7B8394; --line:rgba(255,255,255,.10);
  --ac:#38BDF8; --acfg:#0B132B; --acsoft:rgba(56,189,248,.15);
  --ok:#06D6A0; --oksoft:rgba(6,214,160,.14); --okfg:#34D399;
  --warn:#FBBF24; --warnsoft:rgba(251,191,36,.13); --warnfg:#FBBF24;
  --bad:#F87171; --badsoft:rgba(248,113,113,.14); --badfg:#FCA5A5;
  --navy:#0B132B; --frame:#000; --shadow:0 30px 60px -24px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--stage);color:var(--fg);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
.bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:9px 16px;background:var(--navy);color:var(--navyfg)}
.bar .name{font-weight:800;font-size:14px}
.bar .name small{font-weight:600;opacity:.6}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:#F59E0B;color:#1A1D24;padding:3px 8px;border-radius:99px;white-space:nowrap}
.sp{flex:1}
.seg{display:flex;gap:3px;background:rgba(255,255,255,.08);padding:3px;border-radius:10px}
.seg button{border:0;background:transparent;color:inherit;opacity:.75;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.seg button.on{background:#38BDF8;color:#0B132B;opacity:1}
.themeb{border:1px solid rgba(255,255,255,.2);background:transparent;color:inherit;border-radius:9px;min-height:34px;padding:0 10px;font-size:12.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.stage{display:flex;gap:36px;justify-content:center;align-items:flex-start;flex-wrap:wrap;padding-block:26px 56px;padding-inline:16px}
.phone{width:390px;max-width:100%;height:812px;background:var(--bg);border:11px solid var(--frame);border-radius:46px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.sbar{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12.5px;font-weight:700;background:var(--surface)}
.head{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding:6px 12px 10px;display:flex;align-items:center;gap:10px}
.iconb{width:44px;height:44px;flex:none;border-radius:12px;border:0;background:var(--surface2);display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.head h1{margin:0;font-size:17px;font-weight:800;line-height:1.2}
.head p{margin:0;font-size:12.5px;color:var(--muted)}
.scr{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;background:var(--surface2);padding:4px;border-radius:14px}
.tabs button{min-height:44px;border:0;border-radius:11px;background:transparent;font-weight:800;font-size:13.5px;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--fg)}
.chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.month{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:6px 2px -6px;display:flex;justify-content:space-between}
.row{display:flex;gap:12px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;width:100%;text-align:left;cursor:pointer}
.row.over{border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 5%,var(--surface))}
.row.run{border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 5%,var(--surface))}
.date{width:52px;flex:none;border-radius:12px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0}
.date b{font-size:20px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.date span{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:2px}
.row.over .date{background:var(--badsoft)} .row.over .date b,.row.over .date span{color:var(--badfg)}
.row.run .date{background:var(--oksoft)} .row.run .date b,.row.run .date span{color:var(--okfg)}
.body{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.eq{font-size:12.5px;color:var(--muted);font-weight:600}
.tk{font-size:15px;font-weight:800;line-height:1.25}
.win{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap;margin-top:4px;align-self:flex-start}
.p-open{background:var(--acsoft);color:var(--ac)}
.p-wait{background:var(--surface2);color:var(--muted)}
.p-over{background:var(--badsoft);color:var(--badfg)}
.p-run{background:var(--oksoft);color:var(--okfg)}
.est{font-size:11px;font-weight:700;color:var(--warnfg);background:var(--warnsoft);padding:2px 7px;border-radius:99px}
.track{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:7px}
.track i{display:block;height:100%;border-radius:99px;background:var(--ac)}
.row.over .track i{background:var(--bad)}
.legend{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.legend div{display:flex;gap:8px;align-items:center}
.sw{width:14px;height:14px;border-radius:5px;flex:none}
.guide{width:350px;max-width:100%;display:flex;flex-direction:column;gap:18px;padding-top:14px}
.guide h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.guide p{margin:0;color:var(--muted);font-size:14.5px;max-width:60ch}
.gl{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.45}
.ref{max-width:860px;margin:0 auto;padding-block:30px 60px;padding-inline:16px;display:flex;flex-direction:column;gap:22px}
.ref h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.ref h3{margin:0 0 8px;font-size:17px;font-weight:800}
.ref p,.ref li{font-size:14.5px;line-height:1.55}
.ref ul,.ref ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.opt{display:flex;flex-direction:column;gap:10px}
.opt .card b{display:block;margin-bottom:3px}
@media (max-width:520px){
  .bar{padding:7px 10px;gap:8px} .bar .name{display:none}
  .stage{padding:0;gap:0}
  .phone{width:100%;height:calc(100dvh - 50px);border:0;border-radius:0;box-shadow:none}
  .sbar{display:none}
  .guide{padding:22px 16px 40px;width:100%}
}
</style>

<div class="bar">
  <span class="name">Agenda de mantenimiento <small>· Preview V31</small></span>
  <span class="tag">Demo · datos ficticios</span>
  <span class="sp"></span>
  <div class="seg" id="tabs">
    <button type="button" data-a="tab" data-p="app">Probar</button>
    <button type="button" data-a="tab" data-p="ref">Qué cambia</button>
  </div>
  <button type="button" class="themeb" id="themeb" data-a="theme"></button>
</div>
<main id="root"></main>

<script>
const I=(n,s=16)=>`<i data-lucide="${n}" style="width:${s}px;height:${s}px"></i>`;
const HOY = new Date(2026, 8, 16); // 16/09/2026
const MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESL = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const d = (y,m,dd) => new Date(y, m-1, dd);
const fmt = x => `${String(x.getDate()).padStart(2,"0")}/${String(x.getMonth()+1).padStart(2,"0")}`;
const days = (a,b) => Math.round((b-a)/86400000);

// Tareas de ejemplo: apertura de ventana + vencimiento (lo que ya sabe el sistema).
const TAREAS = [
 {eq:"Bomba de Incendio de Emergencia", tk:"Recorrido de bomba: verificación de aro y cambio de sellos", open:d(2026,6,10), due:d(2026,6,20), code:"M02-BBA-INC-EM-30"},
 {eq:"Filtros de Achique Sentina", tk:"Limpiar y controlar filtro general y rejillas", open:d(2026,6,5), due:d(2026,6,11), code:"M02-FILT-ACH-01"},
 {eq:"Bomba Hidráulica Estribor", tk:"Recorrido general, cambio de juntas y mangueras", open:d(2026,9,1), due:d(2026,9,30), code:"M02-BBA-HID-ER-30", wo:"WO-M02-26-0461"},
 {eq:"Motor Principal Babor", tk:"Cambio de aceite y filtros de aceite", open:d(2026,9,12), due:d(2026,9,22), code:"M02-MP-BR-04", est:true},
 {eq:"Generador N°2", tk:"Limpieza del intercambiador de calor", open:d(2026,9,14), due:d(2026,9,26), code:"M02-GEN-2-03"},
 {eq:"Molinete de proa", tk:"Engrase general y control de freno", open:d(2026,9,25), due:d(2026,10,5), code:"M02-MOL-01"},
 {eq:"Motor Principal Estribor", tk:"Toma de muestra de aceite para laboratorio", open:d(2026,10,2), due:d(2026,10,12), code:"M02-MP-ER-18"},
 {eq:"Balsas salvavidas", tk:"Servicio anual en taller certificado", open:d(2026,10,1), due:d(2026,10,28), code:"M02-BALSA-01"},
 {eq:"Caja reductora Babor", tk:"Cambio de aceite de caja", open:d(2026,10,20), due:d(2026,11,4), code:"M02-CR-BR-06", est:true},
 {eq:"Extintores portátiles", tk:"Control y recarga (12 unidades)", open:d(2026,11,1), due:d(2026,11,20), code:"M02-EXT-01"},
];

function estado(t){
  if (t.wo) return "run";
  if (HOY > t.due) return "over";
  if (HOY >= t.open) return "open";
  return "wait";
}

const S = {v:"app", tab:"agenda", soloPuedo:false, theme:"system"};

function fila(t){
  const st = estado(t);
  const cls = st==="over" ? "over" : st==="run" ? "run" : "";
  const total = Math.max(1, days(t.open, t.due));
  const hecho = Math.min(total, Math.max(0, days(t.open, HOY)));
  const pill =
    st==="run"  ? `<span class="pill p-run">${I("wrench",13)}En ejecución · ${t.wo}</span>`
  : st==="over" ? `<span class="pill p-over">${I("alert-triangle",13)}Venció hace ${days(t.due,HOY)} días</span>`
  : st==="open" ? `<span class="pill p-open">${I("circle-check",13)}Ya se puede hacer</span>`
  :               `<span class="pill p-wait">${I("clock",13)}Se puede desde el ${fmt(t.open)}</span>`;
  return `<button class="row ${cls}" data-a="abrir">
    <span class="date"><b>${String(t.due.getDate()).padStart(2,"0")}</b><span>${MES[t.due.getMonth()]}</span></span>
    <span class="body">
      <span class="eq">${t.eq}</span>
      <span class="tk">${t.tk}</span>
      <span class="win">${I("calendar-range",14)} Ventana ${fmt(t.open)} → ${fmt(t.due)} ${t.est?'<span class="est">fecha estimada</span>':""}</span>
      ${pill}
      ${st!=="run" ? `<span class="track"><i style="width:${Math.round(hecho/total*100)}%"></i></span>` : ""}
    </span>
  </button>`;
}

function agenda(){
  let lista = TAREAS.slice().sort((a,b)=>a.due-b.due);
  if (S.soloPuedo) lista = lista.filter(t => ["open","over"].includes(estado(t)));
  const vencidas = lista.filter(t => estado(t)==="over");
  const resto = lista.filter(t => estado(t)!=="over");
  const porMes = {};
  resto.forEach(t => { const k = `${t.due.getFullYear()}-${t.due.getMonth()}`; (porMes[k] ??= []).push(t); });
  const bloques = Object.entries(porMes).map(([k, items]) => {
    const [y,m] = k.split("-").map(Number);
    const esEste = y===HOY.getFullYear() && m===HOY.getMonth();
    return `<p class="month"><span>${MESL[m]} ${y}${esEste?" · este mes":""}</span><span>${items.length}</span></p>` + items.map(fila).join("");
  }).join("");
  return `
  <p class="hint">Cuándo se puede empezar cada tarea y cuándo vence. Tocá una para abrir la OT.</p>
  <div class="chips">
    <span class="chip ${S.soloPuedo?"":"on"}" data-a="filtro" data-p="todo">Todas</span>
    <span class="chip ${S.soloPuedo?"on":""}" data-a="filtro" data-p="puedo">Ya se pueden hacer</span>
  </div>
  ${vencidas.length?`<p class="month"><span>Vencidas</span><span>${vencidas.length}</span></p>${vencidas.map(fila).join("")}`:""}
  ${bloques}
  <div class="legend">
    <div><span class="sw" style="background:var(--bad)"></span>Vencida: pasó la fecha de vencimiento.</div>
    <div><span class="sw" style="background:var(--ac)"></span>Ya se puede hacer: la ventana está abierta.</div>
    <div><span class="sw" style="background:var(--surface2);border:1px solid var(--line)"></span>Todavía no: se puede recién desde la fecha que indica.</div>
    <div><span class="sw" style="background:var(--ok)"></span>En ejecución: ya tiene una OT abierta.</div>
  </div>`;
}

function app(){
  return `<div class="stage">
    <div class="phone">
      <div class="sbar"><span class="mono">09:41</span><span>${I("signal",14)}${I("wifi",14)}${I("battery-full",16)}</span></div>
      <div class="head">
        <button class="iconb">${I("arrow-left",20)}</button>
        <div><h1>Planes para abrir</h1><p>MAO 02</p></div>
      </div>
      <div class="scr">${agenda()}</div>
    </div>
    <aside class="guide">
      <div><h2>La agenda: desde cuándo y hasta cuándo</h2>
      <p style="margin-top:8px">Cada tarea tiene una <b>ventana</b>: la fecha desde la que se puede hacer y la fecha en la que vence. La agenda las muestra ordenadas por vencimiento, mes por mes.</p></div>
      <div><p class="gl">Para probar</p><ol class="steps">
        <li>Mirá la barrita de cada tarjeta: es cuánto avanzó la ventana.</li>
        <li>Tocá <b>Ya se pueden hacer</b>: deja sólo lo que ya está habilitado (y lo vencido).</li>
        <li>Fijate en "fecha estimada": son las tareas por horas de motor, donde la fecha sale del promedio de uso.</li>
      </ol></div>
      <p class="hint">Abrila desde el celular: ocupa toda la pantalla.</p>
    </aside>
  </div>`;
}

function ref(){
  return `<article class="ref">
  <h2>Agenda de mantenimiento · Preview V31</h2>
  <p><b>Reemplaza la pantalla “Planes para abrir”</b> (decisión del usuario): se van las pestañas Vencidos / Por vencer y queda una sola lista por fecha, agrupada por mes, con las dos fechas que importan: <b>desde cuándo se puede hacer</b> (apertura de la ventana) y <b>cuándo vence</b>. Lo vencido no se pierde: va agrupado arriba de todo. Muestra <b>6 meses hacia adelante</b> más todo lo vencido.</p>

  <section><h3>De dónde salen las fechas</h3>
  <ul>
    <li><b>Vencimiento:</b> el que ya tiene cada plan.</li>
    <li><b>Apertura de la ventana:</b> la fecha cargada en el plan; si no está, la misma regla que ya usa el diagrama de Gantt del escritorio: los días de anticipación del plan, o alrededor del 10% del ciclo. No se inventa nada nuevo ni se toca la base de datos.</li>
    <li><b>Tareas por horas de motor</b> (cambio de aceite, services): no tienen fecha propia. Se muestra la fecha estimada según el promedio de uso del equipo, marcada como <b>estimada</b> para que nadie la tome como exacta.</li>
  </ul></section>

  <section><h3>Qué se ve en cada renglón</h3>
  <ul>
    <li>Día y mes del vencimiento, grandes, a la izquierda.</li>
    <li>Equipo y tarea.</li>
    <li>“Ventana 12/09 → 22/09” y una barrita que muestra cuánto de esa ventana ya pasó.</li>
    <li>El estado: <b>Vencida</b> (rojo), <b>Ya se puede hacer</b> (celeste), <b>Se puede desde el …</b> (gris) o <b>En ejecución</b> (verde, con el número de la OT).</li>
  </ul></section>

  <section><h3>Decidido</h3>
  <div class="opt">
    <div class="card"><b>Reemplaza a “Planes para abrir”</b>Una sola pantalla: la agenda. Desde el inicio se entra igual que hoy, con el mismo cuadro rojo que cuenta vencidos y por vencer.</div>
    <div class="card"><b>6 meses hacia adelante</b>Más todo lo vencido, que va agrupado arriba de todo.</div>
    <div class="card"><b>Sólo el buque elegido</b>Como el resto de la app. La flota entera se mira desde la PC.</div>
    <div class="card"><b>Sin vista calendario</b>La V32 (mes y semana) queda descartada para el celular.</div>
  </div></section>

  <p class="hint">No cambia ninguna regla: la agenda sólo mira. Abrir la OT sigue siendo el mismo camino de siempre.</p>
  </article>`;
}

function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.p===S.v));
  document.getElementById("themeb").innerHTML = `${I({system:"monitor",light:"sun",dark:"moon"}[S.theme],15)}<span>${{system:"Sistema",light:"Claro",dark:"Oscuro"}[S.theme]}</span>`;
  document.getElementById("root").innerHTML = S.v==="ref" ? ref() : app();
  if (window.lucide) lucide.createIcons();
}
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-a]"); if(!el) return;
  const a = el.dataset.a, p = el.dataset.p;
  if (a==="tab") S.v = p;
  else if (a==="theme") { S.theme = {system:"light",light:"dark",dark:"system"}[S.theme];
    const r=document.documentElement; if(S.theme==="system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme",S.theme); }
  else if (a==="filtro") S.soloPuedo = p==="puedo";
  else if (a==="abrir" || a==="tab2") { /* la maqueta no navega */ }
  render();
});
render();
</script>
