<body>
<div class="pv-bar">
  <b>Especificación de Varada · Preview V26</b><span class="tag">DEMO · DATOS FICTICIOS</span><span class="sep"></span>
  <button data-w="list" class="on">Listado</button><button data-w="detail">Documento abierto</button><button data-w="fixes">Fallas encontradas</button>
  <span class="sep"></span><span class="lab">Etapa:</span>
  <button data-c="DRAFT0">Borrador vacío</button><button data-c="DRAFT" class="on">Borrador con trabajos</button><button data-c="SUBMITTED">Enviada</button><button data-c="UNDER_REVIEW">En revisión</button><button data-c="REJECTED">Devuelta</button><button data-c="APPROVED">Aprobada</button>
  <span class="sep"></span><span class="lab">Soy:</span><button data-r="ship" class="on">Buque</button><button data-r="shore">Tierra</button>
</div>
<div id="root"></div>
<script>
const I=(n,s=14)=>`<i data-lucide="${n}" style="width:${s}px;height:${s}px"></i>`;
const S={w:"list",c:"DRAFT",r:"ship",sel:2,toast:null,card:""};
function toast(t){S.toast=t;render();setTimeout(()=>{S.toast=null;render();},2000);}

function stepsBar(st){
  const order=["DRAFT","SUBMITTED","UNDER_REVIEW","APPROVED"]; const lbl=["Armar","Enviada","En revisión","Aprobada"];
  const idx=st==="REJECTED"?0:order.indexOf(st);
  return `<div class="steps">${order.map((s,i)=>`${i?'<span class="bar"></span>':''}<span class="stp ${i<idx?'done':i===idx?'cur':''}"><span class="n">${i<idx?'✓':i+1}</span><span>${lbl[i]}<span class="dt">${i<idx?['02/09','05/09','08/09'][i]:''}</span></span></span>`).join("")}${st==="REJECTED"?`<span class="stg s-REJECTED" style="margin-left:auto">Devuelta al buque</span>`:''}</div>`;
}

  }
  if(c==="SUBMITTED") return shore

  if(c==="UNDER_REVIEW"){
    const dec=ITEMS.filter(i=>i.st!=="PROPOSED").length, acc=ITEMS.filter(i=>i.st==="ACCEPTED").length, all=ITEMS.length;

    return shore

  }
  if(c==="REJECTED") return box("n-late","corner-up-left","Tierra la devolvió: hay que corregir","Motivo: «Falta el detalle de espesores del planchaje y la cotización previa del ítem 2.»","",`<button class="btn orange" onclick="S.c='DRAFT';render()">${I("pencil",14)}Volver a borrador y corregir</button>`);

}

function fixesPage(){
  return `<div class="main"><div class="fix"><b style="font-size:14px">Revisión del funcionamiento actual</b> — lo que encontré leyendo el código y los datos (hoy hay 1 especificación en borrador con 8 trabajos).
  <ol style="padding-left:18px;margin:10px 0 0">
   <li><span class="sev hi">PIERDE DATOS</span><b>"Enviar a tierra" no guarda antes.</b> Si agregaste o cambiaste trabajos y tocás Enviar sin Guardar, los cambios se borran de la pantalla (y si todos los trabajos eran nuevos, da el error "no tiene ítems"). <i>Arreglo:</i> el botón guarda y después envía.</li>
   <li><span class="sev hi">PIERDE DATOS</span><b>"Importar del backlog" pisa lo no guardado.</b> Al traer pendientes, la lista se reemplaza por lo que está en la base: se pierden las líneas nuevas o editadas sin guardar. <i>Arreglo:</i> guarda antes de abrir la importación.</li>
   <li><span class="sev hi">PIERDE DATOS</span><b>Cerrar la ventana no avisa</b> si hay cambios sin guardar. <i>Arreglo:</i> pregunta antes, como el resto de la app.</li>
   <li><span class="sev md">REGLA</span><b>Se puede aprobar con trabajos sin decidir.</b> Alcanza con 1 aceptado; los demás quedan "propuestos" y no salen en el PDF sin que nadie los haya descartado. <i>Propuesta:</i> aprobar sólo cuando todos estén aceptados o descartados.</li>
   <li><span class="sev md">REGLA</span><b>El buque puede cambiar trabajos mientras tierra los revisa</b>, y un trabajo ya aceptado sigue "aceptado" aunque le cambien el texto. <i>Propuesta:</i> una vez que tierra la toma, sólo tierra edita; el buque conversa en cada trabajo (o la retira antes de que la tomen).</li>
   <li><span class="sev md">PERMISO</span><b>"Tomar para revisar" lo puede hacer cualquier tripulante</b> por fuera de la pantalla (la pantalla lo esconde, el servidor no lo exige). <i>Arreglo:</i> exigir el permiso "Aprobar especificación de varada", igual que aprobar.</li>
   <li><span class="sev md">PERMISO</span><b>Tierra puede aceptar/descartar trabajos de un borrador</b> que el buque todavía no envió. <i>Arreglo:</i> decidir sólo durante la revisión.</li>
   <li><span class="sev md">DATOS</span><b>Quitar un trabajo borra su conversación sin preguntar.</b> <i>Arreglo:</i> confirmar cuando tiene comentarios o ya fue decidido.</li>
   <li><span class="sev lo">VISUAL</span>Los comentarios muestran el <b>mail</b> del autor en lugar del nombre; el listado muestra el <b>código</b> del buque. <i>Arreglo:</i> nombre de la persona y del buque.</li>
   <li><span class="sev lo">VISUAL</span>La grilla de trabajos es muy apretada (título y detalle en dos renglones chicos) y no explica qué va en cada dato. <i>Arreglo:</i> tarjetas por trabajo con ayudas.</li>
  </ol></div></div>`;
}

function render(){
  document.querySelectorAll(".pv-bar button").forEach(b=>{const k=Object.keys(b.dataset)[0];b.classList.toggle("on",S[k]===b.dataset[k]);});
  let h=S.w==="list"?listPage():S.w==="detail"?detailPage():fixesPage();
  if(S.toast)h+=`<div class="toast">${S.toast}</div>`;
  document.getElementById("root").innerHTML=h; lucide.createIcons();
}
document.querySelectorAll(".pv-bar button").forEach(b=>b.onclick=()=>{const k=Object.keys(b.dataset)[0];S[k]=b.dataset[k];if(k==="c"&&S.w==="list")S.w="detail";render();});
render();
</script>
