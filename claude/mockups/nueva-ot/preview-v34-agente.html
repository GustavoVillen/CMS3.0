<title>Agente de voz a bordo</title>
<meta name="theme-color" content="#0D1B2A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --stage:#E7EAEF; --bg:#F4F5F7; --surface:#FFFFFF; --surface2:#EEF1F5;
  --fg:#1A1D24; --muted:#586070; --faint:#8A919D; --line:#E2E5EA;
  --ac:#0284C7; --acfg:#FFFFFF; --acsoft:#E0F2FE;
  --ok:#0E9F6E; --oksoft:#DCFCE7; --okfg:#166534;
  --warn:#D97706; --warnsoft:#FEF3C7; --warnfg:#92400E;
  --bad:#DC2626; --badsoft:#FEE2E2; --badfg:#991B1B;
  --ai:#7C3AED; --aisoft:#EDE9FE;
  --navy:#0D1B2A; --navyfg:#E0E1DD; --frame:#1A1D24;
  --shadow:0 30px 60px -24px rgba(13,27,42,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --stage:#050914; --bg:#080D1D; --surface:#141D36; --surface2:#1C2541;
    --fg:#E0E1DD; --muted:#A6ADB9; --faint:#7B8394; --line:rgba(255,255,255,.10);
    --ac:#38BDF8; --acfg:#0B132B; --acsoft:rgba(56,189,248,.18);
    --ok:#06D6A0; --oksoft:rgba(6,214,160,.18); --okfg:#34D399;
    --warn:#FBBF24; --warnsoft:rgba(251,191,36,.16); --warnfg:#FBBF24;
    --bad:#F87171; --badsoft:rgba(248,113,113,.18); --badfg:#FCA5A5;
    --ai:#A78BFA; --aisoft:rgba(167,139,250,.18);
    --navy:#0B132B; --frame:#000; --shadow:0 30px 60px -24px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --stage:#050914; --bg:#080D1D; --surface:#141D36; --surface2:#1C2541;
  --fg:#E0E1DD; --muted:#A6ADB9; --faint:#7B8394; --line:rgba(255,255,255,.10);
  --ac:#38BDF8; --acfg:#0B132B; --acsoft:rgba(56,189,248,.18);
  --ok:#06D6A0; --oksoft:rgba(6,214,160,.18); --okfg:#34D399;
  --warn:#FBBF24; --warnsoft:rgba(251,191,36,.16); --warnfg:#FBBF24;
  --bad:#F87171; --badsoft:rgba(248,113,113,.18); --badfg:#FCA5A5;
  --ai:#A78BFA; --aisoft:rgba(167,139,250,.18);
  --navy:#0B132B; --frame:#000; --shadow:0 30px 60px -24px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--stage);color:var(--fg);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
.bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:9px 16px;background:var(--navy);color:var(--navyfg)}
.bar .name{font-weight:800;font-size:14px}
.bar .name small{font-weight:600;opacity:.6}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:#F59E0B;color:#1A1D24;padding:3px 8px;border-radius:99px;white-space:nowrap}
.sp{flex:1}
.seg{display:flex;gap:3px;background:rgba(255,255,255,.08);padding:3px;border-radius:10px}
.seg button{border:0;background:transparent;color:inherit;opacity:.75;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.seg button.on{background:#38BDF8;color:#0B132B;opacity:1}
.themeb{border:1px solid rgba(255,255,255,.2);background:transparent;color:inherit;border-radius:9px;min-height:34px;padding:0 10px;font-size:12.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.stage{display:flex;gap:36px;justify-content:center;align-items:flex-start;flex-wrap:wrap;padding-block:26px 56px;padding-inline:16px}
.phone{width:390px;max-width:100%;height:812px;background:var(--bg);border:11px solid var(--frame);border-radius:46px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.sbar{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12.5px;font-weight:700;background:var(--navy);color:var(--navyfg)}
.scr{flex:1;overflow-y:auto}
.hero{background:var(--navy);color:var(--navyfg);padding:4px 20px 18px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.vsl{display:inline-flex;gap:7px;align-items:center;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.me{width:38px;height:38px;border-radius:99px;background:rgba(255,255,255,.13);display:grid;place-items:center;font-size:13px;font-weight:800}
.hi{margin:14px 0 0;font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.role{margin:2px 0 0;font-size:13.5px;opacity:.7}
.wrap{padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px}
/* el botón del agente */
.agent{width:100%;min-height:104px;border-radius:22px;border:0;cursor:pointer;display:flex;gap:14px;align-items:center;padding:16px;text-align:left;
  background:linear-gradient(135deg,var(--ai),#4F46E5);color:#fff;box-shadow:0 14px 30px -14px rgba(124,58,237,.75);user-select:none;-webkit-user-select:none;touch-action:none}
.agent.rec{background:linear-gradient(135deg,#DC2626,#B91C1C);box-shadow:0 14px 30px -14px rgba(220,38,38,.8)}
.agent .ring{width:64px;height:64px;border-radius:99px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none;position:relative}
.agent.rec .ring::after{content:"";position:absolute;inset:-8px;border-radius:99px;border:3px solid rgba(255,255,255,.45);animation:pulse 1.1s infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.agent b{display:block;font-size:18px;font-weight:800;line-height:1.15}
.agent small{display:block;font-size:13px;opacity:.9;margin-top:3px}
.wave{display:flex;gap:3px;align-items:flex-end;height:22px;margin-top:6px}
.wave i{width:4px;background:rgba(255,255,255,.85);border-radius:2px;animation:w .9s infinite ease-in-out}
@keyframes w{0%,100%{height:5px}50%{height:22px}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{min-height:92px;border-radius:18px;border:1px solid var(--line);background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;color:var(--fg)}
.tile .ti{width:36px;height:36px;border-radius:11px;background:var(--acsoft);color:var(--ac);display:grid;place-items:center}
.tile b{font-size:14.5px;font-weight:800;line-height:1.15}
/* hoja del agente */
.sheetwrap{position:absolute;inset:0;background:rgba(8,13,29,.55);display:flex;align-items:flex-end;z-index:10}
.sheet{background:var(--surface);width:100%;max-height:92%;border-radius:24px 24px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sh{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.sh .ai{width:38px;height:38px;border-radius:11px;background:var(--aisoft);color:var(--ai);display:grid;place-items:center;flex:none}
.sh b{font-size:16px;font-weight:800}
.sh small{display:block;font-size:12px;color:var(--muted)}
.x{margin-left:auto;width:36px;height:36px;border-radius:99px;background:var(--bad);color:#fff;border:0;display:grid;place-items:center;cursor:pointer}
.chat{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.said{align-self:flex-end;max-width:85%;background:var(--acsoft);color:var(--fg);border-radius:16px 16px 4px 16px;padding:10px 13px;font-size:14.5px}
.says{align-self:flex-start;max-width:90%;background:var(--surface2);border-radius:16px 16px 16px 4px;padding:11px 13px;font-size:14.5px;line-height:1.45}
.thinking{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13.5px}
.dotz i{display:inline-block;width:6px;height:6px;border-radius:99px;background:var(--muted);margin-right:3px;animation:b 1s infinite}
.dotz i:nth-child(2){animation-delay:.15s} .dotz i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.25}}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:56px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:10px;padding:0 14px;cursor:pointer;text-align:left}
.opt:active{background:var(--fg)/5}
.opt .k{width:26px;height:26px;border-radius:8px;background:var(--aisoft);color:var(--ai);display:grid;place-items:center;font-size:12.5px;font-weight:800;flex:none}
.card{border:1.5px solid var(--ok);background:var(--oksoft);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card .eq{font-size:12.5px;font-weight:700;color:var(--okfg)}
.card b{font-size:16px;font-weight:800;line-height:1.25}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.pill{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.55);color:var(--okfg)}
:root[data-theme="dark"] .pill{background:rgba(0,0,0,.25)}
.foot{border-top:1px solid var(--line);padding:12px 16px 16px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.btn{min-height:54px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:100%}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--acfg)}
.btn.ai{background:var(--ai);border-color:var(--ai);color:#fff}
.hold{min-height:54px;border-radius:16px;border:0;background:var(--aisoft);color:var(--ai);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:100%;user-select:none}
.hold.rec{background:var(--bad);color:#fff}
.guide{width:350px;max-width:100%;display:flex;flex-direction:column;gap:18px;padding-top:14px}
.guide h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.guide p{margin:0;color:var(--muted);font-size:14.5px;max-width:60ch}
.gl{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
.try{display:flex;flex-direction:column;gap:8px}
.try button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;padding:0 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--fg)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.45}
.ref{max-width:880px;margin:0 auto;padding-block:30px 60px;padding-inline:16px;display:flex;flex-direction:column;gap:22px}
.ref h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.ref h3{margin:0 0 8px;font-size:17px;font-weight:800}
.ref p,.ref li{font-size:14.5px;line-height:1.55}
.ref ul,.ref ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.5}
.rcard b{display:block;margin-bottom:3px}
.opt2{display:flex;flex-direction:column;gap:10px}
@media (max-width:520px){
  .bar{padding:7px 10px;gap:8px} .bar .name{display:none}
  .stage{padding:0;gap:0}
  .phone{width:100%;height:calc(100dvh - 50px);border:0;border-radius:0;box-shadow:none}
  .sbar{display:none}
  .guide{padding:22px 16px 40px;width:100%}
}
</style>

<div class="bar">
  <span class="name">Agente de voz <small>· Preview V34</small></span>
  <span class="tag">Demo · datos ficticios</span>
  <span class="sp"></span>
  <div class="seg" id="tabs">
    <button type="button" data-a="tab" data-p="app">Probar</button>
    <button type="button" data-a="tab" data-p="ref">Qué cambia</button>
  </div>
  <button type="button" class="themeb" id="themeb" data-a="theme"></button>
</div>
<main id="root"></main>

<script>
const I=(n,s=16)=>`<i data-lucide="${n}" style="width:${s}px;height:${s}px"></i>`;

// Tres pedidos de ejemplo. Cada uno es una conversación: lo que el agente
// pregunta y con qué botones, hasta que sabe exactamente qué hacer.
const CASOS={
  muestra:{
    dicho:"Quiero hacer la toma de muestra del motor",
    pasos:[
      {dice:"¿De cuál motor?", opts:["Motor Principal","Motor Auxiliar","Motor de emergencia"]},
      {dice:"¿Cuál de los dos?", opts:["Babor (N°1)","Estribor (N°2)"]},
      {dice:"En el Motor Principal Babor hay una sola rutina de muestreo. ¿Es esta?", opts:["Sí, esa es","Ver otras tareas del motor"]},
    ],
    final:{eq:"Motor Principal Babor", tk:"Toma de muestra de aceite para laboratorio",
      pills:["Plan M02-MP-BR-18","Mantenimiento preventivo","Vence en 5 días","Laboratorio CONDOR S.A.C.I"],
      texto:"Es una rutina del plan, así que la OT sale con el criterio, el bloqueo de energía y el riesgo ya cargados, y se abre también la solicitud al laboratorio.",
      cta:"Abrir la OT y la SS"}
  },
  perdida:{
    dicho:"La bomba de lastre está perdiendo agua por el sello",
    pasos:[
      {dice:"¿Es un trabajo de reparación, un mantenimiento programado o una inspección?", opts:["Reparación (algo falla)","Mantenimiento programado","Inspección"]},
      {dice:"No encontré ninguna rutina del plan que coincida, así que sería una OT correctiva. ¿La hace la tripulación o un taller?", opts:["La tripulación","Un taller o proveedor"]},
    ],
    final:{eq:"Bomba de Lastre", tk:"Pérdida de agua por el sello mecánico",
      pills:["Sin plan: OT correctiva","Reparación","La hace la tripulación"],
      texto:"Te abro el alta con el equipo y la descripción ya puestos. Falta elegir la urgencia y completar los datos de aprobación.",
      cta:"Abrir el alta de OT"}
  },
  horas:{
    dicho:"Anotá 40.960 horas del motor principal babor",
    pasos:[
      {dice:"La última lectura de ese motor fue 40.951 h hace 1 día. Con 40.960 h serían 9 horas más. ¿Lo registro?", opts:["Sí, registrar","Cambiar el número"]},
    ],
    final:{eq:"Motor Principal Babor", tk:"Lectura de horómetro: 40.960 h",
      pills:["+9 h desde la última","Hoy"],
      texto:"Esto se guarda de una: no hace falta abrir la planilla.",
      cta:"Registrar la lectura"}
  },
};

const S={v:"app", theme:"system", abierto:false, caso:null, paso:0, fase:"idle", rec:false, elegidas:[], listo:false};

function home(){
  const tile=(ic,t)=>`<div class="tile"><span class="ti">${I(ic,20)}</span><b>${t}</b></div>`;
  return `<div class="scr">
    <section class="hero">
      <div class="hero-top"><span class="vsl">${I("ship",16)}MAO 02</span><span class="me">JB</span></div>
      <p class="hi">Buen día, Jorge</p><p class="role">Capitán / Jefe de Máquinas · martes, 15/9</p>
    </section>
    <div class="wrap">
      <button class="agent ${S.rec?"rec":""}" data-a="hold">
        <span class="ring">${I(S.rec?"square":"mic",30)}</span>
        <span style="min-width:0">
          <b>${S.rec?"Te escucho…":"Decime qué querés hacer"}</b>
          <small>${S.rec?"Soltá cuando termines":"Mantené apretado y hablá"}</small>
          ${S.rec?`<span class="wave">${Array.from({length:14},(_,i)=>`<i style="animation-delay:${i*0.07}s"></i>`).join("")}</span>`:""}
        </span>
      </button>
      <p style="font-size:12.5px;color:var(--muted);margin:0;text-align:center">También podés tocar los botones de siempre</p>
      <div class="tiles">
        ${tile("calendar-clock","Planes para abrir")}
        ${tile("plus","Nueva OT / SS")}
        ${tile("message-square-plus","Registrar avance")}
        ${tile("gauge","Horómetros")}
      </div>
    </div>
  </div>`;
}

function sheet(){
  const c=CASOS[S.caso];
  const pasos=c?c.pasos:[];
  const burbujas=[];
  if(c) burbujas.push(`<div class="said">${I("mic",14)} ${c.dicho}</div>`);
  for(let i=0;i<S.paso;i++){
    burbujas.push(`<div class="says">${pasos[i].dice}</div>`);
    if(S.elegidas[i]!==undefined) burbujas.push(`<div class="said">${pasos[i].opts[S.elegidas[i]]}</div>`);
  }
  let abajo="";
  if(S.fase==="think"){
    burbujas.push(`<div class="thinking"><span class="dotz"><i></i><i></i><i></i></span> El agente está buscando en el buque…</div>`);
  } else if(S.paso<pasos.length){
    const p=pasos[S.paso];
    burbujas.push(`<div class="says">${p.dice}</div>`);
    abajo=`<div class="opts">${p.opts.map((o,i)=>`<button class="opt" data-a="elegir" data-p="${i}"><span class="k">${i+1}</span>${o}</button>`).join("")}</div>`;
  } else if(S.listo){
    const f=c.final;
    burbujas.push(`<div class="card"><span class="eq">${f.eq}</span><b>${f.tk}</b>
      <span class="meta">${f.pills.map(p=>`<span class="pill">${p}</span>`).join("")}</span></div>`);
    burbujas.push(`<div class="says">${f.texto}</div>`);
    abajo=`<button class="btn ai" data-a="cta">${I("arrow-right",18)}${f.cta}</button>
           <button class="btn" data-a="otra">${I("rotate-ccw",17)}No es eso, empezar de nuevo</button>`;
  }
  return `<div class="sheetwrap"><div class="sheet">
    <div class="sh"><span class="ai">${I("bot",20)}</span>
      <span><b>Agente</b><small>MAO 02 · Jorge Bael</small></span>
      <button class="x" data-a="cerrar">${I("x",18)}</button></div>
    <div class="chat">${burbujas.join("")}</div>
    <div class="foot">
      ${abajo}
      ${S.fase!=="think" && !S.listo ? `<button class="hold ${S.rec?"rec":""}" data-a="hold2">${I(S.rec?"square":"mic",18)}${S.rec?"Te escucho… soltá para terminar":"Mantené apretado para hablar"}</button>`:""}
    </div>
  </div></div>`;
}

function app(){
  return `<div class="stage">
    <div class="phone">
      <div class="sbar"><span class="mono">09:41</span><span>${I("signal",14)}${I("wifi",14)}${I("battery-full",16)}</span></div>
      ${home()}
      ${S.abierto?sheet():""}
    </div>
    <aside class="guide">
      <div><h2>Un botón, y el agente arma el resto</h2>
      <p style="margin-top:8px">El de a bordo aprieta, dice lo que quiere y suelta. El agente busca en los datos del buque y, cuando le falta algo, lo pregunta con botones — nunca pide escribir.</p></div>
      <div><p class="gl">Probá estos tres pedidos</p><div class="try">
        <button data-a="caso" data-p="muestra">🎙 “Quiero hacer la toma de muestra del motor”</button>
        <button data-a="caso" data-p="perdida">🎙 “La bomba de lastre pierde agua por el sello”</button>
        <button data-a="caso" data-p="horas">🎙 “Anotá 40.960 horas del motor principal babor”</button>
      </div></div>
      <div><p class="gl">Qué mirar</p><ol class="steps">
        <li>Las repreguntas son de a una y siempre con botones grandes.</li>
        <li>El agente dice qué encontró antes de hacer nada.</li>
        <li>Nada se guarda sin que toques el botón final.</li>
      </ol></div>
      <p style="font-size:13px;color:var(--muted)">En el celular de verdad el botón graba mientras lo mantenés apretado; acá se simula con un toque.</p>
    </aside>
  </div>`;
}

function ref(){
  return `<article class="ref">
  <h2>Agente de voz a bordo · Preview V34</h2>
  <p>Un botón grande arriba de todo: se mantiene apretado, se dice lo que se quiere hacer y se suelta. El agente interpreta el pedido contra los datos reales del buque (equipos, planes, órdenes, repuestos, permisos…) y, cuando le falta un dato, lo pregunta con botones, de a uno, hasta saber exactamente de qué tarea se trata.</p>

  <section><h3>Qué ya existe y se reusa</h3><ul>
    <li>El <b>copiloto</b> ya es un agente: consulta todos los módulos, entiende el buque y propone acciones que sólo se ejecutan cuando el usuario confirma con un botón.</li>
    <li>Ya tiene <b>modo voz para celular</b> y el botón de mantener apretado para hablar (hoy vive en la pestaña IA de la vista de tripulación).</li>
    <li>En la PC ya muestra <b>las opciones como botones</b>.</li>
  </ul></section>

  <section><h3>Qué hay que hacer</h3><ul>
    <li>El <b>botón grande</b> arriba del inicio de la app a bordo, con grabación al mantenerlo apretado.</li>
    <li>La conversación en formato celular: lo que dijiste, lo que el agente pregunta y <b>las opciones como botones grandes</b> (eso hoy sólo lo hace la PC).</li>
    <li>El <b>cierre</b>: cuando el agente ya sabe qué es, muestra la ficha de lo que encontró y un botón que abre la pantalla correspondiente con todo cargado (la OT desde el plan, el alta de OT, el horómetro…). Lo que se guarda de una sola vez —como una lectura de horómetro— se confirma ahí mismo.</li>
    <li>Reglas de siempre: el agente <b>no decide ni guarda solo</b>; propone y el usuario confirma.</li>
  </ul></section>

  <section><h3>Ejemplo de repreguntas</h3>
  <p>“Quiero hacer la toma de muestra del motor” → <b>¿De cuál motor?</b> (Principal / Auxiliar / Emergencia) → <b>¿Cuál de los dos?</b> (Babor / Estribor) → encuentra la rutina de muestreo del plan, dice cuál es y ofrece abrir la OT con su solicitud al laboratorio.</p></section>

  <section><h3>Para decidir</h3>
  <div class="opt2">
    <div class="rcard"><b>1. iPhone</b>El dictado del navegador no existe en Safari. En iPhone el botón quedaría para escribir en vez de hablar (o se agrega grabación y transcripción por el servidor, que es más trabajo y consume crédito). ¿Lo dejamos escrito en iPhone por ahora?</div>
    <div class="rcard"><b>2. ¿Hasta dónde ejecuta?</b>Propongo: lo que es “abrir una pantalla con todo cargado” lo hace el agente, y lo que guarda de una (horómetro) lo confirma en el mismo lugar. Cerrar OT, firmar o aprobar sigue siendo a mano.</div>
    <div class="rcard"><b>3. ¿Lee la respuesta en voz alta?</b>El copiloto ya sabe hablar. A bordo, con ruido, puede molestar: lo dejaría apagado con un botón para activarlo.</div>
    <div class="rcard"><b>4. Costo</b>Cada pedido consume crédito de IA (es el mismo copiloto). Con repreguntas cortas es poco, pero conviene saberlo.</div>
  </div></section>

  <p style="font-size:13.5px;color:var(--muted)">⚠ La otra sesión está trabajando justo en el copiloto y en el registro de avances. Antes de construir esto hay que saber si ya terminó, para no pisarnos.</p>
  </article>`;
}

function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.p===S.v));
  document.getElementById("themeb").innerHTML=`${I({system:"monitor",light:"sun",dark:"moon"}[S.theme],15)}<span>${{system:"Sistema",light:"Claro",dark:"Oscuro"}[S.theme]}</span>`;
  document.getElementById("root").innerHTML=S.v==="ref"?ref():app();
  if(window.lucide) lucide.createIcons();
}
function pensar(ms,then){ S.fase="think"; render(); setTimeout(()=>{ S.fase="ask"; then?.(); render(); }, ms); }

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]"); if(!el) return;
  const a=el.dataset.a,p=el.dataset.p;
  if(a==="tab") S.v=p;
  else if(a==="theme"){S.theme={system:"light",light:"dark",dark:"system"}[S.theme];
    const r=document.documentElement; if(S.theme==="system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme",S.theme);}
  else if(a==="hold"||a==="hold2"){
    if(!S.rec){ S.rec=true; render(); setTimeout(()=>{ S.rec=false; if(!S.caso){S.caso="muestra";S.abierto=true;S.paso=0;S.elegidas=[];S.listo=false;} pensar(1100); },1500); return; }
    S.rec=false;
  }
  else if(a==="caso"){ S.caso=p; S.abierto=true; S.paso=0; S.elegidas=[]; S.listo=false; pensar(1100); return; }
  else if(a==="elegir"){
    S.elegidas[S.paso]=Number(p); S.paso++;
    const total=CASOS[S.caso].pasos.length;
    pensar(900, ()=>{ if(S.paso>=total) S.listo=true; });
    return;
  }
  else if(a==="otra"){ S.paso=0; S.elegidas=[]; S.listo=false; }
  else if(a==="cta"){ S.abierto=false; S.caso=null; S.paso=0; S.listo=false; }
  else if(a==="cerrar"){ S.abierto=false; S.caso=null; S.paso=0; S.listo=false; }
  else return;
  render();
});
render();
</script>
