<title>App a bordo CMS3.0</title>
<meta name="theme-color" content="#0D1B2A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --stage:#E7EAEF; --bg:#F4F5F7; --surface:#FFFFFF; --surface2:#EEF1F5;
  --fg:#1A1D24; --muted:#586070; --faint:#8A919D; --line:#E2E5EA;
  --ac:#0284C7; --acfg:#FFFFFF; --acsoft:#E0F2FE;
  --ok:#0E9F6E; --oksoft:#DCFCE7; --okfg:#166534;
  --warn:#D97706; --warnsoft:#FEF3C7; --warnfg:#92400E;
  --bad:#DC2626; --badsoft:#FEE2E2; --badfg:#991B1B;
  --ai:#6D28D9; --aisoft:#EDE9FE;
  --navy:#0D1B2A; --navyfg:#E0E1DD; --frame:#1A1D24;
  --shadow:0 30px 60px -24px rgba(13,27,42,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --stage:#050914; --bg:#080D1D; --surface:#141D36; --surface2:#1C2541;
    --fg:#E0E1DD; --muted:#A6ADB9; --faint:#7B8394; --line:rgba(255,255,255,.10);
    --ac:#38BDF8; --acfg:#0B132B; --acsoft:rgba(56,189,248,.15);
    --ok:#06D6A0; --oksoft:rgba(6,214,160,.14); --okfg:#34D399;
    --warn:#FBBF24; --warnsoft:rgba(251,191,36,.13); --warnfg:#FBBF24;
    --bad:#F87171; --badsoft:rgba(248,113,113,.14); --badfg:#FCA5A5;
    --ai:#A78BFA; --aisoft:rgba(167,139,250,.15);
    --navy:#0B132B; --navyfg:#E0E1DD; --frame:#000000;
    --shadow:0 30px 60px -24px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --stage:#050914; --bg:#080D1D; --surface:#141D36; --surface2:#1C2541;
  --fg:#E0E1DD; --muted:#A6ADB9; --faint:#7B8394; --line:rgba(255,255,255,.10);
  --ac:#38BDF8; --acfg:#0B132B; --acsoft:rgba(56,189,248,.15);
  --ok:#06D6A0; --oksoft:rgba(6,214,160,.14); --okfg:#34D399;
  --warn:#FBBF24; --warnsoft:rgba(251,191,36,.13); --warnfg:#FBBF24;
  --bad:#F87171; --badsoft:rgba(248,113,113,.14); --badfg:#FCA5A5;
  --ai:#A78BFA; --aisoft:rgba(167,139,250,.15);
  --navy:#0B132B; --navyfg:#E0E1DD; --frame:#000000;
  --shadow:0 30px 60px -24px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--stage);color:var(--fg);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}

/* barra de la maqueta */
.bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:9px 16px;background:var(--navy);color:var(--navyfg);border-bottom:1px solid rgba(255,255,255,.08)}
.bar .name{font-weight:800;font-size:14px;letter-spacing:-.01em;display:flex;gap:8px;align-items:center}
.bar .name small{font-weight:600;opacity:.6}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:#F59E0B;color:#1A1D24;padding:3px 8px;border-radius:99px;white-space:nowrap}
.seg{display:flex;gap:3px;background:rgba(255,255,255,.08);padding:3px;border-radius:10px}
.seg button{border:0;background:transparent;color:inherit;opacity:.75;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.seg button.on{background:#38BDF8;color:#0B132B;opacity:1}
.bar .sp{flex:1}
.themeb{border:1px solid rgba(255,255,255,.2);background:transparent;color:inherit;border-radius:9px;min-height:34px;padding:0 10px;font-size:12.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center;cursor:pointer}

/* escenario */
.stage{display:flex;gap:36px;justify-content:center;align-items:flex-start;flex-wrap:wrap;padding-block:26px 56px;padding-inline:16px}
.phone{width:390px;max-width:100%;height:812px;background:var(--bg);border:11px solid var(--frame);border-radius:46px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.sbar{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12.5px;font-weight:700;background:var(--surface)}
.sbar.navy{background:var(--navy);color:var(--navyfg)}
.sbar span{display:flex;gap:5px;align-items:center}
.head{flex:none;display:flex;align-items:center;gap:10px;padding:6px 12px 10px;background:var(--surface)}
.head.bd{border-bottom:1px solid var(--line)}
.head .grow{min-width:0;flex:1}
.head h1{margin:0;font-size:17px;font-weight:800;line-height:1.2;text-wrap:balance}
.head p{margin:0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconb{width:44px;height:44px;flex:none;border-radius:12px;border:0;background:var(--surface2);display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.prog{display:flex;gap:5px;padding:0 16px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.prog span{flex:1;height:5px;border-radius:9px;background:var(--line)}
.prog span.on{background:var(--ac)}
.scr{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.foot{flex:none;padding:12px 16px 16px;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}

/* botones */
.btn{min-height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:16px;font-weight:800;display:flex;gap:8px;align-items:center;justify-content:center;cursor:pointer;width:100%;padding:0 16px;color:var(--fg)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--acfg)}
.btn.need{background:var(--warnsoft);border-color:var(--warn);color:var(--warnfg)}
.btn.sec2{min-height:48px;font-size:15px;font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.signer{font-size:12.5px;color:var(--muted);text-align:center;margin:0}

/* inicio */
.hero{margin:-16px -16px 0;padding:4px 20px 52px;background:var(--navy);color:var(--navyfg)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.vsl{display:inline-flex;gap:7px;align-items:center;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.me{width:38px;height:38px;border-radius:99px;background:rgba(255,255,255,.13);display:grid;place-items:center;font-size:13px;font-weight:800}
.hi{margin:16px 0 0;font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.role{margin:3px 0 0;font-size:14px;opacity:.7}
.due{margin-top:-52px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;text-align:left;cursor:pointer;width:100%;box-shadow:0 10px 24px -14px rgba(13,27,42,.35);color:var(--fg)}
.due-ic{width:46px;height:46px;flex:none;border-radius:13px;background:var(--badsoft);color:var(--badfg);display:grid;place-items:center}
.due-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.due-tx b{font-size:16px}
.due-tx span{font-size:14px;color:var(--muted)}
.n-bad{color:var(--badfg);font-weight:800;font-style:normal}
.n-warn{color:var(--warnfg);font-weight:800;font-style:normal}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{min-height:116px;border-radius:18px;border:1px solid var(--line);background:var(--surface);padding:14px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;text-align:left;cursor:pointer;color:var(--fg)}
.tile .ti{width:42px;height:42px;border-radius:12px;background:var(--acsoft);color:var(--ac);display:grid;place-items:center}
.tile b{display:block;font-size:15.5px;line-height:1.2}
.tile small{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.tile small.w{color:var(--warnfg);font-weight:700}
.tile.pri{background:var(--ac);border-color:var(--ac);color:var(--acfg)}
.tile.pri .ti{background:rgba(255,255,255,.2);color:var(--acfg)}
.tile.pri small{color:var(--acfg);opacity:.85}
.gh{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:6px 2px -6px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);text-align:left;background:transparent;width:100%;color:var(--fg)}
.row:first-child{border-top:0}
button.row{cursor:pointer}
.row .grow{flex:1;min-width:0}
.row b{display:block;font-size:14.5px;line-height:1.3}
.row .sub{font-size:12.5px;color:var(--muted)}
.code{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-size:12px;font-weight:600;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.p-bad{background:var(--badsoft);color:var(--badfg)}
.p-warn{background:var(--warnsoft);color:var(--warnfg)}
.p-ok{background:var(--oksoft);color:var(--okfg)}
.p-ac{background:var(--acsoft);color:var(--ac)}
.p-mut{background:var(--surface2);color:var(--muted)}
.pc{display:flex;gap:7px;align-items:center;justify-content:center;font-size:13px;color:var(--muted);margin:2px 0 4px}

/* tarjetas y pestañas */
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface2);padding:4px;border-radius:14px}
.tabs2 button{min-height:44px;border:0;border-radius:11px;background:transparent;font-weight:800;font-size:14.5px;cursor:pointer;color:var(--muted)}
.tabs2 button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;cursor:pointer;color:var(--fg)}
.card .eq{font-size:12.5px;color:var(--muted);font-weight:600}
.card .tk{font-size:16px;font-weight:800;line-height:1.25}
.card .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.card.off{opacity:.62}
.task{display:flex;flex-direction:column;gap:4px}
.task h2{margin:2px 0 0;font-size:21px;font-weight:800;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.task p{margin:0;color:var(--muted);font-size:14px}

/* formularios */
.fld{display:flex;flex-direction:column;gap:8px;padding:12px;margin:0 -12px;border-radius:14px;border:1.5px solid transparent}
.fld.miss{background:var(--warnsoft);border-color:var(--warn)}
.lbl{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;margin:0}
.lbl .req{font-size:11px;font-weight:800;color:var(--warnfg);text-transform:uppercase;letter-spacing:.05em;display:none}
.miss .lbl .req{display:inline}
.lbl .opt2{font-size:12px;font-weight:600;color:var(--faint)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:14.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--fg)}
.chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip.sm{min-height:36px;font-size:13px;padding:0 11px;border-width:1px}
.chip.aio.on{background:var(--aisoft);border-color:var(--ai);color:var(--fg)}
.inp,.ta{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font:inherit;font-size:16px;padding:12px}
.inp{min-height:50px}
.ta{min-height:96px;resize:none;line-height:1.45}
.inp:focus,.ta:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--acsoft)}
.group{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:2px 14px}
.okrow{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.okrow:first-child{border-top:0}
.okrow .ck{color:var(--ok);flex:none;margin-top:1px}
.okrow b{display:block;font-size:14px}
.okrow span{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--acsoft);font-size:13.5px;color:var(--fg);margin:0}
.note svg{color:var(--ac);flex:none;margin-top:1px}
.note.ai{background:var(--aisoft)}
.note.ai svg{color:var(--ai)}
.note.w{background:var(--warnsoft)}
.note.w svg{color:var(--warnfg)}
.tools{display:flex;gap:8px}
.tools .chip{flex:1;justify-content:center}
.chip.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{min-height:124px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;cursor:pointer;color:var(--fg)}
.opt b{font-size:15px;line-height:1.2}
.opt small{font-size:12.5px;color:var(--muted)}
.opt.on{border-color:var(--ac);background:var(--acsoft)}
.opt .oi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);color:var(--fg)}
.opt.on .oi{background:var(--ac);color:var(--acfg)}
.radio{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-align:left;width:100%;color:var(--fg)}
.radio.on{border-color:var(--ac);background:var(--acsoft)}
.radio .dot{width:22px;height:22px;border-radius:99px;border:2px solid var(--faint);flex:none;display:grid;place-items:center}
.radio.on .dot{border-color:var(--ac)}
.radio.on .dot::after{content:"";width:11px;height:11px;border-radius:99px;background:var(--ac)}
.radio .grow{flex:1;min-width:0}
.radio b{display:block;font-size:15px}
.radio small{font-size:12.5px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:8px}
.risk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.risk button{min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:13.5px;cursor:pointer;color:var(--fg)}
.risk button.on.r0{background:var(--ok);border-color:var(--ok);color:#fff}
.risk button.on.r1{background:var(--warn);border-color:var(--warn);color:#1A1D24}
.risk button.on.r2{background:#EA580C;border-color:#EA580C;color:#fff}
.risk button.on.r3{background:var(--bad);border-color:var(--bad);color:#fff}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:62px;height:62px;border-radius:12px;background:linear-gradient(135deg,#94A3B8,#475569);display:grid;place-items:center;color:#fff}
.sel{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--acsoft);border:1.5px solid var(--ac)}
.sel .grow{flex:1;min-width:0}
.sel b{display:block;font-size:15px}
.times{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.times label{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

/* horómetros */
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 14px;display:flex;gap:10px;align-items:center}
.hcard .grow{flex:1;min-width:0}
.hcard b{font-size:15px;display:block;line-height:1.25}
.hlast{font-size:13px;color:var(--muted)}
.hlast.st{color:var(--badfg);font-weight:700}
.delta{font-size:12.5px;font-weight:700;min-height:18px;display:block}
.delta.ok{color:var(--okfg)}
.delta.warn{color:var(--warnfg)}
.hin{display:flex;align-items:center;gap:6px}
.hin input{width:122px;min-height:54px;text-align:right;font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--fg);padding:0 10px}
.hin input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--acsoft)}
.hin span{font-weight:700;color:var(--muted)}

/* check list */
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.item.miss{border-color:var(--warn);background:var(--warnsoft)}
.item p{margin:0;font-size:15px;font-weight:600;line-height:1.35}
.yn{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.yn button{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:14px;display:flex;gap:5px;align-items:center;justify-content:center;cursor:pointer;color:var(--fg)}
.yn button.on.si{background:var(--ok);border-color:var(--ok);color:#fff}
.yn button.on.no{background:var(--bad);border-color:var(--bad);color:#fff}
.yn button.on.na{background:var(--muted);border-color:var(--muted);color:var(--bg)}
.meter{display:flex;flex-direction:column;gap:6px}
.meter div{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.meter div span{display:block;height:100%;background:var(--ac);border-radius:9px}
.meter p{margin:0;font-size:13px;color:var(--muted);display:flex;justify-content:space-between}

/* repuestos */
.spare{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;cursor:pointer;text-align:left;width:100%;color:var(--fg)}
.spare .grow{flex:1;min-width:0}
.spare b{display:block;font-size:15px}
.spare .sub{font-size:12.5px;color:var(--muted)}
.cart{background:var(--surface);border:1.5px solid var(--ac);border-radius:16px;padding:4px 14px}
.cart .row{padding:10px 0}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px}
.stepper button{width:66px;height:66px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface2);display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.stepper output{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;min-width:90px;text-align:center}

/* ventanitas */
.dlg{position:absolute;inset:0;background:rgba(8,13,29,.55);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--surface);width:100%;border-radius:22px 22px 0 0;padding:10px 16px 20px;display:flex;flex-direction:column;gap:12px;max-height:85%;overflow-y:auto}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 4px}
.sheet h2{margin:0;font-size:19px;font-weight:800;text-wrap:balance}
.two{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.toast{position:absolute;left:16px;right:16px;bottom:104px;background:var(--fg);color:var(--bg);padding:12px 14px;border-radius:14px;font-size:14px;font-weight:600;z-index:6;text-align:center}

/* listo */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:6px}
.done .big{width:80px;height:80px;border-radius:99px;background:var(--oksoft);color:var(--okfg);display:grid;place-items:center}
.done h2{margin:10px 0 0;font-size:23px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.done ul{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.done li{display:flex;gap:10px;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.done li svg{flex:none;color:var(--muted);margin-top:1px}

/* panel guía */
.guide{width:350px;max-width:100%;display:flex;flex-direction:column;gap:20px;padding-top:14px}
.guide h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.guide p{margin:0;color:var(--muted);font-size:14.5px;max-width:60ch}
.gl{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
.jump{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.jump button{min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;text-align:left;padding:0 10px;display:flex;gap:7px;align-items:center;cursor:pointer;color:var(--fg)}
.jump button.on{border-color:var(--ac);color:var(--ac)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.45}

/* qué incluye */
.ref{max-width:880px;margin:0 auto;padding-block:30px 64px;padding-inline:16px;display:flex;flex-direction:column;gap:26px}
.ref header h2{margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.ref header p{margin:8px 0 0;color:var(--muted);font-size:16px;max-width:64ch}
.ref h3{margin:0 0 10px;font-size:17px;font-weight:800}
.ref section p,.ref li{font-size:14.5px;line-height:1.55}
.ref ul,.ref ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
thead th{border-top:0;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);background:var(--surface2)}
td b{font-weight:700}
.dec{display:flex;flex-direction:column;gap:10px}
.dec div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.5}
.dec b{display:block;margin-bottom:2px}

@media (max-width:520px){
  .bar{padding:7px 10px;gap:8px}
  .bar .name{display:none}
  .stage{padding:0;gap:0}
  .phone{width:100%;height:calc(100dvh - 50px);border:0;border-radius:0;box-shadow:none}
  .sbar{display:none}
  .hero{padding-top:14px}
  .guide{padding:22px 16px 44px;width:100%}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

function inputFld(o,k,label,{ph="",sugg=[],ta=false,req=true,hint="",extra=""}={}){

  const ctl=ta?`<textarea class="ta" id="${o}-${k}" data-in="${o}|${k}" placeholder="${esc(ph)}">${esc(v)}</textarea>`
             :`<input class="inp" id="${o}-${k}" data-in="${o}|${k}" value="${esc(v)}" placeholder="${esc(ph)}">`;

function otMiss(){
  const o=S.ot; let m=OT_REQ[o.step].filter(k=>!String(o[k]??"").trim()).length;

  return m;
}

    <label class="hin"><input id="h-${h.id}" inputmode="decimal" autocomplete="off" data-in="h|${h.id}" data-live="h" value="${esc(S.h[h.id]??"")}" placeholder="${fmt(h.last)}" aria-label="Horas de ${h.eq}"><span>h</span></label></div>`;}).join("")}`,
  foot:`<button type="button" class="btn pri" ${n?"":"disabled"} data-a="hSave">${I("check",19)}${n?`Guardar ${n} ${n===1?"lectura":"lecturas"}`:"Guardar lecturas"}</button>`};

function hourWarn(h,v){
  const n=parseNum(v); if(n===null||Number.isNaN(n))return null;
  const d=n-h.last;
  if(d<0)return {w:true,t:`${fmt(Math.abs(d))} h menos que la anterior`};
  if(d>h.days*24)return {w:true,t:`+${fmt(d)} h: más de las que pasaron (máx. ${h.days*24} h)`};
  return {w:false,t:`+${fmt(d)} h desde la última lectura`};
}

function ckState(){

    <tr><td><b>Planes vencidos y por vencer</b></td><td>Ver la lista, abrir la OT (sumando otras tareas del mismo equipo), completar solicitado por, asignado a, sistema y ubicación, y enviar a aprobar. Criterio, LOTO y riesgo ya vienen del plan.</td><td>Repuestos planificados, fechas, adjuntos, cierre.</td><td>Superintendente</td></tr>
    <tr><td><b>Nueva OT / SS</b></td><td>Equipo, qué pasa (texto, dictado, foto), tipo y urgencia; quién lo hace; si es un taller: proveedor y tipo de solicitud. Riesgo, LOTO y criterio (con sugerencia de IA). Envía a aprobar la OT y, si corresponde, la SS.</td><td>Presupuestos, forma de comunicación, distribución, seguimiento del taller.</td><td>Superintendente</td></tr>
    <tr><td><b>Registrar avance</b></td><td>Igual que la Preview V29.</td><td>—</td><td>No requiere</td></tr>
    <tr><td><b>Horómetros</b></td><td>Lectura del día por equipo, con la última lectura a la vista. Avisa si es menor que la anterior o si suma más horas de las que pasaron, y pide una nota.</td><td>Historial y corrección de lecturas viejas.</td><td>No requiere</td></tr>
    <tr><td><b>Permiso de trabajo</b></td><td>Tipo (los 6 del formulario), OT relacionada, lugar, qué se hace y horario; peligros, controles y EPP sugeridos por IA. Pide aprobación.</td><td>Participantes, pruebas de gas, adjuntos, activar y cerrar.</td><td>Superintendente o Jefe SSMA</td></tr>
    <tr><td><b>Check list</b></td><td>Elegir la lista, responder Sí / No / N/A (el «No» pide explicación), seguir más tarde y firmar.</td><td>PDF, plantillas.</td><td>No requiere</td></tr>
    <tr><td><b>Consumo de repuestos</b></td><td>Elegir la OT (o consumo general), buscar por nombre o P/N, cantidad con botones grandes, descontar.</td><td>Recepciones, ajustes, pedidos.</td><td>No requiere</td></tr>
    </tbody></table></div></section>
  <section><h3>Quién ve, quién crea, quién aprueba</h3><ul>
    <li><b>Ve:</b> sólo los buques asignados al usuario, igual que hoy.</li>
    <li><b>Crea y envía:</b> Capitán y Jefe de Máquinas, con los permisos que ya tienen. No se agrega ningún permiso nuevo.</li>
    <li><b>Aprueba:</b> nadie desde esta app. OT y SS las aprueba el Superintendente; los permisos de trabajo, el Superintendente o el Jefe SSMA.</li>
  </ul></section>
  <section><h3>Qué no cambia</h3><p>La base de datos, las reglas de aprobación y las pantallas de la PC. La app usa lo que el sistema ya sabe hacer. La vista móvil actual de la tripulación sigue como está.</p></section>
  <section><h3>Para decidir</h3><div class="dec">
    <div><b>1. ¿Exigir todos los datos para enviar?</b>En la PC hoy se puede «Enviar igual» con datos faltantes. En el celular propongo exigirlos (el botón dice «Faltan 2 datos» y los marca en amarillo).</div>
    <div><b>2. «Lo que mandaste» en el inicio</b>Muestra si te aprobaron o rechazaron, con el motivo. ¿Lo dejamos?</div>
    <div><b>3. Consumo sin OT</b>Hoy el sistema lo permite (consumo general del buque). ¿Lo dejamos en el celular o todo consumo debe ir contra una OT?</div>
    <div><b>4. Fotos en el check list</b>El sistema guarda Sí / No / N/A y una nota, no fotos. Sumarlas es un cambio de base: lo dejaría para otra etapa.</div>
    <div><b>5. ¿Cómo entra el Capitán?</b>Propuesta: al iniciar sesión desde el celular con ese rol, abre directo esta app.</div>
  </div></section>
  <section><h3>Aviso para la implementación</h3><p>El consumo cargado desde la OT hoy reemplaza la lista entera de repuestos de esa orden. Si dos personas cargan consumos en la misma OT, el segundo borraría lo del primero. Al construir la app hay que sumar sin pisar.</p></section>
  </article>`;
}

/* ───────── acciones ───────── */
function go(scr){
  S.scr=scr;S.tried=false;S.dlg=null;
  if(scr==="newot")S.ot=newOt();
  if(scr==="permiso")S.pt=newPt();
  if(scr==="horas"){S.h={};S.hn.note="";}
  if(scr==="avance")S.av={wo:null,txt:"",rec:false,photos:0};
  if(scr==="repuestos")S.rp={step:"ot",ot:null,lines:[],pick:null,qty:1,q:""};
}
function back(){
  const m={plans:"home",planOpen:"plans",avance:"home",avSheet:"avance",horas:"home",check:"home",ckRun:"check",done:"home"};
  if(S.scr==="newot"){ if(S.ot.step>1){S.ot.step--;S.tried=false;} else go("home"); return; }
  if(S.scr==="permiso"){ if(S.pt.step>1){S.pt.step--;S.tried=false;} else go("home"); return; }
  if(S.scr==="repuestos"){ if(S.rp.step==="list"){S.rp.step="ot";} else go("home"); return; }
  S.scr=m[S.scr]||"home";S.tried=false;S.dlg=null;
}
function finish(d){S.done=d;S.scr="done";S.dlg=null;S.tried=false;}
function needMore(){S.tried=true;S.scrollMiss=true;}
const DICT={ot:"Pierde agua por el sello mecánico; hay que cambiar el sello y revisar el eje.",av:"Se desarmó la bomba y se cambió el sello mecánico. Se probó 20 minutos sin pérdidas.",pt:"Soldar un refuerzo en la cuaderna 42 del tanque 3 Babor."};
const DICTK={ot:"txt",av:"txt",pt:"desc"};

function act(a,p){
  const [x,y,z]=p.split("|");
  switch(a){
    case "tab": S.tab=x; window.scrollTo(0,0); break;
    case "theme": S.theme={system:"light",light:"dark",dark:"system"}[S.theme]; applyTheme(); break;
    case "go": go(x); break;
    case "home": go("home"); break;
    case "back": back(); break;
    case "set": { const t=y?S[x]:S; const k=y||x; const v=y?z:""; if(t[k] instanceof Set){t[k].has(v)?t[k].delete(v):t[k].add(v);} else t[k]=t[k]===v?null:v; break; }
    case "pick": { if(x==="planTab"){S.planTab=z;break;} S[x][y]=z||null; if(x==="ot"&&y==="eq"&&!z)S.ot.eqQ=""; break; }
    case "fill": S[x][y]=z; break;
    case "openPlan": { const pl=PLANS.find(q=>q.id===x); if(pl.openWo){toast(`Ya tiene la ${pl.openWo}: cargá el avance desde ahí.`);return;}
      S.plan=pl; S.add=new Set(); S.pf={sol:null,asig:pl.dept==="PROVEEDOR"?"Tercerizado":"Tripulación",sis:null,ubi:""}; S.scr="planOpen"; S.tried=false; break; }
    case "toggleAdd": S.add.has(x)?S.add.delete(x):S.add.add(x); break;
    case "sendPlan": { if(pfMiss()){needMore();break;}
      const n=1+S.add.size, pl=S.plan;
      finish({icon:"send",title:"OT enviada a aprobar",code:"OT-DEM1-26-0072"+(pl.prov?" · SS-DEM1-26-0015":""),again:["Abrir otro plan","plans"],lines:[
        ["list-checks",`${n} ${n===1?"tarea":"tareas"} de ${pl.eq}${n>1?" en la misma orden":""}.`],
        ["user-check","La aprueba el Superintendente. El estado aparece en «Lo que mandaste»."],
        ["monitor","Repuestos planificados, fechas y adjuntos: desde la PC."]]});
      break; }
    case "otNext": { if(otMiss()){needMore();break;}
      if(S.ot.step<3){S.ot.step++;S.tried=false;break;}
      const ss=S.ot.quien==="Taller o proveedor";
      finish({icon:"send",title:ss?"OT y SS enviadas a aprobar":"OT enviada a aprobar",code:ss?"OT-DEM1-26-0073 · SS-DEM1-26-0015":"OT-DEM1-26-0073",again:["Abrir otra","newot"],lines:[
        ["cog",`${S.ot.eq} · ${S.ot.urg}.`],
        ...(ss?[["building-2",`La SS sale para ${S.ot.prov}.`]]:[]),
        ["user-check","La aprueba el Superintendente. El estado aparece en «Lo que mandaste»."],
        ["monitor",ss?"Presupuestos y adjuntos de la SS: desde la PC.":"Repuestos y adjuntos: desde la PC."]]});
      break; }
    case "dictate": { const o=S[x]; if(!o.rec){o.rec=true;} else {o.rec=false; const k=DICTK[x]; o[k]=(o[k]?o[k].replace(/\s*$/," "):"")+DICT[x];} break; }
    case "photo": S[x].photos++; break;
    case "aiCrit": S.ot.crit="Equipo en marcha 15 minutos sin pérdidas y con la presión de trabajo normal."; if(S.ot.loto==="Sí"&&!S.ot.lotoTxt.trim())S.ot.lotoTxt="Cortar la alimentación en el tablero principal y colocar candado y tarjeta."; toast("Sugerencia de IA: revisala antes de enviar."); return;
    case "avPick": S.av.wo=x; S.scr="avSheet"; break;
    case "avSave": finish({icon:"check",title:"Avance guardado",code:S.av.wo,again:["Registrar otro","avance"],lines:[["message-square-plus","Se ve en la OT con tu nombre y la hora."]]}); break;
    case "hSave": { const ws=HOURS.filter(h=>{const w=hourWarn(h,S.h[h.id]??"");return w&&w.w;}); if(ws.length){S.dlg="horas";break;} }
    /* falls through */
    case "hConfirm": { const n=Object.values(S.h).filter(v=>parseNum(v)!==null).length;
      finish({icon:"gauge",title:`${n} ${n===1?"lectura guardada":"lecturas guardadas"}`,lines:[["calendar-clock","Los planes por horas se recalculan con estas lecturas."],["monitor","El historial y las correcciones, desde la PC."]]}); break; }
    case "ptType": { const T=PTW.find(t=>t.v===x); S.pt.type=x; S.pt.haz=new Set(T.haz); S.pt.ctl=new Set(T.ctl); S.pt.ppe=new Set(T.ppe); S.pt.step=2; S.tried=false; break; }
    case "ptStep": S.pt.step=Number(x); S.tried=false; break;
    case "ptNext": { if(ptMiss()){needMore();break;} if(S.pt.step<3){S.pt.step++;S.tried=false;break;}
      const T=PTW.find(t=>t.v===S.pt.type);
      finish({icon:"shield-check",title:"Permiso enviado a aprobar",code:"PTW-DEM1-26-0010",again:["Pedir otro","permiso"],lines:[
        [T.ic,`${T.n} · ${S.pt.lugar} · ${S.pt.dia} ${S.pt.desde} a ${S.pt.hasta}.`],
        ["user-check","Lo aprueba el Superintendente o el Jefe SSMA."],
        ["monitor","Participantes, pruebas de gas y adjuntos: desde la PC."]]});
      break; }
    case "toastOther": toast("Se escribe a mano (en la maqueta no hace nada)."); return;
    case "ckStart": { S.ck={tpl:x,ans:{}}; S.ckn={}; if(y==="resume"){for(let i=0;i<4;i++)S.ck.ans[i]="si";} S.scr="ckRun"; S.tried=false; break; }
    case "ckAns": S.ck.ans[x]=S.ck.ans[x]===y?undefined:y; break;
    case "ckFinish": { if(ckState().miss){needMore();break;} S.dlg="ckSign"; break; }
    case "ckSign": { const {t,a}=ckState(); const no=t.items.filter((_,i)=>a[i]==="no").length;
      finish({icon:"clipboard-check",title:"Check list firmado",code:`${t.n} · 15/09 09:41`,lines:[
        ["circle-check",`${t.items.length} puntos · ${no} no ${no===1?"conforme":"conformes"}.`],
        ["monitor","El PDF queda disponible en la PC."]]}); break; }
    case "rpOt": S.rp.ot=x==="none"?null:x; S.rp.step="list"; break;
    case "rpPick": S.rp.pick=Number(x); S.rp.qty=1; S.dlg="qty"; break;
    case "qty": S.rp.qty=Math.max(1,S.rp.qty+Number(x)); break;
    case "rpAdd": { const ex=S.rp.lines.find(l=>l.i===S.rp.pick); ex?ex.q+=S.rp.qty:S.rp.lines.push({i:S.rp.pick,q:S.rp.qty}); S.dlg=null; break; }
    case "rpDel": S.rp.lines.splice(Number(x),1); break;
    case "rpSave": { const n=S.rp.lines.length;
      finish({icon:"package-minus",title:"Stock descontado",code:S.rp.ot||"Consumo general",lines:[
        ...S.rp.lines.map(l=>["package",`${SPARES[l.i].n} · ${fmt(l.q)} ${SPARES[l.i].u}`]),
        ["history",`${n} ${n===1?"movimiento":"movimientos"} con tu nombre y la hora.`]]}); break; }
    case "dlgClose": S.dlg=null; break;
  }
  render();
}

/* ───────── render ───────── */
function current(){
  return ({home,plans,planOpen,newot,avance,avSheet,horas,permiso,check,ckRun,repuestos,done})[S.scr]();
}
function icons(){ if(window.lucide) lucide.createIcons(); }
function applyTheme(){
  const r=document.documentElement;
  if(S.theme==="system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme",S.theme);
  try{localStorage.setItem("v30-theme",S.theme);}catch(e){}
}
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.p===S.tab));
  $("#themeb").innerHTML=`${I({system:"monitor",light:"sun",dark:"moon"}[S.theme],15)}<span>${{system:"Sistema",light:"Claro",dark:"Oscuro"}[S.theme]}</span>`;
  const main=$("#main");
  if(S.tab==="ref"){ main.innerHTML=refPage(); icons(); return; }
  const key=S.scr+(S.scr==="newot"?S.ot.step:S.scr==="permiso"?S.pt.step:S.scr==="repuestos"?S.rp.step:"");
  const prev=$("#scr"); const top=(prev&&key===S.lastKey)?prev.scrollTop:0;
  const focusId=document.activeElement&&document.activeElement.id;
  const v=current();
  main.innerHTML=`<div class="stage"><div class="phone">
      <div class="sbar ${v.sbar||""}"><span class="mono">09:41</span><span>${I("signal",14)}${I("wifi",14)}${I("battery-full",16)}</span></div>
      ${v.head||""}<div class="scr" id="scr">${v.body}</div><div id="foot">${v.foot?`<div class="foot">${v.foot}</div>`:""}</div>
      ${S.dlg?`<div class="dlg" data-a="dlgBg">${dialog()}</div>`:""}${S.toast?`<div class="toast" role="status">${S.toast}</div>`:""}
    </div>${guide()}</div>`;
  icons();
  const scr=$("#scr"); scr.scrollTop=top; S.lastKey=key;
  if(S.scr==="horas") HOURS.forEach(h=>liveHour(h.id,S.h[h.id]??""));
  ["eqlist","splist"].forEach(id=>{const inp=document.querySelector(`[data-filter="${id}"]`); if(inp&&inp.value) filterList(id,inp.value);});
  if(focusId&&!S.dlg){const el=document.getElementById(focusId); if(el&&(el.tagName==="INPUT"||el.tagName==="TEXTAREA"))el.focus();}
  if(S.scrollMiss){S.scrollMiss=false; const m=scr.querySelector(".miss"); if(m)m.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}
}
function refreshFoot(){ const v=current(); $("#foot").innerHTML=v.foot?`<div class="foot">${v.foot}</div>`:""; icons(); }
function liveHour(id,v){
  const h=HOURS.find(x=>x.id===id); const el=document.getElementById("d-"+id); if(!el)return;
  const w=hourWarn(h,v); el.className="delta "+(w?(w.w?"warn":"ok"):""); el.textContent=w?w.t:"";
}
function filterList(id,q){
  const t=q.trim().toLowerCase(); document.querySelectorAll(`#${id} [data-name]`).forEach(b=>{b.hidden=t&&!b.dataset.name.includes(t);});
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]"); if(!el)return;
  if(el.dataset.a==="dlgBg"){ if(e.target===el){S.dlg=null;render();} return; }
  act(el.dataset.a,el.dataset.p||"");
});
document.addEventListener("input",e=>{
  const el=e.target; if(!el.dataset||!el.dataset.in)return;
  const [o,k]=el.dataset.in.split("|"); S[o][k]=el.value;
  if(el.dataset.live==="h") liveHour(k,el.value);
  if(el.dataset.filter) filterList(el.dataset.filter,el.value);
  const f=el.closest(".fld,.item"); if(f&&S.tried) f.classList.toggle("miss",!el.value.trim());
  if(!S.dlg) refreshFoot();
});

try{S.theme=localStorage.getItem("v30-theme")||"system";}catch(e){}
applyTheme();
render();
window.addEventListener("load",icons);
</script>
