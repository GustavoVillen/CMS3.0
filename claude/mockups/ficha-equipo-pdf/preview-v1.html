<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de equipo — propuesta V1</title>
<style>
  :root {
    --navy: #0c2461; --ink: #0f172a; --muted: #64748b; --line: #dbe2ea; --soft: #f5f7fa;
    --ok: #15803d; --ok-bg: #e8f5ec; --warn: #b45309; --warn-bg: #fdf3e3; --bad: #b91c1c; --bad-bg: #fcebeb;
    --info: #0369a1; --info-bg: #e7f2f9; --violet: #6d28d9; --violet-bg: #f1ebfd;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9edf2; font-family: Helvetica, Arial, sans-serif; color: var(--ink); }
  .bar { position: sticky; top: 0; z-index: 5; background: #0f172a; color: #fff; padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .bar b { margin-right: 6px; }
  .bar button { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
  .bar button.on { background: #fff; color: #0f172a; font-weight: 700; }
  .bar .note { margin-left: auto; color: #94a3b8; font-size: 11px; }
  .pages { padding: 24px 12px 60px; display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .page { width: 210mm; min-height: 297mm; background: #fff; box-shadow: 0 2px 12px rgba(15,23,42,.12); padding: 14mm 14mm 12mm; position: relative; display: flex; flex-direction: column; }
  @media (max-width: 820px) { .page { width: 100%; min-height: auto; padding: 16px; } }

  /* Encabezado (mismo marco que los demás documentos Mercurio) */
  .hdr { display: grid; grid-template-columns: 120px 1fr 150px; border: 1px solid var(--line); }
  .hdr > div { padding: 8px 10px; display: flex; align-items: center; }
  .hdr .logo { border-right: 1px solid var(--line); justify-content: center; font-weight: 700; color: var(--navy); font-size: 12px; text-align: center; }
  .hdr .ttl { justify-content: center; font-weight: 700; color: var(--navy); font-size: 16px; letter-spacing: .5px; }
  .hdr .meta { border-left: 1px solid var(--line); flex-direction: column; align-items: stretch; padding: 0; font-size: 9px; }
  .hdr .meta span { display: flex; justify-content: space-between; padding: 5px 8px; border-bottom: 1px solid var(--line); color: var(--muted); }
  .hdr .meta span:last-child { border-bottom: 0; }
  .hdr .meta b { color: var(--ink); }

  /* Aviso crítico */
  .alert { margin-top: 10px; border-radius: 6px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; font-size: 11px; font-weight: 700; }
  .alert.bad { background: var(--bad); color: #fff; }
  .alert.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid #f3d6a8; }
  .alert small { font-weight: 400; opacity: .9; }

  /* Identidad */
  .hero { margin-top: 12px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start; padding-bottom: 12px; border-bottom: 2px solid var(--navy); }
  .hero h1 { margin: 0; font-size: 22px; line-height: 1.15; }
  .hero .sub { margin-top: 5px; font-size: 10.5px; color: var(--muted); }
  .hero .sub .code { font-family: "Courier New", monospace; color: var(--ink); font-weight: 700; }
  .chips { display: flex; flex-direction: column; gap: 5px; min-width: 190px; }
  .chip { display: flex; align-items: center; gap: 8px; border-radius: 6px; padding: 5px 9px; font-size: 10.5px; font-weight: 700; border: 1px solid transparent; }
  .chip .k { font-weight: 400; font-size: 8.5px; text-transform: uppercase; letter-spacing: .4px; opacity: .8; width: 62px; }
  .chip.ok { background: var(--ok-bg); color: var(--ok); }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }
  .chip.bad { background: var(--bad-bg); color: var(--bad); }
  .chip.violet { background: var(--violet-bg); color: var(--violet); }
  .chip.muted { background: var(--soft); color: var(--muted); }
  .scale { display: inline-flex; gap: 2px; margin-left: auto; }
  .scale i { font-style: normal; width: 15px; height: 15px; border-radius: 3px; display: grid; place-items: center; font-size: 8.5px; background: #fff; color: #94a3b8; border: 1px solid var(--line); }
  .scale i.on { color: #fff; border-color: transparent; }
  .ic { width: 13px; height: 13px; flex: none; }

  /* Tarjetas de resumen */
  .kpis { margin-top: 12px; display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); gap: 8px; }
  .kpi { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: #fff; }
  .kpi .k { font-size: 8px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 700; }
  .kpi .v { margin-top: 3px; font-size: 16px; font-weight: 700; }
  .kpi .d { margin-top: 2px; font-size: 9px; color: var(--muted); line-height: 1.3; }
  .kpi.bad { border-color: #f1b8b8; background: #fff8f8; } .kpi.bad .v { color: var(--bad); }
  .stack { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 6px; background: var(--soft); }
  .stack span { display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 4px; font-size: 8.5px; color: var(--muted); }
  .legend b { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 3px; vertical-align: 0; }

  /* Secciones */
  .sec { margin-top: 14px; }
  .sec h2 { margin: 0 0 6px; background: var(--navy); color: #fff; font-size: 9.5px; letter-spacing: 1.2px; text-transform: uppercase; padding: 5px 9px; border-radius: 3px; display: flex; justify-content: space-between; }
  .sec h2 small { font-weight: 400; letter-spacing: 0; text-transform: none; opacity: .85; }
  .kv { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 4px; }
  .kv div { padding: 6px 9px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .kv div:nth-child(3n) { border-right: 0; }
  .kv div:nth-last-child(-n+3) { border-bottom: 0; }
  .kv .k { font-size: 7.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 700; }
  .kv .v { font-size: 10.5px; font-weight: 700; margin-top: 2px; }
  .kv .v.empty { color: #b8c2cf; font-weight: 400; }
  .why { border-left: 4px solid var(--c, var(--warn)); background: var(--soft); padding: 8px 12px; font-size: 9.5px; line-height: 1.5; border-radius: 0 4px 4px 0; }
  .why .t { font-weight: 700; font-size: 10px; margin-bottom: 3px; }

  table { width: 100%; border-collapse: collapse; font-size: 9px; }
  th { text-align: left; font-size: 7.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); background: #eef2f6; padding: 5px 6px; border-bottom: 1px solid var(--line); }
  td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr.hot td { background: #fff5f5; }
  tr.group td { background: #f8fafc; font-weight: 700; font-size: 8.5px; color: var(--navy); text-transform: uppercase; letter-spacing: .6px; padding: 5px 6px; }
  .pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 10px; padding: 2px 7px; font-weight: 700; font-size: 8.5px; white-space: nowrap; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.info { background: var(--info-bg); color: var(--info); }
  .pill.violet { background: var(--violet-bg); color: var(--violet); } .pill.muted { background: var(--soft); color: var(--muted); }
  .t1 { font-weight: 700; } .t2 { color: var(--muted); font-family: "Courier New", monospace; font-size: 8px; margin-top: 1px; }
  .rel { display: block; font-size: 8px; margin-top: 1px; }
  .rel.bad { color: var(--bad); font-weight: 700; } .rel.warn { color: var(--warn); } .rel.muted { color: var(--muted); }
  .empty-row td { color: var(--muted); font-style: italic; text-align: center; padding: 12px; }

  .foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; font-size: 8px; color: var(--muted); }
  .tag { position: absolute; top: 4mm; right: 14mm; font-size: 8px; color: #a16207; background: #fef9c3; border: 1px solid #fde68a; padding: 1px 6px; border-radius: 4px; }
</style>
</head>

    <div class="sec"><h2>Plan de mantenimiento <small>${plans.length} ${plans.length === 1 ? "tarea" : "tareas"} · primero lo vencido</small></h2>
      <table><thead><tr><th style="width:92px">Estado</th><th>Tarea</th><th style="width:78px">Tipo</th><th style="width:82px">Frecuencia</th><th style="width:108px">Próximo</th></tr></thead><tbody>${planRows}</tbody></table></div>
    <div class="foot"><span>Copilot Management System · Ficha de equipo · ${a.name} · ${vessel}</span><span>Página 1 de 2</span></div>
  </div>
  <div class="page">
    <div class="sec" style="margin-top:0"><h2>Historial de mantenimientos e inspecciones <small>${wos.length} OT · ${closed.length} realizadas · ${open.length} abiertas${correctives ? ` · ${correctives} correctivas` : ""}</small></h2>
      <table><thead><tr><th style="width:92px">OT</th><th style="width:66px">Tipo</th><th>Descripción</th><th style="width:60px">Apertura</th><th style="width:62px">Realización</th><th style="width:70px">Estado</th></tr></thead><tbody>${histRows}</tbody></table></div>
    <div class="foot"><span>Copilot Management System · Ficha de equipo · ${a.name} · ${vessel}</span><span>Página 2 de 2</span></div>
  </div>`;
}
document.querySelectorAll(".bar button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".bar button").forEach(x => x.classList.toggle("on", x === b));
  render(b.dataset.ex);
}));
render("M02-MP-BR");
</script>
</body>
</html>
