<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de equipo — propuesta V2</title>
<style>
  :root {
    --navy: #0c2461; --ink: #0f172a; --muted: #64748b; --line: #dbe2ea; --soft: #f5f7fa;
    --ok: #15803d; --ok-bg: #e8f5ec; --warn: #b45309; --warn-bg: #fdf3e3; --bad: #b91c1c; --bad-bg: #fcebeb;
    --info: #0369a1; --info-bg: #e7f2f9; --violet: #6d28d9; --violet-bg: #f1ebfd;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9edf2; font-family: Helvetica, Arial, sans-serif; color: var(--ink); }
  .bar { position: sticky; top: 0; z-index: 5; background: #0f172a; color: #fff; padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .bar b { margin-right: 6px; }
  .bar button { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
  .bar button.on { background: #fff; color: #0f172a; font-weight: 700; }
  .bar .note { margin-left: auto; color: #94a3b8; font-size: 11px; }
  .pages { padding: 24px 12px 60px; display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .page { width: 210mm; min-height: 297mm; background: #fff; box-shadow: 0 2px 12px rgba(15,23,42,.12); padding: 14mm 14mm 12mm; position: relative; display: flex; flex-direction: column; }
  @media (max-width: 820px) { .page { width: 100%; min-height: auto; padding: 16px; } }

  /* Encabezado (mismo marco que los demás documentos Mercurio) */
  .hdr { display: grid; grid-template-columns: 120px 1fr 150px; border: 1px solid var(--line); }
  .hdr > div { padding: 8px 10px; display: flex; align-items: center; }
  .hdr .logo { border-right: 1px solid var(--line); justify-content: center; font-weight: 700; color: var(--navy); font-size: 12px; text-align: center; }
  .hdr .ttl { justify-content: center; font-weight: 700; color: var(--navy); font-size: 16px; letter-spacing: .5px; }
  .hdr .meta { border-left: 1px solid var(--line); flex-direction: column; align-items: stretch; padding: 0; font-size: 9px; }
  .hdr .meta span { display: flex; justify-content: space-between; padding: 5px 8px; border-bottom: 1px solid var(--line); color: var(--muted); }
  .hdr .meta span:last-child { border-bottom: 0; }
  .hdr .meta b { color: var(--ink); }

  /* Aviso crítico */
  .alert { margin-top: 10px; border-radius: 6px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; font-size: 11px; font-weight: 700; }
  .alert.bad { background: var(--bad); color: #fff; }
  .alert.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid #f3d6a8; }
  .alert small { font-weight: 400; opacity: .9; }

  /* Identidad */
  .hero { margin-top: 12px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start; padding-bottom: 12px; border-bottom: 2px solid var(--navy); }
  .hero h1 { margin: 0; font-size: 22px; line-height: 1.15; }
  .hero .sub { margin-top: 5px; font-size: 10.5px; color: var(--muted); }
  .hero .sub .code { font-family: "Courier New", monospace; color: var(--ink); font-weight: 700; }
  .chips { display: flex; flex-direction: column; gap: 5px; min-width: 190px; }
  .chip { display: flex; align-items: center; gap: 8px; border-radius: 6px; padding: 5px 9px; font-size: 10.5px; font-weight: 700; border: 1px solid transparent; }
  .chip .k { font-weight: 400; font-size: 8.5px; text-transform: uppercase; letter-spacing: .4px; opacity: .8; width: 62px; }
  .chip.ok { background: var(--ok-bg); color: var(--ok); }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }
  .chip.bad { background: var(--bad-bg); color: var(--bad); }
  .chip.violet { background: var(--violet-bg); color: var(--violet); }
  .chip.muted { background: var(--soft); color: var(--muted); }
  .scale { display: inline-flex; gap: 2px; margin-left: auto; }
  .scale i { font-style: normal; width: 15px; height: 15px; border-radius: 3px; display: grid; place-items: center; font-size: 8.5px; background: #fff; color: #94a3b8; border: 1px solid var(--line); }
  .scale i.on { color: #fff; border-color: transparent; }
  .ic { width: 13px; height: 13px; flex: none; }

  /* Tarjetas de resumen */
  .kpis { margin-top: 12px; display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); gap: 8px; }
  .kpi { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: #fff; }
  .kpi .k { font-size: 8px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 700; }
  .kpi .v { margin-top: 3px; font-size: 16px; font-weight: 700; }
  .kpi .d { margin-top: 2px; font-size: 9px; color: var(--muted); line-height: 1.3; }
  .kpi.bad { border-color: #f1b8b8; background: #fff8f8; } .kpi.bad .v { color: var(--bad); }
  .stack { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 6px; background: var(--soft); }
  .stack span { display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 4px; font-size: 8.5px; color: var(--muted); }
  .legend b { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 3px; vertical-align: 0; }

  /* Secciones */
  .sec { margin-top: 14px; }
  .sec h2 { margin: 0 0 6px; background: var(--navy); color: #fff; font-size: 9.5px; letter-spacing: 1.2px; text-transform: uppercase; padding: 5px 9px; border-radius: 3px; display: flex; justify-content: space-between; }
  .sec h2 small { font-weight: 400; letter-spacing: 0; text-transform: none; opacity: .85; }
  .kv { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 4px; }
  .kv div { padding: 6px 9px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .kv div:nth-child(3n) { border-right: 0; }
  .kv div:nth-last-child(-n+3) { border-bottom: 0; }
  .kv .k { font-size: 7.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 700; }
  .kv .v { font-size: 10.5px; font-weight: 700; margin-top: 2px; }
  .kv .v.empty { color: #b8c2cf; font-weight: 400; }
  .why { border-left: 4px solid var(--c, var(--warn)); background: var(--soft); padding: 8px 12px; font-size: 9.5px; line-height: 1.5; border-radius: 0 4px 4px 0; }
  .why .t { font-weight: 700; font-size: 10px; margin-bottom: 3px; }

  table { width: 100%; border-collapse: collapse; font-size: 9px; }
  th { text-align: left; font-size: 7.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); background: #eef2f6; padding: 5px 6px; border-bottom: 1px solid var(--line); }
  td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr.hot td { background: #fff5f5; }
  tr.group td { background: #f8fafc; font-weight: 700; font-size: 8.5px; color: var(--navy); text-transform: uppercase; letter-spacing: .6px; padding: 5px 6px; }
  .pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 10px; padding: 2px 7px; font-weight: 700; font-size: 8.5px; white-space: nowrap; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.info { background: var(--info-bg); color: var(--info); }
  .pill.violet { background: var(--violet-bg); color: var(--violet); } .pill.muted { background: var(--soft); color: var(--muted); }
  .t1 { font-weight: 700; } .t2 { color: var(--muted); font-family: "Courier New", monospace; font-size: 8px; margin-top: 1px; }
  .rel { display: block; font-size: 8px; margin-top: 1px; }
  .rel.bad { color: var(--bad); font-weight: 700; } .rel.warn { color: var(--warn); } .rel.muted { color: var(--muted); }
  .empty-row td { color: var(--muted); font-style: italic; text-align: center; padding: 12px; }

  .foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; font-size: 8px; color: var(--muted); }
  .alert .proc { display:block; font-weight:400; font-size:9.5px; margin-top:2px; opacity:.95; }
  .alert.crit { background:#7f1d1d; color:#fff; }
  .sec h2 .ref { font-weight:400; font-size:8px; letter-spacing:.3px; opacity:.8; text-transform:none; }
  .note-empty { border:1px dashed var(--line); border-radius:4px; padding:10px 12px; font-size:9px; color:var(--muted); }
  .note-empty b { color: var(--ink); }
  .tag { position: absolute; top: 4mm; right: 14mm; font-size: 8px; color: #a16207; background: #fef9c3; border: 1px solid #fde68a; padding: 1px 6px; border-radius: 4px; }
</style>
</head>

function next(p, hours) {
  if (p.nextDueHours != null) {
    const left = hours != null ? p.nextDueHours - hours : null;
    const rel = left == null ? "" : left < 0 ? `<span class="rel bad">pasada por ${num(-left)} h</span>` : `<span class="rel ${left <= 100 ? "warn" : "muted"}">faltan ${num(left)} h</span>`;
    return `${num(p.nextDueHours)} h${rel}`;
  }
  if (p.nextDueDate) {
    const n = days(p.nextDueDate);
    const rel = n < 0 ? `<span class="rel bad">vencida hace ${-n} días</span>` : n <= 30 ? `<span class="rel warn">en ${n} días</span>` : `<span class="rel muted">en ${Math.round(n / 30)} meses</span>`;
    return `${fmt(p.nextDueDate)}${rel}`;
  }
  return `<span class="rel muted">Sin fecha ni horas de referencia</span>`;
}
const sec = (title, ref, body, extra = "") => `<div class="sec"><h2><span>${title}${extra ? ` <small>${extra}</small>` : ""}</span><span class="ref">${ref}</span></h2>${body}</div>`;

function render(code) {
  const { asset: a, plans, wos, defects, samples, spares, vesselName } = DATA[code];
  const crit = !!a.isSafetyCritical;              // "Equipo crítico" de PROC-MAN-03 = crítico ISM 10.3 en el sistema
  const sfiTab = (a.sfiCode || "")[0];
  const [critTxt, critColor] = CRIT[a.criticality] || ["", "#64748b"];
  const [stTxt, stTone, stIcon] = STATUS[a.status] || [a.status, "muted", "dot"];
  const counts = {};
  plans.forEach(p => counts[p.executionStatus] = (counts[p.executionStatus] || 0) + 1);
  const overdue = (counts.OVERDUE || 0) + (counts.DUE || 0);
  const pct = plans.length ? Math.round(100 * (plans.length - overdue) / plans.length) : null;
  const sorted = [...plans].sort((x, y) => (PLAN[x.executionStatus]?.[3] ?? 9) - (PLAN[y.executionStatus]?.[3] ?? 9)
    || (x.nextDueHours ?? 1e9) - (y.nextDueHours ?? 1e9) || String(x.nextDueDate).localeCompare(String(y.nextDueDate)));
  const open = wos.filter(w => !["CLOSED", "CANCELLED"].includes(w.status));
  const closed = wos.filter(w => w.status === "CLOSED").sort((x, y) => String(y.completedDate).localeCompare(String(x.completedDate)));
  const cancelled = wos.filter(w => w.status === "CANCELLED");
  const correctives = wos.filter(w => w.type === "CORRECTIVE");
  const fails12 = correctives.filter(w => new Date(w.openDate) >= YEAR_AGO).length + defects.filter(d => new Date(d.reportedAt) >= YEAR_AGO).length;
  const openDefects = defects.filter(d => !["RESOLVED", "CLOSED"].includes(d.status));
  const lowSpares = spares.filter(s => s.minStock > 0 && s.onHand < s.minStock);
  const lastSample = samples[0];

  // ── Avisos: lo que el procedimiento pide hacer, arriba de todo ──
  const alerts = [];
  if (a.status === "OUT_OF_SERVICE") alerts.push(`<div class="alert ${crit ? "crit" : "bad"}">${ICON.stop}<div>${crit ? "Equipo crítico fuera de servicio" : "Equipo fuera de servicio"}${open[0] ? ` <small>· OT abierta ${open[0].workOrderCode} — ${open[0].title}</small>` : ""}
    ${crit ? `<span class="proc">PROC-MAN-03: informar de inmediato a la PDT y al Gerente Técnico, y hacer la Evaluación de Riesgos (REGI-SYE-01.1).</span>` : ""}</div></div>`);
  if (overdue) alerts.push(`<div class="alert ${crit ? "bad" : "warn"}">${ICON.warn}<div>${overdue === 1 ? "1 tarea del plan vencida" : `${overdue} tareas del plan vencidas`}${crit ? " en un equipo crítico" : ""}
    ${crit ? `<span class="proc">PROC-MAN-03: toda falla de mantenimiento de un equipo crítico es una falla del Sistema de Gestión y motivo de No Conformidad.</span>` : ""}</div></div>`);
  openDefects.filter(d => d.severity === "CRITICAL" || d.severity === "HIGH").forEach(d => alerts.push(`<div class="alert warn">${ICON.warn}<div>Falla abierta ${d.defectCode} · gravedad ${SEV[d.severity][0].toLowerCase()}
    ${crit ? `<span class="proc">PROC-MAN-03: las reparaciones de equipos críticos se hacen con prioridad.</span>` : ""}</div></div>`));
  if (lowSpares.length) alerts.push(`<div class="alert warn">${ICON.box}<div>${lowSpares.length === 1 ? "1 repuesto" : `${lowSpares.length} repuestos`} por debajo del stock mínimo
    ${crit ? `<span class="proc">PROC-MAN-04: si falta un repuesto de un equipo crítico, el Capitán informa al Jefe Técnico por el medio más rápido.</span>` : ""}</div></div>`);

  // ── Resumen ──
  const seg = [["OVERDUE", "#b91c1c"], ["IN_WINDOW", "#6d28d9"], ["UPCOMING", "#0369a1"], ["FUTURE", "#15803d"]];
  const kpis = [];
  if (a.currentHours != null) kpis.push(`<div class="kpi"><div class="k">Horas acumuladas</div><div class="v">${num(a.currentHours)} h</div><div class="d">Última lectura cargada</div></div>`);
  kpis.push(`<div class="kpi ${overdue ? "bad" : ""}"><div class="k">Cumplimiento del plan</div><div class="v">${pct == null ? "—" : `${pct} %`}</div>
    ${plans.length ? `<div class="stack">${seg.map(([k, c]) => counts[k] ? `<span style="flex:${counts[k]};background:${c}"></span>` : "").join("")}</div>
    <div class="legend">${seg.filter(([k]) => counts[k]).map(([k, c]) => `<span><b style="background:${c}"></b>${counts[k]} ${PLAN[k][0].toLowerCase()}</span>`).join("")}</div>` : `<div class="d">Sin tareas en el plan</div>`}</div>`);
  kpis.push(`<div class="kpi ${fails12 ? "" : ""}"><div class="k">Averías · últimos 12 meses</div><div class="v">${fails12}</div><div class="d">OT correctivas y defectos reportados</div></div>`);
  kpis.push(`<div class="kpi ${lastSample && ["CRITICAL", "ACTION_REQUIRED"].includes(lastSample.verdict) ? "bad" : ""}"><div class="k">Último análisis</div>
    <div class="v" style="font-size:13px">${lastSample ? fmt(lastSample.sampledAt) : "—"}</div><div class="d">${lastSample ? `${KIND[lastSample.kind]} · ${(VERD[lastSample.verdict] || ["Sin resultado"])[0]}` : "Sin análisis cargados"}</div></div>`);
  kpis.push(`<div class="kpi ${open.some(w => w.type === "CORRECTIVE") ? "bad" : ""}"><div class="k">OT abiertas</div><div class="v">${open.length}</div><div class="d">${open.length ? open.map(w => `${WOT[w.type]}: ${w.workOrderCode}`).join("<br>") : "Ninguna pendiente"}</div></div>`);

  const kv = [["Fabricante", a.manufacturer], ["Modelo", a.model], ["N° de serie", a.serialNumber], ["Instalación", a.installationDate && fmt(a.installationDate)],
    ["Última reparación mayor", a.lastOverhaulDate && fmt(a.lastOverhaulDate)], ["Reemplazo previsto", a.replacementDate && fmt(a.replacementDate)]];

  const planRows = sorted.map(p => `<tr class="${p.executionStatus === "OVERDUE" ? "hot" : ""}"><td>${pill(PLAN[p.executionStatus] || [p.executionStatus, "muted", "dot"])}</td>
      <td><div class="t1">${p.title}</div><div class="t2">${p.taskCode}</div></td><td>${p.taskType === "INSPECTION" ? "Inspección" : "Mantenimiento"}</td>
      <td>${freq(p)}</td><td>${next(p, a.currentHours)}</td></tr>`).join("");
  const planBody = plans.length
    ? `<table><thead><tr><th style="width:92px">Estado</th><th>Tarea</th><th style="width:78px">Tipo</th><th style="width:82px">Frecuencia</th><th style="width:108px">Próximo</th></tr></thead><tbody>${planRows}</tbody></table>`
    : `<div class="note-empty"><b>Este equipo no tiene tareas en el plan.</b> PROC-MAN-02 §4.5: cada equipo lleva su plan, armado sobre el manual del fabricante.</div>`;

  const spareBody = spares.length
    ? `<table><thead><tr><th>Repuesto</th><th style="width:60px">En stock</th><th style="width:60px">Mínimo</th><th style="width:110px">Estado</th><th style="width:60px">Tareas</th></tr></thead><tbody>${spares.map(s => {
        const st = s.minStock > 0 ? (s.onHand < s.minStock ? ["Bajo el mínimo", "bad", "warn"] : ["Cubierto", "ok", "check"]) : ["Sin mínimo definido", "muted", "dot"];
        return `<tr class="${st[1] === "bad" ? "hot" : ""}"><td><div class="t1">${s.name}</div><div class="t2">${s.sku}</div></td><td>${num(s.onHand)} ${s.unit || ""}</td><td>${s.minStock ? `${num(s.minStock)} ${s.unit || ""}` : "—"}</td><td>${pill(st)}</td><td>${s.tasks}</td></tr>`;
      }).join("")}</tbody></table>`
    : `<div class="note-empty"><b>Sus tareas no tienen repuestos cargados.</b> PROC-MAN-02 §4.5 pide un listado de repuestos por equipo, con stock mínimo para 2 veces el plazo de entrega del fabricante.</div>`;

  const avs = [
    ...defects.map(d => ({ date: d.reportedAt, html: `<tr class="${!["RESOLVED", "CLOSED"].includes(d.status) ? "hot" : ""}"><td>${fmt(d.reportedAt)}</td><td>Defecto</td><td class="t1" style="font-family:'Courier New',monospace;font-size:8.5px">${d.defectCode}</td><td>${d.description}</td><td>${pill(SEV[d.severity])}</td><td>${pill(DST[d.status] || [d.status, "muted"])}</td></tr>` })),
    ...correctives.map(w => ({ date: w.openDate, html: `<tr class="${!["CLOSED", "CANCELLED"].includes(w.status) ? "hot" : ""}"><td>${fmt(w.openDate)}</td><td>OT correctiva</td><td class="t1" style="font-family:'Courier New',monospace;font-size:8.5px">${w.workOrderCode}</td><td>${w.title || "—"}</td><td>—</td><td>${pill(WOS[w.status] || [w.status, "muted"])}</td></tr>` })),
  ].sort((x, y) => String(y.date).localeCompare(String(x.date)));
  const avBody = avs.length
    ? `<table><thead><tr><th style="width:60px">Fecha</th><th style="width:66px">Tipo</th><th style="width:96px">N°</th><th>Descripción</th><th style="width:58px">Gravedad</th><th style="width:70px">Estado</th></tr></thead><tbody>${avs.map(x => x.html).join("")}</tbody></table>`
    : `<div class="note-empty"><b>Sin averías registradas.</b> Acá aparecen los defectos del equipo y sus OT correctivas.</div>`;

  const anBody = samples.length
    ? `<table><thead><tr><th style="width:90px">Análisis</th><th style="width:62px">Fecha</th><th style="width:80px">Tipo</th><th>Laboratorio</th><th style="width:110px">Resultado</th></tr></thead><tbody>${samples.map(s =>
        `<tr class="${["CRITICAL", "ACTION_REQUIRED"].includes(s.verdict) ? "hot" : ""}"><td class="t1" style="font-family:'Courier New',monospace;font-size:8.5px">${s.sampleCode}</td><td>${fmt(s.sampledAt)}</td><td>${KIND[s.kind]}</td><td>${s.labName || "—"}</td><td>${s.verdict ? pill(VERD[s.verdict]) : pill(["Esperando informe", "muted", "clock"])}</td></tr>`).join("")}</tbody></table>`
    : `<div class="note-empty"><b>Sin análisis de condición cargados.</b> PROC-MAN-02 §4.8 fija la frecuencia de análisis de aceite por tipo de equipo.</div>`;

  const woRow = w => `<tr class="${w.type === "CORRECTIVE" && !["CLOSED", "CANCELLED"].includes(w.status) ? "hot" : ""}"><td class="t1" style="font-family:'Courier New',monospace;font-size:8.5px">${w.workOrderCode}</td>
    <td>${WOT[w.type] || w.type}</td><td>${w.title || "—"}</td><td>${fmt(w.openDate)}</td><td>${fmt(w.completedDate)}</td><td>${pill(WOS[w.status] || [w.status, "muted"])}</td></tr>`;
  const histBody = wos.length
    ? `<table><thead><tr><th style="width:92px">OT</th><th style="width:66px">Tipo</th><th>Descripción</th><th style="width:60px">Apertura</th><th style="width:62px">Realización</th><th style="width:70px">Estado</th></tr></thead><tbody>
      ${open.length ? `<tr class="group"><td colspan="6">Abiertas (${open.length})</td></tr>${open.map(woRow).join("")}` : ""}
      <tr class="group"><td colspan="6">Realizadas (${closed.length}) · de la más reciente a la más antigua</td></tr>${closed.map(woRow).join("")}
      ${cancelled.length ? `<tr class="group"><td colspan="6">Canceladas (${cancelled.length})</td></tr>${cancelled.map(woRow).join("")}` : ""}</tbody></table>`
    : `<div class="note-empty"><b>Este equipo todavía no tiene órdenes de trabajo.</b></div>`;

  const foot = n => `<div class="foot"><span>Copilot Management System · Ficha de equipo · ${a.name} · ${vesselName}</span><span>Página ${n} de 2</span></div>`;
  document.getElementById("pages").innerHTML = `
  <div class="page">
    <span class="tag">DATOS DE EJEMPLO</span>
    <div class="hdr"><div class="logo">Mercurio<br>Naviera</div><div class="ttl">FICHA DE EQUIPO</div>
      <div class="meta"><span>Generado <b>30/09/2026 15:10</b></span><span>Página <b>1 de 2</b></span></div></div>
    ${alerts.join("")}
    <div class="hero">
      <div><h1>${a.name}</h1>
        <div class="sub"><span class="code">${a.assetCode}</span> · ${vesselName} · ${sfiTab ? `${sfiTab} · ${SFI[sfiTab]}` : "Sin grupo SFI"} (SFI ${a.sfiCode || "—"})</div></div>
      <div class="chips">
        <div class="chip ${stTone}"><span class="k">Estado</span>${ICON[stIcon]}${stTxt}</div>
        <div class="chip ${crit ? "violet" : "muted"}"><span class="k">Equipo crítico</span>${crit ? ICON.shield + "Sí · PROC-MAN-03 / ISM 10.3" : "No"}</div>
        <div class="chip" style="background:${critColor}14;color:${critColor}"><span class="k">Criticidad</span>${a.criticality} · ${critTxt}
          <span class="scale">${["A", "B", "C"].map(c => `<i class="${c === a.criticality ? "on" : ""}" style="${c === a.criticality ? `background:${CRIT[c][1]}` : ""}">${c}</i>`).join("")}</span></div>
        <div class="chip muted"><span class="k">Horas</span>${a.trackDailyReport ? ICON.check + "Se cargan en el reporte diario" : "No lleva horómetro"}</div>
      </div>
    </div>
    <div class="kpis" style="--n:${kpis.length}">${kpis.join("")}</div>
    ${sec("Datos técnicos", "PROC-MAN-02 §4.5", `<div class="kv">${kv.map(([k, v]) => `<div><div class="k">${k}</div><div class="v ${v ? "" : "empty"}">${v || "Sin dato"}</div></div>`).join("")}</div>`)}
    ${sec("Fundamento de la criticidad", "Criterio de la empresa", `<div class="why" style="--c:${critColor}"><div class="t" style="color:${critColor}">Por qué es criticidad ${a.criticality} · ${critTxt}</div>${a.criticalityRationale || "Sin fundamento cargado."}</div>`)}
    ${sec("Plan de mantenimiento", "PROC-MAN-02 §4.5 · §4.7", planBody, plans.length ? `${plans.length} ${plans.length === 1 ? "tarea" : "tareas"} · primero lo vencido` : "")}
    ${sec("Repuestos del equipo", "PROC-MAN-02 §4.5 · PROC-MAN-04", spareBody, spares.length ? `${spares.length} en sus tareas` : "")}
    ${foot(1)}
  </div>
  <div class="page">
    ${sec("Averías e incidencias", "PROC-MAN-02 §4.5 · PROC-MAN-03", avBody, avs.length ? `${avs.length} · la más reciente primero` : "")}
    ${sec("Análisis de condición", "PROC-MAN-02 §4.4.2 · §4.8", anBody, samples.length ? "últimos 4" : "")}
    ${sec("Historial de órdenes de trabajo", "PROC-MAN-02 §4.9", histBody, wos.length ? `${wos.length} OT · ${closed.length} realizadas · ${open.length} abiertas` : "")}
    ${foot(2)}
  </div>`;
}
document.querySelectorAll(".bar button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".bar button").forEach(x => x.classList.toggle("on", x === b));
  render(b.dataset.ex);
}));
render("M01-MP-BR");
</script>
</body>
</html>
