<meta charset="utf-8" />

<title>Consola de administración — Prototipo V2</title>
<style>
  :root{
    --bg:#F4F5F7;--surface:#FFFFFF;--surface2:#F7F8FA;--fg:#1A1D24;--muted:#6B7280;--faint:#9CA3AF;--border:#E2E4E9;
    --accent:#0284C7;--accentbg:rgba(2,132,199,.08);--accentbd:rgba(2,132,199,.25);
    --ok:#0E9F6E;--okbg:rgba(14,159,110,.10);--warn:#B45309;--warnbg:rgba(217,119,6,.12);--bad:#DC2626;--badbg:rgba(220,38,38,.09);
  }
  body.dark{
    --bg:#080D1D;--surface:#111A30;--surface2:#16203A;--fg:#E0E1DD;--muted:#94A3B8;--faint:#64748B;--border:rgba(255,255,255,.10);
    --accent:#38BDF8;--accentbg:rgba(56,189,248,.10);--accentbd:rgba(56,189,248,.30);
    --ok:#34D399;--okbg:rgba(52,211,153,.12);--warn:#FBBF24;--warnbg:rgba(251,191,36,.12);--bad:#F87171;--badbg:rgba(248,113,113,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);font-size:14px;line-height:1.45}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px}
  input:focus,select:focus,button:focus-visible{outline:2px solid var(--accentbd);outline-offset:1px}

  .demo{background:#FEF3C7;color:#92400E;font-size:11px;font-weight:600;text-align:center;padding:4px}
  .app{display:flex;min-height:calc(100vh - 24px)}

  /* Menú */
  aside{width:236px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
  .brand{display:flex;gap:10px;align-items:center;padding:18px 16px;border-bottom:1px solid var(--border)}
  .brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accentbg);border:1px solid var(--accentbd);display:grid;place-items:center;color:var(--accent);font-weight:800}
  .brand b{display:block;font-size:14px}.brand span{font-size:11px;color:var(--muted)}
  nav{padding:10px 8px;flex:1;overflow:auto}
  .grp{font-size:11px;color:var(--faint);font-weight:600;padding:12px 10px 4px}
  .nav{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:8px;color:var(--muted);font-size:13px;text-align:left}
  .nav:hover{background:var(--surface2);color:var(--fg)}
  .nav.on{background:var(--accentbg);color:var(--accent);font-weight:600}
  .nav .ic{width:18px;text-align:center}
  .nav .cnt{margin-left:auto;font-size:11px;background:var(--badbg);color:var(--bad);border-radius:10px;padding:0 7px;font-weight:700}
  .me{border-top:1px solid var(--border);padding:12px 16px;font-size:12px}
  .me b{display:block;font-size:13px}.me span{color:var(--muted)}
  .me button{margin-top:8px;color:var(--muted);font-size:12px}

  main{flex:1;min-width:0;padding:24px 28px 80px}
  .head{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .head h1{font-size:20px}.head p{color:var(--muted);font-size:13px;max-width:640px;margin-top:2px}
  .head .act{margin-left:auto;display:flex;gap:8px}
  .btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13px}
  .btn:hover{background:var(--surface2)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  body.dark .btn.pri{color:#04111f}
  .btn.danger{color:var(--bad)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px}
  .card h2{font-size:14px;padding:14px 16px 0}
  .card .sub{color:var(--muted);font-size:12px;padding:2px 16px 0}

  /* Tarjetas resumen */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
  .kpi{padding:14px 16px;cursor:pointer}
  .kpi:hover{border-color:var(--accentbd)}
  .kpi .l{font-size:12px;color:var(--muted)}
  .kpi .v{font-size:24px;font-weight:700;margin-top:2px}
  .kpi .h{font-size:12px;color:var(--muted);margin-top:2px}
  .kpi.alert .v{color:var(--bad)}

  /* Filtros */
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
  .filters label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);font-weight:600}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
  .seg button{padding:7px 12px;font-size:13px;color:var(--muted)}
  .seg button.on{background:var(--accentbg);color:var(--accent);font-weight:600}

  /* Tablas */
  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface2);white-space:nowrap}
  td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:top}
  tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:var(--surface2)}
  tr.click{cursor:pointer}
  .s{color:var(--muted);font-size:12px}
  .who b{display:block;font-weight:600}
  .tech{display:none}
  body.showtech .tech{display:table-cell}
  body.showtech span.tech,body.showtech div.tech{display:block}

  .pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
  .pill.ok{background:var(--okbg);color:var(--ok)}
  .pill.bad{background:var(--badbg);color:var(--bad)}
  .pill.warn{background:var(--warnbg);color:var(--warn)}
  .pill.mut{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
  .pill.acc{background:var(--accentbg);color:var(--accent)}

  .note{background:var(--accentbg);border:1px solid var(--accentbd);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px}
  .note.warn{background:var(--warnbg);border-color:transparent;color:var(--warn)}
  .empty{padding:36px 16px;text-align:center;color:var(--muted)}
  .empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
  .grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
  .map{height:260px;margin:12px 16px 16px;border-radius:10px;background:linear-gradient(160deg,#dbeafe,#e0f2fe 60%,#ecfccb);position:relative;overflow:hidden;border:1px solid var(--border)}
  body.dark .map{background:linear-gradient(160deg,#0b2545,#0f3057 60%,#163d2c)}
  .map .river{position:absolute;left:38%;top:-10%;width:30px;height:130%;background:rgba(2,132,199,.25);transform:rotate(14deg);border-radius:20px}
  .dot{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer}
  .dot .tip{display:none;position:absolute;left:16px;top:-6px;background:var(--surface);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:12px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.15)}
  .dot:hover .tip{display:block}

  .bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
  .rank{padding:8px 16px 14px}
  .rank .r{display:grid;grid-template-columns:1fr 70px;gap:4px 10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
  .rank .r:last-child{border-bottom:0}
  .rank .r .bar{grid-column:1 / -1}

  /* Panel lateral y ventanas */
  .shade{position:fixed;inset:0;background:rgba(10,15,30,.45);display:none;z-index:20}
  .shade.on{display:block}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(620px,100%);background:var(--surface);z-index:21;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column}
  .drawer.on{transform:none}
  .dh{display:flex;gap:12px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border)}
  .dh h3{font-size:16px}
  .x{margin-left:auto;width:30px;height:30px;border-radius:50%;background:#DC2626;color:#fff;font-weight:700;font-size:15px;flex-shrink:0}
  .tabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--border)}
  .tabs button{padding:10px 12px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
  .tabs button.on{color:var(--accent);border-color:var(--accent);font-weight:600}
  .db{padding:16px 18px;overflow:auto;flex:1}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;font-size:13px;margin-bottom:16px}
  .kv span{color:var(--muted)}
  .dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,92vw);background:var(--surface);border-radius:12px;z-index:31;display:none;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .dlg.on{display:block}
  .dlg .db{padding:16px 18px}
  .dlg .ft{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--border)}
  .shade.top{z-index:30}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;display:none;z-index:40}

  /* Panel de notas del prototipo */
  .notes{position:fixed;right:16px;bottom:16px;width:330px;max-height:70vh;overflow:auto;background:#FFFBEB;color:#78350F;border:1px solid #FCD34D;border-radius:12px;padding:14px 16px;font-size:12.5px;z-index:15;box-shadow:0 8px 24px rgba(0,0,0,.12)}
  .notes h4{font-size:13px;margin-bottom:6px}
  .notes p{margin:4px 0}.notes .c{color:#92400E;font-weight:700}
  .notes .tg{position:absolute;top:8px;right:10px;font-size:12px;color:#92400E}
  .notes.min{width:auto;height:auto}.notes.min .nb{display:none}

  .mbar{display:none}
  @media (max-width:860px){
    aside{display:none}
    main{padding:16px 16px 90px}
    .grid2{grid-template-columns:1fr}
    .head .act{margin-left:0}
    .mbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:10}
    .mbar button{flex:1;padding:8px 2px 10px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
    .mbar button.on{color:var(--accent);font-weight:600}
    .mbar .ic{font-size:17px}
    .notes{display:none}
    .hide-m{display:none}
    .kv{grid-template-columns:1fr}
  }
</style>
</head>

function drawPreg(){
  const q=(document.getElementById("qq").value||"").toLowerCase(), per=document.getElementById("qp").value;
  const rows=PREG.map((p,i)=>({...p,i})).filter(p=>(!per||p.n===per)&&(p.q+" "+(p.a||"")).toLowerCase().includes(q));
  document.getElementById("pregs").innerHTML = rows.length ? rows.map(p=>`<tr><td class="s">${p.f}</td><td class="who"><b>${p.n}</b><span class="s">${p.rol}</span></td>
    <td><b style="font-weight:600">${p.q}</b>${p.adj?`<div class="s">📎 adjuntó un archivo</div>`:""}
      ${p.a?`<div style="margin-top:6px;padding:8px 10px;border-left:3px solid var(--accentbd);background:var(--surface2);border-radius:6px"><span class="s">Copiloto respondió:</span><div>${p.a.length>110?p.a.slice(0,110)+"…":p.a}</div>${p.a.length>110?`<button class="s" style="color:var(--accent);margin-top:4px" onclick="verResp(${p.i})">Ver respuesta completa</button>`:""}</div>`
        :`<div class="s" style="margin-top:6px">Sin respuesta guardada (pregunta anterior a este cambio)</div>`}</td>
    <td class="hide-m">${p.pant}</td><td class="hide-m">${p.buque}</td></tr>`).join("")
    : `<tr><td colspan="5"><div class="empty"><b>No hay preguntas con esos filtros</b>Probá con otra persona u otra palabra.</div></td></tr>`;
}
function verResp(i){ const p=PREG[i]; openDlg("Pregunta y respuesta",`<p class="s">${p.n} · ${p.f} · ${p.buque}</p><p style="margin:8px 0;font-weight:600">${p.q}</p><div style="padding:10px 12px;border-left:3px solid var(--accentbd);background:var(--surface2);border-radius:6px">${p.a}</div>`,`<button class="btn pri" onclick="closeDlg()">Cerrar</button>`); }
function segR(b,r){ [...b.parentNode.children].forEach(x=>x.classList.remove("on")); b.classList.add("on"); logF.r=r; drawLogs(); }
function fLog(q){ logF.q=q; drawLogs(); }
function drawLogs(){
  const rows = LOGS.filter(r=>(!logF.r||(logF.r==="ok"?r.ok:!r.ok)) && (!logF.q||r.n===logF.q));
  document.getElementById("logs").innerHTML = rows.length ? rows.map(r=>`<tr><td class="s">${r.f}</td><td>${r.ok?'<span class="pill ok">✓ Entró</span>':'<span class="pill bad">✕ Rechazado</span>'}</td><td class="who"><b>${r.n}</b>${r.ok?"":`<span class="s">${r.mot}</span>`}</td><td class="hide-m">${r.emp}</td><td class="hide-m">${r.donde} · ${r.disp}</td></tr>`).join("")
    : `<tr><td colspan="5"><div class="empty"><b>No hay ingresos con esos filtros</b>Probá con otra persona o elegí «Todos».</div></td></tr>`;
}
function persona(i){
  const box=document.getElementById("pbox");
  if(i===""){ box.innerHTML=`<div class="empty"><b>Todavía no elegiste a nadie</b>Elegí una persona en la lista de arriba para ver su actividad.</div>`; return; }
  const u=USERS[i];
  box.innerHTML = `<div style="padding:16px"><div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center"><div><h2 style="padding:0;font-size:17px">${u.n}</h2><div class="s">${u.rol} · Mercurio Group · usuario ${u.usu}${u.mail?" · "+u.mail:" · sin correo cargado"}</div></div><div style="margin-left:auto">${pillEstado(u.estado)}</div></div></div>
  <div class="kpis" style="padding:0 16px">
    <div class="card kpi"><div class="l">Descargas a Excel</div><div class="v">3</div><div class="h">Normal para su rol</div></div>
    <div class="card kpi"><div class="l">Datos descargados</div><div class="v">2 MB</div><div class="h">Normal</div></div>
    <div class="card kpi"><div class="l">Uso de madrugada</div><div class="v">0</div><div class="h">Sin actividad entre 0 y 5 h</div></div>
  </div>
  <div class="tw"><table><thead><tr><th>Cuándo</th><th>Qué hizo</th><th class="hide-m">Dónde</th></tr></thead><tbody>
    <tr><td class="s">hoy 08:27</td><td><span class="pill acc">Ingresó</span></td><td class="hide-m">Computadora · Buenos Aires</td></tr>
    <tr><td class="s">hoy 08:31</td><td>Cerró la OT «Cambio de filtros generador 2»</td><td class="hide-m">LA TEREZA</td></tr>
    <tr><td class="s">hoy 08:40</td><td>Descargó a Excel la lista de repuestos</td><td class="hide-m">LA TEREZA</td></tr>
  </tbody></table></div>`;
}
function segK(b,k){ [...b.parentNode.children].forEach(x=>x.classList.remove("on")); b.classList.add("on"); drawIA(k); }
function drawIA(k){
  const box=document.getElementById("iabox");
  if(k===1){ box.innerHTML = `<div class="kpis"><div class="card kpi"><div class="l">Datos usados este mes</div><div class="v">1,8 GB</div><div class="h">entre todos los buques</div></div><div class="card kpi"><div class="l">Buque que más usó</div><div class="v" style="font-size:18px">DON CHICUETO</div><div class="h">640 MB</div></div></div>
    <div class="card"><h2>Por buque</h2><div class="sub">Cuántos datos usó cada buque al conectarse por satélite</div><div class="rank">
    ${[["DON CHICUETO",640],["LA TEREZA",420],["CAPITÁN MIGUEL",310],["Oficina",430]].map(([b,v])=>`<div class="r"><span>${b}</span><b style="text-align:right">${v} MB</b><div class="bar"><i style="width:${v/6.4}%"></i></div></div>`).join("")}</div></div>`; return; }
  box.innerHTML = `<div class="kpis">
    <div class="card kpi"><div class="l">Gasto del período</div><div class="v">US$ 3,00</div><div class="h">Presupuesto mensual: US$ 50</div></div>
    <div class="card kpi"><div class="l">Veces que se usó</div><div class="v">455</div><div class="h">por 6 personas</div></div>
    <div class="card kpi"><div class="l">Lo que más gastó</div><div class="v" style="font-size:16px">OT: revisión al cerrar</div><div class="h">US$ 1,12 · 37% del total</div></div>
  </div>
  <div class="grid2">
    <div class="card"><h2>Detalle de usos</h2><div class="sub">Cada vez que alguien usó una función de IA</div><div class="tw"><table><thead><tr><th>Cuándo</th><th>Persona</th><th>Función</th><th class="hide-m">Buque</th><th>Costo</th><th class="tech">Modelo</th><th class="tech">Texto enviado / recibido</th></tr></thead><tbody>
    ${IA_ROWS.map(r=>`<tr><td class="s">${r.f}</td><td><b>${r.n}</b></td><td>${r.fn}${r.veces>1?`<div class="s">${r.veces} veces</div>`:""}</td><td class="hide-m">${r.buque??"—"}</td><td>${r.cost}</td><td class="tech s">${r.mod}</td><td class="tech s">${r.tin} / ${r.tout}</td></tr>`).join("")}
    </tbody></table></div></div>
    <div class="card"><h2>Gasto por función</h2><div class="sub">En qué se fue la plata</div><div class="rank">
    ${IA.map(r=>`<div class="r"><span>${r.fn} <span class="s">· ${r.usos} usos</span></span><b style="text-align:right">US$ ${r.cost.toFixed(2).replace(".",",")}</b><div class="bar"><i style="width:${r.cost/1.12*100}%"></i></div></div>`).join("")}</div></div>
  </div>`;
}
function empresa(i){
  const e=EMP[i];
  const d=document.getElementById("drawer");
  d.innerHTML = `<div class="dh"><div><h3>${e.n}</h3><div class="s">${e.buques} buques · ${e.usuarios} usuarios</div></div>${pillEstado(e.estado)}<button class="x" title="Cerrar" onclick="closeAll()">✕</button></div>
  <div class="tabs" id="etabs">${["Datos","Usuarios","Invitaciones","Direcciones web"].map((t,k)=>`<button class="${k===1?"on":""}" onclick="etab(${i},${k},this)">${t}</button>`).join("")}</div>
  <div class="db" id="ebody"></div>`;
  document.getElementById("shade").classList.add("on"); d.classList.add("on"); etab(i,1,document.querySelectorAll("#etabs button")[1]);
}
function etab(i,k,b){
  [...b.parentNode.children].forEach(x=>x.classList.remove("on")); b.classList.add("on");
  const e=EMP[i], el=document.getElementById("ebody");
  if(k===0) el.innerHTML = `<div class="kv"><span>Nombre</span><b>${e.n}</b><span>Estado</span><div>${pillEstado(e.estado)}<div class="s">Si se suspende, nadie de la empresa puede entrar hasta reactivarla.</div></div><span>Idioma del sistema</span><div>${e.idioma}</div><span>Moneda</span><div>${e.moneda}</div><span>Hora local</span><div>${e.zona}</div><span>Formato de la OT en PDF</span><div>Formulario propio de la empresa</div></div><button class="btn pri">Editar datos</button>`;
  if(k===1) el.innerHTML = `<div style="display:flex;gap:8px;margin-bottom:12px"><input placeholder="Buscar persona" style="flex:1"><button class="btn pri" onclick="openDlg('Nuevo usuario de ${e.n}',formUsuario(),btnsGuardar())">+ Nuevo usuario</button></div>
    <table><thead><tr><th>Persona</th><th>Rol</th><th>Estado</th></tr></thead><tbody>${USERS.map(u=>`<tr class="click"><td class="who"><b>${u.n}</b><span class="s">Usuario ${u.usu}${u.mail?" · "+u.mail:""}</span>${u.mail?"":`<span class="pill warn" style="margin-top:3px">⚠ Sin correo cargado</span>`}</td><td>${u.rol}</td><td>${u.estado==="ok"?'<span class="pill ok">● Puede entrar</span>':'<span class="pill mut">○ Sin acceso</span>'}<div class="s">Último ingreso: ${u.ult}</div></td></tr>`).join("")}</tbody></table>`;
  if(k===2) el.innerHTML = `<p class="s" style="margin-bottom:12px">Una invitación es un enlace que le mandás a la persona para que cree su propia contraseña. Vence a los 7 días.</p><button class="btn pri" onclick="invitar()">+ Invitar a alguien</button><div class="empty"><b>No hay invitaciones pendientes</b>Cuando invites a alguien va a aparecer acá hasta que la acepte.</div>`;
  if(k===3) el.innerHTML = `<p class="s" style="margin-bottom:12px">Las direcciones de internet con las que la gente de ${e.n} entra al sistema.</p><table><tbody>${e.web.map(w=>`<tr><td><b>${w}</b></td><td><span class="pill acc">★ Principal</span></td></tr>`).join("")}</tbody></table><button class="btn" style="margin-top:12px">+ Agregar dirección</button>`;
}
function invitar(){
  openDlg("Invitar a alguien",`<div class="kv" style="grid-template-columns:1fr"><label style="font-size:12px;color:var(--muted)">Correo de la persona *<input style="width:100%;margin-top:3px" placeholder="nombre@empresa.com"></label><label style="font-size:12px;color:var(--muted)">Rol *<select style="width:100%;margin-top:3px">${["Administrador de la empresa","Superintendente","Jefe de Mantenimiento","Capitán / Jefe de Máquinas","Inspector","Compras y depósito","Sólo lectura (auditor)"].map(r=>`<option>${r}</option>`)}</select></label></div>`,
  `<button class="btn" onclick="closeDlg()">Cancelar</button><button class="btn pri" onclick="invitacionLista()">Crear invitación</button>`);
}
function invitacionLista(){
  openDlg("Invitación lista",`<p style="margin-bottom:10px">Mandale este enlace a la persona. Con él crea su contraseña y entra.</p><div style="display:flex;gap:8px"><input style="flex:1" readonly value="https://mercurio.cms3.shipcms.cloud/invitacion/8F3K…"><button class="btn pri" onclick="toast('Enlace copiado')">Copiar enlace</button></div><p class="s" style="margin-top:8px">Vence el 12/10/2026.</p>`,`<button class="btn pri" onclick="closeDlg()">Listo</button>`);
}
function formPersona(){ return `<div class="kv" style="grid-template-columns:1fr">
  <label style="font-size:12px;color:var(--muted)">Nombre y apellido *<input style="width:100%;margin-top:3px"></label>
  <label style="font-size:12px;color:var(--muted)">Correo *<input style="width:100%;margin-top:3px"></label>
  <label style="font-size:12px;color:var(--muted)">Qué puede hacer *<select style="width:100%;margin-top:3px" onchange="this.nextElementSibling.textContent=ROL_HELP[this.value]"><option>Soporte</option><option>Administrador general</option></select><span class="s" style="display:block;margin-top:4px">${ROL_HELP["Soporte"]}</span></label></div>`; }
function formUsuario(){ return `<div class="kv" style="grid-template-columns:1fr">
  <label style="font-size:12px;color:var(--muted)">Nombre y apellido *<input style="width:100%;margin-top:3px"></label>
  <label style="font-size:12px;color:var(--muted)">Usuario para entrar *<input style="width:100%;margin-top:3px" placeholder="Ej.: GARCIA"><span class="s">Es lo que la persona escribe al entrar. Sin espacios.</span></label>
  <label style="font-size:12px;color:var(--muted)">Correo (opcional)<input style="width:100%;margin-top:3px"></label>
  <label style="font-size:12px;color:var(--muted)">Rol *<select style="width:100%;margin-top:3px"><option>Jefe de Mantenimiento</option><option>Capitán / Jefe de Máquinas</option><option>Superintendente</option></select></label></div>`; }
function btnsGuardar(){ return `<button class="btn" onclick="closeDlg()">Cancelar</button><button class="btn pri" onclick="closeDlg();toast('Guardado')">Guardar</button>`; }
function nuevaEmpresa(){ openDlg("Nueva empresa",`<div class="kv" style="grid-template-columns:1fr">
  <label style="font-size:12px;color:var(--muted)">Nombre de la empresa *<input style="width:100%;margin-top:3px" oninput="this.parentNode.nextElementSibling.querySelector('b').textContent=(this.value||'empresa').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.cms3.shipcms.cloud'"></label>
  <div class="s">Dirección para entrar: <b>empresa.cms3.shipcms.cloud</b> (se arma sola con el nombre; se puede cambiar)</div>
  <label style="font-size:12px;color:var(--muted)">Idioma *<select style="width:100%;margin-top:3px"><option>Español</option><option>Inglés</option><option>Portugués</option></select></label>
  <label style="font-size:12px;color:var(--muted)">Moneda *<select style="width:100%;margin-top:3px"><option>Guaraní (PYG)</option><option>Peso argentino (ARS)</option><option>Real (BRL)</option><option>Dólar (USD)</option></select></label></div>`, btnsGuardar()); }
function publicar(i){ openDlg("¿Publicar estas instrucciones?",`<p>Desde ahora la IA va a usar la versión ${PROMPTS[i].v} de <b>${PROMPTS[i].fn}</b> en <b>todas las empresas</b>.</p><p class="s" style="margin-top:8px">Si algo sale mal, podés volver a la versión anterior.</p>`,`<button class="btn" onclick="closeDlg()">Cancelar</button><button class="btn pri" onclick="closeDlg();toast('Publicado. Ya está en uso.')">Sí, publicar</button>`); }
function volverAtras(i){ openDlg("¿Volver a la versión anterior?",`<p>La IA va a dejar de usar la versión ${PROMPTS[i].v} de <b>${PROMPTS[i].fn}</b> y vuelve a la anterior, en todas las empresas.</p>`,`<button class="btn" onclick="closeDlg()">Cancelar</button><button class="btn danger" onclick="closeDlg();toast('Listo, se volvió a la versión anterior')">Sí, volver</button>`); }

function openDlg(t,body,ft){ const d=document.getElementById("dlg"); d.innerHTML=`<div class="dh"><h3>${t}</h3><button class="x" title="Cerrar" onclick="closeDlg()">✕</button></div><div class="db">${body}</div>${ft?`<div class="ft">${ft}</div>`:""}`; d.classList.add("on"); document.getElementById("shade2").classList.add("on"); }
function closeDlg(){ document.getElementById("dlg").classList.remove("on"); document.getElementById("shade2").classList.remove("on"); }
function closeAll(){ closeDlg(); document.getElementById("drawer").classList.remove("on"); document.getElementById("shade").classList.remove("on"); }
function toast(t){ const el=document.getElementById("toast"); el.textContent="✓ "+t; el.style.display="block"; clearTimeout(window._tt); window._tt=setTimeout(()=>el.style.display="none",2200); }
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeAll(); });
go("inicio");
</script>
</body>
</html>
